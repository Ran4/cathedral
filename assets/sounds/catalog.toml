# The sound catalog: the single source of truth for three consumers.
#
# The sim emits `sound` events and renders their percepts from these rows; the
# generator (`scripts/generate_sounds.py`) synthesizes each row's asset from
# `sfx_prompt`; Bevy resolves playback by convention from the id alone
# (`assets/sounds/{sound_id}.mp3`), so no filename ever crosses the wire.
#
# Row order is load-bearing: `emittable_sound_ids()` keeps it, and the prompt
# lists the emittable ids in that order.
#
# Full design: `docs/features/sounds.md` (and design/06 for the wider soundscape).

[[sounds]]
sound_id = "fart"           # [a-z_]+ — also the asset basename
sound_class = "body"        # body | impact | bell   (design/06's `class`)
audible_distance = 20.0
actor_emittable = true      # may an LLM choose this via make_sound?
seen = "{actor} farted."    # attributed percept; omit => not attributable
heard = "[You heard a big fart!]"   # unattributed percept — everyone in radius
sfx_prompt = "A single loud comedic wet fart, one short burst, close and dry, no music, no voices, no reverb"
duration_seconds = 1.5

[[sounds]]
sound_id = "glass_break"
sound_class = "impact"
audible_distance = 25.0
actor_emittable = true
seen = "{actor} broke a beer glass."
heard = "[You heard glass shatter nearby.]"
sfx_prompt = "A single beer glass shattering on a stone floor, sharp impact and scattering shards, medieval tavern room tone, no voices"
duration_seconds = 2.0

# No `seen`: the bell has no visible author, so it is never attributable — and
# it is not actor-emittable either (the world rings it).
[[sounds]]
sound_id = "town_bell"
sound_class = "bell"
audible_distance = 600.0
actor_emittable = false
heard = "[The town bell is ringing.]"
sfx_prompt = "A massive bronze cathedral bell tolling three slow strokes, deep and resonant, carrying over a medieval city, long natural decay, no music"
duration_seconds = 9.0

# The water network (lore/wells_and_water.md). As of M3 (the water round) the
# sim *does* draw water: the behaviour ladder sends thirsty NPCs to a well, a
# queue forms, and a keeper works the curb. The round's own windlass is emitted
# like the bell — an unattributed WORLD sound heard only by the player (`crates/
# cathedral-sim/src/round.rs`), so ten curbs clanking never nudge an NPC into a
# reaction turn (that would pin the scheduler and blow M3's zero-token budget).
# The `seen` line doubles as the drawer's OWN memory of the act ("You drew water
# at the well."), so the person the player asks can say what they are doing.
# Past tense so the same template reads for a witness and for "You". Since M5
# (the sheet change that regenerated the golden fixtures) they are also
# `actor_emittable`: a *deliberate* clatter an LLM chooses via make_sound is a
# rare social act and nudges one witness like any other actor sound — it is only
# the round's steady background rhythm that must stay nudge-free.
[[sounds]]
sound_id = "draw_water"
sound_class = "impact"
audible_distance = 30.0
actor_emittable = true
seen = "{actor} drew water at the well."
heard = "[You heard a windlass turn, and a bucket break the water far below.]"
sfx_prompt = "A wooden well windlass creaking as its rope unwinds, then a bucket splashing into deep water far below in a stone shaft, echoing, then the rope creaking under load, outdoors, no music, no voices"
duration_seconds = 6.0

[[sounds]]
sound_id = "chain_windlass"
sound_class = "impact"
audible_distance = 40.0
actor_emittable = true
seen = "{actor} worked the chain windlass at the well."
heard = "[You heard the slow clank of a chain windlass, and a bucket knocking the shaft.]"
sfx_prompt = "A heavy iron chain winding slowly over a wooden windlass barrel, a ratchet pawl clicking, an iron-bound bucket knocking against a stone well shaft, medieval street, no music, no voices"
duration_seconds = 7.0

[[sounds]]
sound_id = "pour_trough"
sound_class = "impact"
audible_distance = 22.0
actor_emittable = true
seen = "{actor} emptied a pail into the trough."
heard = "[You heard a pail emptied into a stone trough.]"
sfx_prompt = "A wooden pail of water poured out into a shallow stone trough, a heavy splash settling into a ripple, the empty pail set down on wet stone, outdoors, no music, no voices"
duration_seconds = 4.0

[[sounds]]
sound_id = "pail_clatter"
sound_class = "impact"
audible_distance = 26.0
actor_emittable = true
seen = "{actor} knocked a pail over on the wet stone."
heard = "[You heard a pail go over on the stones, and the water run out.]"
sfx_prompt = "A wooden pail dropped on stone paving, its iron hoop ringing as it rolls, water slopping out across the flags, close and dry, no music, no voices"
duration_seconds = 4.0

# The food market (food & items M3, features/food_and_items/04_the_bread_round.md).
# A stall's sale is a silent, self-perceived act; the only sound is `coin_clink`,
# emitted per sale as an unattributed WORLD sound heard only by the player (like
# the windlass and the bell), so thirty sales an hour in a square never nudge an
# NPC into a reaction turn. `market_cry` is the optional flourish: a bound vendor
# calling their wares, on the same player-only mechanism. NEITHER is
# `actor_emittable` (the world emits them, not an LLM `make_sound`), so the
# emittable-id list the prompt renders is unchanged and the golden fixtures stay
# byte-stable. No `seen`: the parties remember the sale themselves in prose.
[[sounds]]
sound_id = "coin_clink"
sound_class = "impact"
audible_distance = 15.0
actor_emittable = false
heard = "[You heard coins counted onto a market board.]"
sfx_prompt = "A few small copper coins counted out one by one onto a wooden market stall board, a soft clink and settle, close and dry, a faint market murmur behind, no music, no voices"
duration_seconds = 2.0

[[sounds]]
sound_id = "market_cry"
sound_class = "body"
audible_distance = 25.0
actor_emittable = false
heard = "[You heard a stallholder cry their wares across the square.]"
sfx_prompt = "A single medieval market stallholder calling their wares across a busy square, one short wordless rhythmic cry, outdoors with a light crowd murmur behind, no music, no discernible words"
duration_seconds = 3.0

# Body pockets (features/extra_pockets.md M1/M3). The four beats the mouth and
# the lower slots make, with honest radii: swallowing the evidence has to be
# quiet (2 m) or it is not a smuggling mechanic, while gargling carries. `spit`
# does not emit its row — the verb's own percepts name the target — it exists so
# an LLM can spit theatrically with make_sound. The last row is deliberately
# unnamed and its percepts tactfully vague; the `seen` lines avoid a reflexive
# pronoun so the same template reads for a witness and for "You".
[[sounds]]
sound_id = "gulp"
sound_class = "body"
audible_distance = 2.0
actor_emittable = true
seen = "{actor} swallowed hard."
heard = "[You heard a small wet gulp nearby.]"
sfx_prompt = "A single hard nervous swallow, one wet gulp in a dry throat, very close and intimate, no music, no voices"
duration_seconds = 1.0

[[sounds]]
sound_id = "spit"
sound_class = "body"
audible_distance = 4.0
actor_emittable = true
seen = "{actor} spat on the ground."
heard = "[You heard someone spit.]"
sfx_prompt = "A single contemptuous spit landing on stone paving, one short wet splat, close and dry, outdoors, no music, no voices"
duration_seconds = 1.0

[[sounds]]
sound_id = "gargle"
sound_class = "body"
audible_distance = 6.0
actor_emittable = true
seen = "{actor} gargled noisily."
heard = "[You heard someone gargling nearby.]"
sfx_prompt = "A person gargling a mouthful of liquid noisily for a few seconds and stopping, comedic and unhurried, close and dry, no music, no discernible words"
duration_seconds = 2.0

[[sounds]]
sound_id = "soft_report"
sound_class = "body"
audible_distance = 8.0
actor_emittable = true
seen = "{actor} eased a private discomfort, unmistakably."
heard = "[You heard a soft, unfortunate sound nearby.]"
sfx_prompt = "A short soft muffled bodily noise followed by a quiet splash on stone, discreet and low, a narrow medieval alley behind it, no music, no voices"
duration_seconds = 1.5

# The nightly boil (`features/rats.md` M2). Every other rat in the game is
# render-side texture the sim never hears — fifty of them scurry in eight
# authored colonies for no tokens at all. This row is the feature's single
# crossing: once a game night one colony surges, and `src/city/vermin.rs` fires
# this at the colony's anchor on entry and re-arms it every few game-minutes
# while the surge holds, on the same unattributed WORLD-sound mechanism the bell
# and the coin clink use (`emit_sound(world, None, …)`). NOT `actor_emittable`:
# the world pours the rats, not an LLM `make_sound`, so the emittable-id list
# the prompt renders is unchanged and the golden fixtures stay byte-stable. No
# `seen`: a swarm has no author, so it is never attributable however you are
# facing. The radius is deliberately street-sized — you have to be standing in
# the boil to hear it, not in the ward.
[[sounds]]
sound_id = "rat_swarm"
sound_class = "body"
audible_distance = 12.0
actor_emittable = false
heard = "[Rats — far too many of them — are pouring through the street here.]"
sfx_prompt = "A great swarm of rats pouring through a narrow medieval stone alley, dozens of small claws scrabbling over wet cobbles, overlapping high squeaks, bodies brushing past crates and cellar boards, close and dry, outdoors at night, no music, no voices"
duration_seconds = 6.0

# Looping scene assets. Read only by the generator and Bevy; the sim never sees
# these (an inbox line per fireplace crackle would be token suicide —
# design/06 §5). The two water loops are placed on the plan's well and cistern
# fixtures by `city::water`.
[[ambients]]
sound_id = "fireplace"
sfx_prompt = "A steady crackling fireplace, gentle wood pops over a warm even room tone, constant level, seamless loop, no voices, no music"
duration_seconds = 12.0

[[ambients]]
sound_id = "well_trough"
sfx_prompt = "A quiet medieval well yard: water trickling steadily from a stone trough into a drain, an occasional drip echoing down a deep shaft, a rope creaking faintly on a windlass, constant level, seamless loop, no voices, no music"
duration_seconds = 14.0

[[ambients]]
sound_id = "cistern_drip"
sfx_prompt = "Rainwater running down a gutter into a stone settling box, slow drips echoing inside a vaulted underground cistern, a hollow watery room tone, constant level, seamless loop, no voices, no music"
duration_seconds = 14.0

[[ambients]]
sound_id = "chain_draw"
sfx_prompt = "The slow steady clank of an iron chain over a well windlass, a ratchet pawl ticking, a bucket knocking a stone shaft, water dripping back down, a busy freight street behind it, constant level, seamless loop, no voices, no music"
duration_seconds = 14.0
