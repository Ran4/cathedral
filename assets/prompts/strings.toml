# The LLM-visible micro-strings the character sheet embeds.
#
# The sheet is built in Rust before templating, so these cannot live in
# `turn.j2` — but they are still prose the model reads, so they are data, not
# code (D3). The sheet's section labels (`**you_hold**`, `**since_your_last_turn**`,
# …) are NOT here: they mirror the old JSON keys, `turn.j2`'s prose names them,
# and they are structure, not prose. `accept_with` is a pattern: `%s` is
# replaced with the item id.

# Rendered instead of a real name for anyone outside the actor's `knows` set.
unknown_person_name = "a stranger (you don't know their name)"
# The parenthesis after `**you_see**` — the radius here is HEARING_RADIUS_M, in prose.
you_see_description = "people within 20 metres, nearest first"
# `since_your_last_turn` when the inbox drained empty.
nothing = "nothing"
# `recent_history` when the actor has perceived nothing yet.
nothing_yet = "nothing yet"
# `you_offer` for a broadcast offer — and, quirk intact, for an offer whose
# target has left the world (D-quirk R9/R21: replicate, do not "fix").
offer_to_anyone = "anyone"
# `the_only_languages_you_know`.
languages = "English"
# `offered_to_you`: the literal action line that takes the offer.
accept_with = 'accept_offered_item {"item_id": "%s"}'
# `you_see` when nobody is within earshot.
nobody = "nobody"
# `stored_memories` when there are none.
no_memories = "none"
# `places_you_know` when the actor holds no place handles.
no_places = "none"
# `you_hold` when the hands are empty.
holding_nothing = "nothing"
# The parenthesis after `**places_you_know**`.
places_note = "go_to takes these place_ids"
# The parenthesis after `**you_sell**` — a bound vendor's stall prices.
sell_note = "your stall's prices"
# Introduces `you_are`'s clock phrase.
the_hour_label = "The hour:"
# Introduces `you_are`'s weekday phrase.
the_day_label = "The day:"
# The parenthesis after `**your_round**`.
round_note = "your standing day, leg by leg; each begins when its bell rings"
# The parenthesis after `**word_in_the_ward**` — the ward's live notices.
notices_note = "what the ward is saying; hearsay and descriptions, not proof"
# The parenthesis after `**the_ward_says**` — the mood the Night Office's ward
# batch returned, carried by every Minor of that ward (movement M6).
ward_says_note = "how your ward feels this morning; you share it, you did not decide it"
# The parenthesis after `**your_people**` in the ward digest — the ward
# batch's own sheet, not a person's.
ward_people_note = "the ordinary householders and trades of this ward"
# The parenthesis after `**their_places**` in the ward digest.
ward_places_note = "set_round may name any of these place_ids"
# The parenthesis after `**dogs_nearby**` — the street dogs, listed for
# everyone with no `knows` gating: nobody needs an introduction to see a dog.
dogs_note = "street dogs within 20 metres, nearest first"
# The parenthesis after `**marks_here**` — chalk on the walls, listed for
# everyone with no gating: there is no literacy state in this city, and a mark
# means the same plain thing to anyone who looks at it.
marks_note = "chalk on the walls within 8 metres, nearest first"
# `you_are`'s walk sentence; `%s` is the destination name.
walking_to = "You are on your way to %s."
# `you_are`'s follow sentence; `%s` is the person being followed.
following = "You are following %s."
# Introduces the lore profile's `faction_role` on the `**you**` line.
faction_role_label = "Faction role:"
# Introduces the lore profile's `illegal_activity` on the `**you**` line.
illegal_activity_label = "In secret:"
# Introduces the lore profile's `home` — the baked spoken home-binding — on
# the `**you**` line.
home_label = "Home:"
# The parenthesis tying `home` to its wayfinding handle: `(go_to pl_x9k2)`.
home_place_label = "go_to"
# The `you_hold` suffix for a stack-unit riding a body pocket
# (`features/extra_pockets.md`): `- k3f9x wet spark (in your mouth)`. The register
# is period-euphemistic on purpose — partly tone, partly because blunt anatomical
# prompt text is a real provider-compliance risk, and a model plays along with a
# euphemism far more reliably.
pocket_mouth_note = "in your mouth"
pocket_butt_note = "carried privily, behind"
pocket_frontbutt_note = "carried privily, before"
