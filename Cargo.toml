[package]
name = "cathedralbevy"
version = "0.1.0"
edition = "2024"
description = "A walkable, procedural cathedral-city built with Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["3d", "ui"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
