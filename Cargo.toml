[workspace]
members = [".", "crates/cathedral-sim", "crates/cathedral-backends"]

# Shared across the game crate and the ported engine crates. Keep the version
# requirements identical to what the bevy tree already resolves to (Cargo.lock)
# so the workspace conversion changes no resolved version.
[workspace.dependencies]
base64 = "0.22.1"
cathedral-backends = { path = "crates/cathedral-backends" }
cathedral-sim = { path = "crates/cathedral-sim" }
crossbeam-channel = "0.5.15"
# `serde`: checkpoints carry positions (`Vec3`) directly. Bevy turns this on too,
# but only by feature unification, which `-p cathedral-sim` builds do not get.
glam = { version = "0.32", features = ["serde"] }
hound = "3.5.1"
minijinja = "2"
# `rc`: checkpoints serialize the `Arc<BTreeMap>` stores (knowledge, household doors)
# by value; nothing relies on their pointer identity.
serde = { version = "1", features = ["derive", "rc"] }
# `float_roundtrip`: a checkpoint must decode to the exact f64 it encoded, or a
# restored city drifts from the one that was saved.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"

[package]
name = "cathedralbevy"
version = "0.1.0"
edition = "2024"
description = "A walkable, procedural cathedral-city built with Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["3d", "ui", "bevy_audio", "png", "wav", "mp3"] }
# The actor authority: the pure sim, plus the IO backends that feed it.
cathedral-backends = { workspace = true }
cathedral-sim = { workspace = true }
cpal = "0.17.3"
crossbeam-channel = { workspace = true }
hound = { workspace = true }
libc = "0.2.186"
ron = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
