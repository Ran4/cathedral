[package]
name = "cathedral-sim"
version = "0.1.0"
edition = "2024"
description = "Pure-domain smart-actor simulation: world, actions, perception, prompts"
license = "MIT OR Apache-2.0"

# Pure dependency boundary: no bevy, tokio, network, clock or filesystem IO.
# SHA-256 gives versioned replay payloads stable fingerprints across processes.
# Loaders take `&str`; the host owns IO.
[dependencies]
glam = { workspace = true }
minijinja = { workspace = true }
serde = { workspace = true }
# Checkpoint continuation compares accepted/calendar anchors exactly; use the
# correctly rounded parser so encoding then decoding cannot move a deadline.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { version = "0.10.9", default-features = false }
# The two data-file formats the loaders parse from `&str`: world, area, lore,
# and occupation JSON plus sound/prompt TOML. Pure parsers, no IO of their own.
toml = { workspace = true }
