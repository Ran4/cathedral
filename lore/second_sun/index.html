<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Second Sun — a lore &amp; design corpus</title>
<style>
:root{
  --bg:#0a0806;
  --bg-panel:#100d09;
  --bg-raise:#161209;
  --ink:#e6dcc6;
  --ink-soft:#bcae92;
  --ink-dim:#8a7c63;
  --ink-faint:#5f5544;
  --rule:#2a2318;
  --rule-soft:#1d1810;
  --gold:#a98a4e;
  --accent:#b8e6d2;          /* the wrong green-white — second sun only */
  --accent-dim:#7fae9c;
  --accent-glow:rgba(184,230,210,.10);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,Charter,"Times New Roman",serif;
  --sidebar:21rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
a:hover{color:#fff8e8;border-bottom-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
mark{background:rgba(169,138,78,.30);color:#fff5df;border-radius:2px;padding:0 .1em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:var(--bg-panel);
  border-right:1px solid var(--rule);
  height:100vh;position:sticky;top:0;overflow-y:auto;
  padding:1.6rem 0 3rem;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- sidebar ---------- */
.brand{padding:0 1.5rem 1.2rem;border-bottom:1px solid var(--rule-soft);margin-bottom:1.1rem}
.brand button{display:block;width:100%}
.brand-title{font-size:1.32rem;letter-spacing:.055em;color:var(--ink);margin:0;font-weight:400}
.brand-title .sun{color:var(--accent)}
.brand-sub{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-top:.45rem;line-height:1.6}

.search-wrap{padding:0 1.5rem 1.1rem}
.search{
  width:100%;background:var(--bg);border:1px solid var(--rule);
  color:var(--ink);font-family:var(--serif);font-size:.92rem;
  padding:.5rem .7rem;border-radius:2px;
}
.search::placeholder{color:var(--ink-faint);font-style:italic}
.search:focus{border-color:var(--gold);outline:none}
.search-meta{font-size:.72rem;color:var(--ink-faint);letter-spacing:.06em;padding:.45rem .1rem 0;min-height:1rem}

.group{margin-bottom:1.5rem}
.group-h{
  font-size:.68rem;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-faint);padding:0 1.5rem;margin:0 0 .55rem;font-weight:400;
}
.group-h::after{content:"";display:block;height:1px;background:var(--rule-soft);margin-top:.45rem}
.entry{display:flex;align-items:baseline;gap:.3rem;padding:0 1.5rem 0 1.5rem}
.entry-main{
  flex:1;min-width:0;display:block;padding:.3rem 0;
  border-left:2px solid transparent;margin-left:-.65rem;padding-left:.65rem;
  color:var(--ink-soft);font-size:.93rem;line-height:1.4;
}
.entry-main:hover{color:#fff8e8}
.entry-main.active{color:var(--accent);border-left-color:var(--accent-dim)}
.entry-words{display:block;font-size:.68rem;color:var(--ink-faint);letter-spacing:.07em;margin-top:.08rem}
.entry-raw{
  color:var(--ink-faint);font-size:.8rem;border:none;padding:.3rem .2rem;
  flex:0 0 auto;text-decoration:none;
}
.entry-raw:hover{color:var(--gold);border:none}

/* ---------- results ---------- */
.results{padding:0 1.5rem;margin:-.5rem 0 1.5rem}
.result{display:block;width:100%;padding:.6rem 0;border-bottom:1px solid var(--rule-soft)}
.result:hover .result-t{color:#fff8e8}
.result-t{font-size:.86rem;color:var(--ink-soft);letter-spacing:.02em}
.result-s{font-size:.78rem;color:var(--ink-dim);line-height:1.55;margin-top:.2rem;font-style:italic}

/* ---------- reading pane ---------- */
.pane{flex:1;padding:3.2rem 3rem 6rem;max-width:calc(46rem + 6rem);width:100%}
.doc{max-width:46rem}
.doc-head{margin-bottom:2.2rem;padding-bottom:1.1rem;border-bottom:1px solid var(--rule)}
.doc-path{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.doc-path a{color:var(--ink-faint);border:none}
.doc-path a:hover{color:var(--gold)}
.doc-meta{font-size:.75rem;color:var(--ink-faint);letter-spacing:.08em;margin-top:.35rem}

.doc h1{font-size:1.95rem;font-weight:400;line-height:1.3;letter-spacing:.01em;margin:0 0 1.4rem}
.doc h2{font-size:1.3rem;font-weight:400;letter-spacing:.03em;color:var(--ink);margin:2.6rem 0 .9rem;padding-bottom:.35rem;border-bottom:1px solid var(--rule-soft)}
.doc h3{font-size:1.06rem;font-weight:400;font-style:italic;color:var(--ink-soft);margin:2rem 0 .7rem}
.doc h4{font-size:.78rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:1.7rem 0 .6rem}
.doc p{margin:0 0 1.15rem}
.doc strong{color:#fbf3e0;font-weight:700}
.doc em{color:var(--ink-soft)}
.doc hr{border:none;height:1px;background:var(--rule);margin:2.6rem 0}
.doc ul,.doc ol{margin:0 0 1.15rem;padding-left:1.5rem}
.doc li{margin-bottom:.42rem}
.doc li>ul,.doc li>ol{margin:.42rem 0 0}
.doc blockquote{
  margin:0 0 1.3rem;padding:.15rem 0 .15rem 1.3rem;
  border-left:2px solid var(--rule);color:var(--ink-soft);font-style:italic;
}
.doc blockquote p:last-child{margin-bottom:0}
.doc h1+blockquote{
  border-left:2px solid var(--gold);background:rgba(169,138,78,.05);
  padding:.9rem 1.2rem;font-size:.9rem;font-style:normal;color:var(--ink-dim);
  line-height:1.65;border-radius:0 2px 2px 0;
}
.doc code{
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:.85em;background:var(--bg-raise);color:var(--ink-soft);
  padding:.1em .35em;border-radius:2px;border:1px solid var(--rule-soft);
}
.doc pre{
  background:var(--bg-panel);border:1px solid var(--rule);border-left:2px solid var(--rule);
  padding:1rem 1.15rem;overflow-x:auto;border-radius:2px;margin:0 0 1.3rem;
}
.doc pre code{background:none;border:none;padding:0;font-size:.82rem;line-height:1.6;color:var(--ink-soft)}
.table-scroll{overflow-x:auto;margin:0 0 1.5rem;border:1px solid var(--rule);border-radius:2px}
.doc table{border-collapse:collapse;width:100%;font-size:.88rem}
.doc th{
  text-align:left;font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);padding:.7rem .85rem;background:var(--bg-panel);
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
.doc td{padding:.62rem .85rem;border-bottom:1px solid var(--rule-soft);vertical-align:top;color:var(--ink-soft);line-height:1.55}
.doc tr:last-child td{border-bottom:none}
.doc tbody tr:hover td{background:rgba(169,138,78,.04)}
.doc td strong{color:#fbf3e0}
.doc a.xref{color:var(--ink);border-bottom:1px dotted var(--gold)}
.doc a.xref:hover{color:var(--accent)}

/* ---------- landing ---------- */
.landing{max-width:60rem}
.hero{display:flex;gap:3rem;align-items:center;padding-bottom:2.6rem;border-bottom:1px solid var(--rule);margin-bottom:2.8rem}
.hero-text{flex:1;min-width:0}
.hero h1{
  font-size:2.9rem;font-weight:400;line-height:1.1;margin:0 0 .8rem;letter-spacing:.01em;
}
.hero h1 .sun{color:var(--accent);text-shadow:0 0 26px var(--accent-glow)}
.hero-sub{font-size:.95rem;color:var(--ink-dim);font-style:italic;margin:0 0 1.6rem;line-height:1.6}
.hero-quote{
  border-left:2px solid var(--accent-dim);padding:.2rem 0 .2rem 1.2rem;
  color:var(--ink-soft);font-style:italic;font-size:1rem;line-height:1.7;margin:0;
}
.hero-quote cite{display:block;font-style:normal;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-top:.7rem}
.rose-wrap{flex:0 0 auto;text-align:center}
.rose-cap{font-size:.68rem;color:var(--ink-faint);letter-spacing:.07em;line-height:1.6;margin-top:.7rem;max-width:19rem}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:2px;margin-bottom:3.4rem;background:var(--bg-panel)}
.stat{flex:1 1 0;min-width:8rem;padding:1.05rem 1.2rem;border-right:1px solid var(--rule-soft)}
.stat:last-child{border-right:none}
.stat-n{font-size:1.5rem;color:var(--ink);line-height:1.2}
.stat-n.t{color:var(--ink)}
.stat-n.f{color:var(--gold)}
.stat-n.a{color:var(--accent)}
.stat-l{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-top:.25rem;line-height:1.5}

section.block{margin-bottom:3.8rem}
.block-h{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);font-weight:400;margin:0 0 .5rem}
.block-d{font-size:.88rem;color:var(--ink-faint);font-style:italic;margin:0 0 1.5rem;max-width:42rem;line-height:1.65}

/* phenomenon cards */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule)}
.rule{background:var(--bg-panel);padding:1.15rem 1.25rem}
.rule-n{font-size:.66rem;letter-spacing:.16em;color:var(--accent-dim);margin-bottom:.35rem}
.rule-t{font-size:.98rem;color:var(--ink);margin-bottom:.3rem;line-height:1.4}
.rule-b{font-size:.84rem;color:var(--ink-dim);line-height:1.62;margin:0}

/* four answers */
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1.5rem}
.answer{border-top:1px solid var(--rule);padding-top:1rem}
.answer-t{font-size:1.02rem;color:var(--ink);margin:0 0 .1rem}
.answer-w{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.7rem}
.answer-b{font-size:.87rem;color:var(--ink-dim);line-height:1.68;margin:0 0 .9rem}
.answer-q{font-size:.87rem;color:var(--ink-soft);font-style:italic;line-height:1.6;margin:0;padding-left:.9rem;border-left:1px solid var(--rule)}

/* timeline */
.tl{position:relative;padding-left:1.6rem;max-width:44rem}
.tl::before{content:"";position:absolute;left:.32rem;top:.6rem;bottom:.6rem;width:1px;background:var(--rule)}
.tl-e{position:relative;margin-bottom:.15rem}
.tl-b{display:block;width:100%;padding:.5rem 0}
.tl-b::before{
  content:"";position:absolute;left:-1.6rem;top:1.02rem;width:7px;height:7px;
  border-radius:50%;background:var(--bg);border:1px solid var(--ink-faint);
  transform:translateX(.0rem);
}
.tl-e.live .tl-b::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 9px var(--accent-glow)}
.tl-y{font-size:.76rem;letter-spacing:.1em;color:var(--ink-faint);display:inline-block;min-width:6.2rem}
.tl-e.live .tl-y{color:var(--accent-dim)}
.tl-h{color:var(--ink-soft);font-size:.95rem}
.tl-b:hover .tl-h{color:#fff8e8}
.tl-b[aria-expanded="true"] .tl-h{color:var(--ink)}
.tl-d{
  display:none;font-size:.86rem;color:var(--ink-dim);line-height:1.7;
  padding:.15rem 0 .85rem 6.2rem;max-width:40rem;
}
.tl-e.open .tl-d{display:block}
.tl-legend{font-size:.7rem;color:var(--ink-faint);letter-spacing:.08em;margin-top:1.2rem;padding-left:1.6rem}
.tl-legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:.4rem;vertical-align:middle}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule)}
/* flex-column, not block: a <button> otherwise centres its content vertically
   inside the stretched grid cell, and the cards read as staggered */
.person{
  background:var(--bg-panel);width:100%;padding:1.05rem 1.15rem;transition:background .18s;
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
}
.person:hover{background:var(--bg-raise)}
.person-n{font-size:.98rem;color:var(--ink);line-height:1.35}
.person-r{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:.28rem 0 .5rem}
.person-s{font-size:.84rem;color:var(--ink-dim);line-height:1.6;margin:0;font-style:italic}
.person-secret{display:none;margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--rule)}
.person.open .person-secret{display:block}
.secret-l{font-size:.63rem;letter-spacing:.19em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:.3rem}
.secret-b{font-size:.84rem;color:var(--ink-soft);line-height:1.62;margin:0}
.person-hint{font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-top:.7rem}
.person.open .person-hint{display:none}

/* rose svg */
.rose{display:block}
.rose .lead{stroke:#0a0806;stroke-width:1.15;vector-effect:non-scaling-stroke}
.rose .stone{fill:none;stroke:#3a3123;stroke-width:2}
.rose .pane:hover{filter:brightness(1.55)}
.rose .anom{filter:url(#glow)}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
.rose .disc{animation:breathe 7.5s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.rose .disc{animation:none}}

/* footer */
.foot{
  border-top:1px solid var(--rule);padding:1.8rem 3rem 3rem;margin-top:auto;
  font-size:.76rem;color:var(--ink-faint);line-height:1.8;letter-spacing:.03em;
}
.foot a{color:var(--ink-dim);border-bottom:1px solid var(--rule-soft)}
.foot a:hover{color:var(--gold)}
.foot .law{color:var(--ink-dim)}

/* noscript */
.ns{padding:2rem 3rem;max-width:52rem}
.ns h2{font-weight:400;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.ns ul{list-style:none;padding:0}
.ns li{padding:.25rem 0;border-bottom:1px solid var(--rule-soft)}

@media (max-width:900px){
  .shell{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--rule)}
  .pane{padding:2rem 1.4rem 4rem}
  .foot{padding:1.5rem 1.4rem 2.5rem}
  .hero{flex-direction:column-reverse;gap:2rem;align-items:flex-start}
  .hero h1{font-size:2.2rem}
  .tl-d{padding-left:0}
  .tl-y{display:block;min-width:0;margin-bottom:.1rem}
}
</style>
</head>

const DOCS = {"00_canon.md":{"title":"THE SECOND SUN — CANON BIBLE","use":"","words":7625,"text":"# THE SECOND SUN — CANON BIBLE\n\n*Final synthesis. Single source of truth for the Second Sun corpus (`lore/claude/second_sun/`).*\n\n---\n\n## How to use this document\n\nThis bible is the source of truth for roughly twenty sibling documents — depositions, edicts, ledgers, hagiographies, rumor pools, songs — any of which may be injected straight into NPC context. Where a later document disagrees with this one, it is wrong. Rules for later writers:\n\n1. **The phenomenon is a render-layer fact.** Every detail must be (i) purely visual, (ii) mediated by the Great Rose, (iii) verifiable by eye and F5 screenshot. No heat, no healing, no voices, no physical trace. The dread is that it does nothing — except be seen.\n2. **The truth-value ledger (§10) is canonical.** FALSE-BUT-BELIEVED statements are spread sincerely by the parties named. AMBIGUOUS-BY-DESIGN statements are never resolved — by any document, NPC, quest, or system.\n3. **The rival-theory rule.** Add evidence for any theory only if it also fits at least one rival theory. Nothing may tip the designed ambiguity (§3f).\n4. **Where this bible is silent, invent inside its conventions** — the naming rules in §1, the register below, the calendar in §8.\n5. **Register:** chronicle, deposition, catechism, carved stone. Wonder over gore; dread through restraint. The Second Sun never performs, never chooses, never answers. Being wrong in Ombreval is never merely an error; it is a position.\n\n---\n\n## 1. Names\n\n**The city: OMBREVAL** — a free fortified city of roughly 1.2 × 1.0 km beside the river **Serle**, which runs beyond the south wall. Chroniclers relish the irony that a city named for shadow became famous for light. Years count from the **Fabric era** (F.1 = the cathedral's first stone); the present year is **F.437**.\n\n**The cathedral:** formally the **Great Church of Saint Ambrelle**; everyone calls it **the Lanthorn**. Its west front carries the **Great Rose**, whose central round light is **the eye**; its ceremonial forecourt is **the Gradine**, named for its shallow processional steps.\n\n**The church institution:** the **Church of the Sole Light**, colloquially **the Candor**. Its creed in three words: ***Lux una et indivisa*** — one light, undivided. Its supreme head, the **Luminary**, sits far away in primatial **Ostrelle**, nearly a legend in Ombreval: invoked, feared, ignored. Ranks, descending:\n\n- **The Praelucent of Ombreval** — governs the Lanthorn and the city's spiritual life. On elevation a praelucent takes a *lamp-name* in liturgy (Vigil, Serene, Taper-of-Dawn); the street uses the family name anyway. The office is open to women; the incumbent is **Praelucent Havise Dorn**, lamp-named **Serene**.\n- **The Chapter:** three **Provosts** — of the Fabric (building works), of the Rite (liturgy), and the **Provost-Custodian**, who heads the Custody of the Eye (§6) — over the **Canons of the Rose**.\n- **Wick-priests** serve the parishes (\"each parish a wick of the one flame\").\n- Lay officers: **vergers**, **sextons**, **Tapers** (novices), and the Custody's grey-coated clerks.\n\n**Saints** (all invented; the Candor's own; one line each):\n\n1. **Saint Ambrelle the Glass-Carrier** — glazier's apprentice who bore molten glass in her bare hands from a burning workshop; patroness of glaziers and of the Lanthorn itself.\n2. **Saint Coswald the Wall-Wright** — mason who mortared the siege-breach with his own body; patron of masons, whose lodge has never forgiven the cathedral for honoring the glazier saint instead.\n3. **Saint Vhairé of the Ford** — ferrywoman-martyr who carried a lamp dry across the flooded Serle; patroness of the founding ford and of travelers.\n4. **Saint Ilvane the Twice-Shadowed** — hermit whose corpse, witnesses swore, cast two shadows; the Church says the second was thrown by mourners' candles. Her chapel is shut (below).\n5. **Saint Perrin Halfbell** — deaf bellfounder who tuned bells by palm and jawbone; patron of ringers and founders.\n6. **Saint Maren of the Reeds** — drowned girl whose body floated upstream against the Serle; patroness of the drowned, the poor, and lost things.\n7. **Saint Gaudry the Ledgerer** — tax-clerk who burned false ledgers on the tax-farmer's own step and hanged for it; patron of clerks and honest weights.\n8. **Saint Belwyn the Unlit** — went blind staring at an eclipse and preached that darkness too is of the Light; patron of the Custody of the Eye.\n\n**The five town squares:**\n\n1. **The Wickmarket** (west) — chandlers, wax, tallow; Osanne Vell's stall.\n2. **Coswald's Yard** (north) — stone, timber, the masons' lodge.\n3. **The Tallage** (on the dry Cut) — customs square for Serle tolls; pawnshops; the Tally Bridge.\n4. **Maren's Green** (south-east) — fish market, boat-families, eel smoke.\n5. **The Bellstand** (east) — proclamation square under the old watch-bell tower; edicts cried and posted here.\n\n(The Gradine is ceremonial ground, counted apart from the five.)\n\n**The river and Cut:** the **Serle** runs outside the south wall. Its former straightened city stretch is **the Cut**, closed and filled in F.363–369 and now a trade street. Waters keep their pre-Fabric names; nobody renames water, and dry places often keep the names water left them.\n\n**The disasters:** Ombreval held roughly 15,000 people before the **Great Rains** of F.362 broke the Cut and displaced its old waterside economy. On a late-summer Highmarket in F.415, the extraordinarily localized **Great Hail** struck for perhaps ten or fifteen minutes. Ordinary speech calls it **the Hammering**. It killed 2,000–3,000 people at once and perhaps another 1,000 afterward through injury, exposure, fire, failed stores, and later collapse. The **Long Departure** carried thousands of survivors away; roughly 5,000 people remain in F.437. Nothing establishes a supernatural cause, and the Emblem did not change or act.\n\n**Secondary churches:**\n\n- **Saint Maren of the Reeds** — boatmen's and paupers' church on the old Cut; on the lintel of its churchyard **charnel door** the sexton chalks each buried soul's name, leaving it until the next burial.\n- **The Ilvane Chapel** — deconsecrated in F.290, its doors mortared shut by the Custody: officially \"structurally unsound,\" actually shut because the Twice-Shadowed drew the wrong kind of pilgrim. One thing could not be mortared: the **anchorhold** in its north wall, occupied without a break since F.211 — canon law forbids walling up a living anchoress, so the Custody bricked the chapel around her and left the squint on the lane. The present anchoress is Dame Aldith (§7).\n\n**Streets and passages that matter:**\n\n- **Gaunt Passage** — covered passage behind the salt-cellars near the Tallage; primary heretic meeting site.\n- **The Draper's Reach** — covered gallery of the cloth halls; secondary meeting site (roof space).\n- **Cinder Row** — the glaziers' street, rebuilt after the fire of F.171; workshops of the Sparr line.\n- **The Needle** — the narrowest pinch in the city, shoulder-wide; proverbial (\"past the Needle\" = beyond saving); where the cell chalks its signs.\n- **The Tally Bridge** — two-arched stone overhead bridge across the dry Cut at the Tallage; Lise Copp's pawnshop faces it.\n\n**Naming conventions (for minting new names):**\n\n- **Citizens:** given name plus a byname from trade, street, origin, or feature (\"Ede of the Needle,\" \"Wyn Alder\"). Bynames are earned or inherited, never chosen; families of standing fix theirs (Sparr, Copp, Stott, Dorn, Alder). The poor often carry one-syllable small names: Pin, Ib, Cobb, Sef.\n- **Streets:** named for trades, damage, saints, or shape — never for living people; renaming follows only calamity. Passages take the name of what they pass beneath.\n- **Bells:** named at casting like a baptism, two parts, saint plus voice-word, with a motto cast into the waist. The Lanthorn's bourdon is **Great Ambrelle, called Gravemouth** (motto: *SOLI LUCI CANO* — \"I sing to the sole light\"; the heretics note, quietly, that it does not say which). Its ring also holds **the Orphan**, whose baptismal record burned and which folk therefore distrust. Saint Maren's passing-bell is **Maren Smallvoice**, which rings the name-knell: one slow stroke per year of the life.\n- **Dates:** Fabric era, located by feast, chronicle-style: \"the third day after Coswaldstide, F.436.\"\n\n---\n\n## 2. The Phenomenon — Observable Canon\n\nEvery rule below is a visual fact the render layer enforces; witnesses may describe them poorly, but the facts never vary. Two hundred years of records describe them identically — that consistency is the horror.\n\n1. **Where it shows.** A second sun is visible **only where sky is seen through the glass of the Great Rose, from inside the Lanthorn** — nave, crossing, triforium, anywhere the sightline passes through rose glass to sky. Through the other windows: nothing. From outside: nothing. Through a **gap** where a pane is missing: nothing — the hole shows one ordinary sky. Everyone who tests the broken-pane fact goes quiet afterward.\n2. **It is the Rose, not the pane.** A pane taken from the rose and held to open sky shows nothing; replica glass shows nothing anywhere; but **new plain glass leaded into the rose shows it perfectly**. It needs glass, and it needs *that window*. (Proven, suppressed, load-bearing: it acquitted the glaziers in F.288, refutes the heretics' fondest doctrine, and almost no one living knows it.)\n3. **The wrong color.** A cold **green-white — the color of dawn seen through river ice**. Wrong three ways. First, what witnesses always name: it does not take the color of the pane it shines through — through a red pane the clouds redden and the disc stays green-white; every light in the world obeys the glass but this one. Second, its color belongs to no hour of any honest sky. Third, **you can look straight at it without pain** — the true sun punishes the eye; this one permits it, and the permission unsettles people most.\n4. **Its light indoors.** It casts its own beams into the nave at angles that contradict the true sun's, in that same unglazed green-white. Persons and pillars cast **two shadows**: one warm and true, one faint, cold, differently aimed — the **grave-shadow**. Where its beam crosses a true sunbeam, the two pools overlap **without mixing**, each shadow keeping its edge and color inside the other's light. Its beams carry no warmth: wax does not soften in them.\n5. **Step outside** and it is gone — one sun, one shadow, always. Nothing of it reflects in the Serle beyond the walls, in a rain-barrel, or in a mirror carried out the door. A flying observer over the rooftops finds one sun and nothing else, forever.\n6. **No parallax.** The true sun shifts from pane to pane as a walker crosses the nave. The second sun does not: at any instant it stands **in the same pane for every eye in the building**, as if it were *in* the glass — yet its rays sweep the floor with the hour. This is the measurement that broke the scholars.\n7. **Motion.** It moves **against** the true sun — the **countergait**. At clear dawn, while the true sun rises at the city's back, the disc stands low and huge in the western rose: the daily **dawn-showing**, the most crowded viewing. Through the day it climbs the lights against the sun's course. In late afternoon, when the true sun comes round into the west, the two share the window — the **strong hour** — and once each day they pass: **the Passing** (folk: **the Kiss**), crossed rays laying an X of light down the nave. The crossing point walks through the year. It keeps the sun's hours exactly: appearing with dawn, fading with the last light, never seen at night.\n8. **The Concurrence.** On one fixed day a year (§8), the Passing falls dead center in the eye as seen from the crossing floor, and for a handful of minutes the two lights superpose: every doubled shadow in the nave **fuses into one**. It needs the true sun: under a **clouded Concurrence** the pale disc burns alone through the overcast, there is nothing for its shadow to fuse *with*, and the feast simply fails — the city takes it hard.\n9. **Weather.** It burns through overcast as a pale disc when the true sun is smothered — \"the clouds do not know it\" (see the Great Rains, F.362). In daytime thunderstorms, when lightning whitens every pane of the rose for an instant, **the disc alone does not brighten** — a steady cold coin in a sheet of white. (In night storms some swear it has stood, for the length of a flash, in the open sky in the wrong place; no two witnesses agree. AMBIGUOUS-BY-DESIGN.)\n10. **Nothing else doubles** — one moon, single stars, single flames. Only the sun, and only through the rose.\n\n---\n\n## 3. The Layered Truth\n\n### (a) Objective facts the simulation enforces\n\nEvery rule in §2; that anyone with a rose sightline sees it (one ambiguous exception: the Spared); that the Gaunt Passage grate opens only to the current pass and counter-sign; that the Custody pays informants; that the documents named in §4 and §6 physically exist.\n\n### (b) Church doctrine\n\nThe creed holds that light was the first creature and the only one that never disobeyed; every oath in Ombreval — contracts, testimony, verdicts — is sworn ***\"by the light that does not lie.\"*** The stake fits in one sentence: if light can be double, testimony can be double, and every oath in the city is unsworn.\n\nSo the Candor teaches: there are not two suns; there is one Light and, by grace, one **Emblem** of it — a *granted image*, \"a painting of the Light upon the eye of the Church.\" Formula: ***Una lux, gemina species*** — one light, twofold appearance. Calling the Emblem a \"sun,\" a \"second sun,\" or \"the green sun\" is a citable offense under the **Edict of F.244**. The doctrine is elegant precisely because it explains nothing and forbids the question.\n\nBeneath the Edict sits the gentler, cleverer **Custody Doctrine**: ***to see is no sin; to affirm is.*** Confessors absolve the sight freely, without penance — a policy that starves the confessional of rumor. A wick-priest hearing \"I saw it\" says only, \"So do we all, child; affirm nothing.\"\n\nThe Church's true position, held privately at the top, is fear with excellent reasons. It is not hiding a truth it knows; it is **holding a fact it cannot metabolize** (§6).\n\n### (c) Heretic doctrine — the Unwalled\n\nWrong on purpose, per the design. They hold that the green sun is **real**, the elder of the two, and once stood in the open sky above everyone's grandmothers. The Church's four centuries of building were not worship but **masonry against heaven**: the Lanthorn is a wall raised to shut the second sun out of the sky, and the Great Rose is its one flaw — old glass \"remembers the sky it was cooled under,\" so the walled sun shows through it as through a keyhole.\n\n**What they get right:** that the Church is lying about *something*; that the phenomenon is objective and repeatable; that the Custody sits on suppressed test records (§6); their Concurrence arithmetic (F.431). And an irony neither side can see: **both factions secretly guard the same window** — the Keyhole faction protects the rose, and the Custody prevents every \"repair\" that might become a public experiment.\n\n**What they get wrong:** everything about mechanism and history. No chronicle, ruin, or elder testimony attests a green sun in the open sky, ever. Their treasured \"recovered testimonies\" are forgeries — some bought, one unknowingly commissioned (§7). Their glass-memory doctrine is falsified by a fact they will never see: new glass in the rose shows the disc perfectly. And the wall-theory cannot survive its own keyhole: a thing walled out should show through a *hole*, and it shows only through *glass*. Shown the broken-pane fact, an Unwalled neighbor says \"the wall heals its own holes\" — the doctrine absorbs every disproof, and they half-know it, and keep it anyway, because the alternative is that the whispering goes nowhere.\n\n### (d) The scholars' theory\n\n**Doctor Aubin Ferrant** teaches the *doubled ray*: glass fluxed with the ash of the F.171 fire splits the sun's image \"as a stick bends in water.\" Tested: his replica panes show nothing; rose panes show nothing elsewhere; and his own last measurement proved the **no-parallax** — one pane for every eye — which no bent ray can do. The theory is dead, and Ferrant, to his credit, keeps the corpse on his desk and keeps measuring. In his notebook's margin stands the line the whole corpus is named for: *\"It moves against the sun; it stands in one pane for every eye; I have no theory. An impossible light, and the city at peace with it.\"* The phrase is beginning to drift, garbled, into street speech.\n\n### (e) Folk belief\n\nIn the streets the disc is the **Green Sun**, and it shines for the dead — speak your dead's name in its beam and they hear you. A grave-shadow on a bride is ill luck; mothers hold newborns in the doubled light so the child \"has a spare shadow to spend\"; fever is carried into the green beam to cool. Children play **twinning** — contorting so their two shadows touch hands. The vergers tolerate it all; pilgrims pay. The deepest lore is the children's; the canonical rhyme:\n\n\u003e *One sun for the living, one sun for the flown,*\n\u003e *one for the tallow and one for the stone;*\n\u003e *Colm went a-walling and Colm went below —*\n\u003e *count both your shadows wherever you go.*\n\n(No child knows who Colm was. See F.301.)\n\n### (f) The designed ambiguity — a binding design decision, stated plainly\n\nThe game never reveals what the Second Sun is. No document is authoritative about its *nature*; the Custody's archive proves only what it is **not** (not fraud, not one pane, not new, not the glaziers). Never to be confirmed or denied, by any NPC, document, or system: its origin and purpose; whether it hears anything spoken into its light; the night-storm sightings; whether the Spared truly cannot see it, or lie; whether Saint Ilvane's second shadow was this; what the missing last page of the Sparr deposition said, or whether it ever existed; what was seen in the sixteen silent years between F.204 and F.219 (a deliberate gap; do not fill it); and whether Dame Aldith's recitation preserves Idonea Sparr's words or an old woman's invention.\n\nDeveloper flight changes nothing: outside there is nothing to find; inside, it is simply, stubbornly there.\n\n---\n\n## 4. Timeline (Fabric era; current year F.437)\n\n- **F.1** — First stone of the Lanthorn laid at the old ford-market, on Saint Vhairé's ground.\n- **F.171** — The Cinder Row furnace fire; the glaziers' street burns and is rebuilt; its ash enters glass, legend, and Ferrant's dead theory.\n- **F.198–203** — **Master Idonea Sparr** of Cinder Row leads the making of the Great Rose. The day the last panel is set (F.203), the chronicle records, she looked back through her finished window from the crossing and wept, saying **she had made two of something there was one of**. She never fired glass again.\n- **F.204** — The Chapter takes Idonea's deposition and seals it: the oldest paper in the Grey Press. The cover-up is older than the first public sighting.\n- **F.211** — Idonea Sparr dies. The anchorhold at the Ilvane Chapel is first occupied; the line has not broken since.\n- **F.219** — First open record: a novice's margin note, *\"the sky doubled behind the rose.\"* Ruled \"a fault of the eye.\" (What passed between F.204 and F.219 is unrecorded. Deliberately; see §3f.)\n- **F.240s** — Pilgrim traffic surges. The Chapter first monetizes (badges, viewing hours), then criminalizes the vocabulary: the **Edict of F.244**.\n- **F.288 — THE GLAZIERS' TRIAL.** The masons' lodge, aggrieved by the glaziers' pilgrim income and the cathedral's dedication to Saint Ambrelle, formally accuses the glaziers' guild of *sorcerous glass*. Before the Praelucent's court a rose pane is replaced with plain new glass: **the Emblem persists in the new pane.** Verdict: *no art of man* — never published. Three journeymen had already been broken at the Question; the guild pays a \"peace fine\" for a disproven crime; the record is sealed. The glaziers never forgive the masons; the masons never forgive the verdict they were never shown.\n- **F.289** — The **Custody of the Eye** founded to hold the sealed record and prevent the next trial. It has been preventing, and accumulating, ever since. The **Praelucent's Attestation** (§6) is instituted the same year.\n- **F.290** — The Ilvane Chapel shut; the anchorhold's squint stays open, because it must.\n- **F.301 — ORIGIN OF \"WALLED OUT OF THE SKY.\"** During the raising of the west towers, a mason's laborer named **Colm Attergate** preaches in the Bellstand that the towers are coffin lids and the Church is \"walling a sun out of the sky, course by course.\" Banished; drowns at the Serle sluice trying to return by water, while the Cut still ran. Folk make him a martyr; the heresy dates itself from him; the phrase is his. (The Alder boat-family keeps the true arch of the now-dry Old Sluice a trade secret from pilgrims.)\n- **F.362** — **The Great Rains**: three weeks of overcast; the only sunlight in the city stands in the nave. Publicly the Church's finest hour (\"the Light kept faith\"); privately its ugliest: forty arrests for saying the green sun fed the city when the true one failed.\n- **F.363–369** — The Great Rains' damage settles the old argument over the Cut. The city closes and fills it and turns navigation into the Serle's present bed outside the south wall. The old bridge, yard, and sluice names survive on dry ground.\n- **F.398** — The Fabric declared complete after 398 years; the north tower crown stands scaffolded to this day.\n\n**Living memory (NPCs remember these):**\n\n- **F.415 — THE HAMMERING.** The Great Hail strikes a crowded late-summer Highmarket. Impact, falling roofs, fire, meltwater, failed foundations, and spoiled stores kill thousands. The Chapter's Long Book reduces it to broken cloth-hall tiles and dry wool. Ordinary rites are overwhelmed; many dead receive only common mourning tolls and are remembered as the Unknelled. The Great Rose's tracery holds, but glass cracks and leadwork loosens. The Emblem does not change.\n- **F.419–421 — The Re-leading.** Publicly, two years of scaffold over the rose to put right damage sustained in the Hammering. In truth, the Custody also makes the necessary repair its largest experiment: a third of the panes swapped, one whole light removed and re-set, everything documented. The Emblem never flinched. Several living NPCs worked that scaffold under silence-oath.\n- **F.428 — The Whisper Arrests.** On an informant's tip, the Custody seizes five in Gaunt Passage. Two recant on the Gradine; a fuller dies in custody \"of the damp.\" The informant was never named. Every current cell member remembers, and suspects everyone.\n- **F.431 — The Almanac Shame.** The heretics' computed Concurrence date beats the official almanac by a day; the wrong bells ring at the wrong noon. Corrected without acknowledgment.\n- **F.433 — The Ledger Theft.** A Custody scribe dies (or flees; the record is neat and unsigned) and a satchel of archive copies goes into the city. The Custody has bought pages back through pawnshops ever since; a \"Sparr page\" is the costliest contraband in Ombreval.\n- **F.436 — The Shut Door.** At last year's Concurrence the Chapter, fearing crowds, bars the nave doors at the moment of the Passing — first time in memory. A crush on the Gradine; a child's arm broken; tavern fury still hot. **This year's Concurrence approaches; the doors question must be answered again — and everyone watches the sky, for a clouded Concurrence answers nothing.** The corpus's live fuse.\n\n---\n\n## 5. The Heretic Cell\n\n**Names.** They call themselves **the Unwalled**; the Custody's files say **the Attergate error** or **Colmites**; the street says **the Greensick**. Members call one another **neighbor**.\n\n**Size and structure.** About nineteen sworn members, in threes called **lights**, as the lights of a window; each knows their own light and one **lead** — lead, as the strips that hold glass. Above them: the **Wicket** (doorkeeper: Grigor Ashe), the **Namekeeper** (Betriss Marle), and **the Tracer** (the tracery holds all lights), whose identity is hidden even from most members. Currently: Osanne Vell (§7).\n\n**The charity that feeds the secrecy.** From their dues the Unwalled quietly pay Saint Maren's for **paupers' funerals**, so the poor get a name-knell and a chalked name on the charnel door like anyone. The sexton, old **Noll Fitch**, gallows-gentle, rings the knell slow and chalks each name plain; he worked out years ago what his lintel is read *for*, and says nothing, on purpose.\n\n**The pass.** Admission is by whisper at the grate — literally: the player whispers into the microphone, within arm's reach of the door, in a city where every voice carries twenty meters. Two layers:\n\n1. **The name.** The pass is **the given name of the most recently buried soul whose funeral the cell's coin paid for** — always a name chalked publicly on Saint Maren's charnel door and tolled on the name-knell. The name is public; **the rule is the secret**. Rotation is set by death itself, \"while the name is fresh.\" An observant outsider can crack it: attend the pauper's funeral, read the lintel, learn what the knell means.\n2. **The counter-sign.** The Wicket whispers: ***\"Who walks at the other noon?\"*** The neighbor answers with the name — *\"Old Sef walks.\"* The Wicket tests: ***\"By whose lantern?\"*** — and the neighbor gives the current counter-sign, in a strict mintable form: **a saint's possessive plus a terse image, five plain words or fewer** — *\"Maren's, upstream\" · \"Belwyn's, unlit\" · \"Gaudry's, honest weight\" · \"Vhairé's, dry across.\"* It changes at the first meeting after each quarter-feast; the next one is spoken exactly once inside the closing recitation (\"attend the words after *unwalled*\"). Miss a meeting and your lead brings it to you. Nothing is ever written.\n\nAll of it is short, phonetically plain, kind to speech-to-text; a leaked name alone opens nothing, and a leaked counter-sign without the fresh name opens nothing either.\n\n**Signals.** A small **glazier's diamond chalked at the midpoint of the Needle**: high, meeting at Gaunt Passage; low, the Draper's Reach; doorside, Saint Maren's crypt after a burial; **struck through — a \"cracked pane\"** — pass and counter-sign burned, scatter, the next pair travels lead to lead.\n\n**A wrong whisper.** No knives, ever. The grate stays silent a breath too long; then Grigor Ashe answers, perfectly mundane: *\"We're closed, friend — the salt's weighed at Lowmarket.\"* The meeting drains out the far end and becomes people sheltering from weather. But the Wicket has marked your face. A second wrong whisper gets you *fed*: a false name, a false time, an empty cellar — and, the darker rumor says, an unsigned note reaches the Custody. The Unwalled do not kill; they inform on their enemies to their enemies, which in Ombreval is worse.\n\n**What they do at meetings.** Read aloud from bought and stolen archive pages (and argue authenticity, sometimes correctly). Recite the Testimony of Colm. The Namekeeper reads the **bede-roll**, and each neighbor whispers one name of their own dead \"through the keyhole,\" facing the rose — which none can see from the shades; most have seen the Emblem once or twice in their lives, some never. Then **sky-drawing**: those who saw it that week describe its pane and color aloud while a recorder charts the cloth sky-map, the **Green Almanac**. Dues are gathered: for funerals, for page-buying at the Tally Bridge, for bribes to vergers. Last, the forbidden verse is rehearsed low — ***\"Lucem non murabis,\"*** *you shall not wall the light* — to be sung in the nave at this year's Passing.\n\n**Goals.** Near: recover the complete Sparr deposition — they believe it proves the sky once held two suns. (It does not. It proves the Church has lied since F.204, which is nearly as good, and they half-know this.) Far: **the Unwalling**, whose meaning depends on faction: the **Keyhole** faction holds the rose sacred — the one honest eye, to be protected at any cost — while the **Breach** faction whispers that the *building* is the wall and talks of opening it: all talk, no capability, but talk that could hang all nineteen.\n\n**Internal tensions.** Keyhole against Breach; old believers against the post-Shut-Door intake, who joined angry rather than faithful; whether the charity is piety or camouflage (both, and they know it); and under everything, the unfound informant of F.428.\n\n**Risks of exposure.** A grey clerk attends paupers' funerals now, noting who lingers at the charnel door; a whisper at a grate can be overheard by anyone within twenty meters. Exposure means the Gradine — recantation theater — or worse, the Custody mortaring the meeting vaults \"for safety,\" as it mortared the Ilvane Chapel: architecture as punishment. Their real protection is the Custody's reluctance: arrests create witnesses, and the Whisper Arrests taught both sides what a public weeping costs.\n\n---\n\n## 6. The Church Response — the Custody of the Eye\n\nFounded F.289 to hold one sealed verdict; seated in the chapter house; patron **Saint Belwyn the Unlit**; emblem a closed eye. Now a small grey office under the **Provost-Custodian** (Segwin Rasp), with clerks, money, and the **Grey Press**, its archive, F.204 to yesterday.\n\n**Methods.**\n\n1. **The Custody Doctrine** — *to see is no sin; to affirm is* — with free absolution for the sight (§3b).\n2. **Vocabulary enforcement** under the Edict of F.244: fines, recantations on the Gradine — public theater, deliberately survivable.\n3. **Licensing.** The Church *sells* stamped pilgrim badges of the Emblem while forbidding anyone to say what the badge shows; badge-money part-funds the Custody, which thus profits from the belief it polices. Rasp knows it.\n4. **Moths** — paid informants, in \"dry money\" laundered through Lise Copp's pawnshop at the Tally Bridge — the same shop through which stolen archive pages flow back to the Grey Press, and outward to the Unwalled. One broker, milking all sides, essential to each.\n5. **The Fabric pretext.** Scaffolds, canvas, \"repairs\" that repair nothing — some of them secretly experiments.\n6. **The Question** exists in the archive (three deaths, F.288 and F.362); Rasp refuses it — torture, he writes, is bad record-keeping.\n\n**The Praelucent's Attestation.** Instituted F.289 and never once omitted: at installation, each new Praelucent is taken alone to the crossing at the strong hour, required to look, and required to sign what they saw. The leaves live in the Grey Press, each attesting what the Church publicly calls an Emblem and privately cannot name. The founding minute states the purpose: *\"so that the Custody never become a custody of nothing.\"* The Church compels its highest officer to witness what it forbids the city to affirm — it fears the thing, and refuses to let itself forget it.\n\n**The uncomfortable secret, in three layers.** (1) The Custody has known since F.288 that the phenomenon is no fraud; every test since confirms it in meticulous suppressed detail, worst of all: *new glass shows it too.* (2) Its centuries of secret sky-charts **match the heretics' Green Almanac observation for observation**; after the F.433 theft the Custody bought heretic charts, and Rasp has seen the match — enemy institutions keeping one identical record. (3) The last page of the Sparr deposition is missing *from the Grey Press itself*, and no Custodian has ever recorded whether it was removed or never existed (AMBIGUOUS-BY-DESIGN, forever). The Custody is not hiding the truth. It is hiding that it does not have one.\n\n---\n\n## 7. People (seed bios)\n\nRole — temperament — stance — one secret. Later documents expand, never contradict.\n\n1. **Praelucent Havise Dorn**, lamp-named Serene — head of the Church in Ombreval. Serene, exhausted, precise; pure doctrine in public. *Secret:* as a young canon she attended a heretic reading — doubt, not duty — and her name may be in the stolen F.433 pages.\n2. **Provost-Custodian Segwin Rasp** — master of the Custody. Dry, meticulous, despises cruelty as sloppy method. Stance: enforce the Emblem, learn the truth quietly. *Secret:* he wrote the anonymous almanac correction of F.431 using the heretics' own figures.\n3. **Warden Hamel Stott** — master of the masons' lodge. Proud, aggrieved, carries F.288 like a fresh wound. Stance: \"it is in the glass; glass is a lie you can see through.\" *Secret:* the lodge's founding charter pledges the masons to \"close the light above\" — roofing boilerplate, probably — and he has read the clause a hundred times and sleeps badly.\n4. **Mistress Jonet Sparr** — master glazier, Cinder Row, of Idonea's line. Wry, guarded, guild-proud: \"our glass shows true; take it up with the sky.\" *Secret:* she holds one page in Idonea's hand — a recipe margin reading *\"cool the green under the open sky\"* — meaningless or everything; shown to no one.\n5. **Osanne Vell** — chandler of the Wickmarket; supplies the Lanthorn's candles; **the Tracer**. Motherly, iron-cored; her failing eyes can no longer make out the Emblem — she leads the Unwalled on faith in other people's seeing. *Secret:* the F.428 informant was her — one anonymous tip to remove a Breach hothead before he got them all killed; the fuller's death is hers to carry, and her leadership is penance.\n6. **Grigor Ashe** — salt-merchant whose Gaunt Passage cellar hides the grate; the **Wicket**. Jumpy, mercenary, quarter-believer. *Secret:* keeps a private list of every face marked at the grate — insurance, he calls it; merchandise, it may become.\n7. **Doctor Aubin Ferrant** — physician-astronomer off the Tallage. Courteous, obsessed, honest to a fault; author of the margin line *\"an impossible light, and the city at peace with it.\"* Stance: the doubled-ray theory, dead by his own measurements, still measured. *Secret:* his instruments are funded by the Custody; he suspects, and does not ask.\n8. **Lise Copp** — pawnbroker at the Tally Bridge. Unreadable, scrupulously \"neutral\"; fences archive pages to the Unwalled, launders moth-money for the Custody. *Secret:* she cannot read — she prices pages by seal, hand, and the fear in the seller's eyes — and has sold three of her nephew's forgeries as genuine.\n9. **Corin Copp** — her nephew, journeyman scrivener. Charming, hollow, gifted; makes \"old\" pages for both markets. *Secret:* his masterpiece, *Colm's Last Letter* — the cell's most revered relic — he seeded with phrases from a real page handed to him by a man he now believes was a Custody clerk. What that means, he refuses to think about.\n10. **Verger Dunstan Pike** — keeper of the nave keys. Pious, venal in small change; sells odd-hour nave access. *Secret:* he stood the F.421 scaffold, watched the pane-swaps, signed the silence-oath — a living eyewitness that new glass shows the Emblem.\n11. **Crier Jos Brant** — town crier of the Bellstand. Booming, warm, cheerful folk believer (\"the Green Sun hears the dead, neighbors\"). *Secret:* a paid moth, reporting crowd-talk weekly — who does not know his tip caused the Whisper Arrests, or that anyone died of it.\n12. **Betriss Marle** — publicly recanted heretic of F.428, ostentatiously devout, in the nave daily; the **Namekeeper**. Meek in company, granite alone. *Secret:* the recantation was planned with the cell to shield the Tracer; still sworn; she is the daily sky-recorder, charting the Emblem in embroidery.\n13. **Ede of the Needle** — orphan, arm healed crooked from the Shut Door crush; runs messages for a bell-coin; keeper of every skipping rhyme, including verses about \"Colm\" that no adult can gloss. Feral, watchful, unbought. *Secret:* from her hiding place in the Needle she has overheard the current counter-sign; she has told no one, and does not know what it is worth.\n14. **Dame Aldith** — anchoress of the mortared Ilvane Chapel; voice through the squint; ancient, amused; trades verses for honest news, refuses every doctrine: \"I face a wall, child. Both suns can manage without me.\" *Secret:* each anchoress since F.211 has taught the next a recitation, the Glazier's Vespers, never written, said to be Idonea Sparr's last words. Missing page or long game of whispers, not even Aldith knows — and she has recited it to no one. Yet.\n\n*(Named in prose, expandable: Sexton Noll Fitch; the Alders; the dead — Idonea Sparr, Colm Attergate, the fuller of F.428.)*\n\n---\n\n## 8. Calendar Hooks\n\n- **Bellday** — weekly holy day; the nave at its fullest; the Alders speak their dead's names in the green beam.\n- **Highmarket** (Wickmarket, Coswald's Yard) and **Lowmarket** (the Tallage, Maren's Green) — the weekly market days.\n- **Feast of Saint Ambrelle** (early summer) — glaziers' feast; procession of glass from Cinder Row to the Gradine; a quarter-feast (counter-sign turns after it).\n- **Coswaldstide** (autumn) — masons' feast and scaffold-blessing; every year someone brawls over F.288; a quarter-feast.\n- **The Concurrence** (the fortieth day after Coswaldstide) — the alignment feast, officially the **Feast of the Sole Light**. The Passing centers in the eye; shadows fuse; the Unwalled sing the forbidden verse; the rite is hostage to weather, for a clouded Concurrence simply does not happen — and this year, after the Shut Door, the doors.\n- **Colm's Night** (unofficial, early spring) — the Unwalled each burn one green-dipped candle at home; a quarter-feast by their private count. Osanne Vell sells the candles and pads the Custody's tally of who buys them.\n- **Wet Alms** (anniversary of the Great Rains) — bread at the nave door; the fourth quarter-feast.\n- **The Hammering anniversary** (late summer; civic observance, not a feast) — a common mourning toll at the Waning. Traditional families answer that one bell is not a name and continue paying for belated name-knells for the Unknelled.\n- **Funerals as clockwork:** each pauper's burial paid by the cell resets the pass-name — the name-knell of Maren Smallvoice is, to nineteen people in Ombreval, the sound of a key turning.\n\n---\n\n## 9. Glossary Seeds\n\n1. **The Emblem** — Church-mandated term for the phenomenon (Edict of F.244).\n2. **The Green Sun** — the forbidden street name for it.\n3. **Grave-shadow** — the cold second shadow cast indoors.\n4. **The dawn-showing / the strong hour / the Passing (the Kiss)** — the disc huge in the rose at sunrise; late afternoon with both suns in the window; their daily crossing.\n5. **The Concurrence** — the annual Passing centered in the eye; shadows fuse.\n6. **The countergait** — the second sun's motion against the true sun.\n7. **The eye** — the rose window's central round light.\n8. **The Spared** — the few who claim to see only one sun; pitied, envied, doubted.\n9. **The Fabric** — the cathedral works; also the dating era (F.).\n10. **The Grey Press** — the Custody's archive, F.204 to yesterday.\n11. **The Attestation** — the secret signed witness required of each new Praelucent.\n12. **The Custody Doctrine** — \"to see is no sin; to affirm is.\"\n13. **Moth** — a paid Custody informant. **Dry money** — laundered informant pay. **Badge-money** — revenue from licensed pilgrim badges.\n14. **The Unwalled / Colmites / the Greensick** — the heresy's own, official, and street names. **Neighbor** — what members call one another.\n15. **Light** — a heretic cell of three. **Lead** — a member's sole contact. **The Tracer** — the hidden head. **The Wicket** — the doorkeeper. **The Namekeeper** — keeper of the bede-roll.\n16. **The charnel door** — Saint Maren's churchyard door; its chalked lintel carries the newest buried name — the living pass.\n17. **The name-knell** — Maren Smallvoice's burial toll, one stroke per year of the life.\n18. **The counter-sign** — the quarterly second pass: saint's possessive plus terse image (\"Belwyn's, unlit\"). **Cracked pane** — the struck-through chalk diamond: pass and sign burned, scatter.\n19. **Sky-drawing / the Green Almanac** — the cell's spoken observation rite, and the cloth chart it fills.\n20. **The Unwalling** — the heresy's hope; also its forbidden verse, *Lucem non murabis*. **Keyhole / Breach** — its factions: protect the rose vs. open the wall.\n21. **A Sparr page** — any (alleged) leaf of the sealed F.204 deposition; the city's costliest contraband.\n22. ***Lux una et indivisa*** — the creed. ***Una lux, gemina species*** — the Emblem doctrine. ***\"By the light that does not lie\"*** — the oath-formula of every contract and verdict.\n23. **The Shut Door** — the F.436 Concurrence scandal; the corpus's live fuse.\n\n---\n\n## 10. Truth-Value Ledger\n\nCanonical statements for the rumor system and NPC prompt injection. **T** = TRUE (simulation-canonical) · **F** = FALSE-BUT-BELIEVED (someone sincerely spreads it) · **A** = AMBIGUOUS-BY-DESIGN (the game never resolves it).\n\n| # | Statement | Value | Notes / who holds it |\n|---|-----------|-------|----------------------|\n| 1 | A second, green-white sun shows in the sky seen through the rose glass from inside the Lanthorn. | T | Anyone with sky in view. |\n| 2 | It keeps its own color through every pane, whatever the pane's color. | T | The first wrongness witnesses name. |\n| 3 | You can look straight at it without hurting your eyes. | T | The permission unsettles most. |\n| 4 | Shadows in the nave fall two ways; overlapping beams do not mix; its light carries no warmth. | T | Wax does not soften in it. |\n| 5 | It moves against the true sun (the countergait); they pass once daily. | T | Ferrant; the Green Almanac. |\n| 6 | It stands in the same pane for every eye at once. | T | The no-parallax; Ferrant, the Custody, few others. |\n| 7 | Once a year the Passing centers in the eye and the doubled shadows fuse (the Concurrence); under cloud it simply does not happen. | T | A failed year is \"unblessed\" (folk gloss). |\n| 8 | In a daytime storm, lightning whitens every pane except where it stands. | T | Storm-watchers' prize. |\n| 9 | A gap or removed pane shows nothing; a rose pane carried elsewhere shows nothing. | T | Tested F.288, F.419–421. |\n| 10 | New plain glass leaded into the rose shows it too. | T | Suppressed; Verger Pike is a living witness. |\n| 11 | The Church has tested it for centuries and knows it is not fraud. | T | Suppressed; the Grey Press. |\n| 12 | Every new Praelucent is secretly made to look, and signs what they saw. | T | The Attestation; Custody-secret, heist-worthy. |\n| 13 | The Green Sun is glazier sorcery. | F | The masons' line since F.288. |\n| 14 | A green sun once stood in the open sky, and the Lanthorn was built to wall it out. | F | The Unwalled's core belief. |\n| 15 | Old glass remembers the sky it cooled under; that is why the rose shows it. | F | Unwalled doctrine; refuted by #10, which they will never see. |\n| 16 | The Emblem is a granted image, and no sun at all. | A | Official doctrine; never blessed nor broken. |\n| 17 | It has been seen at night, in the wrong place, during lightning. | A | No two witnesses agree; never confirm. |\n| 18 | Idonea Sparr wept at her finished rose, said she had made two of something there was one of, and never fired glass again. | T | Chronicle of F.203. |\n| 19 | The last page of the Sparr deposition exists and names what she saw. | A | Missing from the Grey Press itself; forever. |\n| 20 | Colm Attergate coined \"walled out of the sky\" and drowned at the Serle sluice while the Cut still ran. | T | Bellstand record, F.301. |\n| 21 | *Colm's Last Letter*, the cell's relic, is genuine. | F | Corin Copp forged it — seeded from a real page whose nature is A. |\n| 22 | The heretics' Concurrence arithmetic beat the official almanac in F.431. | T | The Almanac Shame; Rasp corrected it anonymously. |\n| 23 | The Custody's secret sky-charts match the heretics' Green Almanac. | T | Rasp has seen the match; no one else living has. |\n| 24 | The Custody pays moths through the pawnshop at the Tally Bridge. | T | Lise Copp brokers both directions. |\n| 25 | Crier Jos Brant is a Custody moth. | T | Unknown to Brant; his tip caused the F.428 deaths. |\n| 26 | The fuller who died after the Whisper Arrests was betrayed from inside the cell. | T | Osanne Vell; known to no one living but her. |\n| 27 | The Unwalled kill those who cross them. | F | Street belief; they feed you a false meeting instead, and perhaps a note reaches the Custody. |\n| 28 | The pass into a heretic meeting is the newest name chalked on Saint Maren's charnel door — if the cell buried them. | T | The rule is the secret; Ede knows the counter-sign, not the rule. |\n| 29 | Speak your dead's name in the green beam and they hear it. | A | Folk practice; never confirm, never mock. |\n| 30 | A beam from the rose once landed in a courtyard three streets away. | A | Street tale; never demonstrated, never confirm. |\n\n---\n\n*Closing note. The Second Sun never performs. It is simply there, every day, identical, in the one building raised to say there is only one light — kept by an institution that dares not repeat it, loved by nineteen people who are wrong about it on purpose, and named, in one scholar's margin, an impossible light. Keep it quiet, and keep it cold.*\n"},"01_cosmology_and_doctrine.md":{"title":"The Four Answers: A Comparative Doctrine of the Second Sun","use":"inject into sidecar NPC context so actors hold, argue, and mangle the four positions on the Second Sun consistently; doubles as the writers' reference for what each faction believes, practises, and forbids.","words":3181,"text":"# The Four Answers: A Comparative Doctrine of the Second Sun\n\n\u003e Use: inject into sidecar NPC context so actors hold, argue, and mangle the four positions on the Second Sun consistently; doubles as the writers' reference for what each faction believes, practises, and forbids.\n\u003e Canon: 00_canon.md\n\nOmbreval has one phenomenon and four answers. Everyone holds one — or two at once, and hopes no one asks. Truth values follow 00_canon.md §10: [T] true, [F] false-but-sincerely-believed, [A] ambiguous-by-design, never resolved. Knowledge marked *secret* is uncommon; an NPC should be shaped by secrets, not volunteer them. The four: the Candor's Emblem, the Unwalled's walled sun, the measurers' doubled ray, the street's Green Sun of the dead. A fifth — the masons' — is officially no answer at all, and appears in the quarrels at the end.\n\n---\n\n## I. The Candor's Answer: the Emblem\n\n### The doctrine\n\nThe Church of the Sole Light teaches that light was the first creature and the only one that never disobeyed. On this rests the legal order of Ombreval: every contract, testimony, and verdict is sworn *by the light that does not lie*. The stake fits in one sentence: if light can be double, testimony can be double, and every oath in the city is unsworn.\n\nTherefore the Candor teaches: there are not two suns. There is one Light, and by grace one **Emblem** of it — a granted image, \"a painting of the Light upon the eye of the Church.\" The formula is ***Una lux, gemina species***: one light, twofold appearance. Whether this is true, the game never says [A, #16]. The doctrine is elegant precisely because it explains nothing and forbids the question.\n\nThe parish teaching is the **Wick Catechism**, drilled into children:\n\n\u003e *Q. What stands in the Rose?*\n\u003e *A. The Emblem, which is a granted image of the Light upon the eye of the Church.*\n\u003e *Q. Is the Emblem a sun?*\n\u003e *A. There is one sun, as there is one light. The Emblem is neither kindled nor quenched; it burns nothing and warms nothing; it is not to be counted.*\n\nThe founding text is the **Gradine Homily of F.244**, preached by **Praelucent Odo Fenn**, lamp-named Vigil, the day the Edict was cried at the Bellstand — quoted to this day, usually at people:\n\n\u003e \"You have not seen a second sun, for there is none to see. You have seen how much image one Light can afford. Do not count manners among things. ***Species transit, lux manet*** — the appearance passes; the light remains.\"\n\nThe collect of the Feast of the Sole Light:\n\n\u003e \"O Light one and undivided, who hast set thine Emblem in the eye of thy church as a seal is set in wax: grant that we may read the seal and not worship it, and keep our oaths by the light that does not lie.\"\n\nAt a clear Concurrence, as the doubled shadows fuse, the Praelucent gives the versicle from the crossing: *V. One light. R. And undivided.*\n\n### How it answers the three questions\n\n**(a) Why only through the Rose?** Because the Great Rose is the consecrated eye of the Church, and a granted image is granted to the Church gathered — not to the open sky, not to a hole, not to the street. Ask a canon why grace chose that window and he will answer that grace is not interrogated about its address.\n\n**(b) Why the wrong color?** Because the Emblem is of no hour. The Homily: \"It wears no hour of any sky, that you may not mistake it for weather.\" That it keeps its color through every pane [T, #2] is preached as proof: created light obeys the glass; the granted image obeys only its Original. That it may be looked at without pain [T, #3] is glossed the same way — the true sun chastens the eye; the Emblem is *permitted* to it.\n\n**(c) Why the doubled shadows?** The grave-shadow is *the shadow of the appearance*: one light, twofold appearance, therefore twofold shadow — nothing doubled in the world, only in the seeming. The fusion at a clear Concurrence is the doctrine's liturgical vindication: watch, and the appearances return into one. A clouded Concurrence, when nothing fuses [T, #7], is not discussed from the pulpit. It is discussed everywhere else.\n\n### The two layers\n\nPublicly: the **Edict of F.244** — calling the Emblem a \"sun,\" \"second sun,\" or \"green sun\" is citable; fines, and for the stubborn, recantation on the Gradine, theatre deliberately survivable. Beneath it, the gentler **Custody Doctrine**: *to see is no sin; to affirm is* — free absolution for the sight, \"So do we all, child; affirm nothing.\" Privately — *secret* — the Church at its top is not hiding a truth it knows: it has tested the thing for a century and a half [T, #11], knows it is no fraud and no art of man, and is holding a fact it cannot metabolize. Doctrine is the vessel it is held in.\n\n### What it demands\n\n**Practice:** swear by the light that does not lie; keep the Feast of the Sole Light; buy, if you like, the licensed pilgrim badge of the Emblem — never saying aloud what the badge shows. **Taboo:** the three forbidden names; unlicensed images of the disc; counting suns, even in jest, even before children. **Duty:** quiet correction — mend your neighbour's vocabulary before a grey coat hears it. For clergy, one duty more, secret and absolute: whoever is raised Praelucent is taken alone to the crossing at the strong hour, made to look, and made to sign the Attestation [T, #12].\n\n---\n\n## II. The Unwalled's Answer: the Walled Sun\n\n### The doctrine, in full\n\nThe Unwalled hold that the green sun is **real, and the elder of the two** — it once stood in the open sky above everyone's grandmothers, and the Church's four centuries of building were masonry against heaven [F, #14]. The Lanthorn is a wall raised course by course to shut it out; the towers are, in Colm Attergate's words from the Bellstand in F.301, coffin lids. The Great Rose is the wall's one flaw: old glass \"remembers the sky it was cooled under,\" so the walled sun shows through the rose as through a keyhole [F, #15]. Their proof-text is Idonea Sparr, who wept at her finished window, never fired glass again [T, #18], and was deposed and sealed by the Chapter within the year — before any public sighting. There they are simply right: the cover-up is older than the first record of the thing covered.\n\n### What they get right\n\nThat the Church is lying about *something* [T]. That the phenomenon is objective, repeatable, identically described for two hundred years [T]. That the Custody sits on suppressed test records [T, #11]. That their arithmetic is sound: in F.431 their Concurrence date beat the official almanac by a day [T, #22]. And one thing they will never know: the Custody's secret sky-charts match their Green Almanac observation for observation [T, #23] — two enemy institutions keeping one identical record.\n\n### What they get wrong — on purpose, per canon\n\nEverything about mechanism and history. No chronicle, ruin, or elder testimony attests a green sun in the open sky, ever; their treasured \"recovered testimonies\" are forgeries, some bought, one unknowingly commissioned [F, #21 — *Colm's Last Letter* is Corin Copp's work, and no member knows it]. The glass-memory doctrine is falsified by a fact almost no one living has seen: new plain glass leaded into the rose shows the disc perfectly [T, #10, *secret* — proven at the Glaziers' Trial of F.288, again on the F.419–421 scaffold]. And the wall-theory cannot survive its own keyhole: a thing walled out should show through a *hole*, and a missing pane shows one ordinary sky [T, #9]. Confront a neighbour with the broken-pane fact and the answer comes back smooth as river stone: \"the wall heals its own holes.\" The doctrine absorbs every disproof. They half-know it, and keep it anyway, because the alternative is that the whispering goes nowhere.\n\n### How it answers the three questions\n\n**(a) Why only through the Rose?** The keyhole. Old glass remembers the sky it cooled under; the rose's glass, fired on Cinder Row, remembers hardest of all. Every other window is younger, or lesser, or lies.\n\n**(b) Why the wrong color?** It is not wrong; it is *elder*. The green-white is the walled sun's own light, unstained by the panes because it does not pass through them as ordinary light does — the glass is not a window to it but a memory of it. And that you can bear to look at it means it was made to be looked at.\n\n**(c) Why the doubled shadows?** The grave-shadow is your *true* shadow — the one everything would cast if the sky were unwalled, restored only where the keyhole light falls. This is why the bede-roll is whispered facing the rose: the dead stand in the elder light entire, and the living borrow a corner of it.\n\n### What it demands\n\n**Practice:** attend your light of three; know your lead and no one else; pay your dues — paupers' funerals at Saint Maren's, page-buying at the Tally Bridge. Learn the fresh pass-name from the charnel door and the name-knell; answer the Wicket at the grate in a whisper, for every voice in this city carries twenty meters. Whisper one name of your own dead through the keyhole; give your week's sightings to the sky-drawing; rehearse, low, *Lucem non murabis*. **Taboo:** nothing written, ever; never speak the rule of the pass, only the name; never guess at the Tracer aloud. **Duty:** by faction. The **Keyhole** faction owes the rose protection at any cost — watch every scaffold, every \"repair.\" The **Breach** faction says the *building* is the wall and talks of opening it: all talk, no capability, and talk that could hang all nineteen. The bleak joke neither side of the window can see: the Keyhole faction and the Custody of the Eye are guarding the same glass.\n\n---\n\n## III. The Measurers' Answer: the Doubled Ray\n\n### The theory and the instruments\n\n**Doctor Aubin Ferrant**, physician-astronomer off the Tallage, teaches — taught — the *doubled ray*: glass fluxed with the ash of the F.171 fire splits the sun's image \"as a stick bends in water.\" It is the only answer in Ombreval that proposes a mechanism, which is why it is the only answer that can be killed.\n\nHis tools are patient and cheap: sighting-rods and plumb-lines; a string-grid across the nave floor, mimicking the rose's leading, to chart beam-fall against the bell-hours; wax tablets of pane-positions; smoked glass, never needed [T, #3] — a fact he has underlined three times; and the dark box, a pinhole chamber that draws the nave on a white leaf. It renders the disc faithfully, which comforts him more than it should: whatever it is, it consents to be drawn.\n\n### Where the reasoning breaks\n\nHe has killed his own theory five ways and recorded each blow.\n\n1. Replica panes, fired to the old recipes with true Cinder Row ash, show nothing — anywhere.\n2. A cracked cull of genuine rose-glass, bought quietly on Cinder Row, shows nothing held to open sky. The glass is not the thing. (He does *not* know the converse — new glass in the rose shows it perfectly — the one fact that would redirect his enquiry, and the one the Grey Press holds tightest.)\n3. The killing stroke, his own last measurement: two observers, west doors and crossing, calling pane-positions at the same bell-stroke. The true sun stood two panes apart for them; the disc stood in the same pane for both eyes at once [T, #6]. No bent ray puts one image in one place for every observer — not an image's behaviour but a *thing in the glass* — yet its rays sweep the floor with the hour like any sun's.\n4. The countergait [T, #5]: a duplicate must travel with its original; this one moves against it and crosses it once a day.\n5. Color and storm: no refraction keeps its own color through a red pane [T, #2]; and when lightning whitens every pane, an image in transmitted light must brighten. The disc alone does not [T, #8] — a steady cold coin in a sheet of white.\n\nThe theory is dead. Ferrant keeps the corpse on his desk and keeps measuring, and in his notebook's margin stands the sentence the whole matter deserves: *\"It moves against the sun; it stands in one pane for every eye; I have no theory. An impossible light, and the city at peace with it.\"* The phrase is already loose in the streets, garbled.\n\n### How it answers the three questions\n\n**(a)** Rose-only visibility: *unexplained* — the ash-flux account is falsified by his own replicas. **(b)** The color: *unexplained* — he once argued dispersion, but a prism spreads a fringe and obeys the pane, and this does neither. **(c)** The doubled shadows are the one thing his ruin still handles: two sources of light cast two shadows, whatever the second source is. His problem was never the shadows; it is the second source.\n\n### What it demands\n\n**Practice:** measure; measure again with a different instrument; write the failure in the same ink as the success. **Taboo:** affirm nothing unmeasured; admit no explanation from grace, ghosts, or glaziers' malice, for an explanation that cannot fail is not an explanation. **Duty:** the record, published or not — and it may not be, quite: his instruments are funded, at one remove, by Custody money [*secret*]; Ferrant suspects, does not ask, and knows what his not-asking is worth.\n\n---\n\n## IV. The Street's Answer: the Green Sun of the Dead\n\n### The belief\n\nIn the streets the disc is the **Green Sun**, Edict or no Edict, and it shines for the dead. Speak your dead's name in its beam and they hear you [A, #29 — never confirm, never mock]. The street does not argue mechanism, which is why it cannot be refuted; it answers a different question: *what is it for?*\n\n**(a) Why only in the church?** Because the church is the house of the dead's names — where they are prayed for, knelled, and chalked on the charnel door; the dead's sun keeps to the one roof where the living still say their names. You would not look for the ferryman anywhere but the ford.\n\n**(b) Why that color?** Because it is drowned light — dawn through river ice, which is what daylight looks like to the drowned looking up. Saint Maren floated upstream against the Serle; Colm Attergate went under at the sluice; the Green Sun wears their water. It does not hurt the eyes because the dead would not hurt you for looking.\n\n**(c) Why two shadows?** The rhyme is the doctrine, and every child has it:\n\n\u003e *One sun for the living, one sun for the flown,*\n\u003e *one for the tallow and one for the stone;*\n\u003e *Colm went a-walling and Colm went below —*\n\u003e *count both your shadows wherever you go.*\n\nThe grave-shadow is the one you will cast when you are flown — or your dead walking beside you while the green light lasts; both readings are held at once, usually by the same grandmother.\n\n### What it demands\n\n**Practice:** speak your dead's name in the green beam, on Bellday if you can; hold a newborn in the doubled light so the child has a spare shadow to spend; carry a fever into the beam to cool; let a bier rest where the green light falls, so the dead take their second shadow with them; children play twinning until a verger's patience ends; Saint Maren's widows wear a green thread in the hem for a mourning-year. **Taboo:** a grave-shadow on a bride is ill luck — weddings are timed around it, whatever the wick-priest says; and no bargain is struck in the doubled light, for a bargain under two shadows binds twice — which is why pilgrims haggle for badges in the porch and pay in silence within. **Duty:** small coins to the vergers, and small kindness to the Spared — pitied as folk whose dead do not look back, envied for the same reason, and quietly not asked to hold the lantern at funerals [A — whether the Spared see nothing or say nothing is never resolved].\n\n---\n\n## V. Where the Answers Collide\n\nOrdinary days rub the four answers against each other; seed arguments for actors, each speaker consistent with their own answer.\n\n**The oath.** Every verdict at the Tallage is sworn \"by the light that does not lie.\" A smirk surfaces in every generation: *\"Which one?\"* Two words, a citable offence, and the whole stake of doctrine in one breath. The clerk's standing reply, worn smooth: \"The one you'll be fined by.\"\n\n**Coswaldstide.** Every autumn, someone brawls over F.288. The masons' answer — \"it is in the glass; glass is a lie you can see through\" [F, #13] — is not one of the four, and Warden Stott's lodge will die holding it, because the verdict that disproved it was never shown to them. The glaziers' guild-issue rebuttal: \"Our glass shows true; take it up with the sky.\"\n\n**The wedding hour.** A bride's mother wants the nave floor clear of the grave-shadow at the vows. The wick-priest refuses to consult the hours of \"a thing that is not.\" Verger Pike, for a small coin, knows the hour anyway. All three go home satisfied, which is Ombreval in miniature.\n\n**The fever child.** A mother carries her burning child into the green beam. A grey clerk notes her name; her confessor absolves the sight before she has finished kneeling. She has affirmed nothing, only *used* it — and there is no edict against use, a gap the whole street walks through daily.\n\n**The doors, and the sky.** Since the Shut Door of F.436, the taverns hold one argument on repeat: will the Chapter bar the nave again at this year's Concurrence? Folk say the doors belong open on the dead's own day; the Candor says order is also a form of reverence; the post-Shut-Door heretic intake say quietly that a church that locks its doors at the Passing has told you what the building is *for* — and that sentence, above a whisper, is how the Custody finds new files. Over it all hangs the weather: a clouded Concurrence fails everyone. Folk call the year unblessed, the Candor preaches that the Light owes no weather, the Unwalled remember the Great Rains — when \"the clouds did not know it\" and the only sunlight in the city stood in the nave [T] — and Ferrant sets up his string-grid regardless, because a failure, properly recorded, is also a measurement.\n\nFour answers, one disc, no verdict. Keep it that way: nothing tips the balance — the Second Sun never performs, never chooses, never answers.\n"},"02_the_heretic_cell.md":{"title":"The Unwalled — Faction Brief","use":"Structural/meta brief on the heretic cell for designers and sidecar prompt-building; the final block may be injected into any sworn member's NPC context once its two world-state placeholders are filled.","words":3428,"text":"# The Unwalled — Faction Brief\n\n\u003e Use: Structural/meta brief on the heretic cell for designers and sidecar prompt-building; the final block may be injected into any sworn member's NPC context once its two world-state placeholders are filled.\n\u003e Canon: 00_canon.md\n\n## 1. Names and standing\n\nThey call themselves **the Unwalled**. The Custody's files say **the Attergate error**, or **Colmites**. The street says **the Greensick**. Members call one another **neighbor**, and no other title aloud; rank is inferred, never heard.\n\nThey are not a mob, a guild, or a rival church: about nineteen people who pay for paupers' funerals, keep a cloth map of the sky, and are wrong on purpose about the one thing they organized to be right about. Their core doctrine — the green sun is real, elder than the other, walled out of the sky by four centuries of Church masonry, and shows through the Great Rose because old glass remembers the sky it cooled under — is FALSE-BUT-BELIEVED (00_canon.md §10, #14–15); nothing may vindicate it. What they get right: the Church is lying about something; the phenomenon is objective; the Grey Press holds suppressed tests. It is enough.\n\n## 2. History in five wounds\n\nThe cell recites its own history like a rosary of injuries.\n\n**F.301 — the Founding Drowning.** Colm Attergate, a mason's laborer, preached in the Bellstand that the west towers were coffin lids and the Church was \"walling
