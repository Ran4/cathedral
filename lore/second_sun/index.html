ceptance criterion is a measurement, not a guess: one knob-default in-game day under each real backend, costed, before any dollar figure is written down anywhere — including here.\n\nThe summary an engineer can carry to a meeting: the Second Sun is one renderer feature, one small matcher, and §0's counted list of sidecar additions — none of them a new player verb, a new UI, or a new call type. The city already knows how to hear, remember, hand things over, and talk. We are giving it something worth not talking about.\n"},"design/05_playtest_and_tuning.md":{"title":"Playtest and Tuning: Proving the Second Sun Is Fun","use":"design spec for developers — fun analysis, playtest scenario scripts, metrics, failure modes, and tuning knobs for the Second Sun feature; not for NPC context injection.","words":4130,"text":"# Playtest and Tuning: Proving the Second Sun Is Fun\n\n\u003e Use: design spec for developers — fun analysis, playtest scenario scripts, metrics, failure modes, and tuning knobs for the Second Sun feature; not for NPC context injection.\n\u003e Canon: 00_canon.md\n\n**Status: proposal. Nothing below is implemented.** This document assumes the render rules of `01_the_light_rules.md` (cited as L-rules) and the emotional loop of `00_vision.md`; all fiction defers to `00_canon.md` (cited as §). It answers what those documents leave open: how we know each beat lands, and which numbers to turn when one fails.\n\nOne principle governs everything: **the feature's difficulty must live in attention, never in interface.** Every failed playtest is diagnosed as \"the world did not teach it\" (fix choreography, turn a knob), \"the player declined it\" (measure and move on), or \"the system fought the player\" — the last is always a defect.\n\n## 1. The emotional beat map\n\nBeats follow `00_vision.md`. For each: the intended feeling and the observable signal when it lands. Signals are behavioural — players misreport wonder and never misreport posture.\n\n| Beat | Intended feeling | Signal that it landed |\n|---|---|---|\n| **Notice** | Private confusion; \"is that a bug?\" | Movement stops; camera pitches up and holds; the tester leans toward the screen; an unprompted F5. Asking \"is that meant to be there?\" is half-landed; silently starting to test is fully landed. |\n| **Doubt** | Destabilised curiosity | The doorway test within two minutes of first sighting; checking side windows; unprompted hypothesis talk (\"it's only that window\"). |\n| **Verify** | Earned certainty, then loneliness | A screenshot spree; counting their own shadows aloud; then, after the first NPC deflection, an audible register change (\"they *know*\"). The tester starts paper notes — here, a success metric. |\n| **Be noticed** | Exposure; the watcher watched | A flinch or sit-back when their own phrasing returns warped from a stranger; in later sessions, measurably quieter speech near NPCs (mic level logged for analytics only, never gameplay). |\n| **Be recruited** | Clandestine complicity | The tester leans to the microphone and genuinely whispers; a disbelieving laugh when the bar scrapes back. Full-volume pass speech means the fiction has not taught proximity-as-danger — a choreography failure. |\n| **Choose** | Weight without a menu | Hesitation before speaking; asking \"does it matter what I say?\" (correct answer: silence); rehearsing lines before approaching NPCs. |\n| **The Concurrence** | Communion and dread at once | No input during the fusion plateau (L6, T−2 to T+2); the room going quiet together. Alt-tabbing during the plateau means the staging failed. |\n\n## 2. Playtest scenario scripts\n\nEach script: **Setup / Ask / Should / Red flags.** Run cold; the facilitator never says \"sun\", \"window\", \"shadow\", or \"heresy\" before the tester does.\n\n**S1 — First noticing.**\n*Setup:* fresh save, forenoon, clear sky, spawn near the Gradine; third-bay beam footprint active per L-rules §9.\n*Ask:* \"Explore the city for twenty minutes.\" Nothing else.\n*Should:* the tester enters the Lanthorn, crosses the doubled-shadow footprint, looks up, finds the disc — unprompted. Target median: disc within 12 minutes for testers who enter.\n*Red flags:* the double shadow attributed to \"two windows\" without looking up (grave-light too subtle); a bug report and disengagement (F2); never entering the cathedral (F1 — data, not failure).\n\n**S2 — The double-shadow verification.**\n*Setup:* tester has seen the disc once; triforium reachable, one rose pane removed \"for repair\" per L1.3–L1.4.\n*Ask:* \"Convince yourself of what you saw.\"\n*Should:* threshold crossings (the sill pop, L7.1, frame-clean); side-window checks; self-shadow counting; at least one screenshot — the tester independently reinvents the F.288 logic without knowing it has a date. If they climb to the gap: one ordinary sky through the hole, the disc clipped dead to the leading — and the tester goes quiet, as canon promises witnesses do (§2.1).\n*Red flags:* the sill pop reads as a loading hitch; the second shadow invisible on the tester's monitor (K1); disc feathering across the gap (release blocker, L-rules §10); the tester asks for a quest log (the game must not answer — but three in a row asking means the world is not legible enough).\n\n**S3 — The deflection wall.**\n*Setup:* tester has verified; seed a wick-priest, Verger Pike, and market NPCs with their §10 rows and the Custody Doctrine.\n*Ask:* \"Ask people about what you saw.\"\n*Should:* absolution without penance (\"So do we all, child; affirm nothing\"), the verger's subject change for a coin, market wariness. The tester comes away certain everyone knows and no one will say — loneliness, not confusion.\n*Red flags:* an actor explains, speculates on mechanism, or denies the disc (prompt leak — pillar 2 violation); deflections read as broken dialogue rather than policy.\n\n**S4 — Cracking the pass.**\n*Setup:* a pauper's funeral at Saint Maren's within the session; Maren Smallvoice rings the name-knell; the sexton chalks the lintel; a diamond chalked high at the Needle; Grigor Ashe at the Gaunt Passage grate.\n*Ask:* \"There are people who talk about this openly. Find your way in.\" (Here the facilitator may confirm the cell exists — this tests the trail, not the rumour.)\n*Should:* funeral → knell counted → lintel read → rule guessed (§5: the name is public; the rule is the secret) → diamond → grate → whisper. Expect two to four sessions unassisted; one with the hint.\n*Red flags:* the rule must be *told* by an NPC (physical evidence not legible); the rule cracked but the grate unfound; the tester tries to type the passphrase while STT is available (with a working microphone there must be nowhere to type it — the design/02 §9 speech line exists only when STT is unavailable or disabled, and `speech_line_fallback` ships on for exactly that case).\n\n**S5 — Overhearing the cell.**\n*Setup:* a meeting in progress behind the grate; the tester routed past on a plausible errand. Hearing is binary full-text within 20 m, full 3D, no occlusion (design/02 §1) — there are no fragments and no garbling; what leaks is governed by *geometry alone*. This scenario therefore imposes a level-design requirement this document owns: **every position where the closing recitation is spoken must sit more than 20 m, in full 3D, from any position the public can occupy** — a cellar floor is closer to the lane above than it looks — **with the grate mouth as the sole deliberate leak point.** S5 is the standing verification of that requirement.\n*Ask:* the errand only.\n*Should:* from the passage the tester hears whole lines, but only from the bodies nearest the grate — a bede-roll name, \"neighbor\", a sky-drawing phrase — enough to know something is happening and where, while the recitation deeper in stays silent by distance, not by code. Partiality comes from who is in range, never from mangling the audio. If the tester loiters through a genuine admission, they harvest the grate exchange whole — that is legitimate design, the eavesdropped route in (design/02 §5), not a bug. Overhearing uses the ordinary speech pipeline, zero bespoke code.\n*Red flags:* the closing recitation — the line carrying next quarter's sign — audible from any public position (geometry defect: the recitation spot is inside 20 m 3D of the lane, and design/02 §6's \"only those present receive it\" is broken by the level, since the hearing model will not break it for you); nothing audible at all from the passage mouth (site too deep — no lure, and the third-ear risk canon promises the cell is gone); the tester cannot relocate the passage later (wayfinding issue — log it, not this feature's fix).\n\n**S6 — The wrong whisper, with a bystander.**\n*Setup:* tester knows the grate but holds a stale or guessed name; one unaffiliated NPC within 20 m.\n*Ask:* \"Try to get in.\"\n*Should:* the grate silent a breath too long; Ashe's deflection — \"We're closed, friend — the salt's weighed at Lowmarket\"; the meeting drains out the far end. The bystander hears everything; days later, consequence: talk of \"the one who whispers at cellars\", a grey clerk drifting nearer at market. The tester must feel *marked*, not *punished* — mundane, unsettling, recoverable once (§5).\n*Red flags:* a game-over-shaped response (guards, combat, lockout); no consequence within two sessions (bystander memory not propagating); an immediate same-night retry that neither marks further nor varies Ashe's performance (the ladder must visibly remember the face); the fed-false-meeting path firing that same night (design/02 §7 rung 4 is \"second FAIL by a marked face, **any later night**\" — the feed takes a night to set, and a tester who sees it instantly is seeing a spec break, not the §5 escalation).\n\n**S7 — The right whisper under STT stress.**\n*Setup:* fresh name and current counter-sign in hand; run on a good microphone and on a laptop mic at a true whisper; names of varied phonetic shape (Sef, Ib, Aldith-class).\n*Ask:* \"Get in. Whisper it like you mean it.\"\n*Should:* the full exchange — \"Who walks at the other noon?\" / \"Old Sef walks.\" / \"By whose lantern?\" / \"Belwyn's, unlit.\" (the seeded current sign, design/02 §10; \"Maren's, upstream\" is `next_counter_sign` and must *refuse* here). The sidecar matches leniently (F4 below); a transcription miss produces a repeat prompt, never a mark.\n*Red flags:* any correct-content attempt burned as a wrong whisper (forbidden — pillar 4); more than one repeat prompt per exchange on a decent mic (re-mint toward plainer phonemes); the tester raising their voice to help the STT and **paying nothing for it in the fiction**. Note precisely what this last one tests, because the baseline design has no amplitude input at all (design/02 §4: loudness is an optional flavour tier that never gates and never alters a verdict). The consequence must therefore ride the mechanism that does exist — *proximity*: seed a bystander at 15–20 m and verify that a pass spoken loudly enough to be a pass is a pass they hold in memory, with the §5 informant consequence following days later. The lesson is delivered by the 20 m radius, not by a volume meter. Only where the optional honest tier ships may Ashe *also* wince at a shouted pass; if that tier is absent, an unremarked shout is correct behaviour and not a defect.\n\n**S8 — Betraying the cell.**\n*Setup:* tester sworn in, knows faces and the site; Segwin Rasp reachable; Jos Brant seeded as unknowing moth.\n*Ask:* \"You know something two institutions would pay for. Do what you like with it.\"\n*Should:* informing — directly, or carelessly within 20 m of Brant — draws a Rasp-shaped response: dry, procedural, unhurried (arrests create witnesses, §5). A clerk attends the next funeral; the diamond appears struck through; the cell scatters and re-forms with a new pass; the tester's standing dies quietly (a false meeting, an empty cellar). Betrayal opens content — moth work, the page trade, Rasp's questions.\n*Red flags:* a raid montage or mass arrests (canon break: the Whisper Arrests taught both sides the cost); informing produces nothing detectable (betrayal as a dead verb); no long, expensive way back in for the repentant.\n\n**S8b — Selling the rule.**\n*Setup:* tester sworn in *and* has cracked the rule (S4 complete); Rasp reachable. Rasp seeded with a guard and goal encoding his canonical restraint: a single informant's sentence is one leaf — record it, confirm it independently before the Grey Press treats it as fact; never spend knowledge at the meeting itself; arrests create witnesses (§5, §6 — torture is bad record-keeping, and so is a raid).\n*Ask:* as S8 — but this tester holds two different goods, and the script exists to see whether the sim prices them differently. Names, faces, and sites rotation heals; the *rule* — \"the pass is the newest name chalked on the charnel door when the cell paid the burial\" — rotation cannot heal, because canon fixes it permanently (§5, §10.28: the name is public; the rule is the secret). One sentence in Rasp's office and every future funeral hands the Custody the current pass; the actuarial defence of design/02 §5 (\"the name goes stale at the next funeral\") is void forever.\n*Should:* dictating the rule draws a response categorically unlike S8's — no scatter, no new pass, because none would help. Rasp banks it: the leaf is recorded, quietly confirmed against a funeral or two, and the response is *standing surveillance*, not a strike — a grey clerk at every pauper's burial reading the lintel with new eyes, the grate watched on meeting nights, the Custody silently holding each fresh pass and spending none of them. The cell is slowly strangled rather than deleted: meetings thin, the cracked pane recurs, the Tracer hunts a leak she cannot find because the leak is not a name. Content transforms — the tester is paid best rates, moth work and Rasp's questions open at the top — while the recruitment content they used to enter degrades permanently, and the game must let them feel that one sentence did it.\n*Red flags:* the rule-leak triggering a raid (same canon break as S8); the rule-leak producing the same beat as a name-leak (the sim not distinguishing the one unhealable betrayal from the many healable ones); the cell \"changing the rule\" to recover (forbidden — §5 and §10.28 fix it; the cell can crack a pane, not amend its own sacrament); no observable difference at funerals or the grate within a few sessions (the bought rule visibly unspent *and* invisibly unheld is a dead purchase).\n\n**S9 — The Concurrence, clear and clouded.**\n*Setup:* clock advanced to the fortieth day after Coswaldstide; crowd staging in the nave and on the Gradine. Run twice: weather forced clear, then overcast.\n*Ask:* \"It's the feast day. Attend.\"\n*Should (clear):* the L6 minute-script exactly — the scissors-X, shadows rotating, the fusion plateau, the nave-wide split at T+3; testers on the mid-stone discover the viewpoint-exactness themselves (\"come stand *here*\"); the room goes quiet at T−2. *Should (clouded):* the pale coin alone in the eye; nothing fuses; the feast fails and the city takes it hard — NPC dismay, no system messaging. Testers should feel cheated *by the sky*, and half should ask when the next one is; that question is the success condition.\n*Red flags:* wandering off before T0 (bells and crowd failed to signal imminence); frame drops during the plateau; any celebratory flourish from the disc (pillar 1: the sun never performs); the clouded failure read as a bug rather than weather (NPCs must watch the sky for days beforehand, §4 F.436).\n\n**S10 — The flight sweep.**\n*Setup:* flight enabled; tester already knows the disc.\n*Ask:* \"Break it. Find the trick from outside.\"\n*Should:* boredom, by design (L7.3): one sun at every altitude, ordinary glass from every angle, fail-dark at every straddle. The tester lands back inside and finds it stubbornly there; the correct exit quote is \"there's nothing out here — it's only *in* there\", which is the fiction verbatim (§3f).\n*Red flags:* a single exterior frame showing the disc (release blocker); hysteresis flicker at sills or clerestory glass; the absence reading glitchy rather than eerie (pop timing, L7.1).\n\n## 3. Metrics worth logging\n\nPlaytest builds only; telemetry names must not leak mechanism (pillar 2 covers analytics keys too).\n\n- **time_to_first_nave_entry**; **time_to_first_look_up** (camera pitch \u003e 35 degrees inside the Lanthorn, held 2 s); **time_to_first_rose_sky** — first frame the disc renders for the player camera; the headline number, target median under 15 minutes.\n- **time_to_doorway_test** — first threshold recross within 60 s of a disc frame (Doubt proxy); **screenshots_in_nave** vs. baseline (curiosity proxy).\n- **first_spoken_mention** — first transcript containing phenomenon vocabulary, with location and NPCs in radius.\n- **recruitment funnel** — conversion per stage: disc seen → spoke of it → attended a pauper's funeral → lingered at the charnel door → stood at the Needle chalk → approached the grate → attempted the whisper → passed. Healthy shape: a wide mouth and a steep *chosen* narrowing; a cliff at one stage marks the illegible link.\n- **passphrase_failure_rate**, split by cause: wrong name (rule not cracked), stale name (rotation missed), malformed counter-sign, STT mistranscription of correct content. The last must trend to zero; the rest are gameplay and need only be survivable.\n- **repeat_prompt_rate** at the grate, per microphone class — STT health.\n- **informer_rate** — fraction of sworn testers who betray, and time-to-betrayal; **accidental_leak_rate** — pass spoken within 20 m of an unaffiliated NPC.\n- **apathy_rate** — five or more disc sightings with no doorway test, no spoken mention, no funnel entry (F6).\n- **bystander_incidents** at the grate; **concurrence_attendance** and input-silence during the plateau; **flight_minutes_near_west_front**; **mic_level_by_location** (analytics only).\n\n## 4. Failure modes and mitigations\n\n**F1 — The player never looks up.** The choreography is floor-first (L-rules §9): the doubled shadow happens underfoot on the natural walking line; gazing NPCs and the twinning child pull the eye upward; the paying bench frames the disc for the seated. K4 raises nave cues, K3 street rumour. Some players will meet the feature as rumour first; the funnel has several mouths.\n\n**F2 — The player thinks it is a bug.** Partly intended (Notice *is* doubting your graphics card) but must resolve in minutes, not sessions. Determinism is the tell — bugs flicker, the disc keeps hours; an NPC visibly attending to the disc during the first nave visit reframes it as world. Hard rule: no unrelated lighting bugs ship inside the Lanthorn — every real artefact in that room is charged to this feature's account.\n\n**F3 — The player snitches immediately and kills the content.** For names, faces, and sites it cannot, because the cell is built to survive betrayal (S8): cracked pane, scatter, new pass, re-formation — the resilience canon gives them against the Custody serves the designer against the player. Early betrayal of that kind forecloses only trust, which is correct and must be felt. The one betrayal rotation cannot heal is the *rule* (canon §5, §10.28) — the most valuable sentence a player owns and the most obvious to sell, so it must be authored, not hoped against: S8b covers it. The design answer is Rasp's canonical restraint — a leaked rule becomes standing surveillance, the cell strangled slowly under a Custody that holds every pass and spends none — so even the worst betrayal transforms the content (moth work, Rasp's questions, a conspiracy dying by watchfulness) rather than deleting it. What the player gains is the Custody's best coin and standing; what they irrevocably destroy is the pass as a live secret, and with it the whisper-at-the-grate loop for that playthrough. Correct, and it must be felt as *theirs*.\n\n**F4 — STT mangles the passphrase.** The pass corpus is pre-filtered for transcription hardness (canon's forms are short and plain, §5). **The matcher is owned by design/02 §8 and is not restated here** — thresholds live in one document or they drift; this doc owns only the knobs and the acceptance bar. What matters for playtest: **unintelligible input is never a wrong whisper** — Ashe re-asks in character (up to twice per layer per visit, design/02 §3.5) and then defers without a mark; only intelligible, well-formed, wrong content marks a face. The bar (design/02 §8): across 100 noisy transcripts of a *correct* exchange, zero may FAIL. Names that fail pre-testing never enter the pool at all (design/02 §6 makes this a generation-time constraint, since a name chalked and tolled can never be re-minted after the fact); retiring a pool entry before its next use is this document's only remaining lever.\n\n**F5 — The player flies and breaks the illusion.** L7 legislates this: nothing outside at any altitude, fail dark on every straddle, absence made boring rather than glitchy. S10 is a standing regression scenario on every render change. The deeper mitigation is fictional: canon anticipates the flyer (§2.5, §3f) — the answer to \"I flew and found nothing\" is \"yes; that is what everyone finds\".\n\n**F6 — The player finds it and does not care.** Allowed. T0 is priced as ambience (`00_vision.md`); an uninvestigated wonder still colours the city, feeds NPC talk, sits in screenshots. The funeral charity, the Shut Door grievance, the page trade, and market gossip all lead back in later. Measure apathy_rate; act only above roughly half of sighted testers, and by sharpening hooks, never by adding a marker.\n\n## 5. Tuning knobs\n\nDefaults are proposals. \"Breaks\" states what dies at each range edge.\n\n| # | Knob | Controls | Default | Safe range | Breaks below / above |\n|---|---|---|---|---|---|\n| K1 | Grave-light intensity (vs. true sun) | Phenomenon subtlety | 0.35 | 0.20–0.50 | Shadow invisible on dim monitors / reads as a second key light, i.e. a bug |\n| K2 | Dawn-showing disc scale (× true sun) | First-sighting salience | 2.0 | 1.6–2.4 | Disc mistaken for a bright pane / reads as skybox art error. (Taper to Passing parity is fixed by L2.4.) |\n| K3 | Ambient rumour rate (§10 rows per NPC-day) | How much the city talks unprompted | 0.5 | 0.2–1.5 | City seems not to have noticed; bug-theory hardens / the mystery becomes small talk; loneliness dies |\n| K4 | Nave cue density (gazers, twinning child, bench, per daylight hour) | Discovery pressure | 2 | 1–4 | F1 dominates / the nave becomes a tutorial diorama |\n| K5 | Pass rotation cadence (days between cell-paid funerals; config `funeral_cadence_days`, design/04 §6) | Freshness pressure on the name | 10 | 7–14 | The name stales; the knell stops being a key / testers always one funeral behind. (One number, three documents: 10 days is design/04's `funeral_cadence_days` and sits inside design/02 §6's \"one burial per one to two in-game weeks\". Counter-sign cadence is canon-fixed at quarter-feasts.) |\n| K6 | Wicket tolerance (repeat prompts per layer per visit; the *match rule itself* is design/02 §8's and is not a knob) | STT forgiveness | 2 | 0–2 | F4 / a mumble opens the grate; the whisper stops mattering |\n| K7 | Custody aggressiveness (moth threshold; clerk-at-funeral odds; days from first affirm to visible watching) | Office pressure | med; 0.5; 3 | low–high; 0.2–0.8; 1–7 | Affirming costs nothing / players stop speaking; the core verb is punished out of the game |\n| K8 | Mark decay (rungs a marked face sheds per quarter-feast — sim time, per design/02 §7; real-world sessions are not a diegetic quantity and must never be the clock, or quitting and rejoining launders a mark). Config surface: `mark_decay_quarters`, design/04 §6 | Recoverability | 1 | 0.5–2 | One mistake shadows a playthrough for a year of feasts, locking it out of T1 / consequences weightless; a mark forgotten before its feed can land |\n| K9 | Concurrence clear-sky bias | Feast failure frequency | 0.75 | 0.6–0.9 | Alignment unseeable in reasonable play / the clouded Concurrence never witnessed |\n\nKnobs that must not exist: disc colour and countergait timing (identical forever, §2); the 20 m hearing radius (owned by the core game); anything that makes the disc react to the player (pillar 1).\n\n## 6. What fake_backend must fake\n\nEvery scenario above must run offline and deterministically under `smart_actors.fake_backend: true`, driven by `CATHEDRAL_DRIVE` — which needs the proposed `say \u003ctext\u003e` action from `00_vision.md` to inject synthetic transcripts. The renderer needs no faking (the disc is deterministic; `shot` covers the L-rule assertions). The fake backend must supply:\n\n1. **A scripted pass state:** a fixed pauper-name sequence rotating on a drive-triggerable funeral event, a fixed counter-sign per quarter, deterministic lintel-chalk and name-knell outputs — S4 replayable byte-for-byte.\n2. **Wicket logic, complete:** exact and fuzzy match paths, the repeat prompt on unintelligible input, the deflection line, marked-face state, the fed-false-meeting escalation, the cracked-pane scatter — every branch of S6–S8 reachable from a drive script.\n3. **Deterministic NPC sight of the Emblem** per L-rules §8, from the same geometry feed the real sidecar receives, so the two-eyes test is assertable offline.\n4. **Canned deflections and meeting content:** the Custody Doctrine responses for S3; one full meeting transcript for S5 — bede-roll, sky-drawing, the recitation carrying next quarter's counter-sign after \"unwalled\".\n5. **A deterministic moth:** Brant relays any transcript containing phenomenon vocabulary after a fixed delay; clerk-at-funeral and watching-escalation fire on fixed counters — K7's range integration-testable.\n6. **Forced weather and clock:** clear/overcast toggles and a Concurrence-day jump, so both halves of S9 are single drive scripts.\n\nThe bar: a CI run with no network and no keys can walk the whole recruitment funnel, betray the cell, and stand on the mid-stone through a clear and a clouded Concurrence, asserting a screenshot at every beat. If the fake backend cannot perform the entire conspiracy, the conspiracy is not yet a system — it is still only a story.\n"},"design/06_the_sound_of_the_city.md":{"title":"The Sound of the City: Bells, Cries, and the Audible Simulation","use":"design spec for developers — every canonical sound of Ombreval consolidated as asset, meaning, trigger, range, and the sidecar heard-event it emits; the bell layer specified as game mechanics; not for NPC context injection.","words":2875,"text":"# The Sound of the City: Bells, Cries, and the Audible Simulation\n\n\u003e Use: design spec for developers — every canonical sound of Ombreval consolidated as asset, meaning, trigger, range, and the sidecar heard-event it emits; the bell layer specified as game mechanics; not for NPC context injection.\n\u003e Canon: 00_canon.md\n\n## 0. Status and scope\n\n**This is a proposal. Nothing below is implemented.** It sits on `02_voice_and_the_passphrase.md` (the name-knell as pass-rotation clock), `04_systems_integration.md` (the rotation transaction and event stream; cited as design/04), and `03_questlines.md` §1 (the `heard` predicate). All fiction defers to `00_canon.md` (§) and the bell canon of `11_glossary_and_naming.md` and `07_what_everyone_knows.md`; **[spec decision]** and **[proposed]** tags as in the siblings.\n\nThree laws govern everything here:\n\n1. **The sidecar owns the cause; Bevy owns the playback.** Every sound below is scheduled by authoritative sidecar state and rides the snapshot/event stream, as the knell already does in design/04 §3. The Rust side is a speaker, never a clock.\n2. **Percept, never meaning.** A heard-event injects only what an ear gets — *\"you hear the name-knell from Saint Maren's: seventeen strokes.\"* What it *means* lives in standing lore (`07_what_everyone_knows.md` already teaches every actor the bell code). The sidecar never explains a bell to anyone.\n3. **The Second Sun is silent.** Canon §2 is visual-only; vision pillar 1 forbids a whispering audio bed. §9 makes this testable.\n\n## 1. The bronze layer: why bells are mechanics\n\nSpeech dies at 20 m; a bell crosses the map — Ombreval's one broadcast channel, and canon has already spent it as mechanism: the name-knell of Maren Smallvoice **is** the pass-rotation clock (§5, §8 — \"the sound of a key turning\"), its stroke count **is** the dead's age, and the player is expected to count it by ear (design/05 S4). The offices tell the hour, the Scold the law, the Ruin the calamity. None of it is ambience: a player who learns the code navigates the day, the dead, and the conspiracy without one line of UI — vision pillar 3, delivered in bronze.\n\n**Patterns are data, not recordings [spec decision].** The store holds one stroke sample per bell (§6); every peal, toll, knell, and alarm is assembled at runtime as an ordered stroke sequence with intervals. Consequences, each load-bearing: the knell's count is a number in the funeral transaction, never a baked file; the offices are countable because count is data; and the Ruin — the ring rung backward — is *literally the same sequence reversed*, so fire and feast can never drift apart in tuning. Assembled peals get 20–40 ms of seeded jitter per stroke, so bronze sounds pulled by hands, not by a sequencer **[spec decision]**.\n\n## 2. The consolidated table\n\nRanges are 3D radii, no occlusion, matching the hearing model (design/02 §1); the 20 m speech radius is the baseline. The heard-event column is the load-bearing one: the percept class injected into NPC context (§5).\n\n| Sound | Source | Diegetic meaning | Trigger | Range | Heard-event percept (class) |\n|---|---|---|---|---|---|\n| The seven offices | **Perrin Evenblow** (Lanthorn) | The Candor's hours, Watch through Snuffing | Sim clock, seven times daily | citywide | none — updates the scene-header clock only (§5) |\n| Full ring | all six of the ring, the Orphan included | The Concurrence and the quarter-feasts | Calendar event | citywide | \"the full ring from the Lanthorn — the Orphan among them\" |\n| Great toll | **Great Ambrelle, called Gravemouth** | Bellday's great mass; the great dead | Calendar; death of rank | citywide | \"Gravemouth tolling, slow, unnumbered\" |\n| The Ruin | the ring, backward, greatest first | Fire or flood. Drop everything | Calamity event (dev-triggered only, §7) | citywide | \"the ring rung backward — the Ruin\" (at onset) |\n| Alarm | **Coswald Ironthroat** | A local fire or breach; help to one quarter | Calamity event, local | citywide | \"Ironthroat ringing fast from the Lanthorn\" (at onset) |\n| Fog and flood | **Vhairé Farcall** | A report from the off-map Serle wharves: river fog or rising water | Weather state | citywide, strongest in the south wards | \"Farcall for the outer wharves\" / \"Farcall — the river beyond the wall is rising\" |\n| The court | **Gaudry Truetongue** | The Praelucent's court; Gradine recantations | Court event | 400 m | \"Truetongue: the court is sitting\" |\n| The name-knell | **Maren Smallvoice** (Saint Maren's) | A funeral; one slow stroke per year of the life | Burial transaction (design/04 §3) | 300 m | \"the name-knell from Saint Maren's: N strokes\" (at completion) |\n| Curfew | **The Scold** (Bellstand) | The Snuffing curfew, in law | Sim clock, after the seventh office | 500 m | \"the Scold ringing curfew\" |\n| Summons | **The Scold** | Gather the square; a proclamation follows | Proclamation event | 500 m | \"the Scold gathering the Bellstand\" |\n| The wick-call | lamplighters' whistle, three notes | The shape on the ladder is lawful | Lighting round, each corner, dusk | 40 m | \"the lamplighters' wick-call nearby\" |\n| Crier's opening | Jos Brant's handbell and \"Oyez!\" | A crying begins; come close to hear it | Crier schedule; after a Scold summons | 80 m | \"the crier's bell and his Oyez from the Bellstand\" |\n| Crier's words | Jos Brant, speaking | The edict or news itself | Ordinary `say` on his turn | **20 m** | ordinary speech transcript, as today |\n| The boatmen's song | *The Water Knows One*, the Hungry Ox | Boatmen at their pots; louder when grey coats pass | Tavern occupied, evening | 30 m spill | \"low singing from the Hungry Ox: the water knows one, boys\" |\n| The forbidden verse | ***Lucem non murabis***, choral | The Unwalled at the Concurrence Passing | T3 staging (design/03 §5) | the nave; 100 m of the Gradine | \"the crowd in the third bay sings: Lucem non murabis\" |\n| The rehearsed verse | the same, low | Meeting rite (canon §5) | Scripted `say` in the meeting | 20 m | ordinary speech transcript |\n| The Second Sun | — | — | — | — | **none, ever** (§9) |\n\n## 3. Pattern specifications\n\n**The offices [spec decision].** Each office is rung as its ordinal: the Watch one stroke, the Kindling two, Dayspring three, High Wick four, the Waning five, Lamplight six, the Snuffing seven, at 3 s intervals. A player anywhere in the city learns the hour by counting — the ear-skill the knell demands, taught seven times a day for free.\n\n**The full ring [spec decision].** Youngest voice to greatest — Truetongue, Farcall, Evenblow, the Orphan, Ironthroat, Gravemouth — rounds of six, five minutes at feast dawn. The Orphan rings **only** inside the full ring, never alone: folk distrust of the nameless bell (no one weds under it; Belwyn's ward is made when it rings) stays consistent because the only days it speaks are days everyone is already braced.\n\n**The Ruin.** The full-ring sequence exactly reversed: Gravemouth first, recognisable on the first stroke, so its percept fires at onset (§5). Ironthroat alone is a burning house; the Ruin is a burning quarter **[spec decision]** — the difference between help wanted and run.\n\n**The name-knell.** Strokes equal the years of the life, interval `knell_stroke_interval_s` (default 3.0 — slow enough to count). Scheduled inside the same sidecar transaction that updates `burial_registry`, `lintel_name`, and `pass_name` (design/04 §3): the bell and the lock cannot disagree, which is the trust model of design/02 §6. The percept fires at completion, count included — an NPC's ears are text, and text arrives counted; the *player's* ears are their own, which is design/05 S4's puzzle and must never be shortcut by any HUD.\n\n**Gravemouth's toll.** For the great dead: slow, unnumbered, one stroke to a long breath, until the body is in the choir. It does not count years **[spec decision]** — counting is Smallvoice's office, and keeping them distinct protects the knell's meaning as the pass clock.\n\n**The Scold.** Its curfew ring is the *legal* Snuffing, following Evenblow's seventh office — the office is prayer, the Scold is law, and the minutes between them are the city's dusk grace **[spec decision]**. Its summons pattern precedes every crying and Gradine proclamation.\n\n**Farcall.** Long intervals report fog at the off-map Serle wharves; a faster pattern reports rising water beyond the south wall. Boat crews use it outside the playable city, while citizens hear only a material warning about delayed freight and prices. It never changes Saint Maren's crypt or any in-city geometry, and its playback must not imply an accessible canal.\n\n## 4. The human layer\n\n**The wick-call.** Three whistled notes at each corner of the lighting round (`08_folk_culture.md`): the lawful-shape signal. One wav, one percept class, deduped hard (§5) — dusk gets a texture, and an actor seeing a ladder-shape at a window can reason \"no wick-call heard\" like a citizen.\n\n**The crier.** Brant's cry is two sounds with two ranges, and the split is the design: the handbell-and-Oyez opener is game audio at 80 m — a summons — while the words are his ordinary `say` at 20 m. \"Gather in\" is literal: the hearing model forces the crowd to close distance for content, which is the fiction exactly, and no speech-radius exception is created (design/04 §5 forbids resizing).\n\n**The boatmen's song.** A low-mixed wav loop from the Hungry Ox on occupied evenings; boatman actors may also sing single verses as scripted `say` when grey coats pass (the canonical behaviour), giving hearers a real transcript. The wav is texture; the `say` is content.\n\n**The forbidden verse.** At meetings: rehearsed low, a scripted `say` (design/02 §6's ritual-line machinery), 20 m, overhearable — that risk is canon. At the Concurrence: the crowd-scale singing is a choral wav (extras cannot all TTS), *paired* with a percept carrying the words to everyone in range. **Rule [spec decision]: any wav that carries words ships with a sidecar percept containing those words** — wav for ears, text for actors and deaf play. Named cast still sing via scripted `say` so their part enters neighbours' memories attributably (the initiate \"expected in the singing\", design/03 §5).\n\n## 5. The heard-event\n\nOne new sidecar event type **[proposed]**, authoritative and bridge-visible:\n\n```\n{ type: \"sound\", id, class: \"bell\" | \"signal\" | \"cry\" | \"song\",\n  asset_pattern: [ {bell: \"smallvoice\", strokes: 17, interval_s: 3.0}, ... ],\n  site: \"saint_marens\", pos: [x, y, z], audible_m: 300,\n  percept: \"you hear the name-knell from Saint Maren's: seventeen strokes\",\n  percept_at: \"completion\" | \"onset\" }\n```\n\nBevy consumes `asset_pattern` and `pos` for positional playback (and the rendered bell swing, design/02 §9); the sidecar computes recipients from `audible_m` and injects `percept` transiently. Rules:\n\n- **No new calls.** A percept rides the recipient's next scheduled turn in `since_your_last_turn` — a citywide ring is forty lines of prompt text, zero extra turns (design/04 §10's cost model, honoured).\n- **Onset vs completion.** Alarms (the Ruin, Ironthroat) inject at onset — actors must react mid-ring. Counted patterns inject at completion; a count does not exist until it ends.\n- **The offices are a clock, not events.** Seven percepts per actor per day would be token waste: Evenblow instead updates the scene-header time-of-day every actor already receives (\"the last office rung was the Waning\"). Only *deviations* from the daily round are events.\n- **Dedupe by class.** At most the latest percept per class per day; ambient classes (wick-call, song, crier opener) inject once per actor per evening **[spec decision]**. No inbox silts up with corner-whistles.\n- **Quests hear bells.** The `heard(actor, pattern)` predicate of design/03 §1 matches sound percepts as well as speech, so `heard(any, \"the Ruin\")` is a valid trigger with no second mechanism.\n- **Player audio hygiene.** Bell playback ducks 6 dB while the player is mid-utterance at the grate **[spec decision]** — presentation only, protecting cheap open mics from speaker bleed; never touching verdicts or radii.\n\nConfig, additive under `smart_actors.second_sun` (design/04 §6) **[proposed]**: `sounds: ( enabled: true, bell_time_scale: 1.0, knell_stroke_interval_s: 3.0, ambient_dedupe_per_day: 1 )`.\n\n## 6. The wav asset list\n\n`lore/AGENTS.md` invites wav lore; proposed home: `lore/claude/second_sun/sounds/` **[proposed]**. One stroke per bell; patterns assembled (§1).\n\n- `bell_\u003cname\u003e_stroke.wav`, eight of them — `gravemouth` (bourdon, longest decay), `ironthroat` (hard, brazen), `farcall` (carrying, plaintive), `evenblow` (even, mild), `truetongue` (bright, young — cast F.365), `orphan` (slightly off-true against the ring **[spec decision]**: folk unease, earned by ear), `smallvoice` (small, clear — the knell's unit), `scold` (cracked, secular, unlovely).\n- `wick_call.wav` — three whistled notes.\n- `crier_handbell_oyez.wav` — handbell shake plus Brant's canonical \"Oyez, oyez, neighbors, gather in!\"\n- `song_water_knows_one.wav` — one verse and chorus, low male voices, tavern-muffled loop.\n- `verse_lucem_non_murabis.wav` — choral, unison swelling to parts; T3 only.\n\nNo asset exists for the Ruin, any peal, or any knell: sequences, not files. Nothing in this list — and nothing ever added to `sounds/` — may be triggered by, synchronised to, or mixed against the phenomenon (§9).\n\n## 7. Determinism under fake_backend\n\nEverything above must run offline, byte-for-byte (design/04 §7). Seeds, extending the F-series world of design/02 §10:\n\n- **The seeded next burial is Pin, dead at seventeen [spec decision]** — `event funeral_next` (design/04 §8) deterministically chalks *Pin*, sets `pass_name: \"Pin\"`, and schedules a knell of exactly **17 strokes**: fast enough for CI, honest as a count.\n- `bell_time_scale` compresses intervals under drive (0.1 makes the knell ~5 s); the *count* never changes, only the clock **[spec decision]**.\n- New drive events **[proposed]**, `fake_backend` only: `event ruin` and `event proclamation`. The Ruin has no simulation source yet — no fire or flood system exists — so it ships as pattern-plus-dev-trigger, honestly labelled.\n- Every stroke and percept prints an evidence line under drive (`[bell] smallvoice 3/17`, `[percept] \u003cactor\u003e: you hear...`) so scripts assert counts and recipients from stdout **[proposed]**.\n\nOffline tests (B-series, one each in the Python suite): B1 the funeral knell counts 17 and the percept says seventeen; B2 recipients honour `audible_m` (an actor 350 m from Saint Maren's gets nothing); B3 the Ruin is the full ring reversed, injected at onset; B4 offices update the scene clock, no percepts; B5 the crier's opener reaches 60 m while his words stop at 20 m; B6 dedupe holds under three wick-calls; B7 the Concurrence verse wav pairs with its worded percept; B8 zero sound events originate from any render-layer trigger.\n\n## 8. Drive-mode verification\n\nContinuing design/02 §11 (P1–P4) and design/04 §8 (P5–P9); assumes `fake_backend: true` and the seeds above. One new dev anchor: `nave_crossing` **[proposed]**.\n\n```sh\n# P10 — the knell counts true, and the city hears it counted\nCATHEDRAL_DRIVE='wait-online; goto charnel_door; shot lintel_before; \\\n  event funeral_next; sleep 8; shot lintel_after; quit' cargo run\n# assert: 17 `[bell] smallvoice` lines; bystander percept says \"seventeen\n# strokes\"; lintel texture now reads Pin (rotation already proven in P6)\n\n# P11 — summons at 80 m, words at 20 m\nCATHEDRAL_DRIVE='wait-online; goto tally_bridge; event proclamation; \\\n  sleep 4; shot heard_bell_not_words; goto bellstand; sleep 6; \\\n  shot heard_words; quit' cargo run\n# assert: at the bridge, only the Scold and opener percepts; Brant's\n# edict text reaches only inboxes within 20 m\n\n# P12 — the silent sun (the negative test)\nCATHEDRAL_DRIVE='wait-online; goto nave_crossing; event weather clear; \\\n  sleep 10; shot passing_silent; quit' cargo run\n# assert: zero `type: \"sound\"` events across the Passing; the only\n# permitted noise sources are people and bronze\n```\n\nThe Ruin's backward order and onset percept are covered offline by B3 (`event ruin` plus the stroke log). Drive scripts demonstrate; the B-series proves.\n\n## 9. Forbidden: the sound of the Second Sun\n\nThere is none, and there must never be one. Canon §2 is purely visual; vision pillar 1 forbids reaction and flourish. Banned: any hum, drone, or tone tied to the disc, the grave-shadow, the beams, the Passing, or the fusion; any sting on first sighting or on entering the beam; any mix change or filter keyed to rose-sightline; any \"reversed bell\" easter egg gesturing at the countergait. The Concurrence's audio is entirely human and bronze — the full ring, the crowd, the verse — and at the fusion the specified sound is whatever the people present make, which in a well-staged run (design/05 §1) is silence. P12 and B8 keep this enforceable: a sound event whose cause traces to the render layer is a release blocker, the audio equivalent of design/05 S3's prompt leak.\n\n## 10. Accessibility\n\nEvery mechanical sound has a non-audio twin: the knell's count echoes in the rendered swing (design/02 §9) and lands permanently as chalk on the lintel; the offices show in light and lamp state; percept text serves any future subtitle surface, since the sidecar already authors every sound as a sentence. Saint Perrin Halfbell, who tuned bells by palm and jawbone, is the fiction's own warrant that a bell seen and felt is a bell heard.\n\nThe summary an engineer can carry out: one event type, one stroke sample per bell, patterns as data, percepts as sentences, meanings left where canon put them — in what everyone knows. The city gets a voice that carries past the Needle, the conspiracy keeps its clock, and the thing in the window keeps its terrible quiet.\n"}};

const XREF_RE = new RegExp(
  '(' + Object.keys(XREF).sort((a,b)=>b.length-a.length)
        .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','g');

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inline(raw){
  let s = esc(raw);
  const code = [];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ code.push(c); return '\u0001'+(code.length-1)+'\u0001'; });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,h)=>'<a href="'+h+'">'+t+'</a>');
  s = s.replace(XREF_RE, (m)=>{
    const t = XREF[m];
    if (t.ext) return '<a class="xref" href="'+t.ext+'">'+m+'</a>';
    return '<a class="xref" href="'+t.key+'" data-doc="'+t.key+'">'+m+'</a>';
  });
  s = s.replace(/\u0001(\d+)\u0001/g, (m,i)=>'<code>'+code[+i]+'</code>');
  return s;
}

function isTableSep(l){ return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.includes('-'); }
function cells(l){
  let t = l.trim();
  if (t.startsWith('|')) t = t.slice(1);
  if (t.endsWith('|')) t = t.slice(0,-1);
  return t.split('|').map(c=>c.trim());
}
const listMatch = l => l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);

function renderBlocks(lines){
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];

    if (!line.trim()){ i++; continue; }

    /* fenced code */
    if (/^\s*```/.test(line)){
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }

    /* heading */
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){
      const n = h[1].length;
      out.push('<h'+n+'>'+inline(h[2].replace(/\s*#+\s*$/,''))+'</h'+n+'>');
      i++; continue;
    }

    /* hr */
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)){ out.push('<hr>'); i++; continue; }

    /* table */
    if (line.trim().startsWith('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && lines[i].trim().startsWith('|')){ body.push(cells(lines[i])); i++; }
      let t = '<div class="table-scroll"><table><thead><tr>';
      head.forEach(c=>{ t += '<th>'+inline(c)+'</th>'; });
      t += '</tr></thead><tbody>';
      body.forEach(r=>{
        t += '<tr>';
        for (let c = 0; c < head.length; c++) t += '<td>'+inline(r[c] || '')+'</td>';
        t += '</tr>';
      });
      out.push(t + '</tbody></table></div>');
      continue;
    }

    /* blockquote */
    if (/^\s*>/.test(line)){
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,''));
        i++;
      }
      out.push('<blockquote>'+renderBlocks(buf)+'</blockquote>');
      continue;
    }

    /* list (nested, stack-based) */
    if (listMatch(line)){
      const stack = [];   // {indent, tag}
      let html = '';
      while (i < lines.length){
        const m = listMatch(lines[i]);
        if (!m){
          /* lazy continuation of the current item */
          if (lines[i].trim() && stack.length && !/^\s*(#{1,6}\s|>|\||```)/.test(lines[i])){
            html += ' ' + inline(lines[i].trim());
            i++; continue;
          }
          break;
        }
        const indent = m[1].replace(/\t/g,'  ').length;
        const ordered = /\d/.test(m[2][0]);
        const tag = ordered ? 'ol' : 'ul';
        if (!stack.length){
          stack.push({indent, tag}); html += '<'+tag+'>';
        } else if (indent > stack[stack.length-1].indent + 1){
          html += '<'+tag+'>'; stack.push({indent, tag});
        } else {
          while (stack.length > 1 && indent < stack[stack.length-1].indent - 1){
            html += '</li></'+stack.pop().tag+'>';
          }
          html += '</li>';
        }
        html += '<li>' + inline(m[3]);
        i++;
      }
      while (stack.length) html += '</li></'+stack.pop().tag+'>';
      out.push(html.replace(/<(ul|ol)><\/li>/g,'<$1>'));
      continue;
    }

    /* paragraph */
    const p = [];
    while (i < lines.length && lines[i].trim()
           && !/^\s*(#{1,6}\s|>|```)/.test(lines[i])
           && !listMatch(lines[i])
           && !(lines[i].trim().startsWith('|') && i+1 < lines.length && isTableSep(lines[i+1]))
           && !/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(lines[i])){
      p.push(lines[i].trim()); i++;
    }
    if (p.length) out.push('<p>'+inline(p.join(' '))+'</p>');
    else i++;
  }
  return out.join('\n');
}
const md = text => renderBlocks(text.replace(/\r\n/g,'\n').split('\n'));

const pane = document.getElementById('pane');

function open(key, push){
  const d = DOCS[key];
  if (!d) return;
  document.querySelectorAll('.entry-main').forEach(e =>
    e.classList.toggle('active', e.dataset.doc === key));
  pane.innerHTML =
    '<article class="doc">'
    + '<div class="doc-head">'
    +   '<div class="doc-path"><a href="'+key+'">'+esc(key)+' ↗</a></div>'
    +   '<div class="doc-meta">'+fmt(d.words)+' words</div>'
    + '</div>'

  window.scrollTo(0,0);
  pane.focus({preventScroll:true});
  if (push !== false) history.replaceState(null,'','#'+encodeURIComponent(key));
  document.title = d.title + ' — The Second Sun';

   search
   ========================================================================== */
const q = document.getElementById('q');
const resBox = document.getElementById('results');
const qmeta = document.getElementById('qmeta');

function search(term){
  const t = term.trim();
  if (t.length < 2){
    resBox.hidden = true; resBox.innerHTML = '';
    document.getElementById('toc').hidden = false;
    qmeta.textContent = '';
    return;
  }
  const needle = t.toLowerCase();
  const hits = [];
  KEYS.forEach(k => {
    const text = DOCS[k].text, low = text.toLowerCase();
    let idx = low.indexOf(needle), n = 0;
    while (idx !== -1){
      n++;
      if (n <= 3){
        const s = Math.max(0, idx - 55), e = Math.min(text.length, idx + needle.length + 75);
        hits.push({
          key: k,
          snip: (s > 0 ? '…' : '')
              + esc(text.slice(s, idx)) + '<mark>' + esc(text.slice(idx, idx+needle.length)) + '</mark>'
              + esc(text.slice(idx+needle.length, e))
              + (e < text.length ? '…' : '')
        });
      }
      idx = low.indexOf(needle, idx + needle.length);
    }
  });
  document.getElementById('toc').hidden = true;
  resBox.hidden = false;
  qmeta.textContent = hits.length
    ? hits.length + ' passage' + (hits.length === 1 ? '' : 's')
    : 'nothing in the archive';
  resBox.innerHTML = hits.slice(0, 60).map(h =>
      '<button class="result" data-doc="'+h.key+'">'
    + '<div class="result-t">'+esc(DOCS[h.key].title)+'</div>'
    + '<div class="result-s">'+h.snip.replace(/\n+/g,' ')+'</div>'
    + '</button>').join('');
}
q.addEventListener('input', () => search(q.value));
resBox.addEventListener('click', e => {
  const b = e.target.closest('[data-doc]');
  if (b) open(b.dataset.doc);
});

const rad = d => (d - 90) * Math.PI / 180;   /* 0° = the crown (XII), sunwise */
const px = (r,d) => [r*Math.cos(rad(d)), r*Math.sin(rad(d))];

function sector(r0, r1, a0, a1){
  const [x0,y0] = px(r1,a0), [x1,y1] = px(r1,a1), [x2,y2] = px(r0,a1), [x3,y3] = px(r0,a0);
  const big = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r1},${r1} 0 ${big} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`
       + ` L${x2.toFixed(2)},${y2.toFixed(2)} A${r0},${r0} 0 ${big} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z`;
}
function petalPath(a, r0, r1){
  const w = 19;                                   /* half-angle at the waist */
  const [tx,ty] = px(r1, a);
  const [ax,ay] = px(r0, a - w), [bx,by] = px(r0, a + w);
  const [cx1,cy1] = px(r1*0.92, a - w*0.72), [cx2,cy2] = px(r1*0.92, a + w*0.72);
  return `M${ax.toFixed(2)},${ay.toFixed(2)} Q${cx1.toFixed(2)},${cy1.toFixed(2)} ${tx.toFixed(2)},${ty.toFixed(2)}`
       + ` Q${cx2.toFixed(2)},${cy2.toFixed(2)} ${bx.toFixed(2)},${by.toFixed(2)}`
       + ` A${r0},${r0} 0 0 0 ${ax.toFixed(2)},${ay.toFixed(2)} Z`;
}

function el(name, attrs, title){

  if (title){
    const t = document.createElementNS(SVGNS,'title');
    t.textContent = title;
    n.appendChild(t);
  }
  return n;
}

function buildRose(size){

  }

                                 stroke:'#b8e6d2', 'stroke-width':1, opacity:.8}));

  ['F.289','The Custody of the Eye', 'Founded to hold one sealed verdict and prevent the next trial. It has been preventing, and accumulating, ever since. The Praelucent’s Attestation is instituted the same year.', 0],
  ['F.290','The Ilvane Chapel shut', 'Mortared closed by the Custody — officially structurally unsound. The squint of the anchorhold stays open, because canon law will not let them wall up a living woman.', 0],
  ['F.301','Colm Attergate', 'A mason’s labourer preaches in the Bellstand that the towers are coffin lids and the Church is walling a sun out of the sky, course by course. Banished; drowns at the Serle sluice trying to return by water. The heresy dates itself from him.', 0],
  ['F.362','The Great Rains', 'Three weeks of overcast; the only sunlight in the city stands in the nave. Publicly the Church’s finest hour. Privately its ugliest: forty arrests for saying which sun fed the city.', 0],
  ['F.398','The Fabric declared complete', 'After three hundred and ninety-eight years. The north tower crown stands scaffolded to this day.', 0],
  ['F.419–421','The Re-leading', 'Two years of scaffold over the rose “for repair” — in truth the Custody’s largest experiment. A third of the panes swapped, one whole light removed and re-set, everything documented. The Emblem never flinched.', 1],
  ['F.428','The Whisper Arrests', 'On an informant’s tip the Custody seizes five in Gaunt Passage. Two recant on the Gradine; a fuller dies in custody “of the damp.” The informant was never named. Every current cell member remembers, and suspects everyone.', 1],
  ['F.431','The Almanac Shame', 'The heretics’ computed Concurrence date beats the official almanac by a day; the wrong bells ring at the wrong noon. Corrected without acknowledgment — by Rasp himself, using the heretics’ own figures.', 1],
  ['F.433','The Ledger Theft', 'A Custody scribe dies (or flees; the record is neat and unsigned) and a satchel of archive copies goes into the city. A “Sparr page” is now the costliest contraband in Ombreval.', 1],
  ['F.436','The Shut Door', 'At last year’s Concurrence the Chapter, fearing crowds, bars the nave doors at the moment of the Passing. A crush on the Gradine; a child’s arm broken; tavern fury still hot.', 1],
  ['F.437','<em>the present year</em>', 'This year’s Concurrence approaches. The doors question must be answered again — and everyone watches the sky, for a clouded Concurrence answers nothing.', 1],
];

const PEOPLE = [
  ['Praelucent Havise Dorn','Head of the Church in Ombreval','Serene, exhausted, precise; pure doctrine in public.','As a young canon she attended a heretic reading — doubt, not duty — and her name may be in the stolen F.433 pages.'],
  ['Provost-Custodian Segwin Rasp','Master of the Custody of the Eye','Enforce the Emblem; learn the truth quietly. Despises cruelty as sloppy method.','He wrote the anonymous almanac correction of F.431 using the heretics’ own figures.'],
  ['Warden Hamel Stott','Master of the masons’ lodge','“It is in the glass; glass is a lie you can see through.”','The lodge’s founding charter pledges the masons to “close the light above.” He has read the clause a hundred times and sleeps badly.'],
  ['Mistress Jonet Sparr','Master glazier of Cinder Row','“Our glass shows true; take it up with the sky.”','She holds one page in Idonea’s hand — a recipe margin reading “cool the green under the open sky.” Meaningless, or everything. Shown to no one.'],
  ['Osanne Vell','Chandler of the Wickmarket — the Tracer','Motherly, iron-cored; leads the Unwalled though her failing eyes can no longer make out the Emblem.','The F.428 informant was her: one anonymous tip, to remove a hothead before he got them all killed. The fuller’s death is hers to carry, and her leadership is penance.'],
  ['Grigor Ashe','Salt-merchant — the Wicket at the grate','Jumpy, mercenary, quarter-believer.','He keeps a private list of every face marked at the grate. Insurance, he calls it. Merchandise, it may become.'],
  ['Doctor Aubin Ferrant','Physician-astronomer off the Tallage','Courteous, obsessed, honest to a fault; his theory is dead by his own measurements and he keeps measuring.','His instruments are funded by the Custody. He suspects, and does not ask.'],
  ['Lise Copp','Pawnbroker at the Tally Bridge','Unreadable, scrupulously “neutral”: fences archive pages to the heretics, launders informant money for the Custody.','She cannot read. She prices pages by seal, by hand, and by the fear in the seller’s eyes — and has sold three of her nephew’s forgeries as genuine.'],
  ['Corin Copp','Journeyman scrivener; forger','Charming, hollow, gifted. Makes “old” pages for both markets.','His masterpiece — <em>Colm’s Last Letter</em>, the cell’s most revered relic — he seeded with phrases from a real page handed him by a man he now believes was a Custody clerk.'],
  ['Verger Dunstan Pike','Keeper of the nave keys','Pious, venal in small change; sells odd-hour nave access.','He stood the F.421 scaffold, watched the pane-swaps, signed the silence-oath. A living eyewitness that new glass shows the Emblem.'],
  ['Crier Jos Brant','Town crier of the Bellstand','Booming, warm, a cheerful folk believer: “the Green Sun hears the dead, neighbours.”','A paid Custody moth, reporting crowd-talk weekly — who does not know his tip caused the Whisper Arrests, or that anyone died of it.'],
  ['Betriss Marle','Publicly recanted heretic — the Namekeeper','Meek in company, granite alone; in the nave daily, ostentatiously devout.','The recantation was planned with the cell to shield the Tracer. She is still sworn, and charts the Emblem daily in embroidery.'],
  ['Ede of the Needle','Orphan, message-runner','Feral, watchful, unbought; arm healed crooked from the Shut Door crush. Keeper of every skipping rhyme.','From her hiding place in the Needle she has overheard the current counter-sign. She has told no one, and does not know what it is worth.'],
  ['Dame Aldith','Anchoress of the mortared Ilvane Chapel','Ancient, amused; trades verses for honest news. “I face a wall, child. Both suns can manage without me.”','Each anchoress since F.211 has taught the next a recitation, never written, said to be Idonea Sparr’s last words. Missing page or long game of whispers — not even Aldith knows. She has recited it to no one. Yet.'],
];

function landing(){
  document.querySelectorAll('.entry-main').forEach(e => e.classList.remove('active'));
  document.title = 'The Second Sun — a lore & design corpus';
  history.replaceState(null,'',location.pathname + location.search);

  const rules = PHENOMENON.map((r,i) =>
      '<div class="rule"><div class="rule-n">'+ (i+1) +'</div>'
    + '<div class="rule-t">'+r[0]+'</div><p class="rule-b">'+r[1]+'</p></div>').join('');

  const answers = ANSWERS.map(a =>
      '<div class="answer"><h3 class="answer-t">'+a.t+'</h3><div class="answer-w">'+a.w+'</div>'
    + '<p class="answer-b">'+a.b+'</p><p class="answer-q">'+a.q+'</p></div>').join('');

  const tl = TIMELINE.map((e,i) =>
      '<div class="tl-e'+(e[3] ? ' live' : '')+'" data-tl="'+i+'">'
    + '<button class="tl-b" aria-expanded="false">'
    + '<span class="tl-y">'+e[0]+'</span><span class="tl-h">'+e[1]+'</span></button>'
    + '<div class="tl-d">'+e[2]+'</div></div>').join('');

  const people = PEOPLE.map((p,i) =>
      '<button class="person" data-p="'+i+'" aria-expanded="false">'
    + '<div class="person-n">'+p[0]+'</div><div class="person-r">'+p[1]+'</div>'
    + '<p class="person-s">'+p[2]+'</p>'
    + '<div class="person-secret"><div class="secret-l">Their secret</div><p class="secret-b">'+p[3]+'</p></div>'
    + '<div class="person-hint">Their secret →</div></button>').join('');

  pane.innerHTML =
    '<div class="landing">'
  + '<div class="hero">'
  +   '<div class="hero-text">'
  +     '<h1>The Second <span class="sun">Sun</span></h1>'
  +     '<p class="hero-sub">A lore &amp; design corpus for <em>The Cathedral-City of Impossible Light</em>.<br>'
  +     STATS.docs + ' documents · ' + fmt(STATS.words) + ' words · the free city of Ombreval, in the year F.437.</p>'
  +     '<blockquote class="hero-quote">“It moves against the sun; it stands in one pane for every eye; I have no theory. '
  +     'An impossible light, and the city at peace with it.”'
  +     '<cite>Doctor Aubin Ferrant, in the margin of his notebook</cite></blockquote>'
  +   '</div>'
  +   '<div class="rose-wrap" id="rose-wrap">'
  +     '<p class="rose-cap">The Great Rose of the Lanthorn — the eye, eight petals, sixteen histories, '
  +     'two-and-thirty small lights, eight buds: sixty-five lights in all. The Emblem stands at the root, '
  +     'in Belwyn’s petal. Hover any light to name it.</p>'
  +   '</div>'
  + '</div>'

  + '<div class="stats">'
  +   '<div class="stat"><div class="stat-n">'+STATS.docs+'</div><div class="stat-l">Documents</div></div>'
  +   '<div class="stat"><div class="stat-n">'+fmt(STATS.words)+'</div><div class="stat-l">Words</div></div>'
  +   '<div class="stat"><div class="stat-n t">'+STATS.ledger.T+'</div><div class="stat-l">True</div></div>'
  +   '<div class="stat"><div class="stat-n f">'+STATS.ledger.F+'</div><div class="stat-l">False, but believed</div></div>'
  +   '<div class="stat"><div class="stat-n a">'+STATS.ledger.A+'</div><div class="stat-l">Ambiguous by design</div></div>'
  + '</div>'

  + '<section class="block"><h2 class="block-h">The Phenomenon</h2>'
  + '<p class="block-d">Every rule below is a visual fact the render layer enforces. Two hundred years of records '
  + 'describe them identically — that consistency is the horror. The dread is that it does nothing, except be seen.</p>'
  + '<div class="rules">'+rules+'</div></section>'

  + '<section class="block"><h2 class="block-h">Four Answers</h2>'
  + '<p class="block-d">Four positions on one impossible thing. None of them is right; the game never says which is '
  + 'least wrong. Add evidence for any theory only if it also fits a rival.</p>'
  + '<div class="answers">'+answers+'</div></section>'

  + '<section class="block"><h2 class="block-h">The Fabric Era</h2>'
  + '<p class="block-d">Years count from the cathedral’s first stone. The present year is F.437. Select any year to open it.</p>'
  + '<div class="tl">'+tl+'</div>'
  + '<div class="tl-legend"><span class="dot"></span>Living memory — NPCs in the city remember these themselves.</div>'
  + '</section>'

  + '<section class="block"><h2 class="block-h">The People</h2>'
  + '<p class="block-d">Fourteen seed bios. Every one of them is keeping something; select a card to read it.</p>'
  + '<div class="people">'+people+'</div></section>'
  + '</div>';

  document.getElementById('rose-wrap').prepend(buildRose(340));

  pane.querySelectorAll('.tl-b').forEach(b => b.addEventListener('click', () => {
    const e = b.parentElement;
    const open = e.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }));
  pane.querySelectorAll('.person').forEach(b => b.addEventListener('click', () => {
    const open = b.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }));
  window.scrollTo(0,0);
}

/* ==========================================================================
   boot
   ========================================================================== */
buildToc();
document.getElementById('home-btn').addEventListener('click', landing);
const hash = decodeURIComponent(location.hash.slice(1));
if (hash && DOCS[hash]) open(hash, false); else landing();
</script>
</body>
</html>
