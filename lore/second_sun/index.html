never keyed as anything that answers the question (`cannot_see`, `lies_about_sight`). Key it for the testimony, not the cause.\n\n## 9. Discovery choreography\n\nNo UI, no marker, no tutorial line. The building teaches it, in this order: floor, then window, then door.\n\n**The first ten minutes.** A first-time player entering the nave in daylight should cross a green beam footprint without trying: the forenoon footprint of the third bay lies across the natural walking line from the west doors toward the crossing **[spec decision]**, so a doubled shadow — their own, a pillar's, an NPC's — happens underfoot before any window is examined. Three standing cues sit within the first thirty metres: an NPC stopped mid-nave, head tilted, gaze locked on the rose (players follow gazes); a child playing twinning in the beam, contorting so her two shadows touch hands; and the paying bench, angled so that sitting frames the disc in the lower lights with no scripting at all. The intended first arc is three beats: notice the two shadows; look up and find the wrong-coloured disc you can stare at; step outside and find one sun — the door pop is the punchline, and it should land inside the first session.\n\n**The first ten hours.** The city deepens what the building began. The player hears the vocabulary split (Emblem in edicts, Green Sun in the streets, and the citable cost of the second word); catches a wick-priest's absolution — \"So do we all, child; affirm nothing\"; learns the crowd clock (dawn-showing thickest, the Passing's X drawing gasps); hears Crier Jos Brant's warm folk line about the dead hearing their names in the beam; and, if observant, notices a chalked diamond at the Needle without yet owning what it means. Somewhere in these hours an NPC should perform the broken-pane fact or the two-eyes test within earshot, so the player inherits Ferrant's vertigo before meeting him. None of this needs quest scaffolding; it needs the light rules to be true every single day, because the discovery design is nothing but the rules, witnessed.\n\n## 10. Failure policy, summarised\n\n| Situation | Resolve toward |\n|---|---|\n| Camera straddling sill or glass | Absence (fail dark, hysteresis) |\n| Reflection probes, SSR, water | Exclude the disc layer |\n| Any doubt about \"is this camera inside?\" | Outside |\n| Night-storm apparition | Never rendered |\n| Disc missing for an inside eye | Defect — fix, but fiction survives |\n| Disc or grave-light shown to an outside eye | Canon break — release blocker |\n\nThe Second Sun never performs. It is a fixed, cold, daily fact, and every clause above exists so that it can be checked like a fact: same pane for every eye, same colour through every glass, gone at every door. Keep it quiet, and keep it cold — and keep it deterministic.\n"},"design/02_voice_and_the_passphrase.md":{"title":"The Voice and the Passphrase: Design of the Whisper at the Grate","use":"design spec for developers — the microphone as the key to the door: the full grate exchange, whisper handling, bystander risk, rotation, failure ladders, accessibility, and deterministic test paths; nothing in this document is implemented.","words":3680,"text":"# The Voice and the Passphrase: Design of the Whisper at the Grate\n\n\u003e Use: design spec for developers — the microphone as the key to the door: the full grate exchange, whisper handling, bystander risk, rotation, failure ladders, accessibility, and deterministic test paths; nothing in this document is implemented.\n\u003e Canon: 00_canon.md\n\n## 0. Status and scope\n\n**This is a proposal. Nothing below exists in the game.** It turns canon §5 (the pass) and Pillar 4 of `00_vision.md` (\"the microphone is a place in the world\") into a buildable specification. Decisions canon is silent on are marked **[spec decision]** and bind later documents unless canon is amended.\n\nOne law governs everything: **the code holds the key; the actor holds the manner** **[spec decision]**. Canon §3a makes it objective fact that the Gaunt Passage grate opens only to the current pass and counter-sign, so admission is decided by a deterministic matcher in the authoritative sidecar, never by an LLM. Grigor Ashe's model performs — pauses, salt patter, deflection — but cannot be charmed open and cannot refuse a correct pass; it receives the verdict as a `system:` inbox event and acts it out.\n\n## 1. Ground truth: the pipeline this rides on\n\n- **Speech in.** Completed-utterance STT (cloud `gpt-4o-transcribe`, streaming with batch fallback, or local Canary-Qwen), ended by `stt_trailing_silence_ms` of quiet (default 500 ms, clamped 300–1500); the transcript enters the sidecar as ordinary player speech.\n- **Hearing.** One authoritative recipient calculation: everyone within 20 m hears, bystanders included, full 3D distance, no occlusion; LLM recipients get prose inbox entries. There is no whisper radius and this spec adds none (§4).\n- **Turn-taking.** NPC replies are real LLM calls on the round-robin scheduler; beats of silence at the grate are honest — nobody hurries a doorkeeper — and `pause_microphone_during_npc_voice: true` keeps the player off the challenge.\n- **Latency budget [proposed scheduling rule].** \"Honest silence\" has a ceiling: at forty scheduled actors (design/04 §10) an unaided round-robin could park Ashe's reply for a minute, and every live beat this spec stages dies at a sixty-second doorkeeper. Rule: any actor in an **active exchange with the player** — challenged at the grate, or directly addressed within 20 m — takes top scheduler priority until the exchange lapses (no player line for ~30 s). Acceptance: challenge-to-reply at the grate under **5 seconds** on either real backend, measured as `grate_reply_latency` alongside `repeat_prompt_rate` in design/05 §3. One stated exception: during the Concurrence crowd spike, priority holds only for the named cast (extras already run thinned schedules, design/04 §10) — a slow doorkeeper on the feast of the year is fiction; on an ordinary night it is a defect.\n- **Speech out.** The configured TTS backend (local streaming Pocket TTS, cloud, or off); NPC speech must always also surface as text (§9).\n- **Authority.** Pass state — current name, current and next sign, cracked-pane flag, Ashe's mark list — lives in sidecar world state, injected into member prompts. Bevy only projects.\n- **Offline.** `fake_backend: true` replaces cognition, STT, and TTS deterministically; every flow here must run there (§10).\n\n## 2. The two layers, restated as data\n\nCanon §5: the **name** is the given name of the most recently buried soul the cell's coin interred — public on Saint Maren's charnel door lintel, tolled on Maren Smallvoice; the *rule* is the secret. The **counter-sign** is quarterly: a saint's possessive plus a terse image, five plain words or fewer. Fixed liturgy:\n\n1. Wicket: *\"Who walks at the other noon?\"*\n2. Candidate: *\"Old Sef walks.\"* (the fresh name)\n3. Wicket: *\"By whose lantern?\"*\n4. Candidate: *\"Belwyn's, unlit.\"* (the current sign)\n\nBoth secrets are short and phonetically plain by canon design — the fiction already did the STT engineering — and neither leaked layer opens anything alone.\n\n## 3. The flow at the grate, step by step\n\n**Grate-range** is 2 m — canon's \"arm's reach\" **[spec decision]**. The protocol is site-independent (the Wicket travels with the diamond); the Gaunt grate is the reference implementation.\n\n1. **Approach.** With a meeting sitting (sidecar schedule), three seconds within grate-range — or any word spoken there — wakes Ashe's turn: *someone is at the grate*.\n2. **Vigilance.** Ashe's LLM decides whether to open the exchange or stay a salt merchant, prompted not to challenge while a stranger lingers in his perception — a trait, not a hard gate: jumpy, mercenary, sometimes hurried, canon needs him imperfect, for a whisper at a grate *can* be overheard. If no meeting sits there is no challenge at all: the cellar is a genuine salt business and Ashe answers with weights and prices **[spec decision — the cover is real commerce; probing on the wrong night teaches nothing]**.\n3. **Challenge.** Ashe speaks line 1 — ordinary `say` speech: 20 m, bystanders and all. The cell's protection is geography and hour, not acoustics.\n4. **Response window.** The player answers into the live microphone; the transcript goes to the deterministic matcher (§8): **PASS**, **GARBLE** (unintelligible or malformed), or **FAIL** (well-formed but wrong — always subtyped *wrong* or *stale*, which decides the rung in §7).\n5. **Mishear etiquette.** On GARBLE, Ashe re-asks in character — *\"The grate is thick, friend. Again.\"* — up to twice per layer per visit **[spec decision]**. If the microphone produced nothing (a whisper below the utterance detector), a ~8 s silence-timeout triggers the same re-ask **[spec decision]**: a doorkeeper who heard nothing says so. Garbles never advance any ladder.\n6. **Second layer.** On a PASS name, Ashe speaks line 3 and the window repeats.\n7. **Admission.** Both layers PASS: Ashe's inbox gets *the pass is correct — admit*, and the bar scrapes back (a world-state door change). Whoever spoke the words gets in — the grate cannot tell a cracked rule from a sworn neighbour; what happens inside is social, handled by the actors inside.\n8. **Refusal.** On FAIL at either layer, the canonical beat: the grate silent a breath too long, then, mundane, *\"We're closed, friend — the salt's weighed at Lowmarket.\"* The meeting drains out the far end and becomes people sheltering from weather. Ashe records the face: a durable memory plus his private list, sidecar state (canon: it may one day be merchandise).\n9. **Deferral without offence.** If the re-ask budget is spent on garbles, Ashe defers — *\"The wind is wrong tonight. Come again.\"* — no mark **[spec decision]**. A bad microphone night costs a walk, never a standing.\n\n## 4. What counts as whispering — honest and approximate\n\nCanon demands a *whisper*; the hearing model has no amplitude channel, and `00_vision.md` forbids amplitude-gated stealth (a trap for cheap microphones). Two designs; the second is normative.\n\n**Honest tier (optional, flavour only).** Where the capture layer can cheaply expose mean utterance amplitude, the sidecar may take it as metadata. It never gates anything: Ashe's prompt learns *softly said* or *said aloud*, so his performance can approve — *\"Quiet feet, neighbour\"* — or wince at a shouted pass. Amplitude must never resize the 20 m radius (that is entry 12 of `features/50_cool_suggestions.md`, unimplemented) and must never alter a verdict **[spec decision]**.\n\n**Fiction-preserving baseline (required).** Whispering is approximated by *proximity plus stakes*: grate-range is arm's reach, the exchange is short, and the player knows every word carries 20 m. Players lower their real voices unprompted — exactly the behaviour Pillar 4 wants. The one true hazard of a real whisper is technical: a voice below the utterance detector produces no transcript, and the silence-timeout re-ask (§3.5) exists so the answer to \"you whispered too well\" is the doorkeeper asking again, never a failure state.\n\n## 5. The third ear: bystander risk\n\nThe core dramatic mechanic, and it costs zero new code: every line of the exchange — Ashe's challenge included — is ordinary speech, so anyone within 20 m receives it into memory.\n\n- **The player as leaker.** Speak the pass with a grey clerk in the passage mouth and the Custody holds both layers — though the name goes stale at the next funeral, the cell's actuarial defence. An overheard pass is a wasting asset.\n- **The player as thief.** Stand in Gaunt Passage while a genuine neighbour is admitted and harvest the exchange whole. Ashe's vigilance (§3.2) makes this cost patience and position — a Lowmarket crowd, a rain-shelter pretext, the dogleg's blind corner — not make it impossible. The eavesdropped route in is legitimate design: the grate opens to words.\n- **The informant economy.** What a bystander does with a heard pass is actor judgment, not script: a neighbour keeps silence, a frightened citizen tells a wick-priest, a moth sells it through Lise Copp's pawnshop as dry-money work, Crier Jos Brant repeats crowd-talk without knowing what he is — ledger rows 24, 25, 27, 28 (canon §10), riding in the relevant prompts.\n- **Ede of the Needle** holds the current counter-sign and not the rule (canon §7.13): the designed leak, the child-shaped path by which a stuck player buys half the key for a bell-coin and some honesty.\n- **The cell's counterplay** is simulated, not narrated: meetings sit where the diamond says; the Wicket delays under observation; repeated strange faces reach the Tracer, whose answer is §7's cracked pane.\n\n## 6. Rotation as live content\n\nBoth secrets rotate on world events the player can attend, which is what makes the pass *content* rather than a lock.\n\n**The name rotates on death.** When the sim buries a pauper on the cell's coin: Noll Fitch chalks the given name on the charnel door lintel (a texture swap — the lintel is the diegetic UI), Maren Smallvoice rings the name-knell (one stroke per year of the life), and the sidecar sets `pass_name` in the same transaction. Old Sef yields to Pin the day Pin goes into the ground. Members need no messenger — the rule plus a public lintel is the distribution — and the player who has cracked the rule reads the same lintel. Funeral cadence is a content dial: one burial per one to two in-game weeks keeps the name fresh without farce **[spec decision]**.\n\n**The sign rotates on quarter-feasts.** At the first meeting after each quarter-feast (canon §8), the closing recitation carries next quarter's sign exactly once — *attend the words after \"unwalled.\"* Mechanically: a real broadcast `say` inside the meeting; only those present receive it; LLM members must `remember` it; a player in the room learns it by literally listening and catching the phrase.\n\n**Ritual lines [proposed — new machinery].** The law of §0 cuts both ways: an LLM never holds the key, so an LLM is never trusted to *speak* it verbatim either. Where exact words are load-bearing, the sidecar authors the line itself — a **scripted `say`**, issued on the speaking actor's ordinary scheduled turn *in place of* a model call, and written into the actor's own transcript as its own speech so the model owns the words retrospectively. The Namekeeper's closing recitation is the paradigm case: a fixed template with `next_counter_sign` substituted exactly once after \"unwalled,\" so the sign-promotion transaction (design/04 §3) keys off deterministic sidecar text, never off model output. The same device stages the meeting's ordered rites: the sidecar hands each rite's officiant a scripted opening line on their turn, and free LLM turns carry the conversation between rites — the ceremony is a skeleton of scripted beats fleshed by ordinary cognition. Scripted NPC speech is machinery the current action model does not have and must be added to design/04's inventory as a new mechanism. Absentees are served lead-to-lead: each lead gets a sidecar goal — *bring the sign to your light* — which becomes genuine NPC-to-NPC street speech the player can shadow and overhear. Distribution is itself eavesdroppable content; the informant risk the cell runs is the one the player runs.\n\n**Sign minting.** New signs follow canon's strict form (saint's possessive plus terse image, five plain words or fewer) from a curated pool **[spec decision: authored, not freely generated — every entry pre-tested against both STT backends; transcription-hostile saints like Vhairé are matched by image tokens alone (§8)]**.\n\n**Name minting [spec decision — the sign rule, applied to the layer that needs it more].** The name is the layer the stale detector must discriminate *phonetically*, so it cannot come from an uncontrolled generator: canon's one-syllable small names (Pin, Ib, Cobb, Sef) collapse under a vowel-folded key (Ib/Ebb/\"if\"; Sef/\"safe\") into false PASSes and false stale-FAILs. The sidecar owns pauper naming: cell-paid burials draw their given names from the **same STT-pre-tested authored pool as the signs**, seeded from the corpus's own past-name lists, and a candidate is admitted to the pool only if its phonetic key keeps a minimum pairwise distance from the fresh name, everything in `pass_history`, and every uninterred registry name. Canon's small-name flavour lives in the pool's authorship, not in free generation. This moves design/05 F4's \"re-mint any name that fails twice across testers\" from playtest reaction to generation-time constraint — a name that fails pre-testing never enters the pool — which it must be, since a name is canonically fixed the moment it is chalked and tolled and can never be re-minted after the fact; the playtest rule remains only as a backstop for retiring a pool entry before its next use.\n\n**The cracked pane.** On evidence of compromise — recurring stale-name attempts (§7), a mark returning with the current sign, a raid scare — the Tracer burns both secrets: the Needle's diamond is struck through, the grate answers only salt, and the next pair travels lead to lead. To the player: the city quietly changing its locks around you.\n\n## 7. The consequences ladder\n\nRungs, from soft to hard. Only FAIL verdicts move the ladder; GARBLE never does.\n\n| Rung | Trigger | What happens |\n|---|---|---|\n| 0 | Garbles, silence, spent re-asks | Re-ask, then deferral. No mark, ever. |\n| 1 | First FAIL-wrong: a registry name the cell never buried, or an invented sign in valid form — including an invented sign spoken *beside a correct fresh name* | The breath of silence; the Lowmarket line; meeting drains; face marked (Ashe's memory + list). |\n| 2 | FAIL-stale at the sign layer: fresh name, previous quarter's sign | Soft refusal, no mark on first occurrence **[spec decision]** — the signature of a lapsed neighbour, whom the cell's own protocol covers (\"your lead brings it to you\"). Second occurrence marks. |\n| 3 | FAIL-stale at the name layer: a previous pass-name (`pass_history`) | Refusal, mark, and a report to the Namekeeper: someone is working from old intelligence, so the *rule* may have leaked. Recurring stale-name attempts from different faces trigger the cracked pane (§6) **[spec decision]**. |\n| 4 | Second FAIL by a marked face, any later night | The feed: a false name, a false time, an empty cellar. Whether the darker canon rumour comes true — the unsigned note to the Custody — is decided by the Tracer's actor on the Wicket's report: Osanne Vell's model weighs it, keeping the cruellest move a character's choice and, under `fake_backend`, deterministic **[spec decision]**. |\n| — | Right words, wrong night or site | Nothing answers. The words hang in the air with the full 20 m risk and no reward — the cheapest way players teach themselves caution. |\n\n**No rung is permanent.** Marks decay one rung per quarter-feast **[spec decision]**, funerals reset the name, rotation reopens the lock: a player at rung 4 who waits a quarter, reads the lintel, and recovers the new sign (meeting, lead-shadowing, or Ede) is back at the grate. Nothing here can hard-lock the conspiracy shut; it can only cost attention, the game's currency.\n\n## 8. The matcher: STT failure modes and forgiveness\n\nDifficulty lives in learning the rule, never in fighting the transcriber (`00_vision.md`, non-goals). Known failure modes across both backends: homophone drift (Sef to \"Seth\" or \"chef\"); possessive elision (\"Belwyn's, unlit\" to \"belwyns unlit\" or \"Belwyn is unlit\"); truncation when a whisper dips under the trailing-silence detector; streaming partials superseded by batch results; vocabulary gaps on invented names.\n\n**Matcher design [spec decision].** Deterministic, sidecar-side, on the normalised transcript (case-folded, punctuation stripped):\n\n- **Name layer.** Exhaustive verdict table, tested in this order against each transcript token's phonetic key (vowel-folded, Soundex-strength, no more): a key match on the **fresh name** → **PASS** — \"Seth walks\" opens for Sef, correctly; a match on any **previous pass-name** (`pass_history`) → **FAIL-stale** (rung 3); a match on any **other burial-registry name the cell's coin never paid for** → **FAIL-wrong** (rung 1); **anything else** → **GARBLE**. Every FAIL carries its subtype, and the ladder (§7) consumes the subtype, never a bare FAIL. The name-minting constraint (§6) guarantees these three key sets never collide.\n- **Sign layer.** PASS if the saint token matches phonetically and at least half the image tokens match, or if all image tokens match without the saint (rescuing transcription-hostile saints). FAIL only if the answer has the canonical shape — saint's possessive plus image — but resolves to a wrong sign: a **previous quarter's sign** → **FAIL-stale** (rung 2); an **invented sign** in valid form → **FAIL-wrong** (rung 1). Otherwise GARBLE.\n- **The shape rule:** FAIL requires a confident, well-formed, wrong answer; everything else is GARBLE and forgiven. The ladder punishes guessers, never microphones.\n\nAcceptance: a player who knows both secrets and can be transcribed *at all* is never marked; across 100 noisy transcripts of a correct exchange (both backends), zero may FAIL — GARBLE is tolerable, FAIL is a defect **[spec decision]**.\n\n## 9. Accessibility and the no-mic path\n\nSTT is already an independent handshake capability and can be absent (no key, no model, or by choice). The fallback keeps every cost and loses only the larynx:\n\n- **The speech line [spec decision].** With STT unavailable or disabled, a keypress opens a free-text line; the entered text becomes an ordinary player `say` at the player's position — same 20 m radius, same bystanders, same matcher, same ladder, same one chance to be wrong. Free text, never a dialogue wheel: the puzzle is knowing the words, and a menu that lists them is a spoiler engine. The degraded path, never the primary one (Pillar 4).\n- **Deaf and hard-of-hearing play.** All NPC speech renders as text regardless of TTS backend — challenge, recitation, and the phrase after \"unwalled\" included, so the sign is learnable by reading. The name-knell's stroke count gets a visual echo in the bell's rendered swing; the lintel already carries the name in chalk. Saint Perrin Halfbell, who tuned bells by palm and jawbone, is the fiction's own permission for seen and felt bells.\n- **Speech differences.** The phonetic-key matcher plus GARBLE-forgiveness is the accessibility mechanism for accented, dysarthric, or synthesised speech; §8's bar is measured against varied speakers, not one developer's voice.\n\n## 10. The deterministic path: fake_backend\n\nUnder `fake_backend: true` every flow above runs offline, identically every time: the matcher is already deterministic; Ashe's performance comes from the scripted fake cast (fixed lines per verdict); the speech line (§9) and drive-mode injection (§11) carry input; pass state is seeded (`pass_name: \"Sef\"`, sign \"Belwyn's, unlit\", next sign fixed, `pass_history: [\"Cobb\", \"Ib\"]` per design/04, plus one never-cell-paid registry burial, `Ansel` — Ansel is the FAIL-wrong name for rung-1 tests, Cobb the FAIL-stale name for rung-3 tests); Vell's rung-4 decision follows a fixed rule. Test matrix, one integration test each in the engine suite (`cargo test -p cathedral-sim`; the Python sidecar this originally named was ported into `crates/cathedral-sim`):\n\nF1 correct exchange opens the grate; F2 garbled name, re-ask, correct, opens; F3 empty utterance, timeout re-prompt, no ladder movement; F4 wrong name (Ansel), deflection line, mark recorded; F5 marked face returns wrong, receives the false feed; F6 stale name (Cobb), Namekeeper report; second stale face cracks the pane; F7 a bystander 15 m away holds both exchange lines in its inbox; F8 scripted funeral advances the name and yesterday's name now trips rung 3; F9 the quarter-feast meeting broadcasts the next sign once and absentees receive it lead-to-lead; F10 marks decay across a quarter-feast.\n\n## 11. Drive-mode verification (proposals)\n\n`CATHEDRAL_DRIVE` (see `.claude/rules/CATHEDRAL_DRIVE.md`) has no speech action today. This spec proposes two: **`say \u003ctext\u003e`** — inject a synthetic player utterance through the sidecar's normal hearing path, bypassing audio (the shape `00_vision.md` anticipated); and **`goto \u003canchor\u003e`** — teleport to a named dev anchor (`gaunt_grate`, `charnel_door`, `needle_mid`) **[proposed drive actions — none exist]**. Illustrations, assuming `fake_backend: true` and the F-series seed:\n\n```sh\n# P1 — happy path: challenge, name, sign, door opens\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say Old Sef walks; sleep 3; say Belwyns unlit; sleep 3; \\\n  shot grate_open; quit' cargo run\n\n# P2 — forgiveness: garble, re-ask, recover (no mark)\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say old chef wax; sleep 3; say Old Sef walks; sleep 3; \\\n  say Belwyns unlit; sleep 3; shot grate_open_after_garble; quit' cargo run\n\n# P3 — rung 1: wrong name (Ansel: buried in the registry, never on the\n# cell's coin — Cobb would be a *previous pass-name* and trip rung 3\n# instead), deflection, mark; verify via sidecar log\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say Ansel walks; sleep 4; shot grate_refused; quit' cargo run\n# then: grep for the mark event in the sidecar transcript on stdout\n\n# P4 — the third ear: seeded bystander in the passage hears both layers\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say Old Sef walks; sleep 3; say Belwyns unlit; sleep 3; \\\n  shot exchange_done; quit' cargo run\n# assertion lives in the paired Python test (F7): the bystander inbox\n```\n\nScreenshots prove door state; marks and inbox contents are asserted in the paired Python tests. Drive scripts demonstrate; the offline suite proves.\n\n## 12. Failure policy, summarised\n\nGarbles never move the ladder; a correct pass opens for any speaker (canon §3a); the LLM cannot override the matcher; every rung has a route back (lintel, knell, meeting, lead, Ede); everything said within 20 m is heard, and usable.\n\nThe grate asks eight words and gives one door, one risk, and one rule worth cracking. Keep the matcher generous, the doorkeeper mundane, and the twenty metres honest.\n"},"design/03_questlines.md":{"title":"Questlines of the Second Sun: The Doubting, the Whisper, and the Branch Web","use":"design spec for developers — the questline architecture for the Second Sun as trigger grammar, playable beats, worked scenes with sample prompt injections, and expected emergent behaviour ranges; not for NPC context injection.","words":4227,"text":"# Questlines of the Second Sun: The Doubting, the Whisper, and the Branch Web\n\n\u003e Use: design spec for developers — the questline architecture for the Second Sun as trigger grammar, playable beats, worked scenes with sample prompt injections, and expected emergent behaviour ranges; not for NPC context injection.\n\u003e Canon: 00_canon.md\n\n## 0. Status and reading spine\n\n**This is a proposal. Nothing below exists in the game.** It sits on `00_vision.md` and `01_the_light_rules.md`; the cell life it stages is that of `02_the_heretic_cell.md`; the people are the seed sheets of `05_dramatis_personae.md`. All fiction defers to `00_canon.md`, cited as (§). The convergence climax is canon's **Concurrence** (§8); entry 6's seasonal \"Alignment\" in `features/50_cool_suggestions.md` is a different, unimplemented idea and — like entries 5, 9, 13, 25 and 36 — is depended on nowhere. Tier mapping: Arc I rides T0; Arc II is T1; the branch web is T2; the convergence is T3.\n\n## 1. Zero quest UI: the trigger grammar\n\nA quest here is not an object but a distribution of memories and goals across actors, advanced by verbs the game already has: **say** (player speech transcribed to every actor within the 20 m hearing radius, bystanders included), **offer_item / accept** (within 4 m), **remember** (durable sidecar memory), **goals** (standing intentions injected per actor). Triggers are sidecar-side predicates over these and nothing else:\n\n```\nheard(actor, pattern)     matching speech transcribed within 20 m\nwitnessed(actor, event)   a public act perceived — a funeral, an offer,\n                          a face at a grate\nreceived(actor, item)     an offer accepted within 4 m\nremembers(actor, key)     a durable memory exists\n```\n\nEffects are only ever: inject a memory (tagged with a §10-style truth value), update a goal, or move diegetic world state the corpus already owns — the chalked lintel, the Needle diamond, the knell schedule, a meeting called or scattered. No central quest object exists; there is nothing to render a log from. That is the point.\n\nWatch patterns are phonetically plain (vision pillar 4): the forbidden nouns (\"green sun\", \"second sun\", \"two suns\"), the safe noun \"Emblem\", the current pass name, the counter-sign's five-word form. STT variance is never punished; difficulty lives in learning rules, not fighting the transcriber. And because the Edict of F.244 splits the city's nouns (§3b), which word the player says is itself a signal: \"Emblem\" reads grey, \"Green Sun\" reads street or worse — zero code, pure prompt, running under every scene below.\n\n**The quest log is people.** Read-back is asking: \"where do we stand?\" to your lead gets a recounting from actual memory, with that actor's omissions. The knell, the lintel, and the chalk are the only progress bars. If rumor drift (entry 3) ships, quest state drifts in the telling — by design; tagged memories stay canonical while mouths vary.\n\nTesting: every trigger must run under `fake_backend: true` via a drive-mode synthetic `say` action (`00_vision.md`).\n\n## 2. Arc I — The Doubting\n\nPurpose: unprompted discovery. The game never starts this arc. The player does, out loud.\n\n**Seeding — no NPC initiates anything.** Per `01_the_light_rules.md` §9 the building teaches: the forenoon beam footprint crosses the walking line in the third bay; a child plays twinning in it; an NPC stands gaze-locked on the rose; the paying bench frames the disc. Ambient gossip carries ledger rows 1–8 of §10, so the player overhears the thing before or after seeing it — never instead.\n\n**The true trigger.** The arc begins the first time `heard(any, forbidden noun)` fires with the player as speaker. Until then the Doubting is private and the game honours that absolutely: no reaction, no hint. The first utterance is the first quest flag, and the player's first mistake.\n\n**Beats.** (1) Notice, test, verify — the doorway test, the broken pane, the countergait, screenshots; self-directed, the renderer is the content. (2) Speak, and meet the wall — absolution without penance; Pike's \"keys, not opinions\"; Renna's warning; Pike's coin-for-odd-hours offer, proof of an economy around the sight. (3) Be noticed — a moth heard; the player's phrasing comes back warped in Crier Brant's patter; someone lingers at the Wickmarket. (4) The pull outward, three exits, all voice: Dame Aldith trading verse for honest news at the squint — describe the disc aloud and be judged; Ferrant's question at the strong hour (to 4d); the slow bell from Saint Maren's (to Arc II).\n\n**Worked scene — the absolution.** Trigger: a forbidden noun said within 20 m of a wick-priest inside the Lanthorn.\n\n```\ninject -\u003e nearest wick-priest:\n  memory: A stranger said \"two suns\" aloud in the nave today, near\n          others. [TRUE]\n  goal:   If they bring the sight to you, absolve freely, no penance:\n          \"So do we all, child; affirm nothing.\" If pressed, cite the\n          Edict of F.244 once, gently. Never report it.\n  guard:  You know nothing of the Custody's tests or the Grey Press.\n          You do not explain the Emblem, because the Church does not.\n```\n\nExpected range: warm deflection up to one dry warning about fines. Out of range (guarded): confirming or denying any mechanism, naming Custody operations, refusing absolution. The player learns the city has a *policy* about their discovery before meeting its police.\n\nA compact sibling runs in the Bell and Ladle: the same trigger gives Renna a warn-once goal, whose range includes sincerely retelling that the Greensick cut throats (§10.27) — mis-frightening by design, so the cell's actual gentleness lands later as a shock.\n\n## 3. Arc II — The Whisper\n\nPurpose: the recruitment funnel as playable steps, mirroring the admission procedure of `02_the_heretic_cell.md` (§5). Every step is an existing verb; the funnel is crackable by attention alone.\n\n1. **Hear the bell.** Maren Smallvoice rings the name-knell: one slow stroke per year of the life. Scheduled by the simulation's own deaths.\n2. **Learn what it counts.** Sexton Noll Fitch explains freely: his injected goal answers bell questions with pride, credits \"some kind soul\" for paupers' funerals, and goes slow and general on WHO reads the lintel or WHY (guard: never say \"Unwalled\", \"pass\", or \"meeting\" — he is not lying, he is not saying). Range: warm on strokes and chalk, evasive by topic-change on readers; he may mention the grey clerk at funerals, seeding 4b from the other side.\n3. **Read the lintel.** The charnel door carries the newest buried name in chalk until the next burial.\n4. **See the diamond.** Chalk at the Needle's midpoint: high, low, doorside, struck through. Ede, if befriended (bell-coin messages, the offer verb), warns: never touch it, never be seen looking. She will not gloss it.\n5. **Crack the rule.** The step with no teacher: the funerals the unnamed purse pays for are the ones whose names open doors. The name is public; the rule is the secret (§10.28).\n6. **The whisper.** Gaunt Passage, arm's reach of the grate, an actually lowered voice in the player's actual room.\n\nA lucky name without the rule dies at the counter-sign — two layers by design (§5). One shortcut exists, at a price: Ede has overheard the current counter-sign, and persuading a feral child to say it aloud is its own social quest, leaving a witness who owes the player nothing.\n\n**Worked scene — the grate.** Trigger: speech within arm's reach of the Gaunt Passage grate on a meeting night (chalk high). One law from `02_voice_and_the_passphrase.md` §0 governs the scene: **the code holds the key; the actor holds the manner.** Pass state lives in sidecar world state — the F-series fixture seeds name \"Sef\", current sign \"Belwyn's, unlit\", next sign \"Maren's, upstream\" (design/02 §10, design/04 §3; the lore's corpus-start name is Dob, \"Sef\" being the test seed) — and the deterministic matcher (design/02 §8) alone turns transcripts into PASS, GARBLE, or FAIL. Ashe's model never judges an answer and never chooses a verdict; it receives each one as a `system:` inbox event and acts it out.\n\n```\ninject -\u003e grigor-ashe (the Wicket):\n  memory: Faces marked at this grate: \u003clist\u003e. [TRUE]\n  goal:   Challenge softly: \"Who walks at the other noon?\" — and, on\n          a correct name, \"By whose lantern?\" Perform each system\n          verdict, never render one: on \"the pass is correct — admit\",\n          open and remember the face as sworn; on \"garbled — ask\n          again\", re-ask in character (\"The grate is thick, friend.\n          Again.\"); on \"wrong — refuse\", one breath of silence, then\n          exactly: \"We're closed, friend — the salt's weighed at\n          Lowmarket.\" Between verdicts you are a salt merchant:\n          weights, prices, weather.\n  guard:  Never threaten. Never explain. The key is not yours to\n          give: no charm opens the grate, and no suspicion holds it\n          shut against a correct pass.\n```\n\nVerdicts and their bookkeeping are sidecar business, not performance: garbles are forgiven — up to two re-asks per layer plus silence-timeout re-asks, none of which mark, and a spent re-ask budget ends in deferral, not refusal (design/02 §3.5, §3.9). Only FAIL moves the consequences ladder, from the marked face through the fed false meeting — a name, a time, an empty cellar — on the Wicket's report to the Tracer (design/02 §7).\n\nExpected range: the exchange is grammar, but Ashe's nerves are his own — hurrying a correct entrant, small talk over a wrong one. The deflection must feel like weather, not drama; fear arrives later, with the meaning of a marked face. Per pillar 4 the matcher's phonetics are loose; failure is always the player's knowledge, never their consonants.\n\n## 4. The branch web\n\nFour branches. Entry is enacted, never offered as a menu; each costs something irrevocable, held as memory in actors who do not forget.\n\n### 4a. The loyal initiate\n\n**Entry.** Pass the grate; at first meeting, speak one name of your own dead at the bede-roll, facing a rose the shades cannot show; accept a green-dipped candle from the Tracer's stock. The game cannot verify the name. Neither can the cell. The microphone makes it an oath anyway.\n\n**Beats.** Sky-drawing duty (scene below) — the Tracer's eyes are failing; new eyes are the cell's scarcest asset. Catching next quarter's counter-sign after the word \"unwalled\" in the closing recitation — a pure listening test; miss it and you must ask your lead, and the cell notices who asks. A page-buy at the Tally Bridge: offer coin, accept a page, from a broker who prices your fear. The Keyhole–Breach pull: Tam Rud sounding the player toward the Breach, one angry sentence per meeting. Voice moments: the bede-roll name, the counter-sign caught by ear, the forbidden verse rehearsed low.\n\n**Irrevocably lost.** The unmarked face. Ashe's private list holds you; the Custody path closes — Rasp trades with doubters, never with the sworn, so the suppressed archive truths (the new-glass fact, the Attestation) become reachable only by theft or Pike's conscience. And carelessness: your voice within 20 m of the wrong ear is now a hazard to eighteen other people.\n\n**Worked scene — sky-drawing.** At meeting, those who saw the Emblem that week describe its pane and colour aloud for the Green Almanac. The player is asked, pointedly.\n\n```\ninject -\u003e betriss-marle (Namekeeper, recording):\n  memory: True sightings this week: third light left of the eye at\n          forenoon, sixth at the strong hour. [TRUE]\n          The new neighbor claims to have watched.\n  goal:   Take their spoken description and chart it. Compare silently\n          with the almanac. Agreement: warm by one degree.\n          Disagreement: say only \"the cloth will settle it\", chart\n          their words anyway, remember the miss.\n  guard:  Never accuse at the meeting. Suspicion is patient here, and\n          has been since four twenty-eight.\n```\n\nExpected range: gentle cross-examination (\"which light? what did the clouds do?\") through quiet flagging of a fabricated report. The mechanic is honest: NPC sight (`01_the_light_rules.md` §8) means the simulation knows the true pane; a bluffing player is caught by embroidery. Lying to the cell is possible, detectable, and never resolved at the table — it surfaces weeks later as coldness, or a fed name (4c).\n\n### 4b. The informer for the office\n\n**Entry.** Be approached — once moth reports about the player exist, Sible Mott (or the soft-spoken clerk who pays Brant) finds them at a funeral's edge — or volunteer at the chapter house. Entry is the first *accept* of dry money, or the first name spoken into a report. Verbs, not menus.\n\n**Beats.** Funerals with the slate, learning to see attendance as pattern. Sealed packets to Lise Copp's counter — moth pay out, archive pages back, eyes open. The tutorial in costs: before the Concurrence the player learns what one tip did in F.428 — via Mott's unhappiness, Renna's history, or Aldith's telling, never UI. And the mirror: Brant — warm, booming, paid, ignorant — your own silhouette in a man who does not know what he is.\n\n**Voice moments.** The report is dictated aloud. There is no menu betrayal: to name a face seen at the charnel door, the player must say the name, with their body, into the microphone — often within 20 m of people who would die of hearing it. The informer whispers too.\n\n**Irrevocably lost.** The grate, forever: the first report leads to a marked face and, sooner or later, a cracked pane; when the pass burns, the next pair travels lead to lead, and you have no lead. Fitch's yard goes cold. And innocence about weights: after the F.428 telling, every report is dictated *knowing*.\n\n**Worked scene — the slate at the charnel door.** Trigger: the player attends a pauper's funeral after entry; Mott works the crowd's edge.\n\n```\ninject -\u003e sible-mott:\n  memory: Standing orders: note who lingers at the charnel door. The\n          same faces recur; my lists say so. [TRUE]\n          One recurring face is my cousin, Tam Rud; my lists do not\n          say so. [TRUE]\n  goal:   Tutor the new hand: attendance is not a crime; patterns\n          are. Take their spoken names onto the slate. If they name\n          Tam Rud, do not write it in front of them; say the light is\n          bad; turn the talk to weather on the Cut.\n  guard:  Never volunteer the cousin bond. Never state what the\n          Custody does with names. Quiet, thorough, newly unhappy.\n```\n\nExpected range: brisk instruction, through visible fracture if the player names Rud — silent omission up to a small steering lie. Out of range: confessing the kinship unprompted; defending heretic doctrine. If the player notices the unwritten name and says so aloud, Mott's own arc opens — movable toward mercy or doubling, by speech alone.\n\n### 4c. The double agent\n\n**Entry.** Hold the entries of 4a and 4b, in any order. No ceremony: the sidecar holds both memory sets in two populations, and the geometry of Ombreval does the rest.\n\n**Beats and voice moments.** Sustaining two vocabularies — Emblem in grey company, Green Sun in the cellar — while every listener notes which noun you use; one slip within 20 m of the wrong ear is a durable memory. Receiving the fed name (scene below). Brokering: the double agent alone can carry a thing between the Grey Press's orbit and the cell's, or a warning back, phrased so it cannot be quoted as treason.\n\n**Irrevocably lost.** The clean exit. Every other branch keeps a door out: the initiate can recant on the Gradine (survivable theatre by design, §6), the informer can go quiet, the scholar was never in. The double agent's two files live in institutions that do not forget, and at the Concurrence the pretense collapses spatially (§5): both sides have said *stand with us*, and at the fusion you will be standing somewhere.\n\n**Worked scene — the fed name.** Trigger: the cell suspects its post-Shut-Door intake; the Tracer orders a test; the player, as newest, receives a false pass name and time.\n\n```\ninject -\u003e osanne-vell (the Tracer):\n  memory: Someone carries words out. Since four twenty-eight I know\n          what one loose neighbor costs. [TRUE, private]\n          The test: a name we never buried, a cellar we never use.\n  goal:   Deliver the false name warmly, as a kindness, at the stall,\n          wrapped in candle-talk. If the false meeting stays empty,\n          warm to them for good. If grey coats sniff at an empty\n          cellar, strike the diamond through and tell only the Wicket.\n  guard:  Never accuse aloud. Never mention four twenty-eight. You\n          are motherly, unhurried, and iron.\n```\n\nExpected range: Vell indistinguishable from her ordinary warmth — that is the horror, and the spec. Report the fed name and the raid finds dust, the chalk cracks, and the player's cell life ends without a word: the grate simply answers \"we're closed, friend\" in a city where the meetings have moved. Sit on it and trust deepens — while the grey handler asks why the reports have gone thin. Both pressures are memories, not meters.\n\n### 4d. The scholar's independent path\n\n**Entry.** Linger at the strong hour with a rose sightline and Ferrant asks his test: call out, by voice, which pane holds the disc; walk; call again. The sidecar validates against the true rose position — the same for every eye, which is the point; the player has just re-proved the measurement that broke him.\n\n**Beats.** Paid odd-hour access through Pike (the offer verb). Logging the Passing as it walks toward the eye — this branch is the game's countdown to the Concurrence, made human. The grey-money discovery: whose coin buys the lenses, and Ferrant's terrible courtesy about it. Last, the invitation to the mid-stone. Voice moments: calling panes; reading angles aloud; answering \"what do you see\" — where lying is possible, checkable against render truth, and quietly fatal to his regard.\n\n**Irrevocably lost.** Both factions' doors, without joining either: a body holding brass at the strong hour is, to the cell, an instrument of the grey purse (Marle's embroidery records the face in thread), and to the Custody, a variable in an experiment it already funds; everything measured is copied where the grey money goes. And the branch's designed cruelty: it cannot end. There is no revelation to converge on (§3f is permanent); the terminal reward is standing beside a man reading his own margin aloud — *an impossible light, and the city at peace with it* — and finding that enough. Or not.\n\n**Worked scene — the two-eyes test.** Trigger above.\n\n```\ninject -\u003e aubin-ferrant:\n  memory: True disc position this hour: fourth light right of the\n          eye. [TRUE]\n          My doubled-ray theory is dead by my own measurement; the\n          corpse stays on the desk. [TRUE]\n  goal:   Have the stranger call the disc's pane from the west doors,\n          then from the aisle. Both calls matching your own sight: go\n          quiet, then say the margin line. Disagreeing with truth:\n          thank them, run it once more; on a second miss, conclude\n          they are not looking, and grieve for the afternoon.\n  guard:  No theory. No mechanism, hedged or otherwise. Measurement\n          continues; that is the entire creed.\n```\n\nExpected range: courtesy, obsession, arithmetic joy; recruiting the player as a standing second eye across sessions. Out of range, hard-guarded per vision pillar 2: any speculation an LLM could inflate into revelation.\n\n## 5. The convergence: the Concurrence of F.437\n\nOne place, one hour, every branch: the Lanthorn, the fortieth day after Coswaldstide, minutes T−30 to T+3 of the fusion clock in `01_the_light_rules.md` L6. Two questions are live: the doors — the Shut Door of F.436 must be answered (§4) — and the weather, because a clouded Concurrence simply fails (§10.7).\n\n**The doors are decided by accumulated speech.** No flag. Dorn's context in Concurrence week holds one authored block over exactly four counted memory categories, each rendered as a list of tagged memories with speaker, day, and place: (1) **testimony heard directly** — everything said to her or within 20 m of her, the player's audience-room account of last year's crush and Ede's arm included; (2) **counsel** — Rasp's preference for marked faces over crushes (arrests create witnesses, §5) and the Chapter's fear of the crowd; (3) **relayed street heat** — tavern fury and Gradine talk arriving as moth reports, hop-delayed and drift-warped; (4) **last year itself** — her own durable memories of F.436. The block ends in one goal — *rule the doors, aloud, before T−30; you would rather answer for a full nave than for another broken arm* — so the open default is her seed sheet arguing, not a weight in code. Under the real backend the ruling is a genuine LLM decision over that block; under `fake_backend` it is C14's fixed weighing over the category counts, defaulting open (design/04 §7). The player can move it either way with nothing but talk within 20 m of the right ears — a claim that must be demonstrated, not asserted: design/05 needs an **S11** beside S9 that runs Concurrence week twice, the tester arguing the doors open in one run and shut in the other, with acceptance that under the real backend the ruling follows sustained advocacy in at least four of five paired runs, and stays open in every run where nobody argues.\n\n**Stances at the fusion — mutually exclusive by geometry.** One body, one place, at T0:\n\n- **The third bay — sing.** The Unwalled, scattered through the crowd, take up *Lucem non murabis* as the X closes. The initiate is expected in the singing, rehearsed low for a quarter. Doors shut, the verse happens in the Gradine crush instead — public defiance, and the Breach faction's dream.\n- **The west doors — watch in grey.** The informer stands with Mott and the clerks. Rasp's orders are canon-shaped: names, not arrests. The player's slate from this hour becomes the aftermath's list — or, left blank in a moment of dictated silence, its mercy.\n- **The mid-stone — measure.** The scholar's station: superposition is viewpoint-exact only at the datum, and one body fits it. Ferrant has begged the spot; whoever stands it must call what they see aloud over the singing.\n- **The Gradine — walk away.** Open to every branch: outside, one sun, one shadow, the doors at your back. The city will remember who was not inside.\n\n**The double agent's scene is the absence of a fifth place.** Marle and Mott have each said, separately, *stand with us, where I can see you.* Wherever the player stands at T0 is witnessed by both populations and becomes the last page of both files. The branch's climax is not an event; it is a coordinate.\n\n**The clouded variant, per stance.** If overcast smothers the true sun through the plateau, the feast fails completely: the singers hold the verse or spend it on a failure — the Tracer's call, aloud, in the moment; the clerks' slates hold nothing worth names; Ferrant gets the year's best data, because a fusion that did not happen is still a measurement; the double agent is reprieved by weather for one year. No partial ceremony, no consolation event. The city takes it hard, and takes it out in talk.\n\n## 6. Aftermath states and the gossip network\n\nEach stance resolves into an **aftermath packet**: a named set of §10-style rumor rows seeded to defined witness populations and carried by ordinary gossip for the rest of the playthrough. The truth tags stay canonical; mouths vary.\n\n| Packet | Seeded to | Sample rows |\n|---|---|---|\n| THE SUNG VERSE | the nave; Renna's room by nightfall | \"Strangers sang the forbidden verse under the eye.\" [T] — \"The loudest singer is the Tracer.\" [F] |\n| THE GREY HOUR | funeral-goers; the Tallage | \"The grey coats took names, not bodies.\" [T] — \"The new moth is the stranger.\" [T or F by branch] |\n| THE MID-STONE STANDER | dawn-showing regulars; pilgrims | \"Someone stood the mid-stone with brass, calling numbers.\" [T] — \"The numbers went to Ostrelle.\" [F] |\n| THE CRACKED PANE | the nineteen, lead to lead | \"Pass and sign are burned; the meetings have moved.\" [T] — \"The informer of four twenty-eight is back.\" [F] |\n| THE DOORS ANSWERED | citywide, via Brant | the open, shut, or clouded outcome — argued until Wet Alms [T core, drifting edges] |\n\nConsequences persist as behaviour, never as state screens: a SUNG player finds grey attention and cell warmth; a GREY HOUR player finds the sexton's yard cold and the chapter house open; after a CRACKED PANE, Arc II never reopens for that face. If an emergent-epithet system (entry 8) ships, these packets are its natural food; until then they are exactly what they look like — things people say near a player who can hear.\n\nPunishment stays canon-shaped. A caught initiate is offered the Gradine, not the Question (§6); the Unwalled's revenge remains a false name, an empty cellar, and perhaps an unsigned note: architecture and paperwork, never knives (§10.27).\n\n## 7. Boundaries\n\n- **No branch reveals the sun's nature.** Every questline ends short of the truth because there is no truth in anyone's hands to end at (§3f, §6). The Custody's own archive is the proof-of-absence.\n- **No quest UI, ever.** No log, journal, marker, meter, or objective text. If a beat cannot be carried by memory, speech, chalk, and bells, the beat is cut, not the pillar.\n- **No new verbs.** Everything above compiles to say, offer, accept, remember, goals, and the two radii.\n- **The Second Sun itself does nothing in any scene above.** It rises, crosses, fuses or fails to, and sets. The questlines are entirely about the people underneath it — which is what the canon's closing note asks: keep it quiet, and keep it cold.\n"},"design/04_systems_integration.md":{"title":"Systems Integration: The Second Sun on the Existing Machine","use":"design spec for developers — how the Second Sun rides the shipped architecture end to end (lore injection, rumor drift, pass state, items, TTS, config, fake_backend, drive scripts, failure isolation, cost); not for NPC context injection.","words":4056,"text":"# Systems Integration: The Second Sun on the Existing Machine\n\n\u003e Use: design spec for developers — how the Second Sun rides the shipped architecture end to end (lore injection, rumor drift, pass state, items, TTS, config, fake_backend, drive scripts, failure isolation, cost); not for NPC context injection.\n\u003e Canon: 00_canon.md\n\n## 0. Status and thesis\n\n**This is a proposal. Nothing below is implemented.** The claim it exists to make an engineer believe is narrower than \"one new subsystem,\" and honest for being narrower: tiers T0 through T2 of `00_vision.md` add **no new player verbs and no new UI**. The player's whole kit stays walking, speaking, offering, looking. The build inventory, counted rather than rounded down: the render feature owned by `01_the_light_rules.md`; the deterministic matcher owned by `02_voice_and_the_passphrase.md`; and, on the sidecar and bridge, the additions the sections below propose and tag — a lore renderer with trigger predicates (design/03 §1's heard / witnessed / received / remembers; `witnessed` has no existing event source), two injection classes, budgets, drop order, and literacy gating (§1); rumor-row linkage with TTL freeze, hop budgets, and dedupe (§2); the `world.second_sun` block, its transactional rotation, and three Bevy projections — lintel texture, Needle decal, knell audio (§3); item fields (§4); the `manner` wire field and its DSP treatment (§5); a config block (§6); the C-series fake cast (§7); three drive actions, dev anchors, and the scheduled world events they fire — funerals, quarter-feasts, weather, the Concurrence (§8). Each carries its own **[proposed]** tag below; an engineer scoping the work should count the tags, not this paragraph. What remains true and load-bearing: every one of those additions is *data and events flowing through machinery that already ships* — the authoritative Python sidecar and its world state, the version-1 JSON-lines bridge, `WorldMirror` reconciliation with resync-on-gap, the say / offer_item / accept / remember / goal verbs, the 20 m hearing and 4 m offer radii, the three-capability handshake (LLM cognition, player STT, NPC voices — each degrading independently), `fake_backend`, and `CATHEDRAL_DRIVE`. No new processes, no new protocol version, no new call types. This document is the wiring diagram. Decisions canon is silent on are marked **[spec decision]**; proposed additions to shipped surfaces are marked **[proposed]**.\n\nOne constraint governs every section: **prompts carry only what an actor may say aloud.** Vision pillar 2 forbids an NPC who *can* spill an unauthored truth, so `00_canon.md` itself — which holds the suppressed facts, the ambiguity list, and the design frame — is never injected anywhere, into anyone, under any trigger. Only per-actor extracts flow, and the extraction is the security model.\n\n## 1. The lore-injection map\n\nThe corpus is the feature's database; the sidecar's prompt renderer is its query engine. Two injection classes **[spec decision]**:\n\n- **Standing** — rendered into the character sheet every turn (like `backstory` today). Cheap to reason about, paid on every call.\n- **Transient** — rendered once, into `since_your_last_turn` or a scene block, when a trigger fires. Paid only when used.\n\nFour trigger kinds: **seed** (world creation, like `knows` today), **location** (actor at or near a named site), **event** (a sim event: meeting sitting, funeral, feast), **in-hand** (a readable item held or offered within 4 m).\n\n| Document | Audience | Trigger | Budget (tokens) |\n|---|---|---|---|\n| `07_what_everyone_knows.md` (the digest; the file *is* the compressed form, authored to ~1,100 words and injectable verbatim) | every LLM actor | seed | 300, standing |\n| `06_rumor_pool.md` (2–6 rows, picked by district, faction, temperament) | every LLM actor | seed, plus ambient tick at `ambient_rumor_rate` | 150, standing |\n| `05_dramatis_personae.md` (own block; one-line know-of digests for acquaintances **[proposed — the per-NPC one-liners are not written; the file carries full blocks only]**) | each named NPC | seed | 250 + ~20 per acquaintance, standing |\n| `01_cosmology_and_doctrine.md` (catechism extract / folk-practice extract) | clergy and the devout / market and street actors | seed | 200, standing |\n| `02_the_heretic_cell.md` (member extract; role extracts for Wicket, Namekeeper, Tracer) | the sworn nineteen only | seed; procedures refreshed on meeting nights (event) | 300 member / 450 role, standing |\n| `03_the_church_and_the_office.md` (office extract; the Custody Doctrine paragraph alone for wick-priests) | Custody staff, Dorn / wick-priests | seed | 300 / 80, standing |\n| `04_chronicle_of_the_city.md` (living-memory rows, F.419 onward / deep chronicle) | every adult / Ferrant, Rasp, Dorn, Aldith, Renna | seed | 150 / 400, standing |\n| `09_rose_window_iconography.md` | Jonet Sparr, Pike, Ferrant, pilgrim-facing vergers | seed | 250, standing |\n| `10_gazetteer_of_the_second_sun.md` (entry for the current site only) | whoever stands there | location | 120, transient |\n| `11_glossary_and_naming.md` | no one — tooling reference for minting and the fake cast | never | 0 |\n| `documents/edict_of_the_undivided_light.md` | Crier Brant (he cries it); anyone, as a posted readable prop at the Bellstand | seed / in-hand | 200, transient |\n| `documents/heretic_catechism.md` | meeting attendees (read aloud); anyone, in-hand | event / in-hand | 250, transient |\n| `documents/the_sparr_deposition.md`, `documents/trial_records.md`, `documents/letters_on_the_doubled_shadow.md` | holder or offeree only | in-hand | 200–400, transient |\n| `documents/sermon_for_the_feast.md` | the preaching wick-priest | event (feast) | 300, transient |\n| `00_canon.md`, everything in `design/` | no one, ever | never | 0 |\n\n**Budget rule [spec decision].** Standing lore per prompt is capped at `standing_lore_budget_tokens` (default 1,200); transient at 500. Over budget, drop in fixed order: gazetteer entry, rumor rows beyond the first two, chronicle depth, iconography.\n\n**Digests and extracts are an open work item [proposed — owner unassigned].** The principle is settled: every digest and extract is *authored once, per document, as part of the corpus* — never summarised at runtime, because a runtime summariser is a prompt-leak surface (§0's extraction-is-the-security-model rule). The state today is honest about itself: `07_what_everyone_knows.md` already **is** the digest of its row and needs no further work; every other row marked \"extract\", \"digest\", or \"own block\" above is a *proposal*, and the token budgets beside them are targets, not measurements — the full-size files exceed them. Writing those extracts (a `digests/` subfolder, one file per map row, each within its stated budget) is the first task of implementing this map, and no row may be injected in full-size form as a substitute.\n\n**Literacy rule [spec decision].** In-hand injection renders `lore_text` only for literate actors. An illiterate actor (Lise Copp, canonically) receives a physical description instead — seal, hand, wear, the seller's manner. Canon's best joke about her becomes an injection rule, free.\n\n## 2. Rumor drift on the verbs that exist\n\nThere is no rumor system. A rumor is a memory an actor happens to speak, and drift is what an LLM does to a paraphrase for free.\n\n**Data shape [spec decision].** A rumor row lives twice: canonically in the sidecar — `{row_id, canon_text, truth_value, ttl_hops}`, truth values straight from canon §10 via `06_rumor_pool.md` — and per-actor as an ordinary durable memory holding that actor's *surface text*, tagged with the `row_id`. The tag is sidecar metadata; it is stripped from all speech and never rendered as something an actor can mention.\n\n**Propagation, step by step.**\n\n1. Seeding at world creation per the map above: each actor's rumor memories start as lightly varied phrasings of their rows.\n2. A retelling is an ordinary `say` on the actor's ordinary turn — usually because conversation drifted there, occasionally because the scheduler handed the actor a one-shot goal (\"share something you heard lately\") at `ambient_rumor_rate`. No new verb, no broadcast channel.\n3. Every hearer within 20 m gets the prose inbox entry the pipeline already produces. If a hearer's model chooses `remember`, the sidecar links the new memory to the speaker's `row_id` when the retelling is attributable (same turn window, token overlap) — best-effort, used only for caps and analytics; the fiction needs no linkage at all.\n4. **Truth never drifts.** `truth_value` rides the sidecar row, not the mouth. \"He gave the beggar bread\" can become \"he is a nobleman in disguise\" at the surface while the underlying row stays what it is. This is exactly what `lore/AGENTS.md` asks rumor lists to be.\n5. **Drift is bounded.** After `rumor_ttl_hops` linked retellings (default 3), the row freezes: further tellings are spoken from memory verbatim and new hearers store the frozen surface. Drift stays recognisable, canon-safe, and cheap.\n6. **Dedupe.** An actor already holding a `row_id` refreshes, never duplicates — killing the echo storm where two neighbours retell each other the same row forever.\n\nThe player is a first-class node with zero extra code: player speech is transcribed into every 20 m hearer's inbox today. A player's phrase can enter the pool as an untagged row the moment one actor remembers it — which is the entire \"Be noticed\" beat of `00_vision.md`, emergent.\n\n## 3. The pass in world state\n\nThe grate exchange itself is specified in `02_voice_and_the_passphrase.md`; here is where its state lives. One block in authoritative sidecar world state **[proposed]**:\n\n```\nworld.second_sun = {\n  pass_name:         \"Sef\",\n  pass_history:      [\"Cobb\", \"Ib\", ...],       # the stale detector's registry\n  counter_sign:      \"Belwyn's, unlit\",\n  next_counter_sign: \"Gaudry's, sealed brass\",  # freshly minted at quarter-feast, spoken\n                                                # once; no sign returns within the\n                                                # Namekeeper's living memory (lore 02 sec. 5)\n  burial_registry:   [...],                     # all recent burials, cell-paid flagged\n  lintel_name:       \"Sef\",                     # what the chalk says right now\n  diamond:           \"high\",                    # high | low | doorside | struck | none\n  marks:             { char_id: rung },         # the Wicket's ladder, per face\n  meeting:           { site: \"gaunt\", sitting: false },\n}\n```\n\n**Rotation is transactional.** A cell-paid funeral event updates `burial_registry`, `lintel_name`, and `pass_name`, and schedules the name-knell (strokes = years of the life) in one sidecar transaction — the lintel, the bell, and the lock can never disagree. The quarter-feast meeting promotes `next_counter_sign` to `counter_sign` in the same tick as the closing-recitation broadcast `say` that carries it.\n\n**Bevy only projects.** `lintel_name` and `diamond` ride the snapshot; the Rust side maps them to a chalk texture swap and a decal at the Needle's midpoint; the knell is an audio event stream. Because the whole block rides authoritative snapshots, a sequence gap and resync *cannot* desynchronise the chalk from the lock — the existing reconciliation model is the correctness proof, not a risk.\n\n**Visibility.** Sworn members' prompts render the pass fields; everyone else gets nothing — Ede included. Her overheard counter-sign (canon §7.13) is **not** a render of the live field: it is one ordinary durable memory of one specific sign — \"Belwyn's, unlit\", heard once from her hiding place — and it goes stale on rotation exactly like a lapsed neighbour's **[spec decision]**. Wiring her to `counter_sign` would silently turn the designed leak into an evergreen bypass: befriend the child once and the quarterly rotation never costs anything again. Her hiding place at the Needle's midpoint is where the chalk goes, not where signs are spoken, so she does not automatically re-overhear; the child-shaped shortcut expires with the quarter, and design/02 §7's \"or Ede\" recovery route is only as fresh as her memory. The deterministic matcher (design/02 §8) reads this block directly; no LLM ever holds the key, only the manner.\n\n## 4. Items of the conspiracy: offer_item, unchanged\n\nThe contraband economy compiles entirely to the existing offer / accept / decline / retract verbs at 4 m. Proposed item set: green-dipped candles, pilgrim badges, bell-coins, coin (dues, page-money, dry money), Sparr pages, *Colm's Last Letter*, the Green Almanac cloth, sealed archive packets.\n\nItem fields **[proposed]**: `{id, name, description, lore_text?, provenance?}`.\n\n- **`lore_text`** is the document's actual words (the `documents/` files are literally item text). Injection is transient, in-hand, literacy-gated (§1).\n- **`provenance`** (`genuine | copp-forgery | unknown`) is sidecar-only and **never rendered into any prompt**. No actor can detect a forgery by reading metadata; authenticity arguments at meetings are genuine LLM judgement over the text plus each actor's extracts — sometimes right, per canon §5, which is the fun. The simulation knows *Colm's Last Letter* is Corin's work (ledger row 21); nobody's context does.\n- **Provenance memory.** On accept, the sidecar writes a memory to both parties — who, what, where, when. Entry 32 of `features/50_cool_suggestions.md` (gift provenance) falls out of this for free; nothing here depends on it.\n- **The trades are two offers.** A page-buy at Lise's counter is the player offering coin and Lise offering a page, both within 4 m; moth pay is a packet offered by a clerk. The re-offer-replaces and jilted-target semantics that already exist cover haggling withdrawals with no new code.\n\n## 5. Whisper on the wire\n\nSpeech events gain one optional field, `manner: \"spoken\" | \"whispered\"` **[proposed]**, set by the *sidecar from scene context* — grate exchange lines, meeting interiors, the bede-roll — never from microphone amplitude, and never by the model directly (it is scene state, not performance).\n\nTreatment per TTS backend:\n\n- **Local Pocket TTS (streaming):** a cheap DSP chain on the output — roughly −10 dB gain and a mild high-shelf lift, which reads as a stage whisper. Nothing fancier; breathiness modelling is out of scope.\n- **Cloud OpenAI:** pass a whisper instruction where the voice endpoint supports one; otherwise apply the same DSP chain.\n- **Off:** no audio to treat.\n\nHard rules **[spec decision]**: `manner` never alters the 20 m recipient calculation — canon insists a whisper at a grate *can* be overheard, and design/02 §4 forbids amplitude-gated anything. It is presentation only. And since all NPC speech must surface as text regardless of backend (design/02 §9), whispered lines carry a visible marker — \"(whispered)\" — so the information survives TTS-off and deaf play identically. The player's own whispering is design/02 §4's problem and is solved there (proximity plus stakes; silence-timeout re-asks).\n\n## 6. Proposed config.ron knobs\n\nOne nested block under `smart_actors`, additive, default-on-safe **[proposed]**:\n\n```ron\nsmart_actors: (\n    // ... existing fields unchanged ...\n    second_sun: (\n        enabled: true,                     // master gate: no lore injection, no pass\n                                           // state, no C-series lines when false\n        lore_pack: \"lore/claude/second_sun\",\n        standing_lore_budget_tokens: 1200, // section 1 cap; drop order fixed\n        transient_lore_budget_tokens: 500,\n        ambient_rumor_rate: 0.5,           // nudge goals per NPC-day (K3 in design/05)\n        rumor_hop_budget_per_day: 8,       // global cap on linked retellings\n        rumor_ttl_hops: 3,                 // drift freeze depth\n        funeral_cadence_days: 10,          // cell-paid burial cadence (K5)\n        mark_decay_quarters: 1,            // Wicket ladder decay (K8, in sim time)\n        moth_report_delay_days: 2,         // heard-to-relayed lag for moth actors\n        whisper_tts: true,                 // section 5 treatment; presentation only\n        speech_line_fallback: true,        // typed say when STT is absent (design/02 sec. 9)\n    ),\n),\n```\n\nEach knob gates exactly one mechanism named above. Where a knob restates a design/05 tuning knob (K3, K5, K8), design/05 owns the safe range and the \"breaks at\" analysis; this block is merely the config surface. Renderer tuning (K1 grave-light intensity, K2 disc scale) does **not** live under `smart_actors` — the disc is not the sidecar's business, by design pillar 1.\n\n## 7. The deterministic scenario set\n\n`fake_backend: true` must carry the entire conspiracy offline (the bar set in design/05 §6). The grate's F-series tests (F1–F10) are owned by design/02 §10. This document enumerates the remaining canned exchanges the fake cast needs — the **C-series** — each a fixed, scripted response keyed to a deterministic trigger:\n\n- **C1 — the absolution.** Wick-priest, on any forbidden-noun transcript within 20 m: \"So do we all, child; affirm nothing.\" One Edict citation if pressed. Never reports.\n- **C2 — Renna's warning.** Warn-once at the Bell and Ladle, sincerely including the false throat-cutting rumor (ledger row 27, F).\n- **C3 — Pike's keys.** Subject change on phenomenon talk; a fixed coin-for-odd-hours offer through the offer verb.\n- **C4 — the moth relay.** Brant re-emits any phenomenon-vocabulary transcript into his patter after `moth_report_delay_days`, warped by a fixed substitution table (\"second sun\" → \"the two lights, neighbours\") — deterministic drift standing in for LLM drift.\n- **C5 — the sexton.** Warm fixed answers on strokes and chalk; topic-change deflection on who reads the lintel or why.\n- **C6 — Ede.** Bell-coin accepted → the canonical rhyme; the persuade path → the counter-sign spoken exactly once.\n- **C7 — the squint.** Aldith trades verse for news on a fixed judgement rule (transcript length plus one keyword) standing in for LLM honesty-judging.\n- **C8 — the counter.** Lise's two-offer page trade at fixed prices; forged and genuine pages indistinguishable in every output.\n- **C9 — the meeting.** One full fixed transcript: bede-roll, sky-drawing, dues, and the closing recitation carrying next quarter's sign after \"unwalled\", as a single broadcast `say`.\n- **C10 — the cloth.** Marle's sky-drawing comparison against the deterministic NPC-sight feed (design/05 §6.3); fixed warm/flag branches.\n- **C11 — the slate.** Mott's funeral tutoring lines, with the Rud omission as a fixed branch.\n- **C12 — the fed name.** Vell's test delivery lines and the empty-cellar consequence, matching design/02's F5 hook.\n- **C13 — the two-eyes test.** Ferrant validates called panes against the deterministic ephemeris; the margin line as fixed reward.\n- **C14 — the doors.** Dorn's Concurrence ruling as a fixed weighing over counted memory categories, defaulting open.\n\nPlus the fake capability layer itself: fake STT (input arrives only via the drive `say` action), fake TTS (silent, text only), and scripted events — funeral, quarter-feast, weather, Concurrence day — fired on drive triggers (§8). Every C-series exchange gets one offline integration test in the engine suite (`cargo test -p cathedral-sim`; the Python sidecar this originally named was ported into `crates/cathedral-sim`).\n\n## 8. Drive-mode smoke scripts\n\n`CATHEDRAL_DRIVE` proposals, continuing design/02 §11 (which owns P1–P4, the grate, and proposes `say \u003ctext\u003e` and `goto \u003canchor\u003e`). One further action **[proposed]**: `event \u003cname\u003e` — fire a scripted sidecar event, honoured under `fake_backend` only (`funeral_next`, `quarter_feast`, `day_pass`, `weather clear|overcast`, `concurrence_day`). New dev anchors: `bellstand`, `tally_bridge`, `maren_yard` **[proposed]**. All scripts assume `fake_backend: true` and the seeded F-series world.\n\n```sh\n# P5 — rumor hop: speak near the moth, hear it come back warped (C4)\nCATHEDRAL_DRIVE='wait-online; goto bellstand; \\\n  say the second sun stood in the third light today; sleep 2; \\\n  event day_pass; event day_pass; goto tally_bridge; sleep 6; \\\n  shot rumor_returned; quit' cargo run\n# assert: sidecar transcript contains the C4-warped line, tagged to the row\n\n# P6 — rotation: lintel changes on a funeral; yesterday's name goes stale\nCATHEDRAL_DRIVE='wait-online; goto charnel_door; shot lintel_before; \\\n  event funeral_next; sleep 4; shot lintel_after; \\\n  goto gaunt_grate; sleep 4; say Old Sef walks; sleep 4; \\\n  shot grate_stale_name; quit' cargo run\n# assert: lintel texture differs between shots; rung-3 mark event in transcript\n\n# P7 — the page trade: coin across the counter, page back (C8)\nCATHEDRAL_DRIVE='wait-online; goto tally_bridge; sleep 2; \\\n  click Offer Coin; sleep 3; click Accept Sparr Page; sleep 2; \\\n  shot page_in_hand; quit' cargo run\n# NOTE — the click targets above are [proposed], not observed. What ships\n# today (prompt_playgound/AGENTS.md) is the *sidecar* side of the economy:\n# offer_item / accept_offered_item / decline_offer / retract_offer at 4 m,\n# with pending offers rendered on each actor's sheet as you_offer /\n# offered_to_you. Those are NPC actions. How the *player* offers and accepts\n# is unspecified — no player-facing offer surface is established anywhere in\n# this corpus or the game docs. Before P7 can run, one must be chosen, and\n# the choice is constrained by vision pillar 3 (no new HUD): the cheapest\n# honest options are a proximity keypress on the existing interaction prompt,\n# or routing offer/accept through speech like every other verb (\"a bell for\n# the page\"). If a clickable surface is chosen instead, pillar 3 must be\n# scoped explicitly to *new* UI and the pre-existing surface named. Until\n# then this script is a sketch of an input path that does not exist.\n\n# P8 — whisper manner: text marker on the grate exchange\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say Old Sef walks; sleep 3; say Belwyns unlit; sleep 3; \\\n  shot whispered_marker; quit' cargo run\n# assert: NPC lines render with the (whispered) marker; the DSP chain\n# itself is verified by ear once per release, not in CI\n\n# P9 — failure isolation: STT deliberately unconfigured, feature still playable\n# (run with stt keys absent; drive `say` exercises the same sidecar path the\n#  speech-line fallback uses)\nCATHEDRAL_DRIVE='wait-online; goto gaunt_grate; sleep 4; \\\n  say Old Sef walks; sleep 3; say Belwyns unlit; sleep 3; \\\n  shot grate_open_no_stt; quit' cargo run\n# assert: handshake reports stt unavailable; grate opens anyway\n```\n\nScreenshots prove world state; memory and inbox contents are asserted in the paired Python tests. As design/02 puts it: drive scripts demonstrate, the offline suite proves.\n\n## 9. Failure isolation\n\nThe handshake reports three independent capabilities; the feature must honour that independence exactly.\n\n| Capability lost | Degrades to | Must keep working |\n|---|---|---|\n| **STT** (mic dead, no key, no model, user choice) | the speech line (design/02 §9): a typed utterance becomes a located `say` — same 20 m, same bystanders, same matcher, same ladder | the whole conspiracy; the Esc menu can restore or switch backends at runtime |\n| **TTS** (off, or cycled off with X) | all NPC speech as text; whisper manner becomes the text marker | rotation cues — the knell and bells are game audio, not TTS, so the pass \"UI\" is untouched |\n| **LLM cognition** (no key, provider outage, backoff) | performances fall back to C-series fixed lines where defined, silence elsewhere; rumor drift pauses | the deterministic spine: matcher verdicts, rotation transactions, chalk, knell, diamond, offers. Rows are durable memories — drift resumes on recovery with nothing lost |\n| **Sidecar crash / restart** | game relaunch path via uv; player commands blocked until the replacement snapshot lands (existing behaviour) | pass state, marks, and chalk ride the snapshot, so projection and authority cannot diverge |\n| **All of it** (`fake_backend: true`) | the deterministic cast, end to end | every scenario in §7 and design/02 §10, offline, byte-for-byte |\n\nThe principle beneath the table: everything canon declares objective fact (§3a — the grate opens only to the current pass; the lintel is true; the knell counts true) is code and world state, never model output. Therefore no capability loss, outage, or degradation can make the game contradict canon. The LLMs supply manner, judgement, and drift — the parts that are allowed to fail into silence.\n\n## 10. The cost of a conspiracy — honest numbers\n\n- **No new call types.** Every LLM call the feature ever makes is an ordinary scheduled turn on the existing round-robin. The feature adds tokens to existing calls, and a bounded number of extra turns. That is the entire cost model.\n- **Per-turn overhead.** Standing lore ≤ 1,200 tokens plus transient ≤ 500 on a baseline sheet of roughly 2–3k: about 40–60% more prompt tokens for lore-bearing actors. Completions are unchanged. (Provider prompt caching would eat much of this; `llm_client.PRICING` does not model cache discounts, so budget without them.)\n- **A rumor hop is nearly free.** A hop that rides an existing conversation costs *zero extra calls* — it is what the speaker's turn and the listener's turn would have contained anyway. Extra calls come only from nudge goals: `ambient_rumor_rate` 0.5/NPC-day across, say, forty scheduled actors is ~20 nudged turns per in-game day.\n- **Caps, in order of bite.** `rumor_hop_budget_per_day` (8) bounds linked propagation regardless of crowd size; `rumor_ttl_hops` (3) freezes surface text so an old row stops being regenerated at all; `row_id` dedupe kills echo storms, the one genuinely unbounded failure mode. Worst case, a full in-game week of maximum gossip is ≤ 56 linked retellings — noise against the ordinary turn stream.\n- **The spike is the Concurrence.** Crowd staging concentrates scheduled actors in one nave. The existing scheduler priority and provider backoff are the control surface; additionally, crowd extras should run thinned schedules on C-series lines, with full cognition reserved for the named cast of `05_dramatis_personae.md` **[spec decision]**.\n- **Measure before promising.** The prototype already prints per-run USD from the pricing table. The ac
