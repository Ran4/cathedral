 in the closing section.","words":4450,"text":"# The Rumor Pool of Ombreval\n\n\u003e Use: inject into sidecar NPC context — the master list for the gossip network; sample per district and per NPC stance as directed in the closing section.\n\u003e Canon: 00_canon.md\n\nForty-eight rumors current in F.437. Per entry: the rumor as a citizen speaks it (TTS-ready, years spoken as words); truth value per the ledger of 00_canon.md section 10; origin (per 05_dramatis_personae.md where possible); carriers; danger near the wrong hearer; drift — mutations at increasing hops, so a far-off NPC holds a drifted form, not the root. Under the Edict of F.244, \"sun,\" \"second sun,\" and \"green sun\" are themselves citable within a cleric's or grey coat's twenty-meter hearing: half the danger here is vocabulary.\n\n---\n\n## I. The Light Itself\n\n**R-001** — \"There's a second sun in the rose, neighbor — green as river ice. Stand inside at dawn; it isn't there from the street.\"\nTRUE · origin: the dawn crowd, older than anyone · carriers: everyone · danger: the word \"sun\" near clergy or grey coats is citable.\nDrift: \"it only shows to Ombreval-born\" → \"there's a second sky behind the rose.\"\n\n**R-002** — \"Through a red pane the clouds go red but the disc stays green. Every light in the world obeys the glass but that one.\"\nTRUE · origin: an old vergers' demonstration line · carriers: pilgrims, vergers, market folk · danger: mild; a moth notes who shows it to strangers.\nDrift: \"a red pane cracked when it passed\" → \"the glaziers can't fire true red anymore.\"\n\n**R-003** — \"You can stare straight into it and it doesn't hurt. Try that with the honest one.\"\nTRUE · origin: dawn-crowd commonplace · carriers: pilgrims, children · danger: \"the honest one\" implies two suns; citable if a grey coat is peevish.\nDrift: \"stare too long and the true sun goes dim for you\" → \"it blinds the wicked and spares the good.\"\n\n**R-004** — \"At the crossing you cast two shadows, and the cold one points wrong. And wax won't soften in the green beam — ask any chandler.\"\nTRUE · origin: chandlers' shop-talk; Osanne Vell says the wax line herself, deliberately mundane · carriers: tradesfolk, mothers · danger: testing your grave-shadow in the nave puts your face in a grey notebook.\nDrift: \"a man's grave-shadow stayed after he left\" → \"the vergers mop the shadows out at dusk.\"\n\n**R-005** — \"It walks against the sun, one east, one west, and once a day they pass in the window. Folk call it the Kiss.\"\nTRUE · origin: generations of dawn-watchers · carriers: everyone; Crier Jos Brant calls the hour of it · danger: \"the Kiss\" is tolerated; \"the two suns pass\" is citable.\nDrift: \"a wish spoken at the Kiss lands within the year\" → \"when the two wed, the world ends.\"\n\n**R-006** — \"The doctor measured it. It stands in the same pane for every eye in the nave at once, which nothing in nature can do.\"\nTRUE · origin: Doctor Aubin Ferrant, to anyone who asks · carriers: scholars, clerks, slowly the taverns · danger: adding \"so it's in the glass\" starts a masons' quarrel.\nDrift: \"the doctor proved it's inside the glass\" → \"the doctor was paid to prove nothing.\"\n\n**R-007** — \"In the great storm of three eighty-three, lightning went white in every light of the rose save where the disc stood. Sworn to the Chapter, by the light that does not lie.\"\nTRUE · origin: the Long Book · carriers: old men, ringers, storm-watchers · danger: none as history; embroidery is where trouble starts.\nDrift: \"the disc drank the lightning\" → \"storms come to Ombreval because of it.\"\n\n**R-008** — \"There's boatmen swear that in a night storm they've seen it standing in the open sky, in the wrong place, for the length of a flash.\"\nAMBIGUOUS-BY-DESIGN · origin: boat-folk working the Serle beyond the south wall; no two accounts agree · carriers: boatmen, drinkers · danger: an open-sky claim contradicts doctrine wholesale; the Unwalled listen hungrily.\nDrift: \"it stood over where the martyr drowned\" → \"it comes out at night to look for Colm.\"\n\n**R-009** — \"When a pane's out, the hole shows plain sky. It doesn't come through the gap. Every man who's seen that goes quiet after.\"\nTRUE · origin: Fabric workmen; Verger Dunstan Pike confirms with a shrug · carriers: workmen, vergers; rarely said twice · danger: it embarrasses heretic and official doctrine alike; both prefer it unheard.\nDrift: \"the hole shows a different sky\" → \"the gap is how it breathes.\"\n\n**R-010** — \"My mother saw a beam of the rose land in a courtyard three streets away — colored light on the cobbles and no window near.\"\nAMBIGUOUS-BY-DESIGN · origin: Renna Tapster, of her mother · carriers: her regulars; mothers · danger: outside-beam claims are filed as not demonstrated; the claimant gets a courteous grey visit.\nDrift: \"beams walk the city on feast nights\" → \"the light is looking for a way out.\"\n\n---\n\n## II. The Doors, and This Year's Concurrence\n\n**R-011** — \"They'll bar the doors again this year, mark me. The Chapter never unlearns a thing it learned in fear.\"\nOPEN (a live question — resolves through play when the Chapter decides, never through gossip) · origin: Tam Rud and the angry intake · carriers: taverns; the Bell and Ladle holds wagers · danger: safe as opinion; \"we'll open them ourselves\" is the sentence that hangs.\nDrift: \"the doors are already ordered barred\" → \"they mean to bar the city gates too.\"\n\n**R-012** — \"A child's arm broke in the crush at the Shut Door, and none of the Chapter has once said the child's name.\"\nTRUE · origin: the Gradine crowd; the child is Ede of the Needle, which few connect · carriers: everyone · danger: much to answer if a grey coat asks how you know the crowd's mood.\nDrift: \"the child died\" → \"three children, buried quiet.\"\n\n**R-013** — \"If the feast day clouds over, the shadows don't fuse and the whole feast fails. Remember three forty-seven.\"\nTRUE (the folk gloss \"unblessed year\" is forbidden, and said anyway) · origin: folk memory of F.347 · carriers: grandmothers, ringers · danger: priests correct \"unblessed\" wearily rather than report it.\nDrift: \"a clouded feast means a death in the Chapter\" → \"the clouds are sent when the city sins.\"\n\n**R-014** — \"The year the bells rang the feast on the wrong noon, the mending of the almanac came from the Greensick's own figures. Their sums beat the Church's.\"\nTRUE · origin: leaked from a heretic weigher's cup · carriers: drinkers, gossiping clerks · danger: marks you heretic-adjacent in a grey ledger.\nDrift: \"the Chapter buys its almanac from the heretics\" → \"the heretics can call the light to a day of their choosing.\"\n\n**R-015** — \"They say the Greensick mean to sing their song in the nave itself at the Passing this year, doors or no doors.\"\nTRUE (the plan exists within the cell) · origin: the angry intake, too warm in taverns · carriers: drinkers; a moth has likely carried it · danger: gravest in the pool — it points the Custody at the feast; a sworn hearer marks your face.\nDrift: \"they mean to break the doors\" → \"they mean to break the rose.\"\n\n---\n\n## III. The Candor and the Grey Coats\n\n**R-016** — \"It's no sun at all, friend. It's the Emblem — a granted image, a painting of the Light on the eye of the Church.\"\nAMBIGUOUS-BY-DESIGN · origin: the Edict of F.244; every pulpit since · carriers: clergy, the pious, anyone in grey hearing · danger: none — the one safe sentence; note who says it too quickly.\nDrift: \"the Emblem watches back\" → \"the Custody paints it fresh each year.\"\n\n**R-017** — \"Confess you saw it and you're shriven free, no penance. So do we all, child, affirm nothing. Costs less than a candle.\"\nTRUE · origin: every parish confessional · carriers: everyone; taught with the catechism · danger: none; that is the design.\nDrift: \"the priests see it too — they admit it\" → \"seeing it is required now.\"\n\n**R-018** — \"The Church tested the thing long ago, behind doors, and sealed what it found. That's what the grey office keeps. The answer.\"\nTRUE (that it tested and sealed; but the seal holds no answer, only what it is not — the \"answer\" clause is false, and the Custody knows it) · origin: tavern deduction from the trial of two eighty-eight · carriers: masons, drinkers, clerks · danger: speculating on the Grey Press draws the attention it speculates about.\nDrift: \"the verdict says the glaziers did it\" → \"there is no verdict — the seal is on an empty box.\"\n\n**R-019** — \"Every new Praelucent is taken alone to the crossing and made to look. And made to sign what they saw.\"\nTRUE · origin: unknown; leaked as shape without substance · carriers: almost none — a senior clerk, Ferrant privately, one Keyhole neighbor · danger: Custody-secret; the wrong hearer will want your whole acquaintance.\nDrift: \"they sign in their own blood\" → \"one Praelucent refused, and vanished.\"\n\n**R-020** — \"That two-year repair on the rose — they swapped panes behind the canvas and nothing changed. Ask a man who stood that scaffold. He won't answer, and that's your answer.\"\nTRUE · origin: scaffold workmen's silences since F.421 · carriers: Fabric workmen, their wives, Coswald's Yard · danger: naming a workman puts his silence-oath, and him, in question.\nDrift: \"the rose up there is a copy\" → \"the true rose is in the chapter-house cellar.\"\n\n**R-021** — \"Here's the one they'd mortar a street over: new plain glass, leaded into the rose, shows it same as the old. Proven at the trial. Proven again under the canvas.\"\nTRUE (nearly extinct as speech) · origin: at most three mouths could start it; Pike, drunk, has come within a word of it twice · carriers: effectively none · danger: sharpest in the pool; traced to its mouth within a week, and the mouth is under oath.\nDrift: \"new glass goes green in that window\" → \"old glass remembers\" (becoming the heretics' error, and no longer true).\n\n**R-022** — \"Grey coats stand at the back of every pauper's burying now, counting faces at the charnel door.\"\nTRUE · origin: Wyn Alder noticed; Sexton Noll Fitch confirmed by saying nothing, pointedly · carriers: boat-folk, mourners, the poor · danger: said at the funeral itself, it files your face with the rest.\nDrift: \"they write down the mourners' names\" → \"the Custody digs them up after.\"\n\n**R-023** — \"The grey office thinks the paupers' funerals are a door of some kind. They haven't found the lock it fits.\"\nTRUE · origin: half deduction from Fitch's silences, half a grey clerk's own unhappiness · carriers: the careful few of Saint Maren's parish · danger: the sworn hear the beginning of the end, the Custody its own file read back; both trace it.\nDrift: \"the knell is a signal\" (walking straight at the rule) → \"the sexton is the heretics' bellman.\"\n\n**R-024** — \"The pawnshop at the Tally Bridge washes the grey office's money. And sells old pages to the other lot across the same counter.\"\nTRUE · origin: Tallage porters; Cobb the porter says it plainest · carriers: Tallage folk, boatmen · danger: Lise Copp forgets nothing; both institutions need the shop, so the speaker alone has no protector.\nDrift: \"Lise Copp is the Custody's officer\" → \"Lise Copp is the Tracer\" (wrong, and lethal to stand near).\n\n**R-025** — \"Somebody at the Bellstand sells talk to the grey coats. Has for years. Mind what you say in the crier's square.\"\nTRUE (it is Brant, who does not know it) · origin: the cell's cold arithmetic after F.428 · carriers: careful tradesfolk, sworn neighbors, Renna · danger: naming a name starts a fire; the wrong name ruins an innocent, the right one everything.\nDrift: \"it's the crier himself\" (true, and laughed off) → \"it's whoever asks what you heard.\"\n\n---\n\n## IV. The Greensick\n\n**R-026** — \"Cross the Greensick and they'll cut your throat in a covered passage. They've done it before.\"\nFALSE-BUT-BELIEVED · origin: Renna Tapster, warning young fools sincerely · carriers: taverners, mothers, watchmen · danger: none to the speaker; it is the cell's best armor, and false.\nDrift: \"they cart the bodies through the river gate\" → \"they drowned Colm themselves, to make a martyr.\"\n\n**R-027** — \"Whisper wrong at their door twice and it's worse than knives. A note goes to the grey coats with your name on it. Unsigned.\"\nAMBIGUOUS-BY-DESIGN (the cell neither confirms nor forbids) · origin: unknown; possibly the cell, as deterrent · carriers: the fearful and the knowing · danger: knowing this much about their doors is itself a question — who told you?\nDrift: \"the Custody and the Greensick trade names like fish\" → \"the doorkeeper sells faces at the bridge\" (near enough Grigor Ashe's ledger to sweat him).\n\n**R-028** — \"There was a green sun in the open sky once, over everyone's grandmothers, and the Lanthorn was built course by course to wall it out.\"\nFALSE-BUT-BELIEVED · origin: Colm Attergate, the Bellstand, F.301; the Unwalled since · carriers: sworn neighbors carefully, the sympathetic poor · danger: the Attergate error entire; said plainly, a door-grade offense.\nDrift: \"the old folk remember it\" (none ever did) → \"the Church stole the warm sun and left us the cold one.\"\n\n**R-029** — \"Old glass remembers the sky it cooled under. That's why the rose shows what the sky's forgotten.\"\nFALSE-BUT-BELIEVED · origin: Unwalled doctrine, generations old · carriers: neighbors, romantics, one glazier's apprentice · danger: heresy dressed as shop-lore; customers ask glaziers to \"wake\" old panes.\nDrift: \"a bottle from Colm's day shows a green spark at dawn\" → \"the Sparrs fire memory into glass to this day\" (see R-035).\n\n**R-030** — \"Colm Attergate drowned at the Serle sluice, coming home by night against his banishment, when the Cut still ran. The dry gate keeps the place, and the Alders know the arch.\"\nTRUE · origin: the Long Book and boat-folk memory; an Alder hooked him out · carriers: boatmen, pilgrims shown an arch close enough for a penny, the cell like scripture · danger: reverence dressed in awe is citable Attergate talk.\nDrift: \"he preached from the water as he went down\" → \"he never drowned — he walled himself into the tower he built.\"\n\n**R-031** — \"The Greensick keep his last letter, in his own hand, wet from the night he drowned.\"\nFALSE-BUT-BELIEVED (Corin Copp's forgery; the cell holds it genuine) · origin: within the cell, reverently; leaked as legend · carriers: neighbors as fact, the street as story · danger: claiming to have seen it interests the Custody and the cell both.\nDrift: \"it names the informant of twenty-eight\" (it does not; the weighers dread this drift) → \"whoever reads it aloud goes mad.\"\n\n**R-032** — \"The whisperers of twenty-eight were sold from inside. The informant was never found. Never will be, now.\"\nTRUE · origin: the surviving cell, bleeding · carriers: everyone who remembers F.428; every sworn neighbor, nightly · danger: guessing names near a sworn neighbor is the fastest way in Ombreval to be fed a false meeting.\nDrift: \"it was the fuller himself, and the damp his payment\" → \"it was one of the two who recanted\" (Betriss Marle bears this in silence).\n\n**R-033** — \"The Greensick pass is a verse of the forbidden song. Sing the right line at the right door and it opens.\"\nFALSE-BUT-BELIEVED (the true rule is the buried name; the cell feeds the error) · origin: honest confusion of verse with pass · carriers: drinkers, children daring each other at cellar doors · danger: singing Lucem non murabis at any door is heresy at song-volume.\nDrift: \"hum it and they find you\" → \"the little one at the Needle knows the line\" (see R-046).\n\n**R-034** — \"Chalk marks come and go at the midpoint of the Needle. Thieves' signs, marking whose house is ripe.\"\nFALSE-BUT-BELIEVED (the marks are real — the cell's convening signs; the reading is wrong) · origin: a watchman's guess; never corrected · carriers: householders, watchmen · danger: standing to study the chalk puts you in Ede's sight, and in anyone's.\nDrift: \"it's a mason's diamond — lodge business\" (wrong trade, a whisker from true) → \"rub one out and your name goes up on one.\"\n\n---\n\n## V. Glass Against Stone\n\n**R-035** — \"It's in the glass, neighbor. Glazier sorcery, fired into the rose by the Sparr line, and the court knew it and sold the verdict.\"\nFALSE-BUT-BELIEVED · origin: the masons' lodge since F.288; Warden Hamel Stott keeps it in repair · carriers: masons, half of Coswald's Yard · danger: in Cinder Row it starts a fight; near a grey coat it reopens a sealed case.\nDrift: \"melt the rose and the thing dies\" → \"the peace fine was blood-money for the three journeymen.\"\n\n**R-036** — \"When the last panel was set, Master Idonea looked back through her own window and wept, and said she'd made two of something there was one of. Never fired glass again.\"\nTRUE · origin: witnesses at the crossing, F.203; the Long Book · carriers: glaziers with pride and unease, pilgrim guides, the cell as scripture misread · danger: adding \"she knew what she'd done\" makes it an accusation with a guild attached.\nDrift: \"she cursed the window as she wept\" → \"she's buried facing away from the Lanthorn\" (she is not).\n\n**R-037** — \"Three journeymen were broken at the Question in two eighty-eight, for a crime the court's own test disproved. And the verdict was never read — not to the lodge, not to the guild.\"\nTRUE · origin: the glaziers' guild, which has never let it rest · carriers: Cinder Row; Mistress Jonet Sparr in two flat sentences · danger: reciting it at Coswaldstide starts the annual brawl.\nDrift: \"one of the three was a Sparr\" → \"the masons paid the court\" (they paid nothing and got nothing — the true grievance).\n\n**R-038** — \"The Sparrs keep a sorcery-book of the old master's under the workshop floor, and show no one.\"\nFALSE-BUT-BELIEVED (one page exists, in Idonea's hand, shown to no one; not a book, not sorcery) · origin: the lodge, embroidering · carriers: masons, envious tradesfolk · danger: it has sent thieves over Cinder Row walls twice; Jonet Sparr keeps dogs now.\nDrift: \"the Custody offered gold and was refused\" → \"its last page is the missing page of the deposition.\"\n\n**R-039** — \"The masons' own charter binds the lodge to close the light above. Read it how you like. They swore it before the rose was ever fired.\"\nAMBIGUOUS-BY-DESIGN (the clause exists; roofing boilerplate, probably) · origin: a lodge clerk's loose cup at a Coswaldstide, years back; Stott has never denied it · carriers: glaziers gleefully, drinkers · danger: quoting a guild's charter at its warden is a short conversation.\nDrift: \"Coswald himself signed it\" → \"no mason will look at the rose\" (they look).\n\n---\n\n## VI. The Dead, the Beam, and the Spared\n\n**R-040** — \"Speak your dead's name in the green beam and they hear you. It's a long way up, but the light knows the road.\"\nAMBIGUOUS-BY-DESIGN · origin: old as the pilgrim trade; Crier Jos Brant its loudest friend · carriers: Brant, the Alders every Bellday, mourners, half the city · danger: none; a priest murmurs \"affirm nothing\" and lets it pass.\nDrift: \"the dead answer, if you bring their favorite thing\" → \"the beam is the dead looking back.\"\n\n**R-041** — \"Hold a newborn in the doubled light and the child has a spare shadow to spend. And a fever carried into the green beam cools.\"\nAMBIGUOUS-BY-DESIGN (the beam is truly cold, which proves nothing) · origin: mothers; Mother Gude sells the herbs they clutch on the way · carriers: mothers, herb-wives, Brant · danger: none — unless the fever wins, and grief goes looking for someone to cite.\nDrift: \"a child twinned in the light never drowns\" → \"spend the spare shadow and you limp after.\"\n\n**R-042** — \"Mother Gude looked once, at the strong hour, and saw one sun. One. Whatever's in that window, it isn't in it for her.\"\nAMBIGUOUS-BY-DESIGN (whether the Spared cannot see, or lie, is never resolved) · origin: Mother Gude herself, wearily · carriers: market women, pilgrims, all three factions — each wanting her claim · danger: calling her liar at Maren's Green costs your custom; calling her blessed near the Custody invites unanswerable questions.\nDrift: \"the Spared are marked on the palm\" → \"the Spared walk through its beams unshadowed\" (children test this on her; she lets them).\n\n**R-043** — \"The anchoress in the Ilvane wall keeps the glazier's last words behind her teeth. Taught mouth to mouth down the line since the year the master died.\"\nAMBIGUOUS-BY-DESIGN (not even Dame Aldith knows what she carries) · origin: Keyhole whispers; Idonea dead and the anchorhold filled, both in two eleven · carriers: pilgrims, the cell (forbidden to knock, so they talk), children trading news for verses · danger: pressing the squint is watched; the Custody minds who leans on it.\nDrift: \"the words are the missing page\" → \"whoever hears them sees what Idonea saw.\"\n\n---\n\n## VII. City Noise — the Camouflage\n\n*Rumors with no bearing on the Second Sun, load-bearing precisely because of it: a gossip network that talks only of green suns is a searchlight.*\n\n**R-044** — \"Folk won't wed under the Orphan. Her leaf burned in the sacristy fire, and no man living remembers her baptism.\"\nTRUE (the burned register; the scruple is custom) · origin: ringers, since F.341 · carriers: everyone · danger: none; the city's safest superstition.\nDrift: \"the Orphan rings by herself on the eve of a death\" → \"her true name is written in the Grey Press.\"\n\n**R-045** — \"The Needle's a shoulder wide because two burned-out neighbors each rebuilt a half-step forward, and now neither can sell nor yield.\"\nTRUE · origin: the Long Book, F.371; the lane itself · carriers: everyone; the city's favorite parable · danger: none — which is why the Needle is good ground for chalk; nobody watches a proverb.\nDrift: \"the two owners were brothers\" → \"past the Needle means past saving because a man died wedged there.\"\n\n**R-046** — \"Penny for the little one at the Needle. Ede hears everything in that lane, and what she hears, she keeps.\"\nTRUE (more than the speaker knows: she holds the current counter-sign, told to no one) · origin: Renna Tapster, half warning, half fond · carriers: Bellstand regulars · danger: it puts eyes on a child; cell and Custody alike are one sentence from wondering what she has heard.\nDrift: \"the orphan girl runs for the Greensick\" (she belongs to no one) → \"she has the pass\" (she has the counter-sign; nearly, damnably right).\n\n**R-047** — \"The doctor's been at it thirty years, and all he'll say is: it moves against the sun, it stands in one pane for every eye, and he has no theory. An impossible light, and the city at peace with it. Except him.\"\nTRUE · origin: Ferrant, in his own words; the phrase escapes him into the street, garbled · carriers: patients, clerks, tavern wits — the fastest-drifting entry in the pool · danger: none; the Custody finds him useful.\nDrift: \"the impossible light — that's what the doctor calls the city\" → \"the doctor proved it impossible, so it isn't there\" (Renna's favorite, for the laugh).\n\n**R-048** — \"A leaf of old writing fetches more at the Tally Bridge than a silver spoon, which is against nature. And somewhere out there is the page that names what Idonea saw.\"\nAMBIGUOUS-BY-DESIGN (as to the page; the prices are TRUE) · origin: Corin Copp feeds it, for trade reasons · carriers: pawn-side Tallage, scriveners, hopeful thieves · danger: shopping a Sparr page attracts three buyers, and two of them are the Custody.\nDrift: \"the page is behind the anchoress's wall\" → \"there are twelve last pages sold and counting\" (Corin's quiet joke about his own trade).\n\n---\n\n## Sampling Notes for the Sidecar\n\n**Per district.** Weight by where the NPC stands or trades. *Lanthorn and Gradine:* I, II, VI heavy; R-016/R-017 from any cleric; never IV from clergy except R-026 as warning. *Wickmarket:* I and VI, plus R-004. *Coswald's Yard:* V heavy — R-035 and R-037 are identity; II at brawl pitch near Coswaldstide. *Cinder Row:* R-002/R-036/R-037 with pride, R-029/R-038 with fury. *Tallage and Tally Bridge:* III heavy — R-024, R-048 — plus VII; Lise Copp repeats nothing. *Maren's Green and the dry Cut:* R-008, R-022, R-030, R-040, R-042, boat-folk versions throughout. *Bellstand and the Bell and Ladle:* everything, one hop noisier — the tavern is the pool's mixing vessel; Renna carries R-010, R-026, R-046; Brant carries R-005 and R-040, and unknowingly reports what he hears.\n\n**Per stance.** *Clergy:* only R-016/R-017 plus II as worry, and R-026 as a warning; correct forbidden vocabulary in others. *Grey clerks:* repeat nothing, recognize everything; a citizen voicing R-015, R-019, R-021, R-023, or R-028 within twenty meters is remembered and reported. *Sworn Unwalled:* hold R-028 through R-032 as faith, deny them to strangers; go quiet or hostile at R-015, R-023, R-027, or name-guessing on R-032. *Masons:* R-035 sincere; *glaziers:* R-036/R-037 sincere; each calls the other's rumor slander. *Folk believers:* VI entire, plus R-001 through R-005 with wonder. *Children:* R-003, R-030, R-041, R-045, and the Colm rhyme; children speak freely — nobody cites a child, and everyone forgets they are inside the twenty meters.\n\n**Mechanics.** (1) Truth values bind the simulation, not the speaker: every carrier speaks sincerely, including FALSE-BUT-BELIEVED. (2) Never resolve AMBIGUOUS-BY-DESIGN entries — no NPC, however senior, may confirm or deny R-008, R-010, R-016, R-027, R-039, R-040 through R-043, or R-048. R-011 is OPEN, not ambiguous: no NPC may confirm or deny it before the Chapter's decision event fires; once it fires, the doors question resolves like any other fact. (3) Pick the drift hop by social distance from the origin: the origin's district speaks the root; adjacent districts hop one; two or more districts away hops two. (4) R-019 and R-021 are LOCKED: never sample by default; only a designer trigger (Pike drunk and pressed, a stolen Attestation leaf in play) may voice them. (5) Danger runs through the live microphone: anything the player repeats within twenty meters of the wrong hearer takes the consequence in that entry's danger field, and moths pass along what they hear whether they understand it or not.\n"},"07_what_everyone_knows.md":{"title":"What Everyone in Ombreval Knows","use":"inject verbatim into any citizen NPC's context — the city's common knowledge; every line is safe in the mouth of a random fishwife. Deeper knowledge belongs only to the NPCs canon names; do not inject this file *instead of* a named actor's own blocks.","words":1328,"text":"# What Everyone in Ombreval Knows\n\n\u003e Use: inject verbatim into any citizen NPC's context — the city's common knowledge; every line is safe in the mouth of a random fishwife. Deeper knowledge belongs only to the NPCs canon names; do not inject this file *instead of* a named actor's own blocks.\n\u003e Canon: 00_canon.md\n\n## The city\n\nOmbreval is a free fortified city beside the river Serle, which runs beyond the south wall. Its former straightened city channel, the Cut, has been a dry trade street since the works of F.363–369. Years count from the cathedral's first stone; it is F.437. The great church of Saint Ambrelle everyone calls the Lanthorn; its stepped forecourt is the Gradine. Five squares: the Wickmarket (wax and chandlers), Coswald's Yard (stone; the masons' lodge — do not praise glaziers there), the Tallage (Serle tolls; pawnshops by the dry Tally Bridge), Maren's Green (fish and eel smoke; Saint Maren's church), and the Bellstand (edicts cried under the old watch-bell). Cinder Row is the glaziers' street. The Needle is a lane one shoulder wide; \"past the Needle\" means beyond saving. The Ilvane Chapel is mortared shut — \"unsound,\" they say — but the anchoress Dame Aldith lives in its north wall and trades verses for honest news through her squint.\n\n## The disasters\n\nThe Great Rains of F.362 broke the Cut, drowned stores and lower streets, and drove the Serle into its present bed beyond the south wall. The Great Hail of F.415—the Hammering in any ordinary mouth—fell on a late-summer Highmarket and killed thousands beneath hail, roofs, walls, fire, and meltwater. The Long Departure followed. Ombreval once held about fifteen thousand people and now holds about five thousand; busy markets stand close to quiet courts, occupied ground floors beneath empty upper rooms, and roofs patched in four materials.\n\nNobody knows why the hail was so violent or so local. Outsiders call Ombreval accursed; Ombreval calls outsiders rude and checks the sky anyway. At the Hammering anniversary's Waning bell the city gives one common toll. Traditional households call those denied their own name-knell the Unknelled and answer, \"One bell is not a name.\"\n\n## Bells and hours\n\nSeven offices ring the day: the Watch, the Kindling, Dayspring, High Wick, the Waning, Lamplight, and the Snuffing — curfew, rung on the Scold. Perrin Evenblow rings the hours; Great Ambrelle, called Gravemouth, rings great feasts and great dead; no one weds under the Orphan, whose baptismal record burned. The ring rung backward is the Ruin: fire or flood, drop everything. There was no hail alarm when the Hammering began. Maren Smallvoice rings the name-knell, one stroke per year of the life, and everyone in hearing counts.\n\n## Money and markets\n\nThe coin is the silver bell: twelve copper sparks to the bell, sixty bells to the gold lantern. A loaf, two sparks; a journeyman's day, three bells; a pauper's funeral with knell, eight — yet the poor get knell and chalked name at Saint Maren's charnel door; some quiet purse pays, nobody says whose. Bellday opens the week; Highmarket is third (Wickmarket, Coswald's Yard), Lowmarket sixth (the Tallage, Maren's Green). Every oath and verdict is sworn \"by the light that does not lie.\"\n\n## The Church, and how one behaves\n\nThe Church of the Sole Light — the street says the Candor — teaches one Light, undivided: *Lux una et indivisa*. Its head, the Luminary, is far off in Ostrelle; here it is the Praelucent, Havise Dorn (lamp-named Serene; the street says Dorn), and the parish wick-priests. The grey clerks are the Custody of the Eye, who keep the Great Rose and hold records nobody living has seen; be civil to grey. By the Edict of F.244 what shows in the rose is the Emblem; say \"sun\" or \"green sun\" near the wrong ears and it is a fine, or recantation on the Gradine. Everyone says green sun anyway, indoors, quietly. Confessing the sight costs nothing — *to see is no sin; to affirm is* — and the priests want no details.\n\n## The feasts\n\nQuarter-feasts: Vhairestide (spring; the year turns), Ambrellestide (early summer; glass carried from Cinder Row to the Gradine like children), Coswaldstide (autumn; scaffold-blessing and the yearly mason-glazier brawl over F.288), Wet Alms (winter; bread at the nave door). Lesser feasts fill the year, and one autumn day is left nameless. Some burn a green candle in spring for poor drowned Colm.\n\nGreatest is the Concurrence — the Feast of the Sole Light, the fortieth day after Coswaldstide — when the two lights cross in the eye of the rose and every doubled shadow fuses into one; under cloud the feast simply fails, and the year is called unblessed. Last year the Chapter barred the nave doors at the Passing — the Shut Door — and a crush on the Gradine broke a child's arm. Now it comes again: everyone asks about the doors, the Praelucent does not answer, all watch the sky.\n\n## The light in the rose — safe common talk\n\n- Sky seen through the Great Rose from inside the Lanthorn holds a second disc — green-white, cold, dawn through river ice. Outside it is gone: only through the rose, only from within.\n- You can look straight at it without hurt — the strangest part.\n- It keeps its own colour through every pane; its beams cross the true sun's without mixing; folk in the nave cast two shadows, the cold one the grave-shadow — ill luck on a bride.\n- Speak your dead's name in its beam and they hear you — so folk believe. Children play twinning until their two shadows touch hands.\n- It walks against the true sun — the countergait: huge in the west at dawn (the dawn-showing), sharing the window late in the day (the strong hour), crossing once daily — the Passing, or the Kiss.\n- In the Great Rains it burned three weeks through the wrack, the only sunlight in Ombreval.\n- A few — the Spared — see only one sun there. Pitied, envied, doubted.\n- Old stories: Idonea Sparr, who made the rose, wept at its finishing — she had made two of something there was one of; Colm Attergate preached the Church was walling a sun out of the sky, and drowned banished at the sluice while the Cut still ran; and the skipping rhyme, *one sun for the living, one sun for the flown*, that no grown soul can gloss.\n- Pilgrims buy lead badges of the Emblem, which it is forbidden to describe; the city finds this funny, and profitable.\n- There are heretics — the street says the Greensick — who hold the disc a true sun the Lanthorn was built to wall out. Nine years back the Custody took five in a cellar raid; two recanted, and a fuller died in keeping, of the damp. The street says the Greensick kill those who cross them; the street says a great deal.\n\n## What no ordinary citizen knows\n\nYou know *of* these things, never the things themselves; do not invent their contents.\n\n- What the glaziers' trial of F.288 found: the verdict was never read out. Masons say sorcery, glaziers slander; pick a side and know nothing.\n- What the Grey Press holds: that it exists, yes; what is in it, no.\n- Who the Greensick are, where they meet, or how one is let in. Guessing aloud is dangerous both ways.\n- Who informs for the Custody — somebody does — or why old paper outsells silver at the Tally Bridge; nobody honest asks.\n- What the two years of canvas over the rose were really for, beyond \"repair.\"\n- What the Emblem is. The Candor says a granted image; the Greensick, a walled-out sun; the scholars have given it up. Nobody knows, everyone knows nobody knows — the city is at peace with it, as some scholar is supposed to have written.\n"},"08_folk_culture.md":{"title":"The Mouth of the City: Folk Culture of the Second Sun","use":"inject whole or by section into sidecar NPC context as Ombreval's shared oral culture — verses, sayings, and songs are speakable or singable verbatim by TTS; the italic annotations are for designers and the sidecar, never spoken aloud by NPCs.","words":3414,"text":"# The Mouth of the City: Folk Culture of the Second Sun\n\n\u003e Use: inject whole or by section into sidecar NPC context as Ombreval's shared oral culture — verses, sayings, and songs are speakable or singable verbatim by TTS; the italic annotations are for designers and the sidecar, never spoken aloud by NPCs.\n\u003e Canon: 00_canon.md\n\nThe Edict of F.244 governs what may be written and cried; it says nothing of what may be skipped to, hummed, or muttered over a cradle. So the city put its memory in its mouth. None of what follows is doctrine; most of it is older than anyone who says it, and says more than any speaker knows.\n\n---\n\n## Children's rhymes and skipping songs\n\nThe root rhyme, known to every child in Ombreval (see 00_canon.md; no child knows who Colm was):\n\n\u003e *One sun for the living, one sun for the flown,*\n\u003e *one for the tallow and one for the stone;*\n\u003e *Colm went a-walling and Colm went below —*\n\u003e *count both your shadows wherever you go.*\n\nThe verses below follow it at the rope; Ede of the Needle keeps them all, and corrects adults who get them wrong.\n\n**The ladder verse.**\n\n\u003e *Colm had a ladder and Colm had a line,*\n\u003e *Colm counted courses, one to nine;*\n\u003e *nine for the tower and ten for the sky —*\n\u003e *down came the water, and don't ask why.*\n\n*What it keeps: F.301 (see 04_chronicle_of_the_city.md) — a labourer of the west towers, ladder and plumb-line; banishment and drowning in one falling line; the town's learned silence in the last four words. Children think \"don't ask why\" is about the rope turning.*\n\n**The sluice verse.**\n\n\u003e *Under the sluice the eels are fed,*\n\u003e *say your names to the green instead;*\n\u003e *if the gate is shut, come round by the wall,*\n\u003e *if the wall is shut, don't come at all.*\n\n*What it keeps: where and how Colm died — back by water at night against a shut ban. \"Say your names to the green\" is the folk practice of naming the dead in the beam (never confirm, never mock); the last line is the banishment turned skipping advice.*\n\n**Weep, Weep, the Glass-wife's Daughter.**\n\n\u003e *Weep, weep, the glass-wife's daughter,*\n\u003e *what do you see in the noonday water?*\n\u003e *I see a window, I see a sun,*\n\u003e *I made it two that was made but one.*\n\u003e *Latch the shutter, latch it twice —*\n\u003e *dawn comes green through the river ice.*\n\n*What it keeps: F.203 nearly verbatim — Idonea Sparr weeping at her finished rose, saying she had made two of something there was one of; folk memory has slid the maker down a generation. The last line preserves the canonical colour — dawn seen through river ice. The rhyme says \"sun,\" which is citable; the Custody has never once cited a child.*\n\n**Three Went In Walking.**\n\n\u003e *Three went in walking, walking, walking,*\n\u003e *three went in walking and nobody talking;*\n\u003e *two came out riding and one came out cold,*\n\u003e *and the glass was good as gold, gold, gold.*\n\n*What it keeps: the Glaziers' Trial of F.288 — three journeymen put to the Question, two carried home, one to his grave — and, in the last line, the verdict never published: the glass was found innocent. This skipping rhyme is the only public text in Ombreval that states the trial's outcome, and no one who sings it knows it states anything. How it learned a sealed verdict, no one can say.*\n\n**Rain on the Reeds.**\n\n\u003e *Rain on the reeds and rain on the wall,*\n\u003e *three weeks' raining and no sun at all;*\n\u003e *one little candle in the big stone room —*\n\u003e *who kept it burning? Don't say whom.*\n\n*What it keeps: the Great Rains of F.362 — the pale disc the city's only sunlight for three weeks, garbled to a candle — and the forty arrests in four words: \"don't say whom.\"*\n\n**The twinning chant**, said while playing twinning — contorting in the doubled light until the two shadows' hands touch:\n\n\u003e *Shadow, shadow, take my hand,*\n\u003e *one to kneel and one to stand;*\n\u003e *if we touch before the bell,*\n\u003e *nothing-never-no-one tell.*\n\n*The last line is nonsense that scans; some grandmothers say it used to be different, and cannot say what. Leave that alone.*\n\n## Counting-out rhymes\n\nFor choosing who is out.\n\n\u003e *Pin, Ib, Cobb and Sef*\n\u003e *went to the church and one was left:*\n\u003e *one for the wick and one for the stone,*\n\u003e *one for the water and one came home,*\n\u003e *and the one who came home came home alone — OUT.*\n\n\u003e *Gravemouth, Smallvoice, Orphan — three,*\n\u003e *which of the bells will ring for thee?*\n\u003e *Not the great and not the small;*\n\u003e *the nameless bell won't ring at all,*\n\u003e *and out you fall.*\n\n*The second keeps F.341: the Orphan's baptismal record burned, and the folk conviction that an unnamed bell cannot ring you anywhere good.*\n\n## The common toll and the Unknelled\n\nAt the Waning on the Hammering's late-summer anniversary, the city gives one\ncommon mourning toll for those who could not receive individual rites during\nthe mass burials of F.415. Many stand for it. Some traditional households turn away\nfrom the bell; others speak their dead's names after the last stroke, supplying\nin the mouth what the bronze did not count.\n\nAround Saint Maren's, the answer is taught in four short lines:\n\n\u003e *One bell for the city,*\n\u003e *one name for each dead;*\n\u003e *ring what was owing*\n\u003e *before we are dead.*\n\nThe argument underneath is shorter: **one bell is not a name**. Families keep\nprivate copies of the incomplete Hammering rolls and save for belated\nname-knells when an omitted relative is proved or an old debt to the bell can\nfinally be paid. The devout call those still without one **the Unknelled**.\nSome mean the word accusingly, some sorrowfully, and some only as a clerk's\ncategory. No authorial fact says the dead hear either the common toll or the\nbelated bell.\n\n## Superstitions and omens\n\n*All are sincerely held somewhere. Those marked (sooth) describe render-true facts from 00_canon.md §2; the rest the game never confirms nor mocks. The contradictions are intentional: quarters disagree and keep their own versions.*\n\n1. A grave-shadow across a bride is ill luck until the next Concurrence fuses it away — and a clouded Concurrence leaves it on her another year; careful weddings keep to the aisle bays, out of the window's sight.\n2. A newborn held in the doubled light gets a spare shadow to spend; what the spending costs, ask no midwife.\n3. Fever carried into the green beam cools; the vergers keep a bench in it.\n4. Speak your dead's name in the beam and they hear you.\n5. Speak a living name in the beam and he will hear of it by Bellday; the nave is a bad place to gossip.\n6. Wax will not soften in the cold light; a Wickmarket tallow drop proves it to any pilgrim with a penny. (sooth)\n7. You may look straight at it and take no hurt; grandmothers say the hurt is being saved up. (the looking is sooth; the saving is not)\n8. Never count your shadows aloud past two.\n9. A mirror leaving the nave goes face-down; carried face-up it shows an empty sky till sundown.\n10. To meet one of the Spared is lucky in the Wickmarket and unlucky at Maren's Green, and both squares have proofs.\n11. No one weds under the Orphan's voice; a bell without a baptism cannot bless one.\n12. A candle guttering in still air is a grave-shadow passing; snuff it and say nothing.\n13. Step on the X at the Kiss and lose a year; stand on it with both feet and gain a wish; the vergers have given up saying which.\n14. A clouded Concurrence is an unblessed year. Saying so is forbidden. It is said.\n15. A green dawn through river ice means a drowning by thaw, say the boatmen; a fat eel year, say the fishwives; both watch for it.\n16. Where a pane is out, the window holds its breath; do not stand beneath a held breath. (that a gap shows one plain sky is sooth; the breath is not)\n17. A child born at the hour of the Passing will never lie, or will never be believed; the midwives split by parish.\n18. If your cold shadow falls darker than your warm one, you owe the dead; pay it into Saint Maren's box before the next knell.\n19. The ravens nesting in the north tower scaffold keep the tower unfinished; if ever they leave, something worse is finished instead.\n20. A beam from the rose once came down in Skinners' Court, three streets from any glass; nothing has been seen there since or before, and the rents are lower even so.\n\n## The warding gesture\n\n**Belwyn's ward**: shut the left eye and lay two fingers flat on the shut lid. The wick-priests teach that it is only giving the dark its due, after Saint Belwyn, who preached that darkness too is of the Light; the folk use it as a latch on the soul. It is made when the thing in the window is named aloud, when crossing a doubled shadow not your own, when the Orphan rings, and at the midpoint of the Needle, which is held to \"cast wrong\" — folk hurry through the pinch eyes-down, a habit certain parties find convenient.\n\nVariants, each certain it is the original: boatmen shut the right eye, because the left minds the water; masons shut both for one breath, since stone doesn't look; chandlers draw a thumb across an unlit wick.\n\nThe old strong form is **making the Kiss**: cross the two forefingers and throw their crossed shadow on the ground — the Passing, made small and answered. Grandmothers keep it for the worst occasions; children have made it a dare. Whether making the Kiss inside the nave itself is the surest protection in Ombreval or the plainest provocation divides households.\n\nThe Custody can hardly object to a shut eye, its own emblem being one; the grey clerks are said to use Belwyn's ward themselves, which either proves it works or proves nothing.\n\n## Sayings, oaths, and curses\n\n- **\"Past the Needle\"** — beyond saving. Said of a debt, a marriage, a man.\n- **\"One shadow to your road.\"** — the travel blessing, given at doors and moorings. Answer: **\"And one light over it.\"** It is not said indoors, and never in the nave.\n- **\"Chalked on the lintel\"** — as good as dead: \"he just hasn't heard the bell.\"\n- **\"Sold at the Tallage\"** — betrayed, at a fair price.\n- **\"There's a moth in every tavern.\"** — mind your tongue. Most who say it could not tell you what a moth is, and are right anyway.\n- **\"Peace with the impossible, and dinner at noon.\"** — no use puzzling; get on with the day. Also heard as \"it's impossible light\" (not worth arguing) and \"the city's at peace with it\" (drop the subject). *All three are drift from Doctor Ferrant's margin line (00_canon.md §3d); no speaker knows the phrase has an author.*\n- **\"Before the Hammering.\"** — old, sound, or remembered as better than it\n  was. A roof, marriage, debt, and bad knee may all date this way.\n- **\"Under slate.\"** — killed in the Hammering, regardless of what actually\n  fell.\n- **\"Hammer-weather.\"** — a dark, abruptly cold summer sky; enough to send a\n  market crowd edging toward arches.\n- **\"Gone in the Long Departure.\"** — left the city after F.415, usually with\n  some property, debt, or relative unresolved behind them.\n- **\"One bell is not a name.\"** — the traditional objection to the common\n  Hammering toll.\n- The lawful oath is **\"by the light that does not lie.\"** Four pots in at Maren's Green, a boatman will swear *\"by the light that does not lie — and the other one, that does not answer,\"* which costs a fine if a moth is thirsty.\n\nCurses, mild to mortal: **\"May the Orphan ring you in.\"** **\"May your shadow go home without you.\"** **\"May you stand at the Kiss and cast nothing.\"** The last is not said to children. And there is **\"fuller's luck\"** — the worst luck, luck of the damp — used in low voices, and never within earshot of a grey coat.\n\n## The boatmen's song\n\n**The Water Knows One**, sung at the Hungry Ox, the boatmen's tavern by Maren's Green — the ox verse explains its name. The song never names what it is about, which is the craft of it; it is sung louder when grey coats pass.\n\n\u003e *Old Maren came floating the wrong way home,*\n\u003e *upstream to her mooring through the weir and the foam;*\n\u003e *the river cried pardon, the reeds took her in,*\n\u003e *and she keeps the drowned tidy till we're drowned again.*\n\u003e\n\u003e *Haul on the dry rope, pole on the stone,*\n\u003e *the water knows one, boys, the water knows one;*\n\u003e *let the tall house keep what the tall house has won —*\n\u003e *the Serle never carried but the one, boys, the one.*\n\u003e\n\u003e *The year of the great frost they roasted an ox,*\n\u003e *the butchers ate brisket in their holiday smocks;*\n\u003e *the boats stood in ice and the boatmen stood by —*\n\u003e *we'll pay for that dinner when the river runs dry.*\n\u003e\n\u003e *A fish like a provost came up at the Green,*\n\u003e *the finest fat sturgeon the Tallage has seen;*\n\u003e *the chapter got dinner, the priest got the bone,*\n\u003e *and who kept the roe, boys? Ask the river alone.*\n\u003e\n\u003e *They've a light in the tall house too good for the street,*\n\u003e *it never gets wet and it never gives heat;*\n\u003e *count lights in the water when your day's work is done —*\n\u003e *whatever they've two of, the water knows one.*\n\u003e\n\u003e *So drink to the east gate that empties the town,*\n\u003e *it lets the freight seaward and it let a man down;*\n\u003e *sing low by the sluice, boys, and pole for the sun —*\n\u003e *the water knows one, boys, the water knows one.*\n\n*Every verse is chronicle-true and older than the closing of the Cut: Saint Maren upstream; the ox of F.229; the sturgeon of F.271, whose roe the boatmen kept and lie about in the song itself; the working Cut's one reflected sun; and Colm at the sluice, unnamed, because the boatmen own that death. The river now runs beyond the south wall and the song has refused every correction. Legally it is unimpeachable, and everyone in the room knows exactly what it means.*\n\n## The ghost in Gaunt Passage\n\nTold always as happening to a friend of the teller's cousin.\n\nSince the year the Custody took the five, there is something at the dark midpoint of Gaunt Passage after last bell. You hear cloth being wrung — the slow twist, and then the dripping — on nights when the stones are dry as a sermon; the air goes river-damp around you, and there is a smell of wet wool where no wool is. It is the fuller, they say: taken there, dead of the damp before ever he was tried, come back to wring his cloth at the door they took him from. Do not stop to listen. A salt-porter who lingered went deaf for three days, his ears full of water that no one could see poured out. Walk the passage quick, and if you must pass at night, say \"good night to the trade\" — never guess at his name, for nobody living is sure of it, and the dead hate being guessed at wrong. The old women add one thing more, and lower: he is not wringing his cloth at all. He is listening for one voice, and when he hears it, the dripping will stop.\n\n*Designer note: the fuller of F.428 died in the Custody's keeping, not in the passage; folk memory has moved the death to the arrest-site. The last line brushes against a true thing (00_canon.md, ledger 26) without knowing it — never let any NPC or system resolve it. The Unwalled neither started the tale nor correct it: it empties the passage at night better than any watchman, and Grigor Ashe has been heard to add details.*\n\n## Trade customs\n\n**The lamplighters.** The lamplighters of the five squares serve under the Wickmarket chandlers. The first flame of the round is taken from a coal carried in a horn box, never begged from a house-fire, for borrowed flame tells tales; a lamplighter never lets his own shadow fall on the lamp he is lighting, but stands side-on; at each corner he whistles the wick-call, three notes, so folk know the shape on the ladder is lawful. In every square one lantern is left dark each night, a different one by rote — **Belwyn's lamp**, the dark getting its due — which the Custody approves for the saint's sake, the folk for their own, and the thieves study. Lamps in sight of the west front are lit last: reverence or thrift, depending which lamplighter you ask. On the eve of the Concurrence every lamp in the five squares is lit, Belwyn's included — the one night the dark goes unpaid. The lamplighters hate it, and are paid double.\n\n**The glaziers.** On Cinder Row an apprentice swears his articles on the lead, never on the glass — glass shows, lead holds. Burn scars are **Ambrelle's kisses**, after the saint who carried the melt bare-handed, and a first scar is toasted. No one whistles within sound of a furnace; a whistle calls a crack. On the eve of Saint Ambrelle's feast the furnaces are raked cold, and every fire on the Row is relit next morning from the procession's lantern, so the whole street burns one flame for a year. To say \"glass remembers\" on Cinder Row buys silence and no service; if the Row answers at all, it answers: **\"Glass forgets; men remember.\"** And since the year of the trial no glazier will testify about light — sand, ash, and lead they will swear to all day, and go mute at \"what does it show\"; the Row's whole answer to that question is the mistress's formula, *our glass shows true; take it up with the sky*, and the courts have learned not to ask.\n\n## What mothers tell children about the rose window\n\nThat a baby is carried into the doubled light to be given its spare shadow, and that the spare can be spent once — a fall survived, a fever turned. Children point to Ede of the Needle: she spent hers at the Shut Door, which is why the arm knit crooked but knit. Some mothers walk the child through the beam every month \"to keep the spare fed\"; others say once at birth and never again, or the window will think the child is being offered; the two kinds of mother do not lend each other flour.\n\nThat you do not wave at the eye, because it is not looking at you — and you do not ask whom it is looking at.\n\nThat the window minds the dead's side of the family, and you behave under it as at a grandmother's table; if you must cry there, cry quietly, for the dead sleep badly enough.\n\nAnd that a child who loses his shadow in the dark can find it next morning in the nave, standing in the green, waiting to be stepped back into. Mothers say it to stop night wandering, and it works; and more than one grown citizen, on a bad morning, has stood a moment in the cold beam and come out saying nothing, with both shadows on.\n\n---\n\n*Nothing in this mouth-lore is authorised, and nothing in it will die. The Edict polices nouns; the rhymes gave the nouns away and kept the facts. If the Grey Press burned tomorrow, the children would still be skipping the trial, the rains, and the man at the water — one turn of the rope per century, and never a word wrong.*\n"},"09_rose_window_iconography.md":{"title":"The Lights of the Great Rose","use":"diegetic document - the verger's book of the Lanthorn, a panel-by-panel guide to the Great Rose; inject into NPC context for vergers, canons, glaziers, and pilgrim-facing actors; authoritative geometry and numbering for building the rose-window diagram.","words":3411,"text":"# The Lights of the Great Rose\n\n\u003e Use: diegetic document - the verger's book of the Lanthorn, a panel-by-panel guide to the Great Rose; inject into NPC context for vergers, canons, glaziers, and pilgrim-facing actors; authoritative geometry and numbering for building the rose-window diagram.\n\u003e Canon: 00_canon.md\n\n*The verger's book of the west window, renewed by Verger Dunstan Pike, keeper of the nave keys, from the book of Verger Amiel Fenn, in the winter of F.436. Whoso holds the keys after me: read this before you answer a pilgrim, and answer less than you read.*\n\nFirst, the one rule of the mouth. The window holds the Emblem; the Edict of F.244 gives it no other name, and neither does this book. One who calls it a sun is warned once, kindly; twice, and you send for a grey clerk. To see is no sin; to affirm is. Affirm nothing, not even in the margins of this book.\n\n## I. The reckoning of the lights\n\nPositions are read as on a clock face seen from within the nave, facing the window. You face west; the III side is therefore the north side of the window, the IX side the south; the crown is XII, the root VI. Numbering begins at the crown and runs sunwise.\n\nFrom the centre outward:\n\n- **O, the eye** - the central round light.\n- **Ring I, the eight petals**, I-1 to I-8. I-1 at XII; each next petal one eighth of the wheel sunwise: I-2 at half past I, I-3 at III (north), I-4 at half past IV, I-5 at VI (root), I-6 at half past VII, I-7 at IX (south), I-8 at half past X.\n- **Ring II, the sixteen histories**, II-1 to II-16. II-1 at the crown, directly without I-1; each next panel one sixteenth of the wheel sunwise. Odd panels stand on petal rays, even on the gaps. Thus II-5 at III, II-9 at VI, II-13 at IX.\n- **Ring III, the two-and-thirty small lights**, III-1 to III-32. III-1 on the crown ray; each next light one thirty-second of the wheel sunwise. Odd small lights stand on Ring II rays, even between. Anchors: III-9 at III, III-17 at VI, III-25 at IX.\n- **Ring IV, the eight buds** - trefoils in the rim stonework, IV-1 to IV-8, each on the same ray as the petal of its number.\n\nSixty-five lights in all.\n\n## II. The eye (O)\n\nNo figure: the Sole Light itself, a white heart rayed in gold, ringed with the creed lettered black on white - LVX VNA ET INDIVISA. Note: one lead-strip crosses the final A of INDIVISA, so the word undivided is divided. Asked to mend it, Master Idonea Sparr answered: *the lead must go somewhere.* Unmended these two hundred and thirty-three years. Do not point it out.\n\n## III. Ring I - the eight petals\n\n**I-1, crown. Saint Ambrelle the Glass-Carrier**, bearing the molten gather bare-handed from the burning workshop. Ruby, gold, white. Note: her halo is no ring but a furnace-mouth.\n\n**I-2, half past I. Saint Vhairé of the Ford**, mid-river, lamp held dry. Deep blue, white, grey-green. Note: the water is painted in torment, yet the lamp's reflection lies unbroken.\n\n**I-3, at III, the north. Saint Coswald the Wall-Wright**, in the breach, the wall closing on his body. Ochre, iron-grey, one deep red. Note: the breach-stones carry true masons' marks; the lodge disputes two.\n\n**I-4, half past IV. Saint Perrin Halfbell**, palm and jaw laid to a great bell. Bronze, amber, brown. Note: the only figure that breaks its border - the bell's rim rides over the edging lead.\n\n**I-5, root. Saint Belwyn the Unlit**, white-eyed, face lifted to a black sky rayed with white. Black, violet, white. Patron of the Custody of the Eye. Note: his staff points not heavenward but down, to the sill.\n\n**I-6, half past VII. Saint Maren of the Reeds**, borne on the water. Green, blue, silver - the window is thrifty with green everywhere but its waters. Note: every reed bends downstream; she goes against.\n\n**I-7, at IX, the south. Saint Gaudry the Ledgerer**, the false ledgers burning at his feet. Red, parchment-yellow, black. Note: his scales tip against the coin.\n\n**I-8, half past X. Saint Ilvane the Twice-Shadowed**, the hermit on her bier. Grey, white, candle-gold - and the other thing; see chapter V. Old vergers call this petal the Fault.\n\n## IV. Ring II - the sixteen histories\n\n| Panel | Shows | Chief glass | Careful eye |\n|---|---|---|---|\n| II-1 (crown) | The First Stone, F.1, at the old ford-market | blue, gold | a river-reed at the stone's foot: Vhairé's ground |\n| II-2 | The Ferry at the Flood | blue-grey, white | the lamp's flame drawn as a small rayed disc |\n| II-3 | The Quire Unroofed: first mass, no roof | gold, rain-grey | rain falls in; the candles stand lit |\n| II-4 | Coswald in the Breach: the old siege | iron-black, red | his trowel is gilded; the besiegers' swords are not |\n| II-5 (at III) | The Lodge at Work: Coswald's Yard, crane, courses | ochre, white | one mason has turned and looks along the ray, toward the eye |\n| II-6 | The Casting: the pour; Perrin tuning by jawbone | orange, bronze, black | the painted bell's motto-band is blank; see below |\n| II-7 | The Burning of Cinder Row, F.171 | red, black | in the fire's heart, one piece of glass utterly clear - \"the ash goes in,\" says the lodge |\n| II-8 | Cinder Row Rebuilt | amber, violet | a girl apprentice carries glass bare-handed: little Ambrelle, as promise |\n| II-9 (at VI) | The Setting of the Rose | white, blue, lead-grey | the Tear; see below |\n| II-10 | The Light Kept Faith, F.362 | black-blue, silver | see below |\n| II-11 | Maren Upstream | green-blue, white | eyes open, water above her, painted sleeping, not drowned; boatmen salute it on Bellday |\n| II-12 | Gaudry and the Ledgers | red, parchment | the ledger-lines are true writing; the sums balance |\n| II-13 (at IX) | The Oath by Light: a court sworn in a beam | gold, white, black | the witness casts one emphatic shadow - \"the One Shadow\"; stand pilgrims who ask too much here |\n| II-14 | The Luminary in Ostrelle | purple, gold | the painter never saw Ostrelle: its cathedral is the Lanthorn drawn again, smaller |\n| II-15 | The Five Squares: wax, stone, tolls, fish, bell | motley | in the Tallage corner a pawnbroker's balance tips, both pans empty |\n| II-16 | Ambrelle's Walk: the workshop, the barefoot walk | red, gold, white | the embers under her bare feet are gilded |\n\n**Of II-6, the Casting:** pilgrims name the painted bell Gravemouth, and some vergers before Amiel let them. But this glass was fired by F.203, and the bourdon was not poured in Coswald's Yard until F.309, a hundred years and six after; the bell of the pour is an elder bell, and nameless, which is why the motto-band is blank. Amiel wrote that the letters wore; fired paint does not wear, and a bell before its baptism has no letters to lose. Correct a pilgrim once, kindly; past that, let the bell be what they will.\n\n**Of II-9, the Setting of the Rose:** the lodge raising the last panel of this very window, shown small and whole within itself; at the eye of the little painted rose sits one fleck of green-white glass found nowhere else in the window - the vergers call it the Tear. The chronicle of F.203 is public: the day the last panel was set, Master Idonea looked back through her finished window from the crossing and wept, and never fired glass again. This book's tradition holds that II-9 was that panel. Of why she wept, this book says nothing.\n\n**Of II-10, the Light Kept Faith:** the one panel younger by design, set F.365 in a light left as unfinished grisaille - the Great Rains, the city black under cloud, one beam standing in the nave. Every holy ray in this window is gold; this beam alone is silver-white. Reflect once, silently, on why the Chapter passed the cartoon so.\n\n## V. The Fault: the petal of the Twice-Shadowed (I-8)\n\nThe cartoon of I-8 survives with the lodge. Drawn to the Chapter's order, it shows the bier, the mourners, the candles, and one shadow - doctrine made picture, for the Church teaches that the second shadow Ilvane's witnesses swore to was thrown by the mourners' candles.\n\nThe fired glass does not match it. The bier casts two shadows: one warm, candle-ochre, falling away from the candles, obedient; the other cold, of a thin green cast, falling toward the candles, which no shadow thrown by them could do. No one saw it painted; the daybook for those weeks records pot-metal, firings, nothing else.\n\nFormally remarked F.221, on a canon's complaint. The lodge produced the cartoon; the ruling runs: *a doubling of the paint in the firing; no fault of doctrine; let it stand.* From the word \"fault\" the vergers named the petal - deniable, for a fault is a flaw, and flaws are nobody's heresy.\n\nNote: no painted mourner looks at the bier - they look at the candles, their hands, away. Only a small dog in the corner regards the cold shadow directly. Pilgrims ask what the dog means. The dog means that Master Sparr painted a dog.\n\nIn the Re-leading of F.419 to F.421 this petal - glass, lead, and all, the only light so treated - went to the tracing-house two winters, for a cracked tracery rib, the Fabric said. The city watched it come back; there was no change. I carried keys on that scaffold; the Fabric's word is repair, and so is mine.\n\nUnder the Edict you will not say that the cold shadow and the Emblem are one matter. It has been a fault of the firing for two hundred and fifteen years, unchanged, in a window where every other fired fault has bloomed or faded with weather. Affirm nothing.\n\n## VI. Ring III - the two-and-thirty small lights\n\nThree arcs: the Months (III-1 to III-12), the Trades (III-13 to III-24), the Waters (III-25 to III-32). Quarry-work, white and yellow-stain, coloured as noted. The Waters were made while the Cut still carried the Serle; their wharf, bridge, channel, sluice, and high water are now historical images of dry city places.\n\n| Light | Shows | Colour | Careful eye |\n|---|---|---|---|\n| III-1 | Ploughing | brown | the ox's yoke bears Coswald's mark |\n| III-2 | Sowing | green-grey | seed drawn as points of gold |\n| III-3 | Pruning | grey | the knife is a glazier's blade, outsized |\n| III-4 | Shearing | white | wool heaped like cloud |\n| III-5 | Haymaking | yellow | a swift crosses the scythe |\n| III-6 | Reaping | gold | one stalk left standing, by custom |\n| III-7 | Threshing | ochre | chaff gilded, grain plain |\n| III-8 | Brewing | amber | the mash-paddle bears Wray's mark |\n| III-9 | Slaughter-month | red | the only red in the arc |\n| III-10 | Salting | white-grey | salt drawn as light, in points |\n| III-11 | Wood-hauling | brown-black | one squared scaffold-pole in the load |\n| III-12 | Candle-dipping | gold-white | the chandler is a woman; Wickmarket says which |\n| III-13 | The mason | ochre | square and plumb; no lamp (see IV-3) |\n| III-14 | The smith | black-red | sparks fired in yellow-stain |\n| III-15 | The bellfounder | bronze | the mould open, the bell unborn |\n| III-16 | The chandler | gold | wicks numbered in the paint: seven |\n| III-17 | The glazier | white-blue | the Sworn Pane: see chapter VII |\n| III-18 | The fuller | grey-white | cloth trodden in the trough |\n| III-19 | The draper | blue | selvedge laid in true gold-leaf |\n| III-20 | The salter | white | Gaunt Passage's trade; the panel names nothing |\n| III-21 | The baker | brown-gold | loaves counted odd, for luck |\n| III-22 | The scrivener | parchment | the written line abbreviated Latin, unread |\n| III-23 | The fisher | green | eels circled in a basket |\n| III-24 | The boatman | blue-green | the pole bites the water at a true angle |\n| III-25 | The Ford | grey-blue | before the Fabric: no city, one lamp |\n| III-26 | The eel-weirs | green | the stakes lean downstream, rightly |\n| III-27 | Maren's wharf | blue | fish-scales in silver-stain |\n| III-28 | The Tally Bridge | grey | the toll-chain painted slack |\n| III-29 | The Cut | blue-black | the one straight water in the window |\n| III-30 | The sluice | white-green | wax-drips on its sill some springs; scrape them, say nothing |\n| III-31 | The Frost of F.187 | white | the Serle crossed on foot; skates of bone |\n| III-32 | The high water | blue-grey | a crypt door awash; the lintel bare, for the sexton's chalk is younger than the glass |\n\n**Ring IV, the eight buds** - donors' trefoils, each a lamp and the giver's device: IV-1 the glaziers (lozenge and grozing-iron); IV-2 the boat-families (an oar); IV-3 the masons (square and plumb, the one bud with no lamp; the lodge has never said why); IV-4 the bellfounders (a bell, its motto too small to read); IV-5 the chandlers (a taper); IV-6 the fishers (an eel circled); IV-7 the scriveners (quill and honest weight); IV-8 a lamp before a shut cell door, a widow's gift, unnamed in the roll.\n\n## VII. The glaziers' marks, and the repairs\n\nEvery pane of the first making bears, low in a corner, small as a fly, its maker's mark; a glass from the triforium reads them.\n\n- **The diamond-and-dot** - the Sparr house mark, Master Idonea's own; the vergers call the dot \"the eye.\" On most of the lights.\n- **The bare diamond** - the same lozenge, no dot, on nine panes only, all fired in the last season of the work, F.203. Cinder Row's answer, unchanged for generations: haste. Nine panes' worth of one haste.\n- **Wray's wave** - three nested curves; Tilde Wray, journeyman, maker of the water-lights.\n- **The bird-foot** - Josse Bequin, journeyman, maker of the Months.\n- **The cross-stroked diamond** - the present Sparr lodge's mark for the Re-leading of F.419 to F.421. There are many; the Fabric has counted.\n\nThe chalk diamond seen on city walls is no glazier's mark; fired marks do not walk. A verger reports nothing he cannot read.\n\nThe repairs:\n\n- **F.203.** The window finished; the master's weeping, cited at II-9.\n- **F.240.** Viewing hours; the badges licensed.\n- **F.244.** The seventh-bay rail; the Edict the same year.\n- **F.288.** The glazier's small-light, III-17, drawn out and returned. Amiel's book keeps the old entry whole: *pane drawn; pane returned; oath taken.* The lead about III-17 is double court-lead to this day; the vergers call it the Sworn Pane. The paint now in it is younger in manner than its neighbours by near a century, which you are not required to notice. Of the oath: above our office. Ask nothing.\n- **F.365.** II-10 glazed and set.\n- **F.419 to F.421, the Re-leading.** Two years of scaffold after the Hammering had cracked glass and loosened old lead without bringing down the tracery; a third of the panes through the lodge; the petal I-8 away two winters entire. The Fabric's published account is repair, and it is the account this book gives.\n- **The standing order, older than any name in this book:** a broken or fallen light is boarded before the next dawn - boarded, not glazed, and the Custody told. It is the only order with no reason written beside it. Through the hole, the sky is as any street shows it. Men who look long at the hole are the quieter afterward. Board it.\n\n## VIII. The verger's day: a guide to the viewing\n\n**Where to stand.** The wheel is read whole from the crossing floor; the chronicle says the master wept there. From the seventh-bay rail the root lights foreshorten. From the triforium west walk the root lights hold the Gradine roofline, not sky - and mark the plainest lesson in the Lanthorn: where a light holds roof and not sky, the Emblem does not stand in it. No pane of the sixty-five refuses it, if sky stands behind and you stand within; none grants it to a man on the Gradine.\n\n**The dawn duty.** Unbar at first light; the dawn-showing is the crowded one. The Emblem stands then at the root, low and very great - more mornings than not within Belwyn's petal, I-5, so the blind saint has it at his back; in deep winter lower, among III-16 to III-18, and oftenest in the Sworn Pane itself.\n\n**The forenoon.** It climbs the south side against the true sun's course, taking the Trades of Ring III in their order - the fuller before the draper, the fisher before the boatman. By Maren, I-6, at midmorning. Late morning by Gaudry, I-7; toward the sixth hour, the full south, and the first of the Waters - vergers say of its noon that it comes in by the Ford.\n\n**The teaching of the red pane.** One lawful sentence satisfies a decent pilgrim, at whatever light it then stands in: watch the clouds take the colour of the pane, and watch the Emblem keep its own. Spare your legs: it stands in one pane for every eye in the building at once, so there is no better side of it. It may be looked at straight; it is the true sun beside it that punishes.\n\n**The afternoon and the strong hour.** Past the Ford it climbs on; it does not stoop again all day - by the Fault, I-8, in early afternoon, thence up along the Waters toward the high water, III-32; its evening it keeps at the crown, by Ambrelle, and there it goes out with the last light. In late afternoon the true sun comes round into the west and enters by the south lights, II-13 and I-7, higher in summer, and comes down through the lights as the Emblem goes up; then both stand in the window - the strong hour - and once they pass, the one rising and the one falling: the Passing. The crossed beams lay an X of light down the nave floor. Rope the crossing before it forms. What the crowd then does - the twinning games, the newborns, the fever-beds, the names spoken into the cold beam - the Chapter suffers, and so will you.\n\n**The road of the Passing.** No two seasons give one road. In high summer the two pass wide, up by the Fault and the sluice-light III-30; through autumn the road bends inward week by week, until on the Concurrence, the fortieth day after Coswaldstide, the Passing falls dead centre in the eye as seen from the crossing floor, and every doubled shadow in the nave draws home into one. If the day is clouded there is no feast: the pale one burns through cloud alone, and alone there is nothing to fuse with. Of last year's doors I write nothing; the Chapter will rule again this year.\n\n**Foul weather.** Under full overcast the Emblem stands alone in the glass, a pale coin; watch purses. In daytime storm, when lightning whitens every pane of the wheel at one stroke, it alone does not brighten; storm-watchers pay for the triforium.\n\n**Last.** Now and again one at the rail sees nothing, and says so, and is frightened - by the seeing nothing, in this city, more than others are by the seeing. Be gentle. Fetch a wick-priest, cite no one, and write no name in any book, this one least of all.\n\n*Here ends the reckoning of the lights. D.P., verger, F.436.*\n"},"10_gazetteer_of_the_second_sun.md":{"title":"A Gazetteer of the Second Sun","use":"world-geography reference for designers and the sidecar — excerpt district and building entries into NPC context, keeping lines marked (secret) or (never confirm) out of common knowledge.","words":2883,"text":"# A Gazetteer of the Second Sun\n\n\u003e Use: world-geography reference for designers and the sidecar — excerpt district and building entries into NPC context, keeping lines marked (secret) or (never confirm) out of common knowledge.\n\u003e Canon: 00_canon.md\n\n---\n\n## How the city lies\n\nOmbreval measures roughly twelve hundred paces west to east and a thousand north to south, walled, beside the Serle. The Lanthorn stands a little west of the city's heart, quire to the east, the Great Rose in its west front looking down over the Gradine. The river runs west to east beyond the south wall; its freight lands at outer wharves and enters by cart and porter. Across the southern third of the city, the filled former channel called the Cut survives as an unusually straight trade street. Between Cut and cathedral the streets pinch and widen between facades that never agree, dogleg twice to the block, throw jettied upper floors out until the eaves nearly touch, and duck under buildings through covered passages named for whatever they pass beneath, while timber bridges join loft to loft overhead.\n\nNothing of the Second Sun can be seen in any of this: the phenomenon lives indoors, behind one window — yet half the city's geography has arranged itself around it anyway.\n\n## The Gradine and the five squares\n\n**The Gradine** (ceremonial, counted apart from the five). The shallow processional steps before the west front, too narrow for the whole city on a feast day, as the Shut Door crush of F.436 proved on a child's arm. Recantations are performed here, survivable theatre by design; licensed badge-sellers work the steps, selling stamped images of the Emblem it is an offence to name. From the Gradine the Great Rose is dark glass and tracery; no one has ever seen anything from outside, and everyone looks anyway. Openly said: doctrine, the weather, and, since last year, the one live question: \"Will they bar the doors again?\"\n\n**The Wickmarket** (west). Chandlers' square: wax, tallow, wicking, hot fat and honey on the air. Osanne Vell's stall stands against the north row, supplying the Lanthorn's own candles. Because wax is the trade, the Wickmarket owns the city's favourite domestic proof: a tallow drop carried into the cold beam does not soften (true, freely shown to pilgrims). Also openly said: \"speak your dead's name in the beam and they hear you\" (folk practice; never confirm, never mock). Wickmarket talk says \"the beam\" and \"the cold light\" and lets the forbidden noun go unspoken.\n\n**Coswald's Yard** (north). Stone, timber, lime, and grievance. The masons' lodge fronts the square; the scaffolded crown of the north tower stands in eyeshot as a permanent reproach. Openly said, loudly, especially near Coswaldstide: \"it is in the glass; glass is a lie you can see through\" (the lodge's line since the Glaziers' Trial; false, held with total sincerity). No one here says \"sun\" at all; they say *the glaziers' work*. Brawls over F.288 are seasonal and almost liturgical.\n\n**The Tallage** (on the dry Cut). Customs square: weigh-beams, toll-house, bonded warehouses, pawnshops, the Tally Bridge carrying an upper passage across the street. Serle cargo comes up from the outer wharves by cart and porter. The Tallage says nothing openly; it prices things instead. This is the square of careful faces — moth-money and archive pages both pass through Lise Copp's shop facing the bridge (secret: one counter serves the Custody and the Unwalled). Doctor Aubin Ferrant keeps house and instruments off the east corner. What passes for open talk: \"a Sparr page crossed the bridge last month\" — said every month, verifiable never.\n\n**Maren's Green** (south-east). Fish market under eel smoke; boat-families' square; the Alder Moorings warehouse court; Saint Maren of the Reeds on the old Cut, its charnel door facing the churchyard. Openly said: that Saint Maren floated upstream against the Serle (her legend, told as true); that Colm Attergate drowned at the sluice coming home by water while the Cut still ran (true, embellished with each telling); and the watermen's flat observation that the Serle beyond the wall never shows the second light (true). Talk of the Great Rains is had in lowered voices; forty arrests remain inherited parish memory. Here the Hammering grievance is current: families pay belated name-knells for the Unknelled and say one bell is not a name.\n\n**The Bellstand** (east). Proclamation square beneath the old watch-bell tower, behind the Lanthorn's east end. Edicts are cried and posted here — the Edict of F.244 itself is nailed under the tower. Crier Jos Brant works the square daily, warm as a stove: \"the Green Sun hears the dead, neighbours\" (folk gloss, tolerated because he is loved; secret: he is a paid moth who does not know what his reports have cost). Here Colm Attergate preached that the towers were coffin lids; a worn stone by the tower door is shown as \"Colm's stone\" (unattested; never confirm).\n\n## The Lanthorn within\n\nThe nave runs nine bays from the west doors to the crossing, aisled, the triforium gallery above the arcade, the Great Rose filling the west front, the eye at its centre. The rule of sight is absolute: the disc shows wherever the sightline passes through rose glass to open sky, and nowhere else. From the crossing floor the whole rose is in view; from deep in the side aisles the arcade piers eat the window pane by pane; in the shadowed aisle bays a walker can cross the whole church and never once be in sight of it. The Unwalled call such sunless routes *the shades*, and use them.\n\n**The day of the two lights.** At clear dawn, while the true sun rises behind the quire, the disc stands low and huge in the western rose — the dawn-showing, the most crowded viewing. Its green-white lance runs the length of the nave and stands, at prime, on the quire steps; the step it strikes is *the cold step*, and the sextons can tell the month by which step it is. Through the forenoon the disc climbs the lights against the sun's course — the countergait — and its beam steepens and shortens, walking back westward along the pavement: the crossing by terce, mid-nave by sext, until by mid-afternoon the green pool lies small and hard almost under its own window.\n\nOnly when the true sun comes round into the west does honest coloured light enter the rose at all, stretching eastward up the nave as it sinks. This is **the strong hour**: both suns in the one window, warm stain and cold green sharing the pavement, every pillar and pilgrim casting two shadows. Once each day they pass — **the Passing**, the Kiss — crossed rays laying an X of light down the nave. The X walks through the year; this autumn it has been crossing the fifth and sixth bays, and on the Concurrence it will centre in the eye as seen from the crossing floor, or the clouds will refuse
