d had plaited. Every reed bends downstream; she went against. She came ashore at the mud-stair, and on that landing her church was raised, in the ninety-seventh year of the Fabric.\n\nHer death was her martyrdom and her coming home was her miracle, and the Church has never had to choose between them. She is patroness of the drowned, of the poor, and of lost things. Her petal in the Great Rose is the sixth, green in a window thrifty with green.\n\nThe Church suffers the casting of a reed on the water to seek a lost thing, and the boatmen's salute to her panel on Bellday. It does not suffer the giving of the dead to the river for judgment, that Maren might carry the innocent home and keep the guilty: all dead are buried.\n\n## Saint Ilvane the Twice-Shadowed\n\n*Formerly read at Ilvanestide. The day is now nameless and the life is not appointed; it stands here because the book is older than the ruling.*\n\nIlvane was a hermit, and kept vigil for such dead as had no one else to watch them. She lived against the wall of the city and died against it, alone, in the elder days. Mourners came with candles, as is right. Certain witnesses swore that the body on the bier cast two shadows. It was the candles. *[Here a line is struck through, and under the strike may be read only: \"...the second stood toward the candles, and no candle...\"]* *[The elder copy differs here, and is not followed.]* It was the candles; the Chapter has so ruled; the ruling is enough, and is repeated.\n\nHer patronage was of those who watch by the dead. It is not now assigned. Of her light in the great window this copy says nothing.\n\nThe Church suffers alms left at the anchorhold squint on the nameless day. It does not suffer the vigil of two candles, one at the head of a corpse and one at the foot; the wick-priest snuffs the second, whichever it is.\n\n## Saint Coswald the Wall-Wright\n\n*Read at Coswaldstide, at the blessing of the scaffolds, every pole and every knot.*\n\nCoswald was a mason when the city's wall was young. In the old siege the wall was breached by engines, and the breach could not be closed under the enemy's stones, for the mortar of one night is green, and a green wall falls.\n\nCoswald went into the breach and bade them lay the courses to him. Three assaults he held the new work with his back and spread arms. At dawn the enemy drew off. Then the lodge would have brought him out, and could not: the mortar had set about him as about a stone the wall had wanted, and he was dead, and the wall was whole. They left him within it — at his own word, said the layers, though none heard him say it.\n\nHe is patron of masons and of all who build, and the scaffolds are blessed at his feast. His petal in the Great Rose is the third, where the breach-stones carry true masons' marks.\n\nThe Church suffers Coswald's wage, the coin a mason sets in the first course, and the burial of masons with their tools. It does not suffer shadow-walling: the measuring of a stranger's shadow with a cord, and the cord mortared into the footing, that the wall may take a shadow and not, in its own time, a man. The wall is not the stronger for it.\n\n## Saint Belwyn the Unlit\n\n*Read at Belwyn's Dark, at the one office of the year sung unlit.*\n\nBelwyn was a Taper of this great church. In the Fabric's hundred and forty-sixth year the sun was eaten at midday, and every soul covered their eyes or turned away. Belwyn watched it whole, to see, he said, what the Light would do; and he was blind after.\n\nHe preached until his death that darkness too is of the Light: the Light, he said, had shut its one eye over the world, and the world had stood. Thirty years blind he walked the works — scaffold, triforium, the night stairs — without lamp and without falling; and he carried lamps to others, lit, that no one else should learn the dark before their hour.\n\nHe died at his place before the Kindling, the office before light, waiting on a dawn he had no need of. He is patron of the blind and of the Custody of the Eye, whose emblem is an eye shut. His petal in the Great Rose is the fifth, at the root, his staff pointing not heavenward but down, to the sill.\n\nThe Church suffers Belwyn's ward, and the one lamp left dark each night in every square. It does not suffer the staring: boys dare one another to look at the true sun on his feast, to borrow his eyes, and some have borrowed more than they meant.\n\n## Saint Gaudry the Ledgerer\n\n*Read at Gaudry's Audit, called Weighday, when the ledgers are closed and sworn.*\n\nGaudry was a clerk of the tolls under a farmer of the Serle customs, and was bid keep two books, a true and a false. He kept both fair, for a clerk's hand is not where his honesty lives; and when the false book was full he carried it at High Wick to the tax-farmer's own step and burned it there before the square.\n\nThe court was the farmer's. Gaudry swore by the light that does not lie, and would not unswear, and was hanged. At the rope he asked the hangman whether the knot was well tied, and said: a just weight. The court bell of the Lanthorn, cast long after, carries his last words in its waist, PONDUS IUSTUM.\n\nHis miracle came out of the fire: when the ashes were raked, one leaf lay unburned — a leaf of the true book, its sums balancing to the spark. They balance still.\n\nHe is patron of clerks and of honest weights. His petal in the Great Rose is the seventh, where his scales tip against the coin. The Church suffers the closing of the year's ledgers at his Audit, and Gaudry's leaf, the blank first page of a new ledger, on which nothing is written and therefore nothing false. It does not suffer the burning of bonds and tally-sticks at his feast; the court fines it as theft dressed in devotion.\n\n---\n\n## Of the relics of the eight, and where they are kept\n\n**Of Saint Ambrelle**, the gauntlet-cloth: the cloth thrown to her and let fall, scorched with the print of ten fingers and two palms. In the Lanthorn treasury; shown at her feast behind glass of the Row's own firing.\n\n**Of Saint Vhairé**, the lamp: iron and river-brass, in an iron cage upon the ford-stone, in all weathers; filled and lit at Vhairestide by the eldest of the Alder boats. It has been stolen twice and come back twice, and the manner of its coming back is not enquired into.\n\n**Of Saint Perrin**, the tuning bone: his jawbone, in a bronze case in the ringing chamber of the Lanthorn tower. The ringers lay a thumb to the case before a full ring. It leaves the tower only at Perrinstide, as far as the door and no farther.\n\n**Of Saint Maren**, the reed-crown: at her church upon the old Cut, in a dry shrine above the mark left by the last great flood. The crypt has stood dry since the river was turned beyond the walls; the crown has never taken water, which the parish still calls the relic's own quiet argument.\n\n**Of Saint Ilvane** the book keeps the elder entry struck. What was hers was within her chapel when the chapel was shut, and was not brought out. The chapel keeps it. There is the anchorhold, and the squint, and alms, and that is what there is.\n\n**Of Saint Coswald**, the trowel: kept not at the Lanthorn but by the lodge at Coswald's Yard, shown at Coswaldstide to whom they please: the wall keeps the saint, the lodge keeps the trowel. His body is in the wall, and needs no shrine, being one.\n\n**Of Saint Gaudry**, the unburned leaf: in the Lanthorn treasury, carried to the Tallage at his Audit, where the sealed brass Gaudry weights are proved against the Tallage stone — relics of use, handled and true.\n\n**Of Saint Belwyn**, the staff: with the Custody in the chapter house, beneath the closed eye. It is shown to no one, which is thought fitting. The Custody, asked what it is like, answers that it is like a staff.\n\n*Here end the lesser lives. Read what is written, and add nothing.*\n\n---\n\n*Designer footnote — the counter-sign mint. Per 02_the_heretic_cell.md §5: a saint's possessive plus a terse image, five plain words or fewer, whisper-plain for STT (no hissing clusters, no rhymes), never repeated within the Namekeeper's living memory — and never Coswald's, for the masons' saint keeps no lantern for them. Burned by canon and corpus: \"Gaudry's, honest weight\"; \"Vhairé's, dry across\"; \"Maren's, upstream\"; \"Belwyn's, unlit\"; \"Ambrelle's, bare hands\"; \"Perrin's, by the palm\"; \"Ilvane's, twice.\" Sign-fertile mints from these lives:*\n\n- *Vhairé: \"Vhairé's, nine crossings\"; \"Vhairé's, burning on the water.\"*\n- *Perrin: \"Perrin's, felt not heard\"; \"Perrin's, the stopped ring.\"*\n- *Ambrelle: \"Ambrelle's, through the fire\"; \"Ambrelle's, the cloth let fall.\"*\n- *Maren: \"Maren's, eyes open\"; \"Maren's, three days.\"*\n- *Ilvane: \"Ilvane's, second candle\" — fertile but hot: an Ilvane sign flags the speaker doubly; reserve for a late quarter.*\n- *Belwyn: \"Belwyn's, before light\"; \"Belwyn's, never stumbled.\"*\n- *Gaudry: \"Gaudry's, one leaf unburned\"; \"Gaudry's, against the coin.\"*\n- *Coswald: none, deliberately — any \"Coswald's\" sign whispered at the grate is a forgery or a trap, and the Wicket knows it.*\n"},"documents/sermon_for_the_feast.md":{"title":"A Sermon for the Feast of the Sole Light","use":"Diegetic document the player may find (a stolen Grey Press leaf); also prompt fodder for clergy, Custody, or Unwalled NPCs, who may quote either the pulpit voice or the margins.","words":1960,"text":"# A Sermon for the Feast of the Sole Light\n\n\u003e Use: Diegetic document the player may find (a stolen Grey Press leaf); also prompt fodder for clergy, Custody, or Unwalled NPCs, who may quote either the pulpit voice or the margins.\n\u003e Canon: 00_canon.md\n\n*Cover-slip of the Grey Press, in grey ink, pinned to the leaf at filing:* Preached in the Great Church of Saint Ambrelle, called the Lanthorn, at the Feast of the Sole Light in the four hundred and thirty-sixth year of the Fabric, by Havise Dorn, Praelucent of Ombreval, lamp-named Serene. Taken in church by ear and set fair for the chapter book by Ansel Tarn, deacon. The margins are in the fair hand, smaller and later; this office gives them in their places, marked thus: [margin]. — *S.R.*\n\n---\n\nChildren of the Light: before there was a wall in the world, there was light.\n\nBefore the Serle found its bed, before stone learned to sit on stone, before any tongue could swear or forswear, the Light was — and of all things made, it alone never disobeyed. Rivers flood; stone cracks; bells go out of true; the tongue we shall come to. But light has kept its first commandment from the first morning to this one: to be one, and to be seen. *Lux una et indivisa.* Hold it like bread, for it is bread, and this feast is the eating of it.\n\n\u003e *[margin]* Two hundred years in the window and never once different. Constancy is her whole proof. It is also its.\n\nEvery honest thing in this city leans on those words. The tollman at the Tallage swears the weight by the light that does not lie; so swears the witness, the bride, the boatman striking hands at Maren's Green. Take that oath away and Ombreval is not a city but a crowd with walls round it. A city is not held up by its walls, whatever the masons tell you. It is held up by its oaths.\n\nAnd the Light is generous with its image: each parish a wick of the one flame, and the flame not divided by the wicks that bear it. No one whispers about candles in a covered lane.\n\nSo — I know why the nave was full at dawn. Not for my preaching: for the west window, for the appearance that has stood in the Great Rose since your mothers carried you. See how carefully I speak of it. Learn to hear as carefully.\n\n\u003e *[margin]* They come because it is the one faithful thing in Ombreval. Not even bread is so constant.\n\nNow hear the Church's mercy plain: to see is no sin. The eye is a door the Light itself made, and what comes in unbidden at that door accuses nobody. Your children have seen it. Your dead saw it. I — your Praelucent does not preach to the blind. There is absolution for the eye, freely, without penance. To see is no sin; to affirm is. What you have seen, bring to the Light's confessors — not to the lane, not to the grate.\n\n\u003e *[margin]* She stopped herself. I stood six feet below; she folded the word away like a letter into a sleeve. She has seen it. She is not blind either.\n\n\u003e *[margin]* To affirm is sin. Then what is it to write?\n\nWhat shows, then, in the eye of the Rose? *Una lux, gemina species*: one light, twofold appearance. What stands in the glass is the Emblem — a granted image, a painting of the Light upon the eye of the Church. You see a moon in the evening pool and do not cry to the watch that heaven keeps two moons. A portrait is not a second person; a seal pressed in wax is not a second king. The image proves no rival but a favour: of all cities under the one sun, it pleased the Light to leave its likeness here, upon our glass. Ombreval, named for shadow, keeps the portrait of the Light.\n\n\u003e *[margin]* A seal takes the colour of its wax. This takes none — red pane, blue pane, the same green-white, and every other light obeys the glass. Her seal argues against her.\n\n\u003e *[margin]* A pool doubles the moon too. Nothing doubles moon, star, torch, or face. Only that, only there — and it walks the lights against the sun's own course. What portrait moves against its original?\n\nAnd bless the hands that made the window. Saint Ambrelle carried burning glass in her bare hands, and under her name your fathers raised this church. The glass does nothing but receive; it is a servant, as wax is, as parchment is. There is no art of man in what you see, and no guilt in Cinder Row. Leave the makers in peace.\n\n\u003e *[margin]* Idonea Sparr wept at her finished rose, said she had made two of something there was one of, and never fired glass again. The maker did not think the glass does nothing.\n\n\u003e *[margin]* In the year 421 I stood the Re-leading scaffold as a Taper. Where a pane was lifted out I set new glass with my own hands, plain glass a week from the kiln. The disc stood in it before the putty had skinned. I signed their paper that I had seen nothing. Now I have written this. One of the two is perjury; let the light that does not lie say which.\n\nNow the warning. Light cannot be double; words can. Man made words in his own image, and a word can face two ways at once; a name can be a little wall with a lie living behind it. So mind your names. The thing in the window has one name, the Church's name: the Emblem. The name of sun — hear how I must say the word to forbid it — belongs to one lamp only. He who tells you in a lane that there are two has added nothing to heaven; he has subtracted an oath from Ombreval — his own first, then yours — until nothing in this city weighs true. If a man would persuade you there are two lights, ask him: which one heard your oath? Which one will keep it?\n\n\u003e *[margin]* \"I must say the word to forbid it.\" Every feast, the Edict borrows the tongue it cut out.\n\n\u003e *[margin]* Which one heard your oath. Both, perhaps. There is the true sermon, and no pulpit will hold it.\n\nAnd there are some — few, pitied, prayed for whether they believe it or not — who say this house is a wall, raised through four hundred years to shut something out of the sky. Look up. Does a jailer cut his wall a window forty feet across, glaze it, and set it where the whole city may look through, any hour the doors stand open? You do not build a dungeon and call it the Lanthorn. This church is raised as a hand is raised when it holds a lamp.\n\n\u003e *[margin]* Any hour the doors stand open. Remember she said this.\n\n\u003e *[margin]* Attergate drowned at the Serle sluice, coming back. Banished men do not swim toward a city they hate. Say that from a pulpit once.\n\nAnd you who are no heretics — mothers, ringers, boatmen — mind your customs too. I know what is done in this nave when the vergers are patient: names spoken into the light; a fevered child carried into a certain beam; a bride stepping wide of a certain shadow; games whose rules no one living taught the children. I say only: the Light is not a well to be shouted down. Your dead need no coloured doorway. They are with the Light — with it, not behind some pane of it. Pray as the Church prays; it has always been enough.\n\n\u003e *[margin]* I spoke my mother's name into it the winter she died. I will not unsay it. Set down the fine with the rest.\n\n\u003e *[margin]* Count both your shadows wherever you go. The children keep a catechism of their own; it asks no one's leave.\n\nYou will say — and are not fined for saying it — that wax will not soften in that beam; that it is a cold light. Good. A figure should not compete with what it figures. The fire is one, and elsewhere, and coming; the window holds the promise, not the flame. Do not warm yourselves at a portrait.\n\n\u003e *[margin]* Cold as a key; I have carried tapers through it since boyhood. She turns even the cold to doctrine. I no longer know whether I watch faith or masonry.\n\nThis afternoon comes the crown of the feast. The appearance will stand in the eye of the Rose, the true sun will come round into the west to stand with it, and for a handful of minutes every doubled shadow on this floor will gather itself and be made one. The Church does not fear your eyes today of all days: look. It is the whole creed acted out on paving stones — whatever seems divided is gathered; whatever seems second is taken up into the first. Pray with me for a clear sky. And if the press at the doors be great — it will be great — be patient with the vergers.\n\n\u003e *[margin]* There is no office for a clouded Concurrence; I have searched the books of the Rite. If cloud comes, the disc stands alone in the eye with nothing to be made one with — and that is the other sermon.\n\n\u003e *[margin]* \"Be patient with the vergers.\" She knew what the Chapter had in mind, or feared it. Mark this line.\n\nGo, then. Swear this year as your grandmothers swore, by the light that does not lie, and let no lane, no grate, no clever grief unswear you. Whatever stands in the window, the Light stands where it has always stood. One. Undivided. Yours. *Lux una et indivisa.*\n\n*Here ends the sermon.*\n\n\u003e *[margin]* Nineteen times she said \"one\". I counted on my knuckles, like a Taper at his offices. A strange number of ones.\n\n*Beneath the last line the small hand fills the foot of the leaf:*\n\n\u003e *[margin]* Within the hour the Chapter barred the nave doors, with the Gradine full and the Passing coming on — the first time in living memory. Over the singing I heard the crying at the west doors, and a child's cry in it. Within, the shadows were made one, exactly as she promised; and the doors were shut exactly as the heretics say the sky was. She preached one light; the Chapter preached with a doorbar. Fair copy and margins are one hand, mine; I can no longer tell which is the fair one. If any read this: the sermon is true, and the window is true, and the two of them cannot both be\n\n---\n\n*[In a third hand, grey ink, at the foot:]* The leaf is trimmed by a binder's knife; the small hand's last line runs off the cut. Razored from the chapter book of the Lanthorn some weeks after the feast, none confessing; bought back across the Tally Bridge in the spring of F.437 for a sum in dry money, the seller not named to this office. Fair hand and margin hand are one: Ansel Tarn, deacon, gone from the rolls since that spring — to Ostrelle under escort, or over the wall by night, the rolls do not say. Verdict: genuine. Value: citable, every margin. Filed in the Grey Press under the Edict of F.244. To be kept, not shown. — S.R.\n"},"documents/the_sparr_deposition.md":{"title":"The Sparr Deposition, as the Leaves Are Sold","use":"diegetic document the player may find — an illegal circulating copy of the sealed F.204 deposition; its answers are street-famous and quotable, and excerpts may be injected into heretic, Custody, antiquary, or glazier NPC context.","words":1878,"text":"# The Sparr Deposition, as the Leaves Are Sold\n\n\u003e Use: diegetic document the player may find — an illegal circulating copy of the sealed F.204 deposition; its answers are street-famous and quotable, and excerpts may be injected into heretic, Custody, antiquary, or glazier NPC context.\n\u003e Canon: 00_canon.md\n\n## The copyist to the reader\n\nWhat you hold is a Bridge copy — the first whole bundle was sold across the Tally Bridge — of the examination of Mistress Idonea Sparr, master glazier of Cinder Row, taken before the Chapter in the two hundred and fourth year of the Fabric and sealed the same day: the oldest paper in the Grey Press. No one outside the Custody read a word of it for two hundred and twenty-nine years. Then, in the year 433, a Custody scribe died, or fled, and a satchel of the Custody's own fair copies went into the city; every leaf since sold, bought back, or copied by candle descends from it. The original has never left the Grey Press.\n\nUnderstand three things. A Sparr page is the costliest contraband in Ombreval; this bundle is nine of them, and one more I will speak of — burn it whole or not at all, for a single leaf sold back sells the seller's face with it. The clerk wrote *the second sun* with a clean conscience, the Edict being forty years unborn; it will not cover yours. And there is a hand in this city — the trade says **the Second Hand**, knowing no better name — that makes young paper speak old words. I have copied what I trust and marked what I do not. Some of these answers you know already; they walk the taverns without their paper.\n\n## The deposition\n\n*[The first leaf]*\n\nIn the two hundred and fourth year of the Fabric, the fourth day after the Feast of Saint Ambrelle, in the chapter house, before the Praelucent Osric Harn, lamp-named Vigil, and Warin Grell, Provost of the Rite, and Bertram Chace, Provost of the Fabric, was examined Idonea Sparr of Cinder Row, master glazier, sworn by the light that does not lie; her answers set down by me, Aymer Pett, clerk.\n\nItem, asked her name and trade. She saith: Idonea Sparr, glazier, as my mother was.\n\nItem, asked what went into the glass of the great west window, and whether the ash of the fire of one-and-seventy were in the melt. She saith: Serle sand from the reed-shoals below the walls; beech ash, fern ash for the greens; the metals the craft appoints — nothing that has not gone into glass since glass began. And that fire's ash is in everything on Cinder Row — the glass, the gardens, the bread. It did not change the bread.\n\n*[The second leaf]*\n\nItem, asked of the work. She saith: the Chapter appointed me in the year 198; the work was five years. I drew every figure full on whited tables, and the Provost of the Fabric passed each before the fire — the obedience of the Light, and in the round we of the craft call the eye, the Sole Light in glory.\n\nItem, asked whether she wrought in any pane a second sun, or any figure that might be taken for one. She saith: none. There is one sun in my cartoons, and I know it, for I drew it. Let the tables be fetched and counted. [The clerk notes: they were, and one sun found.]\n\n*[The third leaf]*\n\nItem, asked of the day the work was finished, and what she saw. She saith: on the eve of Saint Ambrelle, last year, we set the last pane at first light, the morning being clear. I came down and walked to the crossing, to see my window whole, as a master does once. The window was true; every lead lay where I had drawn it — five years of leads. And low in the west lights, great, the bigness of a cartwheel, there stood a sun where I had put no sun; and the sun of heaven stood at my back, over the quire, where at that hour it ought.\n\nItem, asked how she knew it for no reflection, nor trick of new glass. She saith: it stood behind a red pane, and the pane did not redden it. Fathers, all my life light has done what glass tells it; red glass makes a red sun. This keeps its own colour through every pane it stands behind — green-white, like dawn through river ice — and no pane tells it anything.\n\nItem, asked whether she looked long on it. She saith: the length of a prayer. It does not punish the eye. The sun of heaven will not be looked at; this one suffers it. Asked whether that comforted her: no. That was when I wept.\n\n*[The fourth leaf]*\n\nItem, it being put to her, as the Fabric's chronicle has it, that she said that day she had made two of something there was one of, asked whether the words were hers, and what she meant by them. She saith: they were, and are; and I meant what a weaver would mean, that found in her finished cloth a figure she had not woven. One sun drawn, one sun fired, one sun leaded; the window gives back two. What a craftsman makes past his count he has made without meaning it, and cannot unmake, for he does not know which of his motions made it. That is what I meant, and why I wept.\n\nItem, asked whether she meant that she had made the second sun. She saith: I mean that I never saw it before my window was whole, and that it is nowhere my window is not. Whether that is making, you fathers must judge. I have no other word I dare use.\n\n[The clerk has written: the examination was stayed at the third hour, the fathers going apart into the nave, and resumed at the ninth. The Praelucent did not sit again; the Provost of the Rite presided.]\n\n*[The fifth leaf]*\n\nItem, asked what she had observed in the year past. She saith: it rises when the day rises and goes when the light goes, and it goes against the sun — widdershins to heaven; once a day they meet in the west and pass, and neither gives way.\n\nItem, asked in what manner it differs from the sun of heaven, besides colour and course. She saith: it stands still for every eye. The sun of heaven walks pane to pane beside you across the nave; this keeps one pane — the same for me at the font and the sexton at the altar — as a painted figure does. But painted glass borrows its shining and casts no beam. This casts its own, cold — wax set in it a summer day keeps its corners — and aslant the true; where the two lie together they lie apart, like oil and water in one cup, and a body standing in both has two shadows, the second faint, cold, and aimed wrong.\n\n*[The sixth leaf]*\n\nItem, asked whether she held her oath good, sworn by the light that does not lie. She saith: I swore it and I hold it. Asked whether, having seen what she deposes, she doubted the form of it: I have never seen light lie. I have seen it be two. Admonished that this was perilous speech, and asked whether she would amend it: I will amend it when the window does.\n\nItem, asked who beside herself had seen it. She saith: whoever has stood in the nave with open eyes on a bright day. Asked their names: Cinder Row is a name; take it.\n\nItem, admonished on her obedience to speak of the matter to no one. She saith: you may seal my mouth, and this paper with it. The window is forty feet wide.\n\n*[The seventh leaf]*\n\nItem, asked whether she would return to her furnace. She saith: no. Asked why: a master answers for all her window shows. I cannot answer for mine.\n\nItem, asked what she believed the thing to be. She saith: I can tell you what it is not. It is not in the glass as colour is in glass, for I put the colours in, and I did not put it. It is not in the sky as the sun is in the sky, for the sky from the roofs is empty of it. Do not ask what I let in, for I do not know that I let in anything, and I do not know that I did not.\n\n*[The eighth leaf]*\n\nItem, asked whether she desired anything of the Chapter. She saith: that you leave the window whole. Whatever else it is, it is five years of my life, and true work, and true work is not the world's most common thing.\n\n## The unnumbered leaf\n\n*[Set between the eighth leaf and the ninth in many bundles; of disputed authority. I give it as I found it.]*\n\nItem, asked whence the second light comes. She saith: out of the glass's remembering. Glass keeps the sky it cooled under, as the eye keeps a flame it has looked on. We annealed the great lights under open heaven, and what heaven held above them then, the window holds now. Asked what heaven held then. She saith: what the window holds. Two.\n\n*[Concerning this leaf. No one quarrels over the paper; every leaf in the city is young. The quarrel is whether the words are old. Against it: the true leaves are numbered in Pett's hand, this one in no hand; and* glass keeps the sky it cooled under *is the very catechism of the Colmites, preached by Colm Attergate ninety-seven years after this ink was supposed dry. For it: its lovers say the leaf lent the doctrine its words, read in secret long before Colm; there is no answering that, and no proving it. The Custody pays more for this leaf than for any numbered one — proof it is true, say its lovers; proof, say its doubters, that the Custody pays dearest for whatever it fears is loose. And the Second Hand has never been caught; so every bundle is his until proven otherwise. Including, reader, this one.]*\n\n## The ninth leaf\n\nItem, the deposition being read back to her, asked whether she would set her hand to it. She saith: to every leaf. [She signed each leaf, and cut her mark beside: a small diamond, such as glaziers make.]\n\nItem, it being now near dark, the fathers withdrew to confer upon what should be asked further, or whether aught should. She was bidden wait in the nave, where the light was going.\n\n*[Here the ninth leaf ends, filled to its last rule, and here ends every bundle I trust. Whether the fathers came back with one question more, and a tenth leaf holds her answer, or asked nothing more, and there was never more paper than this — no copy tells, and the Grey Press, which alone could tell, buys back even the asking. She waited in the nave. That is the last thing anyone wrote down.]*\n"},"documents/trial_records.md":{"title":"The Glaziers' Trial of F.288 — Surviving Leaves of the Sealed Record","use":"diegetic document — contraband excerpts of the sealed trial record, loose in the city since the Ledger Theft of F.433; findable or purchasable in-game, read aloud at Unwalled meetings, and injectable as context for Custody, guild, mason, or archivist NPCs.","words":2398,"text":"# The Glaziers' Trial of F.288 — Surviving Leaves of the Sealed Record\n\n\u003e Use: diegetic document — contraband excerpts of the sealed trial record, loose in the city since the Ledger Theft of F.433; findable or purchasable in-game, read aloud at Unwalled meetings, and injectable as context for Custody, guild, mason, or archivist NPCs.\n\u003e Canon: 00_canon.md\n\n*A fair copy in a chancery hand, the sewing broken, several leaves wanting; the press-mark of the Grey Press scraped from the first page, but not well.*\n\n---\n\n## The Bill\n\n[fol. ii] Be it known that the warden and lodge of the masons of Ombreval, by Bartrem Stott their warden, do accuse the guild of the glaziers of Cinder Row, and namely the journeymen Tomelin Vasse, Gilles Loder, and Herry Fane, who in the two years past re-set panes of the Great Rose: that they, by an art that is no honest craft, did fix or renew in the said window a false light, to the deceiving of pilgrims, the fattening of the guild's purse, and the dishonour of the Sole Light, contrary to the creed *Lux una et indivisa*. And this the lodge will prove.\n\nThe bill was laid before the Chapter in the last of winter; the three named were put to the Question in the spring. Gilles Loder was not brought to the hearing, having died in the keeping of the court; the manner of it the record does not give.\n\n## The Court\n\n[fol. iii] Proceedings taken in the chapter house of the Great Church of Saint Ambrelle, the sixth day after Ambrelle's feast, in the two hundred eighty-eighth year of the Fabric, before the Praelucent Amaury Vair, lamp-named Vigil, assisted by the Provosts of the Fabric and of the Rite; Fulk Ottey, notary of the Chapter, writing.\n\nFirst the Edict of two hundred and forty-four was read aloud, and every witness charged that the thing seen in the west window be named the Emblem and nothing else, on pain of fine; and every witness was sworn by the light that does not lie, the hand spread above the taper. *(The bill itself could not be read as written; the forbidden word stands in it four times. The court fined its own accusers before the first witness was sworn. This is recorded without comment.)*\n\n## The First Witness\n\n[fol. ix] **Bartrem Stott, warden of the masons' lodge, of Coswald's Yard, sworn.**\n\nHe says that from the north triforium, where the lodge kept scaffold two summers past, he saw the false light stand in the glass at dawn, high in the eye, green as pond-ice. That his mason's level, stood on the pavement, cast two shadows, and the false shadow leaned toward Cinder Row. That at the re-setting he heard the accused whispering over the panes, words he could not make out.\n\nHe says further: \"Saint Coswald mortared the breach with his own body and got a side altar. The glaziers made a window and got the whole church. Now the window makes pilgrim coin, and the second s—\" *(here the witness was fined a bell-coin, and paid it angrily)* \"—the Emblem, then. The Emblem makes them rich. Ask who profits by it. Ask the guild. I have asked it in the Yard these two years, and I will ask it here, fine or no fine.\"\n\n## The Second Witness\n\n[fol. xvii] **Wystan Crake, corn-measurer at the Tallage, aged three score and eight, sometime choirboy of the Lanthorn, sworn.**\n\nHe says he sang in the quire as a boy, before the Edict, when men still said the green sun out loud in the nave and no one blinked. *(He was warned as to the word. He said he was old, and the word was older.)*\n\nHe says that in his boyhood, a generation before the accused were born, the light stood in the rose exactly as it stands today. That at dawn it does not stand high, saving the warden's word, but low and great in the lights, and climbs through the day against the sun's own going, the way a bargeman poles against the stream. That late in the day the two share the window and once pass each other, which the boys called the Kiss, the crossed beams laying an X down the nave where the boys would knot their two shadows for a game.\n\nAsked its colour, he says: the colour of dawn under river ice. *(The court asked him to say it again, and he said it the same.)*\n\nAsked whether its beam carries warmth, he says the choir once stood a candle-stub in the green beam a whole afternoon, and it never wept a drop.\n\nAsked whether it hurt the eye, he says no; you may look as long as you like, and the eye takes no hurt of it. He looked long, as a boy. He said men leave off looking all the same, and could not tell the court why.\n\nAsked whether the light is changed in fifty years, he was silent a space, and then said: \"No. And I have thought on that more than on my sins.\"\n\n## The Third Witness\n\n[fol. xxx] **Maud Alder, widow of a boatman, of the Cut, sworn.** Her statement being taken, she was questioned upon it.\n\nAsked whether she holds that she came into the nave by the north door, at the thirty-day office for her husband, she says yes, by the north door; she has used no other door her life long.\n\nAsked whether she holds that the office stood at noon, and that two beams lay crossed upon the bier like sword-blades, she says yes, at noon, she is sure of the hour.\n\nAsked whether she holds that the green beam was warm upon her hands, she says yes, sirs, it warmed me, whatever any candle-stub may say; it was the only warm thing in that church.\n\nAsked its colour, she says: white. White as a dead man's lip. Then she says: green, or white and green both. Then she says: \"It was the colour of being cold. I know no better word.\"\n\nThen the proctor for the lodge pressed her, saying: say plainly, widow — was it a second sun that you saw? And the Provost of the Rite warned her that to affirm a second sun is citable under the Edict, whatever the proctor promised.\n\nThe witness stood a long moment between them, and said: \"I unsay it. All of it. There was no light. There were candles at the bier, a great many candles, and I was tired, and I saw candles.\"\n\n*(The witness here wept. The court remitted her earlier fine and excused her. She was led out by the south door, and at the door she asked which door she had come in by. No answer is recorded.)*\n\n[The leaf that bore her first statement is wanting. See the note at the end of this record.]\n\n## The Fourth Witness\n\n[fol. xxxv] **Aymon Harl, clerk of the Fabric, sworn upon the ledgers he keeps.**\n\nHe says the Great Rose was glazed by Master Idonea Sparr, finished in the two hundred and third year, and that none of the accused was born within fifty years of the setting. That the re-leading named in the bill stood on the south side of the rose, not the north; the ledger is before the court. That the north porch stood shut with scaffold from Bellday to Bellday that half-year, and whoever came into the nave came by the south or the west, whatever they remember.\n\nAsked what the viewing of the Emblem brings the Fabric in a year, he gave the sums; the court struck them to the private schedule. The lodge's grievance as to money he conceded true, and said that truth of grievance is not proof of sorcery.\n\nAsked whether the Emblem is changed in his time, or in the ledgers before his time, he says the records describe it in the same words for sixty years; that he has checked; and that he wishes he had not.\n\n*(In one thing only were all the witnesses of one mind: that the light does not hurt the eye that looks at it. In colour, hour, and door, no two agreed, and each swore honestly. The court let it stand.)*\n\n[fol. xxxix] *(Here Averil Sparr, master of the glaziers' guild, of Idonea's line, prayed that the deposition taken of Master Idonea Sparr in the two hundred and fourth year be unsealed and read, that the court might hear what the maker said of her window. The court answered: what was sealed in wisdom stays sealed in wisdom. Denied, and minuted.)*\n\n## The Fifth Witness\n\n[fol. xl] **Tomelin Vasse, journeyman glazier of Cinder Row, one of the accused, produced.** Being unable to spread his right hand above the taper, he was sworn with it laid open in his left.\n\nAsked whether he stands by his confession made at the Question, that the journeymen sang over the glass and called the light into it, he says: \"I said what the Question asked me to say. It asks kindly at first, and then it does not ask. I unsay the calling. The singing I never denied. Every shop on Cinder Row sings when the lead goes in, so the hands keep time and the strips sit true. It is a work-song. It is about a girl in Ostrelle. I could sing it for the court, if the court wishes.\" *(The court did not wish.)*\n\nAsked its colour, he says he does not know the mix. He named over the greens a shop can make — copper-green, iron-green, bottle-green — and said it was none of them. Asked to say more, he looked at his hand a while and said nothing more.\n\nNot asked, he said further: \"We keep the glass. The light was in the window before my grandsire was born. It was not us. We are only the ones who wash it.\"\n\n## The Probation by Pane\n\n[fol. xlii] That the matter be proved, not merely sworn, the court removed to the nave at the strong hour. Item, the pane chosen by the accusers themselves was taken whole out of the rose and the gap left open to the sky. Item, a pane of new white glass, made that same day under the accusers' own eyes, of sand and ash of their own choosing, no hand of the guild touching it, was carried to the window and set in lead by a glass-wright brought from Ostrelle. And the court stood at the crossing, and looked.\n\n[Here five leaves are wanting: fols. xliii to xlvii.]\n\n## The Verdict\n\n[fol. xlviii] IT IS FOUND, this court having seen what it has seen, that the light in the Great Rose is **no art of man**; and that the charge of sorcerous glass is not proven, nor could be proven, nor shall be brought again.\n\nAnd the court says further, for the quiet of the city, holding to the Edict as it is written in its seventh article — *nothing binds the eye; to see is no sin, to affirm is* — that to have seen this light is no sin in any soul of this city, and to affirm it is another matter, and so it shall be held until better comes.\n\n## The Sentence\n\n[fol. xlix] The accused are released without stain. The guild of the glaziers shall pay a fine of peace, in the sum the Chapter shall appoint — not for guilt, of which the court finds none, but for quiet, of which there is need — and shall make good the disturbed pane at its own cost. The lodge of the masons is admonished, and bears its own costs. All present are sworn to silence upon the whole matter, by the light that does not lie. This record is sealed; the verdict shall not be cried at the Bellstand, nor posted, nor read.\n\nFulk Ottey wrote this.\n\n---\n\n## Archivist's Note\n\n*In a later hand, unsigned, after the custom of this office.*\n\nTwo wants in this record, that the reader be not deceived by its neatness.\n\nFirst: fols. xliii to xlvii, being the whole probation by pane, were lifted from the binding in the first year of the Custody, by minute of the first Provost-Custodian, and lodged in the inner press, where they remain. The minute is signed; nothing else in this business is. Every copy since — this one too, by whatever road it came to you — was made from the record thus shortened. The thief of four hundred thirty-three did not carry off those five leaves; they were never there to steal.\n\nSecond: the leaf that bore the widow Alder's first statement was cut out at the sewing. The stub shows a knife, not age. No minute records the hand or the year. Her unsaying is kept; her saying is gone. Consider what manner of keeping that is. This office does not know whose knife.\n\nWhy it matters. Without the probation, the verdict stands like a keystone with no arch under it. *No art of man* — but shown by what? The lodge holds to this day that the arch was never built and the guild was bought clear; the guild, that it was built and hidden; and there are those in the covered passages who read the words as the court confessing something older than craft. All three readings live because five leaves are elsewhere. A verdict without its ground is not a truth; it is a seed.\n\nAnd mark the witnesses. Five were sworn honestly by the light that does not lie, and no two of them had stood before the same window. Green and white, noon and the strong hour, the north door and the south, a warm beam and a cold one. Do not conclude that any lied. Conclude that memory is glass of another sort: it lets the light through and colours it in passing, and no one can hold their own pane up against another's sky. This record disagrees with itself in colour, hour, and door — which is the ordinary condition of truth in Ombreval, and the keeping of it is this office's whole trade.\n\nWhoever holds this copy holds everything the trial said, and nothing the trial saw.\n"},"design/00_vision.md":{"title":"The Second Sun — Feature Vision","use":"design spec for developers — player fantasy, pillars, emotional loop, scope tiers, and non-goals for the Second Sun as a feature; not for NPC context injection.","words":2727,"text":"# The Second Sun — Feature Vision\n\n\u003e Use: design spec for developers — player fantasy, pillars, emotional loop, scope tiers, and non-goals for the Second Sun as a feature; not for NPC context injection.\n\u003e Canon: 00_canon.md\n\n**This is a proposal. Nothing described here is implemented; the Second Sun (entry 1) does not yet exist in the game.**\n\nVision document for entry 1 in `features/50_cool_suggestions.md`. All fiction defers to the canon bible; section references (§) are into `00_canon.md`. Related unimplemented ideas (entries 5, 6, 9, 13, 25, 36 there) are nodded to where natural and depended on nowhere.\n\n## The player fantasy\n\nYou noticed something the game never pointed at. Standing in the nave of the Lanthorn you glanced up through the Great Rose and there were two suns, one of them the wrong colour, and when you stepped outside to check, the sky was ordinary. Nobody told you to look. No marker flared. You tested it yourself — screenshots, doorways, the doubled shadow at your own feet — and then you said something about it out loud, near people, with your actual voice, and the city heard you. Now a chandler watches you at market, a funeral bell has started to sound like a key turning, and a grate in a covered passage will open if you can work out what to whisper into your real microphone. You are not the chosen one. You are the newest person to notice, in a city that has been carefully not-noticing for two hundred years, and both of the institutions built on that silence would like a word.\n\n## Design pillars\n\n**1. The sun never performs.**\nDemands: the phenomenon is a render-layer fact and nothing else (§2) — visually perfect, verifiable by eye and F5 screenshot, identical on every visit for every player forever. Every observable in §2 — the wrong green-white, the unfiltered colour through stained panes, the countergait, the no-parallax, the double shadows, the beams that do not mix — is enforced by the renderer, not by narrative claim.\nForbids: any reaction to the player. No pulsing when approached, no whispering audio bed, no gameplay buff from standing in the beam, no particle flourish at quest beats, no boss form. It carries no warmth (wax does not soften in it) and it carries no mechanics. The moment the sun does something, the dread dies. Its entire power is that it is merely, stubbornly there.\n\n**2. Nobody is ever told the truth.**\nDemands: the designed ambiguity of §3f is a binding constraint on every system we build — dialogue, quests, documents, endings, achievements, debug output. The Custody's archive proves only what the sun is *not*. The heretics are wrong on purpose. The player can learn everything both factions know and still not know what it is.\nForbids: an NPC who knows; a findable document that explains; a quest reward of revelation; a sidecar prompt that leaks a mechanism to an LLM actor (actors must not be *able* to spill a truth we never authored); and the softer failure — implying a truth through art direction, achievement names, or file names a datajunkie will decompile. The phenomenon has no explanation *anywhere*, including in our own code comments.\n\n**3. Knowledge lives in voices and stone, not menus.**\nDemands: every fact the player needs is diegetic and already representable — chalk on a lintel, a bell counting years, a rhyme children skip to, a name spoken at a grate, an NPC's durable memory. The rumour ledger (§10) with its truth values is the feature's real database, injected as sidecar context.\nForbids: a quest log, a journal, a codex that \"unlocks\", objective markers, a faction reputation bar, any HUD element at all. If the player wants a record, that is what F5 screenshots and their own notes are for — the game already treats screenshots as the player's survey journal, and this feature leans into it. If a beat cannot be communicated through the world and the actors, the beat is redesigned, not the UI.\n\n**4. The microphone is a place in the world.**\nDemands: the player's real voice is the only door into the conspiracy, and it is a *located* voice — heard by every actor within the 20 m radius, bystanders included. The pass exchange at the Gaunt Passage grate (§5) is deliberately built for this: short, phonetically plain, kind to speech-to-text; a given name plus a five-word counter-sign in a strict mintable form. Whispering at arm's reach of the grate must feel physically furtive because it *is* — the player lowers their actual voice in their actual room.\nForbids: a dialogue-wheel fallback that trivialises the exchange; passphrase entry via text box as a primary path; voice-print gimmicks; punishing STT variance with instant burn (the Wicket's deflection line and the marked-face escalation in §5 are the *designed* failure path — mundane, unsettling, recoverable once). Any accessibility fallback must preserve the costs: proximity, bystanders, one chance to get it wrong.\n\n## Why this is the identity feature\n\nThe game's three unique assets are an always-open microphone, LLM actors with durable memory, and a renderer whose subject is impossible light. Every other candidate feature uses one or two. This one requires all three, load-bearing, simultaneously:\n\n- **Impossible light** provides a mystery no scripted game can offer honestly: the evidence is *actually in the renderer*. The player does not take the game's word that shadows fall two ways — they stand in the nave and count their own. The broken-pane rule, the countergait, the Passing: all real, all screenshottable, none narrated.\n- **LLM actors** provide a society that can *respond to noticing*. The Custody Doctrine (\"to see is no sin; to affirm is\", §3b) is a prompt, not a cutscene — a wick-priest actor genuinely absolves the sight and genuinely stiffens at the affirmation. Two hundred years of institutional not-saying can be performed by actors who each hold their own slice of §10 and their own reasons.\n- **The open mic** makes the player's noticing *audible*. In any other game, discovering a secret is private. Here, saying \"second sun\" within 20 m of the wrong stall is an event that enters memories and travels. The whisper at the grate is the inverse: the one time the game asks you to speak *quietly*, and means it.\n\nNo other game can do this because no other game has a hot microphone wired into a candlelit heresy. That sentence is the pitch.\n\n## The core emotional loop\n\n**Notice** — *private confusion.* The player sees two suns through the rose and half-assumes a render bug. This is intended and precious: the first witness experience is indistinguishable from doubting your own graphics card. Nothing acknowledges the sighting. Do not tutorialise this beat; protect it.\n\n**Doubt** — *destabilised curiosity.* The player self-tests: step outside (gone, §2.5), other windows (nothing), back inside (there). They are re-deriving the Custody's two centuries of method without knowing it. The design goal is that the player invents the F.288 experiment on their own before ever hearing it existed.\n\n**Verify** — *earned certainty, and loneliness.* Screenshots. The double shadow. Watching the Kiss lay its X down the nave. And then the social wall: every NPC deflects. The priest absolves without penance. The verger changes the subject for a coin. The player now *knows*, provably, and discovers that knowing is not the same as being allowed to say. This loneliness is the emotional fuel for everything after.\n\n**Be noticed** — *exposure.* Somewhere in the verify phase the player has spoken. A moth heard, or a neighbour did; either way, someone lingers near them at the Wickmarket, or their own phrasing comes back warped in a crier's patter. The feeling flips from \"I am watching the city\" to \"the city was watching me watch\". This beat costs no content beyond memory injection and the existing hearing radius — it is emergent, which is why it lands.\n\n**Be recruited** — *initiation and complicity.* The trail is authored but unmarked: a pauper's funeral, a bell striking once per year of a life, a name chalked on the charnel door, a diamond chalked at the Needle, a grate in Gaunt Passage. The player cracks the rule (§5: the name is public; the rule is the secret) and whispers into a real microphone in a dark cellar — the specific thrill of doing something clandestine with your body, not your cursor.\n\n**Choose** — *weight without a menu.* Keyhole or Breach, Custody or cell, or the long walk away — and over it all the F.437 Concurrence and the unanswered doors question (§4, the Shut Door). The choice is never presented; it is enacted, by where the player stands, what they carry, and what they say aloud, to whom, within earshot of whom.\n\nThe loop then re-enters at **Be noticed** from the other side: the player is now somebody *other* players of the social simulation — the Custody, the cell, the moths — notice, doubt, verify, and recruit against.\n\n## Layering onto existing systems — no new UI\n\n- **Renderer.** One additional sun disc composited only where the sightline passes through rose-glass to sky, from interior positions; one additional cold directional light valid only within the Lanthorn interior volume, giving the grave-shadow and the contradictory godrays. Countergait is a mirrored solar ephemeris. The no-parallax (§2.6) falls out of rendering the disc in glass-space rather than sky-space. All deterministic, all screenshot-stable.\n- **STT and the 20 m radius.** The pass exchange is ordinary speech to the sidecar — the counter-sign's mintable form (\"saint's possessive plus terse image, five plain words or fewer\") exists precisely to survive transcription. No amplitude detection required at any tier; arm's-reach proximity to the grate plus content suffices. Overhearing risk needs zero new code: the grate exchange is speech like any other.\n- **Actor memory and goals.** Cell membership, suspicion, sightings, the current pass and counter-sign are durable memories in the authoritative sidecar. The §10 ledger rows are prompt fodder with truth values, exactly what `lore/AGENTS.md` says lore is for.\n- **Items within 4 m.** Pilgrim badges, green-dipped candles, bell-coins, forged and genuine Sparr pages — the contraband economy uses the existing offer/accept verb unchanged. A Sparr page changing hands at the Tally Bridge is the item system plus context, nothing more.\n- **Audio and calendar.** The name-knell of Maren Smallvoice and the chalked lintel are the pass-rotation \"UI\": one audio cue and one texture swap, both diegetic. Quarter-feasts already live in the calendar hooks (§8).\n- **Testing.** `fake_backend: true` must cover the full grate exchange deterministically, which requires a drive-mode path for injecting a synthetic transcript (a small `say \u003ctext\u003e` action in `CATHEDRAL_DRIVE` is the likely shape). The render facts of §2 are screenshot-assertable via the existing drive `shot` action.\n\n## Scope tiers\n\n**T0 — the illusion (minimum shippable).** The §2 render package: disc through rose glass only, green-white, countergait, double shadows indoors, gone outside, dawn-showing through to the daily Passing. Plus roughly a dozen ledger rows (§10, statements 1–8) injected as ambient rumour context so actors can gossip about it. No cell, no quest. *Effort:* one renderer feature, one light rig, prompt-pack text. *Proves:* the sight alone generates player conversation and screenshots; actors discussing a thing the renderer actually does is already unlike any other game.\n\n**T1 — the cell and the pass.** Saint Maren's charnel door with sim-driven chalk; the name-knell; the Needle's chalk diamond states; the Gaunt Passage grate; Grigor Ashe as Wicket with the full §5 exchange, deflection line, and marked-face escalation; one meeting scene (bede-roll, sky-drawing, the recitation carrying next quarter's counter-sign). *Effort:* a handful of placed props and states, one interior, three to five seeded actors, sidecar pass logic. *Proves:* the microphone-as-key loop end to end — that a rule-based, uncracked-by-UI puzzle (attend the funeral, read the lintel, learn what the knell means) is solvable by attention alone, and that STT holds up under whispering players.\n\n**T2 — the church answers.** The Custody as an active force: Rasp's office, Pike's odd-hour keys, Brant as unknowing moth, the grey clerk at funerals; moth reports generated from actually-overheard player speech; a Gradine recantation as public theatre; the page trade through Lise Copp; two or three questlines (recover an alleged Sparr page; find the moth; assist Ferrant's measurements and watch his theory die again). *Effort:* the big tier — a dozen seeded actors from §7, quest content, economy tuning. *Proves:* two institutions reacting to the same open microphone create stakes without any karma system; the rumour network can carry §10's truth values under adversarial pressure.\n\n**T3 — the alignment event.** The Concurrence of F.437 (§2.8, §8): the Passing centred in the eye, every doubled shadow in the nave fusing for a handful of minutes; crowd assembly on the Gradine; the doors question as a live, influenceable situation; the Unwalled's forbidden verse sung in the nave; the clouded-Concurrence failure honoured — if the weather system says overcast, the feast simply fails, and the city takes it hard. *Effort:* one scheduled citywide event, crowd staging, weather coupling, choral audio. *Proves:* the game can stage its loudest moment with no cutscene and no UI, and hold Pillar 2 — the mystery survives its own spotlight — under maximum player scrutiny.\n\nEach tier ships whole. T0 without T1 is still a wonder; T1 without T2 is still a conspiracy; nothing in a lower tier assumes a higher one exists.\n\n## Non-goals\n\n- **Explaining the sun.** Not in T3, not in DLC, not in a director's commentary. §3f is permanent.\n- **Combat or violent resolution.** The Unwalled do not kill (§10.27); the Custody prefers records to bodies. Betrayal, deflection, and architecture-as-punishment are the whole threat model.\n- **Faction meters, reputation bars, join-screens.** Standing is held in actor memories or nowhere.\n- **Extending the phenomenon.** No beams landing three streets away (that is ledger row 30, an unconfirmed street tale, and stays one), no night appearances, no second moon. Nothing else doubles (§2.10). Entry 5's wandering-light survey is a different feature and must not bleed in.\n- **Voice biometrics or amplitude-gated stealth.** Tempting, out of scope, and a trap for players with cheap microphones.\n- **Making the pass hard for the transcriber instead of the player.** Difficulty lives in learning the rule, never in fighting STT.\n\n## What makes it fun\n\nNot \"atmosphere\". These moments:\n\n- **The doorway test.** Leaning your camera across the west door's threshold to watch a sun blink in and out of existence. Every player invents this within a minute of noticing, and the game rewards it with perfect consistency. Fun = a hypothesis confirmed by your own hands.\n- **The broken pane.** Climbing to the triforium to look through the one gap where a pane is missing and seeing a single ordinary sky through the hole (§2.1). Canon says everyone who tests it goes quiet afterward. Playtesters do too. Fun = a twist delivered by geometry.\n- **Counting the knell.** The moment the slow bell stops meaning \"someone died\" and starts meaning \"the password changed\" — and you catch yourself counting strokes to guess an age. Fun = re-perceiving an ambient sound as a mechanism, forever.\n- **The whisper.** Leaning toward your own microphone at midnight, housemates asleep, actually whispering \"Old Sef walks\" at a grate, and hearing the bar scrape back. Fun = your body doing the verb.\n- **Hearing yourself come back wrong.** A joke made in the Wickmarket returns days later from a stranger on the Tally Bridge, warped into something with teeth, and you can triangulate it back to whoever heard you. Fun = detective work against your own past voice.\n- **Feeding the moth.** Suspecting an informer, handing them a false name and an empty cellar, and watching who arrives. The cell's own method (§5), turned by the player. Fun = a sting operation built from nothing but speech, memory, and patience.\n- **Standing in the crossing at the strong hour** beside actors who are praying, haggling, and taking notes in grey, while two suns share one window above all of you — knowing which of your neighbours knows, and who is pretending not to. Fun = dramatic irony you earned, in a crowd that is actually thinking.\n\nThe through-line: every one of these is the player acting on the world with attention, voice, and position — the three inputs this game owns — and the world visibly, durably answering.\n"},"design/01_the_light_rules.md":{"title":"The Light Rules: A Testable Specification of the Second Sun","use":"design spec for developers — the observable rules of the Second Sun stated as acceptance criteria a graphics programmer can implement from and a tester can verify by eye and F5 screenshot; nothing in this document is implemented.","words":3698,"text":"# The Light Rules: A Testable Specification of the Second Sun\n\n\u003e Use: design spec for developers — the observable rules of the Second Sun stated as acceptance criteria a graphics programmer can implement from and a tester can verify by eye and F5 screenshot; nothing in this document is implemented.\n\u003e Canon: 00_canon.md\n\n## 0. Status and scope\n\n**This is a proposal. Nothing below exists in the game.** No render layer, no second light, no interior gate, no Concurrence clock. This document turns the observable canon (00_canon.md §2) into numbered, testable rules with player-visible proofs. Where it decides something canon is silent on, the decision is marked **[spec decision]** and binds later documents unless canon is amended.\n\nTwo principles govern everything:\n\n1. **The phenomenon is identical forever.** Two hundred years of in-world records describe it without variance; therefore no randomness, no drift, no per-save variation. Same hour, same pane, same colour, every playthrough. Determinism is the horror.\n2. **Fail dark.** Wherever the implementation must choose between wrongly showing and wrongly hiding — threshold straddles, reflection probes, portal edges — it hides. An absence inside the Lanthorn is a defect; a presence outside it breaks canon §2.5 (\"one sun, one shadow, always\") and cannot be walked back.\n\n## 1. Definitions and datum points\n\n- **The Lanthorn interior volume** — the enclosed air of the Great Church of Saint Ambrelle: nave, aisles, crossing, transepts, choir, triforium and clerestory walks. Excludes the crypt, the porches, and the Gradine.\n- **The sill** — the threshold plane of each exterior door. The interior volume ends here, exactly.\n- **Rose-UV** — the two-dimensional coordinate space of the Great Rose, pane by pane. **The eye** is its central round light (canon §1).\n- **The mid-stone** — a worn octagonal slab at the centre of the crossing floor **[spec decision — minted]**: the viewing datum for the Concurrence and all \"seen from the crossing\" criteria. Four centuries of feet have dished it.\n- **The paying bench** — verger furniture against the north arcade, third bay from the west doors **[spec decision — minted]**: angled so a seated adult's sightline passes through the lower lights of the rose to open sky. Verger Dunstan Pike positions it; pilgrims pay; the placement is discovery choreography (§9).\n- **Hours.** *Dawn* (sunrise), *the dawn-showing* (first hour after sunrise), *forenoon*, *noon*, *the strong hour* (late afternoon, both suns in the rose), *the Passing* (the daily crossing; its time walks through the year), *last light* (sunset), *night*.\n- **The grave-light** — the implementation's name for the second, interior-gated illumination source; its shadow is the **grave-shadow** (canon §9.3). Never surfaced in UI or dialogue; NPCs use the canon vocabulary (Emblem / Green Sun).\n\n## 2. Rule L1 — Visibility\n\n**L1.1 The one condition.** The disc renders when and only when all of the following hold: (a) the camera is inside the Lanthorn interior volume; (b) the sightline from the camera passes through glass currently leaded into the Great Rose; (c) beyond that glass lies sky — clear or clouded, but sky, not scaffold planking, canvas, or masonry; (d) the hour is between dawn and last light.\n\n**L1.2 Any pane.** Every pane of the rose transmits it equally: coloured, grisaille, or plain; original Sparr glass or new glass leaded in yesterday (canon §2.2, truth #10). No panel is privileged. The eye matters only as the Concurrence target (L6), not as a transmission condition.\n\n**L1.3 Gaps show nothing.** A missing pane, an open light, a hole in the glass: the gap shows one ordinary sky. The disc never bridges a gap; its edge clips exactly to the leading **[spec decision: hard clip, no feathering]**. This is the broken-pane fact that makes witnesses go quiet, and it must survive close inspection from the triforium walk.\n\n**L1.4 Sky occlusion.** Canvas or scaffold planking hung outside a pane blanks that pane's share of the disc while the pane stays visible. This is the Custody's only off-switch (the Fabric pretext, canon §6.5) and must work per-pane, since the F.419–421 Re-leading proceeded light by light.\n\n**L1.5 Other windows.** All other glass in the world shows one sky. A rose pane carried elsewhere shows nothing (canon §2.2). Replica glass shows nothing anywhere.\n\n**L1.6 Nothing else doubles.** One moon, single stars, single flames (canon §2.10). The grave-light pairs only with the sun; candlelight, torchlight, and moonlight never gain a green twin.\n\n**Proof.**\n- Standing on the mid-stone at forenoon on a clear day, the player sees a green-white disc in one pane of the rose, and one ordinary sun through any side window they turn to.\n- Standing on the triforium walk beside the rose at forenoon, with one pane removed for \"repair\", the player sees the disc clipped dead against the leading and plain sky through the hole.\n- Standing on the Gradine at the same minute, looking up at the rose from outside, the player sees ordinary glass and one sun.\n\n## 3. Rule L2 — Colour and intensity\n\n**L2.1 The colour.** A cold green-white — canon's swatch is \"dawn seen through river ice\". One authored chromaticity, fixed forever; it must read as green-white against every tint of rose glass and against gold nave light. No time-of-day tinting, no atmosphere scattering applied to the disc itself.\n\n**L2.2 It ignores the pane.** Sky and cloud seen through a red pane redden; the disc in that same pane stays green-white (canon §2.3, truth #2). The disc is composited after glass tinting, not before. This is the first wrongness witnesses name and the single most important pixel-level criterion in this spec.\n\n**L2.3 It permits the eye.** Looking straight at the disc costs nothing: no bloom flare, no exposure crush, no eye-adaptation punishment; its luminance clamps near paper-white **[spec decision]**. Looking at the true sun through a clear pane must still punish — full bloom and adaptation — so the contrast is felt in the player's own flinch. The permission unsettles more than the colour (truth #3).\n\n**L2.4 Size.** At the dawn-showing the disc subtends roughly twice the true sun's diameter, low in the western lights; it tapers as it climbs, and by the Passing it matches the true sun closely enough that at the Concurrence the two discs superpose edge to edge **[spec decision]**. The taper is the same every day of a given season.\n\n**Proof.**\n- Standing on the paying bench at forenoon, the player sees the disc hold its green-white while the clouds around it take the red of the pane it stands in.\n- Standing anywhere in the nave, staring at the disc costs nothing; turning to the true sun through a clear side pane punishes at once.\n\n## 4. Rule L3 — Anchoring and the countergait\n\n**L3.1 No parallax.** At any instant the disc occupies one position in rose-UV, identical for every eye in the building (canon §2.6, truth #6). Implementation shape: the disc is anchored to the glass, not to a sky direction — a rose-space element, not a skybox element. A walker crossing the nave watches the true sun slide from pane to pane; the disc does not move by one lead-width.\n\n**L3.2 The countergait.** The disc's rose-UV path is authored per season and runs against the true sun's course (canon §2.7):\n\n- **Dawn.** As the true sun crests at the city's back (east, behind the choir), the disc brightens with the dawn sky — no pop-in — already low and huge in the western rose: the dawn-showing, the most crowded hour.\n- **Day.** It climbs the lights against the sun's course while the true sun crosses the southern sky.\n- **The strong hour.** Late afternoon, the true sun comes round into the west; both stand in the rose.\n- **The Passing.** Once daily their apparent positions cross, as judged from the mid-stone. The crossing point walks through the year; only on the Concurrence does it land in the eye.\n- **Last light.** The disc fades with the failing sky. Never seen at night (L5.1).\n\n**L3.3 Beams follow a virtual source.** Though the visible disc is pane-anchored, its beams enter the nave as if cast from the disc's stated position and sweep the floor with the hour (canon §2.6). The beam direction at every hour must contradict the true sun's: at the dawn-showing the green beams run west to east down the whole nave axis while true dawn light enters from the choir end; at the strong hour both enter from the west at differing pitch and skew, which is what draws the X (L6.2).\n\n**Proof.**\n- Standing on the mid-stone at forenoon and then walking to the west doors, the player sees the true sun cross three panes and the disc stay fixed in its one pane the whole walk.\n- Standing at the dawn-showing anywhere on the nave axis, the player sees a huge low disc in the western rose behind them and its long green beams running toward the altar, against the true dawn.\n- Standing at the strong hour on the mid-stone, the player sees both suns in the rose at once.\n\n## 5. Rule L4 — The light indoors\n\n**L4.1 What doubles a shadow.** A doubled shadow is cast only by the pair {true sun, grave-light}. Any shadow-caster lit by both — pillar, NPC, dropped item, the player's body or shadow proxy — casts one warm true shadow and one faint, cold, differently aimed grave-shadow. Objects lit by neither, or by candles alone, cast singles (L1.6).\n\n**L4.2 Where it reaches.** The grave-light illuminates exactly the interior points with an unobstructed line to the rose glass — shadow-mapped from the virtual source of L3.3. Side chapels around corners get none; the crypt gets none; step fully into a pier's own grave-shadow and your second shadow vanishes while your true one stays. Doubling is strongest inside the direct beam footprints on the nave floor; a weak green fill within line-of-sight of the rose keeps second shadows faint but findable elsewhere **[spec decision]**; falloff to zero outside line-of-sight, hard.\n\n**L4.3 No mixing.** Where a green pool crosses a true sunbeam pool, the two overlap without blending into a third colour: each pool keeps its edge and colour inside the other's light, and each shadow keeps its edge and colour inside the other's pool (canon §2.4, truth #4). Implementation latitude is total; the acceptance is pixel-blunt: nowhere in the overlap may a yellow-green mongrel tone appear.\n\n**L4.4 No warmth.** The grave-light couples to nothing physical: no heat, no wax-softening, no gameplay stat, ever. If a candle or wax simulation is added, green beams are excluded from it by rule. The dread is that it does nothing — except be seen.\n\n**Proof.**\n- Standing in a green beam footprint at forenoon, third bay of the nave, the player sees two shadows of the nearest pillar diverging on the floor, one warm, one cold.\n- Standing at the strong hour where the beams cross, the player sees gold and green pools overlapped, each shadow keeping its own edge inside the other's light, and no mixed tone anywhere along the seam.\n- Standing behind the north-west crossing pier, out of line-of-sight of the rose, the player sees their second shadow gone and their first intact.\n\n## 6. Rule L5 — Night, cloud, storm; Rule L6 — the Concurrence\n\n**L5.1 Night.** Nothing. The disc keeps the sun's hours exactly. The night-storm apparition of canon §2.9 is AMBIGUOUS-BY-DESIGN and is **never rendered, under any condition** — it exists only in NPC testimony, and no two testimonies agree. Do not build an easter egg. There is no flag for it to hide behind.\n\n**L5.2 Overcast.** When cloud smothers the true sun, the disc persists as a pale coin burning through the overcast (\"the clouds do not know it\"), and its beams persist into the nave at reduced strength — during the Great Rains of F.362 the only sunlight in the city stood in the nave, and that scene must be reproducible. Under full overcast, nave shadows are single and green: there is no true shadow to double.\n\n**L5.3 Daytime storm.** When lightning whitens every pane of the rose for a frame (a nod to unimplemented storm ideas; do not depend on them), the disc alone does not brighten: its luminance is exempt from the flash exposure, a steady cold coin in a sheet of white (canon §2.9, truth #8).\n\n**L6 The Concurrence** — the fortieth day after Coswaldstide, once a year, weather permitting. Let T0 be the instant the Passing centres in the eye as judged from the mid-stone. Minute by minute, clear sky:\n\n- **T−30.** The strong hour opens; both suns in the rose; the nave fills (or the doors shut — F.436 is the live fuse, not this spec's business).\n- **T−12.** The crossed beams lay their X down the nave floor; through these minutes the X's arms close like scissors.\n- **T−6.** The discs stand within one pane of each other; every grave-shadow in the nave is visibly rotating toward its true twin.\n- **T−3.** Both discs enter the eye. From the mid-stone they close edge to edge.\n- **T−2 to T+2 — the fusion plateau.** The two lights superpose. Disc superposition is exact only from the mid-stone (the true sun keeps its parallax; the disc keeps its anchor). Shadow fusion is directional and therefore nave-wide: the grave-light's beam direction aligns with the true sun's, the footprints fall congruent, and every doubled shadow in the building fuses into one **[spec decision: superposition is viewpoint-exact at the datum; fusion is global]**. Within the congruent pool no mongrel tone may appear.\n- **T+3.** The discs part; across the nave every shadow splits again, all at once.\n- **Clouded Concurrence.** If overcast smothers the true sun through the window T−3 to T+3, the pale disc burns alone in the eye, there is nothing for its shadow to fuse with, and the feast simply fails (truth #7). No partial credit.\n\n**Proof.**\n- Standing on the mid-stone at T0 on a clear Concurrence, the player sees one disc in the eye and casts one shadow; screenshots at T−6 and T0 differ by exactly the fused shadows and the closed X.\n- Standing in the third bay (off-datum) at T0, the player sees two discs almost, not quite, one — and still casts one shadow.\n- Standing on the mid-stone at T0 under cloud, the player sees the pale coin alone in the eye and the nave dark: the feast has failed.\n\n## 7. Rule L7 — Flight, thresholds, reflections, screenshots\n\n**L7.1 The sill is absolute.** Crossing any exterior door line, the disc and all grave-light vanish between one step and the next — instantaneous, no fade **[spec decision: the pop is canonical; witnesses describe the pools \"going out like a snuffed wick\"]**. Re-entering restores them identically.\n\n**L7.2 Looking in from outside.** From the Gradine through open west doors, the nave floor shows true sunlight only: the grave-light renders only for a camera inside the interior volume. Two people straddling the sill disagree about what the floor shows; that is the phenomenon's nature, not a bug **[spec decision, supported by canon §2.5 and the Shut Door crowds wanting in]**.\n\n**L7.3 Flight outside.** A flying player over the rooftops finds one sun and nothing else, forever (canon §2.5, §3f). Looking back at the rose from the air: ordinary glass, no green glow on the west front, no anomalous light anywhere on the dry Cut. There is nothing to find outside, at any altitude, and the implementation must make that boring rather than glitchy.\n\n**L7.4 Flight inside and degenerate cases.** Flying within the nave, the rules hold unchanged (the triforium criteria already assume elevated eyes). For a camera straddling glass, clipping the window plane, or hovering in a doorway: apply the interior gate with a hysteresis band of about half a metre, and inside the band **fail dark** — never a frame of the disc rendered to an exterior eye. An inside player who briefly sees one sun has met a defect the fiction can absorb; an outside player who sees two has broken the bible.\n\n**L7.5 Reflections.** The beams and pools are ordinary light indoors and shade as light. The disc follows the sightline rule: in principle a mirror inside the Lanthorn that hands the eye a path through rose glass to sky shows it (canon kills the mirror only when carried out the door). But the game plans no true mirrors, so screen-space and probe reflections simply exclude the disc's layer: a missing reflection is canon-safe, a wrong-placed one is not. Normative for any future reflective surface, including standing water indoors.\n\n**L7.6 Screenshots.** F5 and drive-mode screenshots capture exactly what the camera renders: the disc appears in every inside shot with a rose sightline and in no outside shot, ever. Canon §1 makes the phenomenon \"verifiable by eye and F5 screenshot\" — the capture path must not exclude the layer.\n\n**Proof.**\n- Standing one pace inside the west doors at forenoon, the player sees green pools on the floor; one pace outside, at the same second, the floor is gold only.\n- Flying a circuit of the west front at the strong hour, the player sees ordinary glass in the rose from every angle and one sun in every screenshot.\n- Standing at the crossing and taking an F5 screenshot at the Passing, the player finds the X and both discs in the file.\n\n## 8. NPC sight\n\nThe authoritative sidecar, not the renderer, decides what NPCs perceive; it must apply L1 verbatim: any NPC inside the volume with a rose sightline during sun-hours is told the Emblem is visible and in which pane (one pane for all, L3.1). This enables the two-eyes test: the player at the mid-stone and an NPC on the triforium name the same pane for the disc and different panes for the true sun — Doctor Ferrant's broken measurement performed live.\n\nThe one exception is the Spared (canon §9.8), whose testimony is AMBIGUOUS-BY-DESIGN (canon §3f): whether they truly cannot see it, or lie, is never resolved. But a perception feed must still do *something* for a Spared-flagged actor (the corpus instantiates at least one, in 05_dramatis_personae), and either naive choice — sending the sight line or a bare silence — hands an unguarded model a fact it will resolve out loud. So the spec decides the mechanism without deciding the answer **[spec decision]**:\n\n- **No sight events.** A Spared-flagged actor receives no Emblem sight event, ever. This is fail dark (§0) applied to perception: withholding asserts nothing — an actor told of the sight has been told they see; an actor told nothing has merely been told nothing.\n- **A seed guard.** The Spared actor's prompt seed carries an unwavering, itself-ambiguous self-model — to the effect of: *you have never seen it; whether your eyes or your tongue differ from your neighbours', you yourself do not know — never waver, never explain, never wonder aloud which it is.* The guard exists because the absence of sight events is, to a model, still an input; without it the actor resolves the question in dialogue and breaks canon §3f.\n- **The flag never leaks.** The flag's own name is mechanism and follows the grave-light rule (§1): never surfaced in UI or dialogue, and — since players read save files and telemetry too —
