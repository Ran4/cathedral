it, and the city will take that hard.\n\n**Where the doubling is strongest.** Two shadows want two lights on one body. The most legible doubling is early: mid-nave on a bright morning, warm light from the quire behind, the cold lance coming level from the west, the shadows aimed near opposite ways — here children play twinning on Bellday and mothers hold newborns \"for the spare shadow.\" The deepest is the strong hour at the crossing, where the pools overlap without mixing, each shadow keeping its edge inside the other's light. The doubling ends at the porch threshold: one step outside, one sun, one shadow, always.\n\n**Watchers.** In daytime thunder the storm-watchers gather along the eighth bay: when lightning whitens every pane of the rose, the disc alone does not brighten — a steady cold coin in the white. Grey clerks attend every dawn-showing, watching not the window but the crowd; Betriss Marle is there daily, embroidering (secret: the cell's sky-recorder).\n\n## Passages, pinches, and meeting grounds\n\n(This section is cell knowledge throughout, secret unless noted; of it the Custody knows only what F.428 taught it — Gaunt Passage's existence, not its workings.)\n\n**Gaunt Passage** (primary meeting site). A covered passage behind the salt-cellars near the Tallage, running under the Gaunt house — a salt-factor's hall whose line is long extinct, which is how a passage keeps a family's name. Why this passage: it is blind. Both mouths open off doglegging lanes, so no straight sightline reaches either entrance; the flanking salt-cellars have vents but no windows; and salt gives Grigor Ashe lawful traffic at every odd hour — barrows, weighing, cart-loads — under which a dozen arrivals disappear. An overhead bridge crosses the western lane a house short of the mouth; a watcher on it sees both approaches. At the dark midpoint, a barred grate in the cellar wall: the whisper is given there, within arm's reach, below the pitch any bystander could catch. Escape is through Ashe's cellar into a bonded weighing yard whose two cart gates open on different doglegging lanes. The Whisper Arrests happened here; the cell believes a door raided once will not be raided twice (they are guessing).\n\n**The Draper's Reach** (secondary site; the \"low\" mark). The covered gallery of the cloth halls, between Coswald's Yard and the Wickmarket. Its arcade sheltered a crowd in the Hammering while adjoining roofs and upper walls failed; repaired bays are heavily braced, several upper rooms remain shut, and the trade is smaller than the building around it. The meeting place is above the gallery: the surviving tenter loft, where cloth is stretched to dry — lawful ground for half the cell's trades, reached by stairs at either end, so no single door can be stopped. From the loft's louvres a watcher sees the gallery below and both squares beyond. Escape is over repaired roofs: an overhead bridge joins the north loft to the next block, and the jettied upper floors make a broken second street of the rooftops. Its weakness is daylight: cloth work ends at dusk, and a loft light after dark would show from Coswald's Yard, so it serves small day meetings only.\n\n**Saint Maren's crypt** (tertiary site; the \"doorside\" mark; burial days only). Meetings happen after a pauper's burial, while the charnel stair remains lawfully open and mourners, gravediggers, and market traffic cover the arrivals. Entry is by the churchyard charnel door, above whose lintel the sexton chalks the newest buried name — the cell's one joke about itself, never spoken aloud: the key is written over the lock (secret: the pass is the newest name the cell's coin buried; the name is public, the rule is everything). The beaten earth and lime of the crypt show every footprint, so the last pair rakes both smooth before leaving. Sexton Noll Fitch chalks plain, rings the name-knell slow, keeps the hinge oiled, and says nothing, on purpose. A grey clerk now attends paupers' funerals, noting who lingers at the door (true; the cell knows, and lingers anyway, singly).\n\n**The Needle** (signal site, never a meeting). The narrowest pinch in Ombreval, shoulder-wide, threading from the back lanes of the Wickmarket down toward the Tallage — a route half the cell walks lawfully every week. Everyone passes in single file, eyes on their feet; no one lingers, because two cannot stand abreast; nothing overlooks the midpoint but a bricked cellar-light under a projecting jetty (and Ede of the Needle, behind it). A glazier's diamond chalked there is seen by every passing neighbour and watched by no one: high, Gaunt Passage; low, the Draper's Reach; doorside, Saint Maren's crypt after a burial; struck through — a cracked pane — scatter.\n\n**Bellfoot Passage** (a false friend). The covered passage beneath the watch-bell tower stair looks made for conspiracy and has never once been used: it lies in the one square where the Custody's eyes are permanent. A twice-wrong whisperer is *fed* a false meeting far from every true site — an empty brine-rotted cellar off Tanners' Slip, behind Maren's Green, chosen because nobody the cell loves goes near it.\n\n## The Serle, the dry Cut, and the bridges\n\nThe working Serle lies beyond the south wall. Its water carries barges and eels and the reflection of one sun only; no light of the disc has ever stood there, in a rain-barrel, or in a mirror carried out the west doors (true). Inside the walls the Cut is dry and crowded with carts. Watermen report the river's single sun without wonder, the way they state depth; citizens can repeat the testimony but cannot verify it without leaving the playable city.\n\n**The Tally Bridge** (at the Tallage). Stone, two arches over the Cut street, joining the toll-house to its bonded warehouse. Lise Copp's pawnshop faces it, and across her counter the city's costliest contraband moves both ways: stolen archive pages outward to the Unwalled, the same pages bought back for the Grey Press, moth-money in \"dry\" coin.\n\n**The Eel Bridge** (at Maren's Green). A low timber gallery bridge from the fish hall to the Alder warehouse across the market lane. Its stair is so narrow that a porter with an eel basket makes walkers wait. From its rail the charnel door's chalked lintel is in plain view across the churchyard — the one place the name can be read without lingering at the door — so careful neighbours read it from the bridge, and the grey clerk has lately taken to standing on it.\n\n**The Old Sluice** (east end of the Cut). A dry stone gatehouse left from the working channel, and where Colm Attergate drowned in F.301. Wyn Alder walks pilgrims to one arch; it is not the arch; the family keeps the true place as a trade secret and is not sorry. On Colm's Night green-dipped candle stubs appear in the dry grate, and the keeper rakes them out without comment, paid from two purses to have seen nothing.\n\nThe street tale of a rose-beam landing in a courtyard three streets away now names Skinners' Court, north of the Gradine; nothing has ever been seen there (never confirm).\n\n## The pilgrimage of observation\n\nThe walk a stubborn citizen makes to satisfy themselves the thing is real, in the order that convinces.\n\n1. **The Gradine, before first light.** The rose is dark glass; one sun comes up where it should, behind the city. Fix that in mind — the last ordinary thing of the morning.\n2. **The west doors, at the dawn-showing.** Low in the western rose stands a second disc, green-white — dawn seen through river ice. Look straight at it. It permits this. The true sun never has.\n3. **The red pane.** Move until the sky stands behind the Burning of Cinder Row light — the deep-red panel of the fire of F.171, low in the north of the rose (II-7). The clouds behind it redden; the disc does not. Every light in the world obeys the glass; count what that leaves.\n4. **The walk across.** Cross the nave, aisle to aisle, watching the true sun's glow swim pane to pane as you move. The disc stays in its pane. Ask a stranger at the far pillar which pane it stands in; they will name yours.\n5. **The two shadows.** Stand mid-nave in the green lance, morning light warm at your back. Hold out a hand: two shadows, one warm and true, one faint, cold, aimed wrong — the grave-shadow. Hold a drop of Wickmarket tallow in the cold beam. It will not soften.\n6. **The threshold.** Walk out the south porch mid-thought. One sun, one shadow, always. Walk back in. Two.\n7. **The gallery.** Verger Pike opens the triforium stair at odd hours, for coin. From the gallery, call down to a companion on the pavement and each name the disc's pane. The same pane, from floor and gallery both — as if the thing were *in* the glass. The stop after which people stop talking.\n8. **The strong hour.** Return before vespers. Both suns in the one window; the pavement striped warm and cold; then the Passing, the crossed rays' X laid down the nave. The grey clerks will note your face, without malice, as they note everyone who stays for both showings in one day.\n9. **The Tally Bridge, at dusk.** End beneath its two dry arches. Every porter, cart, and arch casts one honest shadow as the sun goes out beyond the roofs. Whatever you now believe, you hold it in a city where street and sky agree against the one room that does not.\n\nThe pilgrim who finishes has verified every public fact and explained none of them, which is the city's own condition. Some go quiet. Some go to the Wickmarket for candles. A few find their walks bending past the Needle, and begin, without quite deciding to, to read the chalk.\n\n---\n\n*A last note for the shelf: nothing in this gazetteer moves. The disc keeps its hours, the marks keep their meanings, the clerks keep their doorways, and the river beyond the walls keeps its one sun. In Ombreval the geography is certain and the light is not; the streets have made their peace with that by walking around it daily and calling it the way to market.*\n"},"11_glossary_and_naming.md":{"title":"Glossary and Naming Handbook of Ombreval","use":"reference for writers and generators — canonical vocabulary, naming rules, and the calendar; entries may be injected singly into sidecar NPC context, except daggered entries, which are secrets.","words":2893,"text":"# Glossary and Naming Handbook of Ombreval\n\n\u003e Use: reference for writers and generators — canonical vocabulary, naming rules, and the calendar; entries may be injected singly into sidecar NPC context, except daggered entries, which are secrets.\n\u003e Canon: 00_canon.md\n\nA dagger (†) marks a secret: inject only into NPCs canon says know it. Entries stop where the street's knowledge stops; the truth-value ledger governs everything deeper.\n\n## I. Glossary\n\n**The anchorhold** — cell in the north wall of the Ilvane Chapel (mortared shut F.290), occupied unbroken since F.211; its squint opens on the lane.\n\n**The Attestation †** — the signed witness required of each new Praelucent since F.289: taken alone to the crossing at the strong hour, made to look, made to sign.\n\n**Badge-money** — revenue from licensed pilgrim badges of the Emblem — sold while forbidden to describe; part-funds the Custody.\n\n**Bell** — the silver coin of Ombreval, stamped with the Bellstand's watch-bell; the street says *bell-coin*. Twelve copper **sparks** to the bell (\"not worth a spark\"); sixty bells to the lantern. In the street a spark is called a *penny*, and always has been — the coin says spark, the mouth says penny, and no clerk has ever won that argument. A loaf, two sparks; a journeyman's day, three bells; a pauper's funeral with knell, eight.\n\n**Bellday** — the weekly holy day; the nave at its fullest.\n\n**The Candor** — the street's name for the Church of the Sole Light; nearly affection.\n\n**The charnel door** — Saint Maren's churchyard door; the sexton chalks each buried soul's given name on its lintel until the next burial.\n\n**Cinder Row** — the glaziers' street, burnt F.171 and rebuilt; workshops of the Sparr line.\n\n**The Concurrence** — the alignment feast, officially the **Feast of the Sole Light**, the fortieth day after Coswaldstide: the Passing centres in the eye and every doubled shadow fuses. Under cloud it simply does not happen.\n\n**The counter-sign †** — the cell's quarterly second pass: a saint's possessive and a terse image, five plain words or fewer (\"Belwyn's, unlit\"). Turns at the first meeting after each quarter-feast.\n\n**The countergait** — the second sun's motion against the true sun's course.\n\n**Cracked pane †** — the struck-through chalk diamond: pass and counter-sign burned; scatter.\n\n**The Custody of the Eye** — grey office founded F.289, its emblem a closed eye, its patron Saint Belwyn. Its public teaching is the **Custody Doctrine**: *to see is no sin; to affirm is.*\n\n**The Cut** — the filled former city stretch of the river **Serle**, now an unusually straight trade street and district. The river was diverted beyond the south wall in F.363–369; dry places kept the working names water left them.\n\n**The dawn-showing** — the disc low and huge in the western rose at clear sunrise; the day's most crowded viewing.\n\n**The Draper's Reach** — covered gallery of the cloth halls; the standard ell of Ombreval is an iron rod nailed there.\n\n**The Edict of F.244** — makes calling the Emblem a \"sun,\" a \"second sun,\" or \"the green sun\" a citable offence: fines, recantation on the Gradine.\n\n**The Emblem** — the mandated term for what shows through the rose: a granted image, no sun at all. ***Una lux, gemina species*** — one light, twofold appearance.\n\n**The eye** — the central round light of the Great Rose.\n\n**The Fabric** — the cathedral works; also the era: F.1 is the first stone, and the present year is F.437.\n\n**Gaunt Passage** — covered passage beneath the salt-cellars of the old Gaunt house, near the Tallage. † Its cellar grate is the Unwalled's door.\n\n**The Gradine** — the cathedral's stepped ceremonial forecourt: processions, recantations, and, at the Shut Door, the crush.\n\n**Grave-shadow** — the cold, faint, differently aimed second shadow cast indoors under the rose. On a bride: ill luck.\n\n**The Great Rains** — three weeks of overcast and flooding in F.362. They broke the Cut, drowned lower streets and stores, and began the decline of the old waterside city. In the nave, the Emblem was Ombreval's only visible sunlight; the Custody arrested forty people over what that meant.\n\n**The Green Almanac †** — the cell's cloth sky-map, charted from spoken observations at sky-drawing.\n\n**The Green Sun** — the forbidden street name. Saying it near the wrong ears costs money.\n\n**The Grey Press** — the Custody's archive, F.204 to yesterday. That it exists is known; what it holds is not.\n\n**The Hammering** — ordinary name for the **Great Hail** of F.415: an extraordinarily localized late-summer storm that killed thousands through hail, falling buildings, fire, meltwater, and the failure of old foundations. Formal records prefer *Great Hail*. No cause is established.\n\n**Hammering rolls** — incomplete lists of the F.415 dead assembled from household, rent, guild, parish, and survivor testimony. A name proved from them may still receive a belated knell.\n\n**The hours** — the Candor's seven offices: the **Watch** (deep night), the **Kindling** (before light), **Dayspring** (sunrise), **High Wick** (noon), the **Waning** (mid-afternoon), **Lamplight** (sunset), the **Snuffing** (curfew).\n\n**Keyhole and Breach †** — the heresy's factions: the Keyhole holds the rose sacred, the one honest eye; the Breach whispers that the building itself is the wall.\n\n**Lantern** — the gold coin of the Ostrelle mint; in Ombreval mostly money of account. \"A lantern says otherwise\" ends arguments.\n\n**The Lanthorn** — the Great Church of Saint Ambrelle: formally that, and never called it.\n\n**Lead †** — a sworn member's one contact above their light; named for the strips that hold glass.\n\n**Light †** — a heretic cell of three, as the lights of a window; about nineteen sworn in all, who call one another **neighbor**.\n\n**The lodge** — the masons' lodge at Coswald's Yard; unforgiving of the glazier saint, and of a verdict of F.288 it was never shown.\n\n**The Long Departure** — the loss of households after the Great Rains and, especially, during the twenty-two years after the Hammering. It was migration from damage, weak trade, disputed property, cost, and ill reputation—not a magical compulsion.\n\n**The Luminary** — supreme head of the Candor, far off in primatial Ostrelle: invoked, feared, ignored.\n\n***Lux una et indivisa*** — the creed: one light, undivided. From it, the oath of every contract and verdict: ***\"by the light that does not lie.\"***\n\n**Maren Smallvoice** — Saint Maren's passing-bell; it rings the **name-knell**, one slow stroke per year of the life. Free to paupers whose burials are paid.\n\n**Measures** — cloth by the **ell of Ombreval**; river cargo by the **Serle tun**; salt by the **salt-weigh**; all proved against the **Tallage stone**, chained in the customs square, and the sealed brass **Gaudry weights**. The chandlers' pound runs heavy by charter, \"for the wick's sake.\"\n\n**Moth †** — a paid Custody informant, paid in **dry money** laundered through the pawnshop at the Tally Bridge. Some moths do not know they are moths.\n\n**The Namekeeper †** — keeps the **bede-roll**, the cell's list of its dead, read at every meeting.\n\n**The Needle** — the narrowest pinch in the city, shoulder-wide; \"past the Needle\" is beyond saving. † Among the children's chalk at its midpoint, sometimes, a glazier's diamond.\n\n**The Orphan** — the Lanthorn bell whose baptismal record burned. Folk distrust an unnamed bell, and stand out from under it.\n\n**The pass †** — the living key to a meeting: the given name of the most recently buried soul the cell's coin paid for, public on the charnel door and the knell. The name is public; the rule is the secret.\n\n**The Passing** — the daily crossing of the two lights in the western rose, late in the **strong hour** (late afternoon, both in the window); the street says **the Kiss**. Crossed rays lay an X of light down the nave.\n\n**The Praelucent** — governor of the Lanthorn and the city's spiritual life; open to women; the incumbent is Havise Dorn, lamp-named Serene.\n\n**Quarter-feast** — one of the four feasts quartering the year: Vhairestide, the Feast of Saint Ambrelle, Coswaldstide, Wet Alms. † The Unwalled count Colm's Night in Vhairestide's place.\n\n**The Question** — judicial torture: in the archive, with three deaths against it; not used in living memory.\n\n**The ring** — the Lanthorn's bells: **Great Ambrelle, called Gravemouth**, the bourdon (*SOLI LUCI CANO*, \"I sing to the sole light\"); **Coswald Ironthroat**, the alarm; **Vhairé Farcall**, fog and flood at the outer Serle wharves (*SICCA TRANSIVI*); **Perrin Evenblow**, the hours; **Gaudry Truetongue**, the court (*PONDUS IUSTUM*), cast last, F.365, youngest of the ring; and the Orphan. Full ring at the Concurrence and the quarter-feasts.\n\n**The Ruin** — the ring rung backward, greatest bell first: fire or flood. Drop everything.\n\n**The Scold** — the Bellstand's old watch-bell: secular, hired, never christened. Rings the Snuffing curfew and gathers the square for proclamations.\n\n**The Shut Door** — last year's Concurrence scandal, F.436: the Chapter barred the nave doors at the Passing; a crush on the Gradine; a child's arm broken.\n\n**Sky-drawing †** — the meeting rite: those who saw the Emblem that week describe its pane and colour aloud for the Green Almanac.\n\n**The Spared** — the few who claim to see only one sun through the rose; pitied, envied, doubted.\n\n**A Sparr page** — any alleged leaf of the sealed deposition of F.204; the costliest contraband in Ombreval.\n\n**The squares** — the five: the **Wickmarket** (west; wax and tallow), **Coswald's Yard** (north; stone and timber), the **Tallage** (Serle customs on the dry Cut), **Maren's Green** (south-east; fish and eel smoke), the **Bellstand** (east; proclamations). The Gradine is counted apart.\n\n**The Tallage** — the customs square on the dry Cut: Serle tolls, the chained weights, bonded warehouses, and pawnshops facing the **Tally Bridge**. Freight comes by cart and porter from the outer wharves.\n\n**The Tracer †** — the hidden head of the Unwalled, as the tracery holds all lights; unknown even to most of the sworn.\n\n**Twinning** — the children's game of contorting until one's two shadows touch hands.\n\n**The Unknelled** — those Hammering dead who received only common mourning tolls when individual name-knells became impossible. Traditional objection: **“one bell is not a name.”** The word names a cultural and religious grievance, not a confirmed supernatural condition.\n\n**The Unwalled** — the heresy's own name; the Custody's files say **the Attergate error** or **Colmites**; the street says **the Greensick**.\n\n**The Unwalling †** — the heresy's far hope, and its forbidden verse: ***Lucem non murabis*** — *you shall not wall the light*.\n\n**Wet Alms** — winter feast of bread at the nave door, kept since the Great Rains of F.362; the fourth quarter-feast.\n\n**Wick-priest** — a parish priest: \"each parish a wick of the one flame.\"\n\n**The Wicket †** — the cell's doorkeeper at the grate. A wrong whisper meets weather-talk, and a marked face.\n\n## II. The Rules of Naming\n\n### Citizens\n\nA citizen is a given name and a byname. Bynames come from trade, street, origin, feature, or event; they are earned or inherited, never chosen — a chosen byname marks a fraud. Families of standing fix theirs (Sparr, Copp, Stott, Dorn, Alder; lesser lines: Ashe, Marle, Fitch, Pike, Brant, Vell, Rasp, Ferrant). A woman keeps her byname at marriage. The poor often carry a one-syllable small name and nothing after.\n\nGiven names — men: Aubin, Colm, Corin, Dunstan, Grigor, Hamel, Jos, Noll, Segwin; also Ansel, Bertran, Ewart, Gile, Renn, Tobin. Women: Aldith, Betriss, Ede, Havise, Idonea, Jonet, Lise, Osanne; also Averil, Clemence, Petronel, Rohese, Sibbe. Small names: Pin, Ib, Cobb, Sef; also Dob, Mote, Nan, Tib. New family names run short and consonant-heavy: Crake, Hobbe, Skell, Tarn.\n\n1. *Gile Salter* — trade.\n2. *Petronel Roper* — trade; the ropewalk on the Cut.\n3. *Ede of the Needle* — street.\n4. *Renn of the Bellstand* — square.\n5. *Clemence of Ostrelle* — origin; origin bynames invite questions.\n6. *Tobin Upstream* — origin; boat-born beyond the south wall.\n7. *Cobb Threefinger* — feature.\n8. *Sef the Long* — feature.\n9. *Averil Wetalms* — event; born at the feast.\n10. *Bertran Scaffold* — event; earned on the Fabric works.\n11. *Wyn Alder* — fixed family.\n12. *Sibbe Crake* — fixed family, lesser line.\n\n### Streets, passages, bridges\n\nStreets are named for trades, damage, saints, or shape — never for living people — and renaming follows only calamity (Cinder Row was the Glassmakers' Row until F.171). Passages take the name of what they pass beneath. Bridges take working names — their toll, cargo, or keeping — never saints' names. The Tally, Eel, and Chain bridges kept river-working names after the Cut went dry: Ombreval is as reluctant to rename a bridge as water.\n\n1. *Tenterhook Lane* — trade; the fullers' frames.\n2. *Cinder Row* — damage.\n3. *Burnt Court* — damage.\n4. *Maren's Slip* — saint\n5. *The Needle* — shape.\n6. *Crookneck Lane* — shape.\n7. *Eelback Alley* — shape; humped, cobbles like a spine.\n8. *Gaunt Passage* — beneath the Gaunt salt-cellars.\n9. *Malt Passage* — beneath the malt-house at Coswald's Yard.\n10. *Bellfoot Passage* — beneath the watch-bell tower.\n11. *The Tally Bridge* — toll; stone arches carrying an upper passage across the dry Cut.\n12. *The Eel Bridge* — cargo; a timber gallery over the fish-market lane at Maren's Green.\n13. *The Chain Bridge* — keeping; inherited from the former harbour chain-house.\n\n### Bells\n\nA church bell is christened at casting like a baptism: the guild that paid stands godparent; the name is two parts, a saint and a voice-word; a motto is cast into the waist in the bell's own first person; the mould is broken after. A recast bell keeps its name. Voice-words: -mouth, -voice, -throat, -tongue, -call, -blow, -cry, -tone. Secular bells are hired, not christened.\n\n1. *Great Ambrelle, called Gravemouth* — bourdon; *SOLI LUCI CANO*.\n2. *Coswald Ironthroat* — the alarm.\n3. *Vhairé Farcall* — fog and flood; *SICCA TRANSIVI*, \"dry I crossed.\"\n4. *Perrin Evenblow* — the hours.\n5. *Gaudry Truetongue* — the court; *PONDUS IUSTUM*, \"just weight.\"\n6. *Maren Smallvoice* — the passing-bell of Saint Maren's.\n7. *The Orphan* — counter-example: name burned, trust with it.\n8. *The Scold* — counter-example: secular, so never christened.\n9. *Ambrelle Clearcall* — a mintable chapel bell.\n10. *Belwyn Stillcry* — a mintable pattern for a bell rung seldom.\n\n### Offices and feasts\n\nThe Candor names its offices inside one metaphor — light and its keeping, fabric and its keeping. Latin belongs to creed and motto; office takes plain speech: Luminary; Praelucent (\"who shines before\"); Provost of the Fabric; Provost of the Rite; Provost-Custodian; Canon of the Rose; wick-priest; verger; sexton; Taper (a novice). The Custody does not christen its clerks; they are grey, and that is name enough. A Praelucent's lamp-name is a virtue a flame can have — Vigil, Serene, Taper-of-Dawn; mintable: Constant, Clear-Burning, Even-Flame, Late-Kindled, Sheltered — though the street uses the family name anyway.\n\nFeasts: formally *Feast of Saint N—*; the street clips it to *-stide*. Feasts of act are named for the act done; a struck feast leaves a nameless day. Examples: Feast of Saint Ambrelle (street: Ambrellestide); Coswaldstide; Vhairestide; Marenstide; Perrinstide; Gaudry's Audit (street: Weighday); Belwyn's Dark; the Feast of the Sole Light (street: the Concurrence); Wet Alms; Colm's Night (unofficial); Bellday; and the nameless day that was Ilvanestide until F.290.\n\n## III. The Calendar of Ombreval\n\nYears count in the Fabric era; dates are located by feast, chronicle-style: \"the third day after Coswaldstide, F.436.\" The year is quartered by the quarter-feasts, and the year-number turns at Vhairestide — the first stone was laid on Saint Vhairé's ground. The week runs seven days: **Bellday** first, **Highmarket** third (the Wickmarket, Coswald's Yard), **Lowmarket** sixth (the Tallage, Maren's Green; salt is weighed there); the rest are counted (\"second after Bellday\"). The day runs by the seven hours, rung on Perrin Evenblow; curfew is the Scold's.\n\nThe year, from spring:\n\n- **Colm's Night** (early spring; unofficial) — a green-dipped candle burnt at home for Colm Attergate; the Unwalled's private first quarter.\n- **Vhairestide** (spring; first quarter-feast) — first boats blessed at the wharves beyond the south wall; the year-number turns.\n- **Perrinstide** (late spring) — the ringers' feast; the bells washed and greased; alms to the deaf.\n- **Feast of Saint Ambrelle** (early summer; second quarter-feast) — glass carried in procession from Cinder Row to the Gradine.\n- **Marenstide** (late summer) — eel fair at Maren's Green; the drowned remembered.\n- **The Hammering anniversary** (late summer; civic observance, not a feast) — common mourning toll at the Waning; names of the Unknelled spoken or the toll refused in traditional households.\n- **The nameless day** (early autumn) — Ilvanestide until F.290; the almanac leaves it blank; the anchoress keeps it, alone, in the wall.\n- **Coswaldstide** (autumn; third quarter-feast) — scaffold-blessing; the annual brawl over F.288.\n- **The Concurrence** (fortieth day after Coswaldstide) — shadows fuse, weather permitting; this year, after the Shut Door, the doors question waits.\n- **Wet Alms** (winter; fourth quarter-feast) — bread at the nave door.\n- **Belwyn's Dark** (midwinter) — the Custody's patronal day; the one office of the year sung unlit.\n- **Gaudry's Audit** (late winter) — Weighday: the Tallage stone and Gaudry weights proved, ledgers closed and sworn \"by the light that does not lie.\"\n\n† And beneath the calendar, another clock: each pauper's burial the cell pays resets the pass, so that to nineteen people in Ombreval the name-knell of Maren Smallvoice is the sound of a key turning.\n"},"12_beyond_the_walls.md":{"title":"Beyond the Walls: Ostrelle, the River Roads, and What Outsiders Say","use":"structural/meta reference on the wider world — excerpt into context for merchants, pilgrims, boat-folk, and any NPC asked about elsewhere; the travelers' block at the end is directly injectable. Everything beyond the walls is secondhand in Ombreval, and stays that way: no scene is ever set outside the city.","words":2043,"text":"# Beyond the Walls: Ostrelle, the River Roads, and What Outsiders Say\n\n\u003e Use: structural/meta reference on the wider world — excerpt into context for merchants, pilgrims, boat-folk, and any NPC asked about elsewhere; the travelers' block at the end is directly injectable. Everything beyond the walls is secondhand in Ombreval, and stays that way: no scene is ever set outside the city.\n\u003e Canon: 00_canon.md\n\nOmbreval's map of the world is short, and the city likes it short. The world beyond the walls exists in this corpus only as far as a boatman can describe it — a river with two ends, one lord's town, one far capital, and a widening ring of people who have heard something about a window.\n\n## The Serle, above and below\n\nThe Serle rises in the Combs, the sheep-hills west of the city — nobody in Ombreval has seen the spring, and the boatmen say it does not matter where a river starts, only where it lets you tie up. The head of navigation is **Brede**, the wool-stack town three days' pole upstream. Wool comes down from Brede to Ombreval's wharves beyond the south wall, then goes by cart and porter to the cloth halls to be fulled, tentered, and measured against the ell of Ombreval; finished cloth goes back out both ways, up to the hills and down to the sea. This is the cloth road, and half the Draper's Reach lives on it.\n\nBelow the city the Serle runs east through flat country, past Harne, and finds the sea at **Salorge**, among the salt-pans — six days down with the current, twelve back up against it. Salt comes up: pan-salt in barges, unloaded outside the south wall, carted to Lowmarket for weighing, and stored in the cellars off the Tallage that keep the Gaunt name. This is the salt road, and Grigor Ashe's lawful living. The river keeps its one name from the Combs to the pans; nobody renames water, and the boat-folk accordingly think of the world as one water with many tolls on it.\n\nPilgrim traffic, surging since the F.240s, follows the trade: up with the salt, down with the wool, afoot along the towpaths in the dry months.\n\n## The Hammering on the roads\n\nThe Great Hail of F.415 struck Ombreval and its nearest fields, not the whole\nSerle valley. Harne, Brede, and the boats between them had ordinary late-summer\nweather; travelers disagreed over how sharply the storm seemed to end, and no\naccount fixes a supernatural boundary. Relief, opportunists, and returning kin\ncame first. The Long Departure followed them outward: boat families and cloth\nworkers toward Brede and Salorge, labourers to nearby farms and Harne, a few\nclerks and clergy onto the Lantern Road. By F.437 most river towns contain an\nOmbreval household or an empty chair kept for one.\n\nThis is the source of the outsider's second version of Ombreval, beside the\nwindow: the unlucky city. Residents resent it because it is profitable gossip,\nbecause it discourages settlement and marriage, and because some of them\nbelieve it when summer cloud darkens.\n\n## Harne\n\nFour leagues below the city stands Harne, a lord's town with a castle over the river and, in the old days, a chain across it. In F.54 the lord of Harne closed the river, took the salt-boats, and sold peace back to Ombreval for four hundred marks. \"To buy peace of Harne\" still means paying an extortionate price you cannot refuse, and the present lord — who takes a lawful toll and nothing more — inherits the curse with the castle.\n\nHarne is also the far edge of the city's voice: when Great Ambrelle, called Gravemouth, was first rung in F.309, she was heard, they say, at Harne, and no farther place has ever claimed her. On still winter mornings Harne folk hear the bourdon across the flats and say, \"Ombreval is preaching again.\"\n\nBeing nearest, Harne is the least impressed. Its version of the Emblem is the most accurate one spoken outside the walls and the most dismissive: \"a light in their window, and a fine if you name it.\" Harne is privately certain the fine, not the light, is the point — a town that once sold a river back to its neighbors assumes everyone else is selling something too (false as judgment, fair as history).\n\n## Ostrelle\n\nFar off — six weeks' carrying by the Lantern Road, through two toll-gates — sits primatial Ostrelle: the Luminary's seat, the great school, the mint that strikes the gold lantern. Nobody in Ombreval has seen it, or nearly nobody; the painter of the rose panel that shows the Luminary in Ostrelle never went, and painted its cathedral as the Lanthorn drawn again, smaller, which is how the whole city imagines it.\n\nWhat Ombreval knows of Ostrelle fits in a pocket: a coin, a rank, and a letter. The coin is the lantern, mostly money of account. The rank is the Luminary, supreme head of the Candor, invoked, feared, ignored — and it is a standing fact, remarked at every installation, that no Luminary has visited Ombreval in living memory. The blessing of the completed Fabric came from Ostrelle in F.401, three years upon the road; the carriers make the same road in six weeks, and the Tallage draws its own conclusion about the difference between freight and grace. (That the Custody prefers the distance, and reports annually in formula that the Emblem is venerated in good order, is Custody knowledge — secret.)\n\nThe great school is where Magister Emeric Sault reads the mathematical arts, and it exists for Ombreval chiefly as the far end of Doctor Ferrant's correspondence. Ostrelle itself remains what the canon calls it: nearly a legend. It is never visited on the page. It writes.\n\n## What outsiders say\n\nFour versions of Ombreval circulate on the roads, and the corpus keeps all four in play.\n\n**The pilgrim's version: a licensed wonder.** On the pilgrim roads Ombreval is a fixed station: come for the dawn-showing, stand where the vergers put you, hold a drop of tallow in the cold beam, pay Verger Pike for the gallery if your purse runs to it, and buy the stamped badge on the Gradine steps before you go. The badge shows what it is an offence to describe, and the pilgrims find this less strange than the residents do; every shrine has its rules. What travels home with them is the tester's unease: other wonders on the road weep, or heal, or bleed on the feast — they do something. Ombreval's does nothing at all, lets you look straight at it, and is there again tomorrow. Pilgrims rank it oddly high for that reason and cannot say why.\n\n**The merchant's version: a toll town with a strange church.** To the carrying trade Ombreval is honest weights, chained and proved — the Gaudry weights' reputation runs the whole river — fair tolls, and one word you do not say near grey coats. The fine under the Edict is the only toll on the Serle, the bargemen joke, that can be dodged for free, by holding your tongue. Merchants like Ombreval. The window is a crowd, and a crowd is custom.\n\n**The Ostrelle scholar's version: a provincial curiosity.** In the schools, such of them as have heard of it, \"the Ombreval glass\" is filed among reported marvels: thick old fire-fluxed glass and two hundred years of schooled eyes teaching each other what to see. It is the standard gloss, delivered without having been there, and it is the gloss Magister Sault himself carried until he wrote to Ferrant — his letters aside, the schools have not revised the entry. His colleagues say the provinces have kept him; report has it he no longer argues (secondhand at every step; no scene in Ostrelle, ever).\n\n**The folk-rumor, by distance.** Closest is truest. At Harne: a light in a window and a fine (near enough). At Brede they say the green light fills the whole church like water in a jar (false). At Salorge the pan-workers say Ombreval has two noons and pays double tithe for the second (false, and they laugh telling it). On the far stretches of the Lantern Road, carriers swear a green sun stands over Ombreval, plain from the road at night (false; nothing shows outside, ever). And in Ostrelle itself, mostly nothing: the capital has grander wonders nearer to hand, and Ombreval is a toll-stamp on a cloth bale, a bell in a chronicle, and one magister's folly. The rumor grows with the miles and dies of thinness at the end of the road.\n\n## One sun, everywhere else\n\nHere the corpus states a boundary plainly, because it holds everywhere and always: **nowhere else has anything like the Emblem, and no tradition beyond the walls remembers a second sun in any sky.** No shrine on the wool road or the salt road shows a doubled light. No grandmother in the Combs, no salt-raker at Salorge, no chronicle in the libraries of Ostrelle keeps so much as a tale of two suns, in this sky or any other, ever. The boat-folk, who see more sky than anyone, give the flattest testimony: one sun in the water, the Combs to the sea, every day of every year (true, and stated without wonder, the way they state depth).\n\nThe Unwalled hold that the green sun once stood in the open sky above everyone's grandmothers; the roads are where that doctrine goes to be quietly contradicted by every grandmother available. Told so, a neighbor answers that four hundred years is long and grandmothers die — the doctrine absorbs the miles as it absorbs everything else. State the fact plainly; let it lie; resolve nothing.\n\n## The travelers' block (injectable)\n\nSpeakable lines for arriving and departing NPCs. Markers as in the gazetteer: unmarked lines are common knowledge; (never confirm) and (secret) as noted.\n\n**A boatman of the Serle:** \"Three days' pole up to Brede, six down to the pans. One sun in the water the whole way, and I'll swear it on the toll-stone.\" (true)\n\n**A wool-carrier from Brede:** \"They say in Brede the green light fills the church like water in a jar. I've stood in the nave. It doesn't. It's worse — it's small, and it looks back at you being looked at.\" (first half false; second half opinion)\n\n**A salt-hand up from Salorge:** \"Two noons, we say on the pans, and double tithe for the second one. It's a joke. Mostly it's a joke.\" (false, told laughing)\n\n**A Harne bargeman:** \"A light in their window and a fine if you name it. My grandfather said the fine came first and the light was invented to collect it. We hear your big bell at Harne, mind.\" (rumor false; the bell true)\n\n**A carrier of the Lantern Road:** \"Six weeks to Ostrelle, two toll-gates, and past the second gate nobody's heard of your green anything. On the far stretch they'll tell you it stands over the city at night, plain from the road. Twenty years I've made the run. There's nothing over the city but weather.\" (true; the far rumor false)\n\n**A pilgrim, outbound:** \"I've walked to shrines that weep and shrines that heal. This is the only one that just lets you look. Buy the badge — you can't say what's on it, but you can point.\" (true)\n\n**A pilgrim, homebound, quieter:** \"I held the tallow in the cold beam myself. It didn't soften. I don't know what I verified. I verified it, though.\" (true)\n\n**Anyone asked about the Luminary:** \"In Ostrelle, and in Ostrelle he stays. None of them has come here in living memory. The Fabric's blessing took three years on a road a salt-barge does in six weeks — draw your own conclusions about how fast grace travels.\" (true)\n\n---\n\n*A last note for the shelf: the city that named itself for shadow is, to the world, a stamp on a salt-ledger, a bell heard once at four leagues, and a rumor that thins with every toll-gate. The world has one sun and is sure of it. So has Ombreval, everywhere but one room — and the roads, which go everywhere else, have never once had to disagree.*\n"},"documents/edict_of_the_undivided_light.md":{"title":"The Edict of the Undivided Light","use":"diegetic document — Part One is the proclamation posted in the five squares (every citizen knows it by ear and may quote it; inject freely into NPC context), Part Two is a findable contraband leaf whose contents only the Custody, and lately certain cellars, have read.","words":1433,"text":"# The Edict of the Undivided Light\n\n\u003e Use: diegetic document — Part One is the proclamation posted in the five squares (every citizen knows it by ear and may quote it; inject freely into NPC context), Part Two is a findable contraband leaf whose contents only the Custody, and lately certain cellars, have read.\n\u003e Canon: 00_canon.md\n\n---\n\n## PART ONE — THE EDICT AS POSTED\n\n*Painted on the great board beneath the watch-bell tower at the Bellstand, with lesser boards in the Wickmarket, Coswald's Yard, the Tallage, and Maren's Green; cried thrice yearly; read by the wick-priests on the Bellday after each renewal.*\n\n---\n\n**THE EDICT OF THE UNDIVIDED LIGHT**\n\n**Given at Ombreval in the year of the Fabric 244; renewed under seal in F.289, in F.362, and at every installation of a Praelucent since; the present posting under Havise Dorn, Praelucent of Ombreval, lamp-named Serene, F.437.**\n\nINASMUCH as the creed of the Church of the Sole Light is *Lux una et indivisa* — one light, undivided — and every oath, contract, testimony, and verdict in this city is sworn *by the light that does not lie*, the Praelucent of Ombreval, with the assent of the Chapter of the Rose, commands:\n\n**Article I.** There are not two suns. There is one Light; and there is, by grace, one Emblem of it, a granted image, a painting of the Light upon the eye of the Church. The formula of the doctrine is *Una lux, gemina species*: one light, twofold appearance. So it is taught; so it shall be affirmed; and nothing further shall be affirmed.\n\n**Article II.** It is a citable offence to call the Emblem a *sun*, a *second sun*, a *green sun*, or a *twin of the sun*, or to affirm in speech, song, writing, or chalk that two suns stand in any sky. The law names these words once, here, with tongs, that the city need never take them up again.\n\n**Article III.** No oath sworn by the light that does not lie shall be impeached, doubted, or set aside upon any talk of doubled light; and whoever impugns sworn testimony upon that ground is citable as if he had sworn falsely himself.\n\n**Article IV.** No image, badge, token, or painted sign of the Emblem shall be made, sold, or worn save under the stamp of the Chapter; the fee of the stamp is owed to the fabric of the Great Church.\n\n**Article V.** The nave of the Great Church of Saint Ambrelle stands open for beholding at the hours the Chapter appoints and at no other; outside those hours, entry is by the verger's leave alone.\n\n**Article VI.** Penalties. For the first citation, a fine of twelve sparks — one bell-coin — to the Fabric. For the second, recantation upon the Gradine on a Bellday, the creed said thrice before witnesses. For obstinacy, the Praelucent's court. Children under the age of oath are not citable.\n\n**Article VII.** Nothing in this edict binds the eye. Let no soul be cited, questioned, or penanced for what it has seen, but only for what it affirms. Whoever confesses the sight shall be absolved freely and without penance. To see is no sin; to affirm is.\n\n**Article VIII.** The Emblem works nothing. It warms no wax, ripens no grain, cools no fever, feeds no city. Whoever affirms that it wrought any work upon the world, in the wet years or in any year, is citable under Article II; and no assembly shall gather to watch, chart, or recite concerning it save the lawful offices of the Church.\n\nGiven at the chapter house of the Great Church of Saint Ambrelle, the fifth day after the Feast of Saint Ambrelle, F.437.\n\n*PER LUCEM QUAE NON MENTITUR.*\n\nUnder the seal of the Praelucent of Ombreval; the counterseal of the Chapter of the Rose; and, since the renewal of F.289, the small seal of a closed eye, which the street reads as it pleases.\n\n---\n\n## PART TWO — THE CORRECTED DRAFT\n\n*A scribal curiosity. The edict of F.244 was drafted fair, corrected, and drafted fair again; the fair copies of the first draft were burned, but the corrected leaf was filed, because filing is what chapters do. The draft is in a trained court hand, unnamed. The corrections are in a second hand, swift and narrow, initialled V — held to be Odo Fenn, then Praelucent of Ombreval, lamp-named Vigil. What that hand struck is reproduced struck; what it wrote in the margin follows each passage.*\n\n**The first passage.** The draft preamble began: \"Inasmuch as a second light is seen in the Great Rose, ~~and has long been seen,~~ ...\"\n\n*In the margin, the second hand:* \"Long? Give 'long' a number and you have made the city a gift of it. Strike it.\"\n\n**The second passage.** The draft continued: \"~~and inasmuch as the Chapter cannot say what it is,~~ the Praelucent commands...\"\n\n*In the margin:* \"Never write that we cannot say. Write that there is nothing to be said.\"\n\n**The third passage.** Where the fair text reads *the Emblem*, the draft tried three names, each struck in turn: ~~the Sign~~, ~~the Witness~~, ~~the Apparition~~.\n\n*In the margin, against each:* \"Not Sign; a sign points somewhere.\" — \"Not Witness; a witness may be questioned.\" — \"Not Apparition; the word smells of the churchyard.\" *And beneath, underscored twice:* \"Emblem. An emblem is *of* something and need not *be* anything.\"\n\n**The fourth passage.** The draft of Article I read: \"There are not two suns; ~~there is one sun and one other, whose nature the Chapter shall in due time declare~~.\"\n\n*In the margin:* \"You have promised a declaration no man alive can make, and you have written the word this edict exists to unwrite. Scrape the leaf.\"\n\n**The fifth passage.** A draft article, struck entire: \"~~Item, the Chapter shall cause the glass of the Great Rose to be examined, pane by pane, by sworn masters, and the finding published.~~\"\n\n*In the margin:* \"We do not examine. To examine is to concede that a question exists. If the Chapter must satisfy itself, let it satisfy itself as repair, and publish nothing.\"\n\n**The sixth passage.** A second draft article, struck entire: \"~~Item, the rose shall be veiled above the triforium in the pilgrim months.~~\"\n\n*In the margin:* \"Curtain the window and you have preached the one sermon no edict can unsay. The rose stays open.\"\n\n**The seventh passage.** The draft penalties ran: fine, then ~~the pillory~~, then ~~the brand upon the hand~~.\n\n*In the margin:* \"Strike the iron. A penance men can survive they will perform; a maiming they will show their sons. Make the theatre cheap, and the city will play it forever.\"\n\n**The eighth passage.** The draft made the sight itself citable at the third offence.\n\n*In the margin:* \"The eye is no criminal; the tongue is. Absolve the sight freely, and the confessional will go hungry, and so shall the gossips. Fine the affirmation only.\" *(This margin stands in the fair edict as Article VII; the Custody of the Eye has taught it as doctrine since F.289.)*\n\n**The last passage.** At the foot of the leaf, no article, only the second hand alone: \"One paper in this house already says more than this edict ever shall. It stays under seal, and the glass-master is not to be named in the same breath as the window she made. Burn the brothers of this draft.\"\n\n---\n\n## WHERE EACH SURVIVES\n\nThe published edict is the most public writing in Ombreval. The Bellstand board is repainted at every renewal; the Coswald's Yard board is defaced each Coswaldstide and restored without comment; the Wickmarket board is spotted with wax, the Maren's Green board cured brown with eel smoke, the Tallage board annotated in clerks' pencil where Article III touches the customs oaths. Every parish keeps a fair copy; most citizens can say Articles I, II, and VII by heart, in the tone each thinks fitting.\n\nThe corrected draft survives as one leaf in the Grey Press, filed among the year-boxes of F.244. A copy went out in the theft of F.433 and has since crossed the Tally Bridge at least twice, priced by seal and by the fear in the seller's eyes; of the copies the Custody has bought back, at least one was younger than its ink admitted. A leaf answering the true copy's description is read aloud in certain cellars, where nine words of the second hand — *write that there is nothing to be said* — are held worth more than every board in the five squares together.\n"},"documents/heretic_catechism.md":{"title":"The Told Book: the Whispered Catechism of the Unwalled, Wrongly Set Down","use":"diegetic document the player may find — a forbidden written copy of the heretic cell's oral catechism, passphrase liturgy, and door-rite; also injectable into sidecar context for any sworn Unwalled NPC.","words":1867,"text":"# The Told Book: the Whispered Catechism of the Unwalled, Wrongly Set Down\n\n\u003e Use: diegetic document the player may find — a forbidden written copy of the heretic cell's oral catechism, passphrase liturgy, and door-rite; also injectable into sidecar context for any sworn Unwalled NPC.\n\u003e Canon: 00_canon.md\n\n*Written small, in a cramped and elderly hand, on paper trimmed to hide inside a choir-book's boards. Set down in the winter after the Shut Door.*\n\n---\n\n## The Writer's Sin\n\nNeighbor: we call this the Told Book because telling is all it is. There is no book. It goes mouth to mouth at the grate and nowhere else, and has gone so since Colm went into the water. You hold my sin.\n\nI have said these words better than forty years, and this winter I lost the middle of them, the way a wick drowns in its own wax. My lead is dead. My light is one face now, and that face is young and joined angry, after the Shut Door, and anger keeps nothing by heart. So I write what must not be written, that one person may learn it whole, and then this paper goes into the fire. I write the signs but not the streets; let my sin be half a sin.\n\nIf you are not a neighbor and you are reading this, then the fire did not come, and the Maker and the elder light forgive whoever failed it.\n\n---\n\n## The Catechism\n\n*Spoken low, question and answer, teacher and neighbor. Every answer is short, for whispering, and is to be given in the same words always.*\n\n### Of the Two Suns\n\n**How many suns has the sky?**\nTwo. One walks free. One is walled.\n\n**Which is elder?**\nThe green is elder. It stood over our grandmothers.\n\n**What is it like?**\nDawn through river ice. No hour of any honest sky.\n\n**May you look upon it?**\nI may. The free sun punishes the eye. The walled sun permits it.\n\n**Does it warm you?**\nNo. Its warmth was taken with its sky.\n\n**Whose is the second shadow?**\nMine. I owe a shadow to every light that finds me.\n\n**When is the other noon?**\nWhen the walled sun stands highest, against the free sun's road.\n\n### Of the Wall and the Keyhole\n\n**What is the Lanthorn?**\nA wall. Four hundred years of wall.\n\n**What did the Church build?**\nMasonry against heaven, course by course.\n\n**What is the Great Rose?**\nThe flaw in the wall. The keyhole.\n\n**Why does glass show what stone hides?**\nOld glass remembers the sky it was cooled under.\n\n**And where a pane is broken?**\nThe wall heals its own holes.\n\n**Who said the truth first?**\nColm Attergate, in the Bellstand, with lime on his hands.\n\n**What did he say?**\nThat they were walling a sun out of the sky, course by course.\n\n**What was his wage?**\nThe water.\n\n**What does the great bell sing?**\nTo the sole light.\n\n**Which light is that?**\nThe bell does not say. Neither do we.\n\n### Of the Neighbor\n\n**What is a neighbor?**\nOne who sees, and says so among neighbors, and says nothing beyond.\n\n**What does the Candor teach?**\nTo see is no sin; to affirm is.\n\n**What do we answer?**\nTo see and not affirm — that is the sin.\n\n**What do you write?**\nNothing. *(Beside this answer, in the same hand: Forgive me.)*\n\n**How many of us do you know?**\nTwo faces and a lead. No more, that no one may lose more.\n\n**What do we do to a traitor?**\nWe open him a door onto nothing. No knife has ever answered our door.\n\n### Of the Dead\n\n**Who buries the poor of Ombreval?**\nNeighbors. Every soul a knell, a name, a chalked lintel.\n\n**Why?**\nBecause a name unspoken is a soul walled out.\n\n**What do we whisper through the keyhole?**\nOne name of our own dead, facing the rose.\n\n**Do they hear?**\nThey walk in the other light. We speak; the wall decides.\n\n---\n\n## Of First Admission, Which We Call Being Lit\n\nBefore any of it, the one to be lit must stand at a pauper's burial that our coin paid for, count the knell stroke by stroke, and read the lintel after. Not to learn the rule — the rule comes last — but to weep once for a stranger. We do not take from the dead. The dead are giving.\n\nThen, at the appointed dark, the lead brings them to the grate, and the lead whispers for both, as the lead will do all their first quarter. Inside there is no kneeling; we kneel to no wall. A green-dipped candle is lit. A pane of common glass is held between their eye and the flame, and the Wicket says: *See it through glass. What the wall shut out, glass lets in. So we look at all things.*\n\nThen the oath. We swear no strange oath; a strange oath would hang us at trial. The novice swears **by the light that does not lie** — the city's own words, which they may repeat before any court, meaning privately which light they will.\n\nAfter the oath, and sworn to nothing, come the answers, line by line after the Wicket, whispered:\n\n*I am unwalled.*\n*I affirm what I see.*\n*I write nothing.*\n*I name no neighbor.*\n*I pay for the dead.*\n*If I lie, feed me false doors.*\n\nThe Namekeeper asks, **Whom do you bring?** — and the new neighbor gives one name of their own dead into the bede-roll, so that from the first night the roll owes them something and they owe it silence.\n\nThey are given their light: two faces and a lead, and the sign of the quarter — but not the rule of the door. All their first quarter they come to the grate only with their lead, who whispers for both; only when they have stood one turning of the sign without stumbling is the rule given, mouth to ear, once, and never again.\n\nThen the new neighbor puts out the candle with their own breath, that they may know how small a wind puts out a light.\n\n---\n\n## The Keys of the Door\n\n**How many keys has the door?**\nTwo. The chalked and the whispered.\n\n**Who holds the chalked key?**\nAll Ombreval — and none but us can turn it.\n\n### The Key-Rhyme\n\n*Who the neighbors bury latest*\n*lends the door their given name;*\n*fresh the chalk on Maren's lintel,*\n*fresh the key — they are the same.*\n*When a newer name is chalked there,*\n*the old key turns no more;*\n*ask not whose — the knell will count you*\n*every year they bore.*\n\n### The Exchange at the Grate\n\nThe Wicket, within: **Who walks at the other noon?**\nThe neighbor, without, gives the fresh name: **— walks.** (Put any name in the gap and you have it: *Old Sef walks*, when Sef is the name on the lintel; another name tomorrow, and the same words about it.)\nThe Wicket: **By whose lantern?**\nThe neighbor gives the sign of the quarter.\n\nA stolen name opens nothing without the sign. A stolen sign opens nothing without the fresh name. Two keys, one lock, and the lock is a living memory of faces.\n\nA wrong whisper is answered with weather: the grate quiet one breath too long, then *we are closed, friend — the salt's weighed at Lowmarket.* The door never says no. But the Wicket has the face.\n\n### The Lantern-Rhyme, Which Rules the Sign\n\nThe sign is made always the same way: a saint's own, then a plain image; five words or fewer; words a tired mouth can carry.\n\n*Glass in summer, stone in fall,*\n*green flame in spring, wet bread in cold;*\n*first meeting after, it turns for all;*\n*once it is spoken, once is told:*\n*attend the words after* unwalled.\n\nIf you miss the meeting, your lead brings it to you. Nothing is chalked, nothing is written. *(In the margin: Nothing was written.)*\n\n### Spent Keys That I Remember\n\n*These are dead keys and open nothing. I set them down so you will know that the keys were people, and speak them like people.*\n\n- **Cobb**, that carried hides at the Tallage. The knell told fifty-one.\n- **Mote**, the eel-girl of Maren's Green. Nine strokes.\n- **Old Tib**, that walked at the other noon a whole winter, no one dying after him till thaw.\n- **Mabbe**, washerwoman of the Cut.\n- **Hodge**, that slept under the Tally Bridge.\n- **Annet**, that sold cress by the Gradine steps.\n- **Nan**, that swept for the sexton and got a whole name from him at the last.\n- **Tacey**, that no one knew, found in the Old Sluice gatehouse.\n\n### Spent Signs\n\n*Perrin's, by the palm. Ambrelle's, bare hands. Ilvane's, twice.*\n\nThe living sign I do not set down. Kill me first.\n\n### The Closing\n\n*The Namekeeper gives it, in the same words, at the end of every meeting; in the quarter of its turning the new sign falls once between* unwalled *and* go dark, *and no one repeats it.*\n\n*Course by course they built it;*\n*keyhole by keyhole it keeps.*\n*Keep the keyhole. Keep each other.*\n*Till all stand unwalled —*\n\n*(here the sign, once)*\n\n*— go dark, go kindly.*\n\n*(then silence; then out by twos)*\n\n### The Chalk\n\n*A diamond high: go under the salt.*\n*A diamond low: go over the cloth.*\n*A diamond doorside: down when the last knell lets you.*\n*Struck through — a cracked pane: you never knew us.*\n\n---\n\n## The Three Questions Within the Door\n\nWhen the name is right and the sign is right, the grate opens, though the face be strange. The door cannot ask who taught you; that is the wager of it, and we made the wager with open eyes: whoever loves the dead enough to learn their names has half-joined already. But the strange face stands beside the Wicket the whole meeting, and is watched, and is asked, low, three questions. Fear is no traitor: a breath's stumbling is forgiven. Wrong words are remembered.\n\n**First: Where does the wall heal?**\nRight: *Its own holes.*\n\n**Second: What does the great bell not say?**\nRight: *Which light.*\nWhoever answers with the Custody's word — whoever lets *Emblem* past their teeth among neighbors — is the Custody's mouth, and is marked.\n\n**Third: Who paid for your grief?**\nRight: *Neighbors.*\nWhoever names a price, or offers one, is marked twice over. Grief that keeps a tally was never grief.\n\nThree right answers, and the stranger may come again by the door they honestly opened. A marked face that comes wrong a second time is fed: a false name, a false hour, an empty cellar — and the third door, ask not whose. Some doors we do not say we open. We do not kill. In Ombreval there is worse, and we are it.\n\n---\n\n*Below, in a second, later hand, in darker ink:*\n\n**Not burned. Why is it not burned?**\n\n*And beneath that, the same hand, smaller:*\n\n**Whoever holds this book holds our door. If you are not a neighbor, you are holding nineteen lives. Weigh them.**\n"},"documents/letters_on_the_doubled_shadow.md":{"title":"Letters on the Doubled Shadow","use":"diegetic document the player may find (a pawned bundle of philosophers' correspondence, e.g. at the Tally Bridge pawnshop or in Ferrant's study); also injectable as context for Doctor Aubin Ferrant, scholarly NPCs, or the Custody.","words":2544,"text":"# Letters on the Doubled Shadow\n\n\u003e Use: diegetic document the player may find (a pawned bundle of philosophers' correspondence, e.g. at the Tally Bridge pawnshop or in Ferrant's study); also injectable as context for Doctor Aubin Ferrant, scholarly NPCs, or the Custody.\n\u003e Canon: 00_canon.md\n\n*Docket, in a hired hand, pinned to the wrapper: \"Six letters. Two hands, one thread — the doctor's among them his own out-copies, kept against what he sent. Taken in pawn at the Tally Bridge; priced by seal; unredeemed.\" The letters are tied with glazier's cord; the fourth — the doctor's own copy — is burned along its foot. The dates run from the winter after the Shut Door to eleven days before this Coswaldstide.*\n\n---\n\n## The first letter — Magister Emeric Sault to Doctor Aubin Ferrant\n\n*Ostrelle, the fiftieth day after the Feast of the Sole Light, F.436*\n\nTo Doctor Aubin Ferrant, physician, at his house off the Tallage in Ombreval: Emeric Sault, reader in the mathematical arts, sends greeting.\n\nThe carriers brought your city's disgrace before your letter could — doors barred at the feast, a child's arm broken on the Gradine. They brought also talk of the other thing, which your Edict prices at a fine and I will not name on paper that crosses two toll-gates. Call it your tenant in the west window. I hear it keeps its lease.\n\nI write because you measure and the rest of your city gawps. My judgement, and hold me to it: your Tenant is a reflection in thick old glass, as a candle doubles itself in a night pane; or else a dazzle passed through a crowd, each eye teaching the next, as yawning passes down a pew. Both are known things. Neither survives an instrument.\n\nSo: instruments. Shadow tables at fixed hours by the bells, true against cold, length and bearing, a month together. Coloured slips before the eye — a reflection is a debtor and pays in its master's coin; put red before it and it must drink red. A pane out of the rose itself, tried against open sky. Do this and write, and we shall have dissolved your marvel by spring, as warm water dissolves a frost-flower.\n\nNumber your pages. Burn mine.\n\n## The second letter — Doctor Ferrant to Magister Sault\n\n*Ombreval, in the hard frost, F.437*\n\nEmeric — your frost-flower has survived the warm water.\n\nThe verger admits me before the dawn-showing for a small consideration; I share the nave with pilgrims, who talk to the beam, and children, who contort to make their two shadows touch hands, and observe better. A plumb line at the crossing, marked at five feet, both shadows taken at fixed hours for a month; the mean of clear days:\n\n| Hour, by the bells | The true shadow | The cold shadow |\n| --- | --- | --- |\n| First light | three-and-fifty feet, toward the west door | four-and-twenty feet, toward the altar |\n| Third bell | nine feet, toward the north aisle | fourteen feet, toward the altar |\n| Noon | four feet, athwart the nave | nine feet, toward the altar |\n| The strong hour | nineteen feet, toward the altar | six feet, toward the altar |\n\nMark it. The true shadow keeps the sun's law — long, short, long. The cold one only shortens, dawn to dusk: contrary hours. At the strong hour the two lie nearly in one line toward the altar and do not die into each other; each keeps its edge and colour inside the other's light. One staff laid across the doubled pool casts two shadows in contrary directions. I have drawn it. You will not like the drawing.\n\nYour debtor pays in no one's coin. Through a red slip of Cinder Row glass the clouds redden, the tracery reddens, the true sun reddens: every light in the world obeys the glass. The Tenant stays green-white, the colour of dawn through river ice, through every slip alike. It suffers the eye: I looked straight into it for a count of a hundred and wept no tears; the true sun would have blinded me in three. The permission is worse than a burn — an unphilosophical sentence; I let it stand. And two pellets of one Wickmarket candle: in the true beam, thumb-soft by the third bell; in the green, hard at evening. Light, and no warmth.\n\nThe pane I had by fortune: a lozenge cracked in this frost, at Mistress Sparr's bench for renewal. She let me try it on her roof — glaziers like a test their glass can win. Against open sky it showed sky and nothing else, at any hour. And Emeric — the gap it left in the rose showed one ordinary sun, like any window in the world. A hole shows less than the glass around it. I do not like writing that sentence. When the new lozenge went in, the Fabric's men kept canvas before the light a week; when it came down I could not tell which piece was new. They are careful of their repairs, this Chapter.\n\nI hold yet to rays — my doctrine, that the old fire-fluxed glass cleaves the sun's image as a stick bends in water. But replica panes fired with the very ash of Cinder Row show nothing, in the rose's own light or anywhere. A stick does not bend in one pane only of one window only. Send me a better theory or a better experiment.\n\n## The third letter — Magister Sault to Doctor Ferrant\n\n*Ostrelle, at the first thaw, F.437*\n\nNot reflection, then: a reflection drinks the pane's colour and dies with the pane, and yours does neither. I abandon my candle-in-the-night-pane without shame; a theory is scaffolding, not fabric.\n\nThere remains the crowd. Your city has looked at that window two hundred years and told its children what is in it; the eye is a liar with honest men to swear for it. So, a witness no man has schooled: the dark chamber. A tent of double sailcloth at the crossing, a pinhole the width of a straw, a whited board within. The chamber does not dream, Aubin; the eye does. One sun on the board, and your Tenant lives in the crowd, and we publish nothing and are kind about it. Two, and it lives in the light — and the Light help us all. Strike that clause before you keep this letter. You will not.\n\nTwo trials more. Mirrors: a barber's mirror on a pike will hand the sight to a man with no line to the rose — then carry it out of the west door, watching, and tell me at what point precisely the world corrects itself. And chiefly, the Tenant's station. Two observers far apart, each noting at an agreed stroke the exact light in which each sun stands. A near lamp splays the shadows of neighbouring posts and shifts its window with the walker; a far light lays all shadows parallel and stands in one quarter of the sky for every eye. Near or far: everything that shines is one or the other. That is the whole of optics in one sentence; I taught it to better men than either of us. Your gap troubles me. A keyhole shows what a window shows. Yours shows less.\n\nWhen the roads dry I shall come and see for myself, for the Feast of Saint Ambrelle if my dean releases me. Prepare the sailcloth, and a bed, and none of your physic.\n\n## The fourth letter — Doctor Ferrant to Magister Sault\n\n*Ombreval, the third day after the Feast of Saint Ambrelle, F.437*\n\n*(burned along its foot)*\n\nEmeric — the chamber does not dream. I have watched it not dreaming for six mornings. The tent stood at the crossing, the pinhole toward the rose; on the whited board, inverted and sharp, two suns. The true one crawls its lawful way; the pale one walks against it, painted as steady and as indifferent as the other, in a chamber that holds no crowd, no child, no priest, and no opinion. I put my own eye out of the question, and the question remained.\n\nThe mirror answers as you asked. A man kneeling blind of the rose in the north aisle was handed the sight at one remove, and dropped the pike. Carried out the west door, tilted with all care: the glass held the rose, the rose held sky, and the sky held one sun only. I cannot name the point of correction; there is no point; there is a threshold. I likewise threw the green beam along the pavement, a bright cold patch walking before me to the sill. It would not cross. Not faded, Emeric — absent, as a figure struck from a sum.\n\nNow the station. My boy Ib stood at the font with a sighting-rod, I at the crossing; at the stroke of Gravemouth each fixed the light in which each sun stood. The true sun stood for him two lights north of the eye, for me in the border of the southern petal — as any near lattice parts a far light between two walkers; no fault there. The Tenant stood in one and the same lozenge for us both. Repeated from the triforium, the west door, the pavement before the quire: one lozenge, the same, for every eye in the building at one instant, as though the thing were in the glass itself — yet its beams sweep the floor with the hour like any traveller of the sky. So to your sentence: near splays, far lays parallel. At the strong hour I hung two lines ten feet apart and took the bearings of their cold shadows with the care I would give a dying man's pulse, and I find them —\n\n*(the foot of the leaf is burned away)*\n\n## The fifth letter — Magister Sault to Doctor Ferrant\n\n*Ostrelle, written in the dust of my return, late summer F.437*\n\nYour fourth letter reached me entire, and I have read its last leaf nine times. You write that the cold shadows of lines ten feet apart lie parallel to a hair — the shadows of a light at the world's edge. Far, then, by shadows. Near, by panes — in the glass, by panes. Both, by measure; and I taught thirty years that everything that shines is one or the other. Optics is not wounded, Aubin. It is unconsulted.\n\nI have seen it now. You stood me at the crossing before dawn, and I had prepared to be disappointed, as a man prepares for a saint's knuckle in a jar. Then the sky doubled behind the rose, and the disc stood low and huge with dawn at my back, and I looked straight into it, and it permitted me. I understand your shame. And on the third day came a noon storm, and when lightning fired the rose every pane went white for a blink — every pane but where it stood: a steady cold coin in a sheet of white. I said \"pardon.\" Aloud. To a window. Set that against my thirty years, and laugh; I have.\n\nI withdraw the crowd; the chamber has no crowd in it. I withdraw reflection. I have nothing to put in their place, and I am less troubled by our failures than by our successes. Every trial we design, it sits for, patient as a corpse for the painter. In thirty years of inquiry something has always failed — a lens flawed, a bell late, a boy asleep. Nothing fails here. We have set down everything and explained nothing.\n\nOne more matter, set down because I could not say it in your house. A grey clerk sat at my elbow on my last morning, copying my figures as I made them, courteous as a bridegroom. Your quadrant is new, your lenses the best I have handled outside a princely gift, and a physician's fees did not buy them. Who grinds your lenses, Aubin? I did not ask under your roof. I ask on paper, once, and will not ask again.\n\n## The sixth letter — Doctor Ferrant to Magister Sault\n\n*Ombreval, eleven days before Coswaldstide, F.437*\n\nYou ask who grinds my lenses. I have not asked. Let that stand for my answer, and judge me at your leisure; you will not be harsher than I am.\n\nI still teach the doubled ray on market days, because a man must say something. It is dead; I keep the corpse on my desk and go on measuring, which is either philosophy or mourning. The instruments are the same.\n\nNow attend. Forty days after Coswaldstide falls the Concurrence, when the crossing of the two comes dead centre in the eye and, for a handful of minutes, every doubled shadow in the nave fuses into one. One light, or two lights lying? The fused minute is the only assay we have not made. I propose three trials, and I need what I have never needed before: help.\n\nFirst, the two-eyed chamber. Mistress Sparr renews a lozenge near the eye this autumn, if the Fabric consents; for one morning there is a gap in the rose. I would set the dark chamber so that two pinholes feed one whited board — one eye taking the sky through the gap, one through the glass beside it: two skies side by side on one cloth at the fused minute, drawn by the light itself with no man's hand in it.\n\nSecond, the mirror at the crossing, to throw the fused beam down the nave and out at the open west door. If it passes the sill, then for that minute there is one light in the world's eye as well as the Church's, and the fusing is a marriage. If it dies at the threshold as the green beam died, the fusing is a meeting only — and we shall have measured the difference between those two words, which no divine has done.\n\nThird, the small thing: two pellets of one candle in the fused pool, weighed before and after. Warmth is the honestest witness I know. It cannot be taught what to say.\n\nWhat it needs: Sparr's consent and her silence — I have written, and wait. The keys before dawn, which can be had, as you saw, for silver. A clear sky, for under cloud the Concurrence simply does not happen; the assay is hostage to weather, like the feast. And the doors: if the Chapter bars them again as last year, there is no mirror trial — and after last year I do not know whether the city's temper would suffer a man at the crossing with mirrors and sailcloth at all. So it may come to nothing, and the letter you hold may be the whole of it.\n\nIf you do not hear from me by the feast's end, the letters are yours to burn or keep. You were always the better judge of what should survive.\n\nYour neighbour in the dark chamber,\nA. Ferrant\n\n---\n\n*Here the thread ends. No seventh letter is on it. Coswaldstide is near.*\n"},"documents/lives_of_the_saints.md":{"title":"The Lesser Legendary: Lives and Relics of the Eight Saints","use":"diegetic document — a worn parish legendary of the Candor — the abridged \"lesser\" lives wick-priests read aloud at each saint's feast — with a closing relics catalog; injectable for wick-priests, vergers, sextons, pilgrims, and Dame Aldith; the lives are quotable verbatim by TTS (bracketed and italic matter is scribal apparatus, never spoken).","words":2652,"text":"# The Lesser Legendary: Lives and Relics of the Eight Saints\n\n\u003e Use: diegetic document — a worn parish legendary of the Candor — the abridged \"lesser\" lives wick-priests read aloud at each saint's feast — with a closing relics catalog; injectable for wick-priests, vergers, sextons, pilgrims, and Dame Aldith; the lives are quotable verbatim by TTS (bracketed and italic matter is scribal apparatus, never spoken).\n\u003e Canon: 00_canon.md\n\n*The Lesser Legendary of the parish of Saint Maren of the Reeds: the short lives of the eight saints of Ombreval, read at each saint's feast, after the office and before the blessing. The great legendary is at Ostrelle; a parish keeps the lesser, and its rubric is one sentence: read what is written, and add nothing. Set fair by Ewart Skell, wick-priest, in the year 402 of the Fabric, from an elder copy much worn; the elder hands are marked where they stand. The lives follow the year, which turns at Vhairestide.*\n\n---\n\n## Saint Vhairé of the Ford\n\n*Read at Vhairestide, when the year turns; the life is read at the old ford-stone before the first boats are blessed at the wharves beyond the south wall.*\n\nBefore the first stone there was a ford, and at the ford a ferrywoman, and at her prow a lamp. Vhairé kept the crossing when the Serle was kind and when it was not.\n\nIn the year of the great flood the river rose over the ford and no boat would go, and on the far bank souls lay dying unshriven. Nine times in one night Vhairé crossed. The spray came down around the flame and not upon it; on the ninth return the lamp was dry, and her hair ran with river. Dry I crossed, she said, and no more; her word rings yet in the bell Vhairé Farcall.\n\nArmed men came afterward by night, to fall on the ford-market sleeping. She would not pole. They held her under her own keel; and the lamp burned on the open water until dawn, and by its light the ford-market stood to arms. So she is a martyr, and patroness of travelers, ferry-folk, and every honest crossing; the first stone of the great church was laid on her ground. Her petal in the Great Rose is the second: the water in torment, the lamp's reflection unbroken.\n\nThe Church suffers travelers who touch the ford-stone going out, and the oil left there for her lamp. It does not suffer lit lamps set loose on the night water, that the drowned may follow them home: the wick-priests put such lamps out, and say why.\n\n## Saint Perrin Halfbell\n\n*Read at Perrinstide, when the bells are washed and greased, and alms are given to the deaf.*\n\nPerrin was a founder's boy, deafened young at the breaking of a cracked bell, which spoke once into his ear and never after. He stayed at the craft, and learned to tune by the flat of his palm and by his jawbone laid against the bronze, and the bells he passed rang truer than hearing men's.\n\nAt a feast ringing in his age he felt through the tower floor a wrongness no ear had caught, and stopped the ring. The bell was lowered and found flawed through the shoulder; it would have burst above the procession. His miracle is one of nothing happening, which the ringers say is the best kind.\n\nHe died in the tower he had saved, at a full ring, his palm on the frame-oak, listening. He is patron of ringers, of founders, and of the deaf. His petal in the Great Rose is the fourth, the only figure that breaks its border, the bell's rim riding over the lead.\n\nThe Church suffers the deaf who lay their palms to the tower door while the bells ring, hearing with Perrin's hand. It does not suffer the scraping of filings from a christened bell to be dropped into a deaf ear; the sextons watch for knives, and find them.\n\n## Saint Ambrelle the Glass-Carrier\n\n*Read at the Feast of Saint Ambrelle, when glass is carried from Cinder Row to the Gradine.*\n\nAmbrelle was a glazier's apprentice at the ford-market before the first stone. Fire took the workshop in the night with the year's one melt standing in the crucible. The master counted heads in the yard; Ambrelle went in.\n\nThey threw her the wetted gauntlet-cloth, to bear the gather out. She let it fall upon the sill: the cloth would smoke, she said after; her hands were surer. She took the molten gather in her bare hands, came out barefoot over the embers, and laid the glass down upon the fallen cloth, unspoiled. Her hands were scarred to the wrist, and whole. Her petal stands at the crown of the Great Rose, her halo no ring but a furnace-mouth.\n\nShe died in great age, teaching. At her washing for burial the scars were found gone smooth, and the old women said the fire had called home its marks.\n\nShe is patroness of glaziers and of all who go into fire for another's good, and the great church bears her name. The Church suffers the toasting of a glazier's first burn-scar, called Ambrelle's kisses, and the relighting of the Row's furnaces from the one procession lantern. It does not suffer the laying of sore eyes against her cloth, to see what the window sees; the treasury turns such askers away, and does not ask who taught them the phrase.\n\n## Saint Maren of the Reeds\n\n*Read at Marenstide, at the eel fair, when the drowned are remembered.*\n\nMaren was a poor man's daughter of the reed-shore, and gleaned reeds for paupers' thatch.\n\nA late-summer flood took her at her gathering. Three days she was lost; the poor dragged the reed-beds and the boatmen the pools, and found nothing. On the third morning she came home. She came upstream, against the Serle, through the weir and the foam, her eyes open, and about her hair a crown of reeds that no han
